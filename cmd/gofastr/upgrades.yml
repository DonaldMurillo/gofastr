# Migration registry for `gofastr upgrade`.
#
# One entry per release that carries migration-relevant changes (usually
# BREAKING entries from CHANGELOG.md — keep the prose here actionable, the
# full story lives in the changelog/release notes). The CLI shows every
# entry in (current, target] when a project upgrades, and runs each note's
# optional `detect` regex over the project's .go files to point at the
# exact lines that need attention.
#
# Fields per release: version (vX.Y.Z), title.
# Fields per note: change (one line), breaking (bool), guidance (one
# line — this parser has no block scalars), detect (optional Go regex
# applied per-line to non-test .go files).
#
# Maintenance rule: EVERY release PR bumps `through` below; a release
# that lands BREAKING changes also adds its entry under `releases`
# (same policy as CHANGELOG.md).

# The registry is complete through this release: releases ≤ through
# with no entry below genuinely had no migration-relevant changes.
# Targets beyond it make the CLI warn that it may be out of date.
through: v0.69.0

releases:
  - version: v0.3.0
    title: Secure-by-default sweep
    notes:
      - change: Tenant scoping and multi-tenant CRUD are fail-closed
        breaking: true
        guidance: "Typed-repo queries and HTTP CRUD now refuse to run without a tenant in context when an entity is tenant-scoped. If reads started returning empty/403 after upgrading, install the tenant middleware or mark the entity non-tenant."
      - change: Admin battery is default-deny for non-admins
        breaking: true
        guidance: "battery/admin now requires the admin role by default. Set AdminRole (and grant it) or provide a custom policy."
      - change: Escape-hatch field Attrs renamed to ExtraAttrs
        breaking: true
        guidance: "Every core-ui/html, core-ui/patterns, and framework/ui Config that exposed a raw attribute bag renamed Attrs to ExtraAttrs. Compile errors point at each use; rename the field."
      - change: Form intercept is opt-in
        breaking: true
        guidance: "runtime.js no longer intercepts plain-enctype forms; browsers submit them natively. Forms posting to JSON endpoints need enctype=\"application/json\" (or data-fui-spa)."
      - change: Legacy /__gofastr compat endpoints removed
        breaking: true
        guidance: "theme.css / styles.css / routes.js / catalog.js now 404. Use /__gofastr/app.css; routes + catalog ship inline in the SSR page."
        detect: '/__gofastr/(theme|styles)\.css|/__gofastr/(routes|catalog)\.js'
      - change: RenderPage / RenderPartial wrap richer *Result variants
        breaking: true
        guidance: "core-ui/app.App.RenderPage and RenderPartial return an error for Redirect/Block policy decisions instead of inline HTML; callers that consumed the raw string switch to the *Result variants."
      - change: Router.Render renamed to Router.RenderRaw; App.RenderScreen to App.RenderScreenRaw
        breaking: true
        guidance: "The renames call out that the raw variants bypass policies and layouts. Mechanical rename at each call site."
        detect: 'Router\.Render\(|\.RenderScreen\('
      - change: Screen.Policies field unexported
        breaking: true
        guidance: "Use Screen.WithPolicy(p) to add a policy and Screen.PolicyChain() to read a copy; direct field access no longer compiles."
        detect: '\.Policies\b'
      - change: Access control installs via framework.WithAccessControl / AccessMiddleware
        breaking: true
        guidance: "Policy + roles install in one line via the new helpers; hand-wired policy plumbing from v0.2 needs the new install path."
  - version: v0.4.0
    title: Declaration-driven entities
    notes:
      - change: Legacy entities/*.json declaration format removed
        breaking: true
        guidance: "Declare entities in Go (framework/entity.EntityDeclaration) or a blueprint. `gofastr generate` emits the Go form; JSON files are no longer read."
  - version: v0.5.0
    title: Auth hardening
    notes:
      - change: battery/auth fails closed on an empty JWTSecret in production
        breaking: true
        guidance: "Set JWT_SECRET (or auth.Config.JWTSecret) in production — startup now refuses a blank secret instead of minting unverifiable tokens."
  - version: v0.6.0
    title: Generator ownership model
    notes:
      - change: gofastr generate scaffolds into the module root, not gen/
        breaking: true
        guidance: "Generated files land next to your code and are add-only afterwards. Move any custom code out of gen/ and re-run generate once."
      - change: gofastr migrate diff removed
        breaking: true
        guidance: "Use `gofastr migrate generate` for versioned migrations; dev-mode auto-migrate covers the inner loop."
  - version: v0.7.0
    title: Generated apps serve entity JSON under an API prefix
    notes:
      - change: Regenerated blueprint apps serve entity JSON at /api/<table>, not /<table>
        breaking: true
        guidance: "A regenerated app moves every entity route under the api_prefix. Clients calling the bare path get 404. Update them, or set `app.api_prefix: \"\"` in the blueprint to keep the old paths. MCP tools and the OpenAPI spec follow the prefix automatically."
        detect: "api_prefix"
  - version: v0.11.0
    title: Multi-replica + security remediation
    notes:
      - change: battery/admin exposure is opt-in
        breaking: true
        guidance: "An app that registered the admin battery implicitly no longer serves it; register it explicitly with a Config."
  - version: v0.12.0
    title: Blueprint output layout
    notes:
      - change: gofastr generate emits a flat package main
        breaking: true
        guidance: "Regenerated blueprint apps are one flat package. Existing multi-package generated apps keep working; regeneration adopts the flat layout."
  - version: v0.13.0
    title: Component correctness
    notes:
      - change: Unknown component variants panic at build time
        breaking: true
        guidance: "ui.Card / ui.ToggleAction (like ui.Button) now reject unregistered variant names at screen construction. Fix the typo or register the custom variant before first use."
      - change: html.Button requires a label
        breaking: true
        guidance: "An empty Label with no aria-label now panics at build time. Icon-only buttons pass ExtraAttrs aria-label — `gofastr audit a11y` finds these statically."
      - change: Plain modals paint a real panel
        breaking: true
        guidance: "preset.Modal slots now render inside .fui-panel (surface, border, padding). Bodies that own their chrome opt out with .fui-slot-bare; selectors targeting .fui-pos-center > .fui-slot move to .fui-panel."
        detect: 'fui-pos-center'
  - version: v0.16.0
    title: Multi-replica outbox
    notes:
      - change: Transactional outbox delivers per-consumer
        breaking: true
        guidance: "Outbox rows are tracked per consumer instead of globally; existing single-consumer apps are unaffected, multi-consumer handlers each get their own cursor. Review handlers that assumed at-most-once fan-out."
  - version: v0.21.0
    title: Multi-replica auth durability
    notes:
      - change: Production mode refuses the in-memory 2FA store
        breaking: true
        guidance: "Two-factor state must be durable in production — configure the DB-backed store (the default when auth has a DB) or an explicit store; startup fails closed otherwise."
  - version: v0.23.0
    title: AI-native UI composition
    notes:
      - change: theme.Default() is now adaptive
        breaking: true
        guidance: "The canonical theme now adapts light/dark from one palette. Apps that overrode dozens of tokens to fake dark mode can delete those overrides; apps that relied on the old static values re-pin them via theme.Overrides."
        detect: 'theme\.Default\('
      - change: SiteHeader wraps its Brand slot
        breaking: true
        guidance: "Brand renders inside a framework-owned wrapper; CSS targeting the raw brand element needs the new wrapper class (or better, drop the CSS — the wrapper is styled)."
      - change: ui.Cluster zero value now wraps
        breaking: true
        guidance: "Clusters wrap whole items by default. Layouts that depended on single-line overflow set NoWrap: true."
  - version: v0.26.0
    title: Technical SEO + enforced accessibility
    notes:
      - change: gofastr build enforces the static accessibility lint
        breaking: false
        guidance: "Builds now fail on missing required a11y fields in core-ui/html element configs (Alt on images, Label on buttons/landmarks, Legend, For, …) with a guided fix hint per finding. Icon-only buttons with ExtraAttrs aria-label pass. Fix the findings (see gofastr docs accessibility) or skip once with --no-a11y."
  - version: v0.27.0
    title: Dev-loop cwd + cmd/ layouts
    notes:
      - change: gofastr dev runs the server with --dir as its working directory
        breaking: false
        guidance: "Relative paths (sqlite db_url, static dirs) now resolve against the project directory instead of wherever gofastr dev was launched. If your sqlite file seems to have vanished after upgrading, it was being created at the launch cwd — point db_url at the old file or move it into the project."
  - version: v0.29.0
    title: Secure-by-default CRUD + unified response envelope
    notes:
      - change: Auto-CRUD and entity MCP tools require an authenticated session by default
        breaking: true
        guidance: "An entity declaring none of owner_field, access, or the new public: true now refuses anonymous requests with 401 across List/Get/Create/Update/Delete (and its MCP tools). Add public: true (EntityConfig.Public) for genuinely public entities, or owner_field/access for scoped ones. Existing apps relying on anonymous CRUD will start returning 401 until an entity opts out."
        detect: "app\\.Entity\\(|EntityConfig\\{"
      - change: Single-record CRUD responses use the {\"data\":{...}} envelope
        breaking: true
        guidance: "Create/Get/PUT/PATCH now wrap the record as {\"data\":{...}}, matching list's {\"data\":[...]}; errors and DELETE are unchanged. Update any hand-written client that decoded the bare object — the generated typed clients already unwrap it. New PATCH /<entity>/{id} verb added for sparse updates (generated clients gain a pointer-based <Entity>Patch)."
  - version: v0.30.0
    title: Access registry + decider, stored routines, background compute
    notes:
      - change: RolePolicy.Grant returns error
        breaking: false
        guidance: "Grant now reports strict-mode capability rejections. Statement-form calls keep compiling; error-checking linters will flag the ignored return. With StrictCapabilities() configured, handle the error — errors.As with *access.UnknownCapabilityError distinguishes a typo'd capability (answer 400) from a store failure (500)."
        detect: '\.Grant\('
      - change: Same-container sortable commits include container=
        breaking: false
        guidance: "Sortable lists that configure Container now send container=<id> on same-container reorders too (previously cross-container only). Handlers that distinguished the two cases by container's presence should key on moved= instead — it remains cross-container-only."
        detect: 'sortablelist\.Config\{'
      - change: gofastr_routines ledger table auto-created
        breaking: false
        guidance: "Apps registering stored routines (App.Routine / the new App.RoutinesFS) gain a gofastr_routines bookkeeping table on next boot, created inside the migration transaction. Reporting-only — every routine Up still runs each boot; no action needed."
  - version: v0.31.0
    title: Process-isolated modules + cross-replica presence
    notes:
      - change: mcpclient.Spawn scrubs the child environment
        breaking: true
        guidance: "Spawned MCP-server children no longer inherit the full host environment (JWT_SECRET, DB DSN, OAUTH_* all leaked before). If a child needs a host variable, pass it explicitly via the new SpawnConfig{Env, InheritEnv} — the default is now a minimal allowlist (PATH/HOME/TMPDIR/locale)."
        detect: 'mcpclient\.Spawn\('
      - change: Process-isolated third-party modules (#37)
        breaking: false
        guidance: "New App.RegisterProcessModule surface: third-party modules run out-of-process behind core/moduleproto, capability-brokered, sandbox-gated. Additive — existing in-process modules (App.RegisterModule) are unaffected. Untrusted-tier modules require a conforming sandbox backend or they fail closed (never run)."
      - change: Cross-replica presence over fanout (#47)
        breaking: false
        guidance: "Presence rosters now aggregate across serve replicas when WithFanout is configured (dedicated gofastr.presence lane). Additive: single-replica behavior is byte-identical with no fanout."
  - version: v0.32.0
    title: Customer-facing CLI generation
    notes:
      - change: gofastr generate cli (#85)
        breaking: false
        guidance: "New generator: run from an app root to emit a standalone customer CLI under cli/ wrapping the app's entities/client package — CRUD, batch, SSE watch, scoped-token login. Additive; custom.go is the dev-owned extension seam and survives --force regens."
      - change: auth.RequireAPIScopes blanket scope gate
        breaking: false
        guidance: "Minted API-token scopes were advisory unless per-route RequireScope was mounted. Mount auth.RequireAPIScopes(\"/api\") after TokenMiddleware to enforce them across the auto-CRUD tree; sessions and off-prefix paths are untouched. Additive — but hosts that mint scoped tokens should adopt it."
      - change: Generated typed client grows Token, batch, Watch, and Do
        breaking: false
        guidance: "entities/client gains an opt-in Token field (Authorization: Bearer), BatchCreate/BatchUpdate/BatchDelete<Entity>, Watch<Entity> (SSE), and a raw Do escape hatch. Regenerate the client (gofastr generate --force from your blueprint, or re-run pack+generate) to pick them up; existing call sites keep compiling."
  - version: v0.35.0
    title: Strict list filters + presence topic authorization
    notes:
      - change: Unknown list filters now return 400 (#100)
        breaking: true
        guidance: "The auto-CRUD List endpoint REJECTS an unknown top-level filter (a typo like ?stauts=open, or a suffixed op on a non-field) with a 400 naming the bad key, instead of silently dropping it and returning an UNFILTERED result set. Fix clients that send unrecognized params. An endpoint whose BeforeList hook reads its own non-column query params declares them via EntityConfig.AllowedFilterParams; EntityConfig.LenientFilters (or filter.Lenient()) restores the old drop-silently behavior. Also: ?per_page is now a ?limit alias and ?offset is honored on both buffered and streaming list paths."
        detect: 'filter\.ParseFilters\('
      - change: Presence topic authorization hook (#98)
        breaking: false
        guidance: "New island.Manager.AuthorizeTopic(ctx, topic) bool gates which ?presence= topics a connection may join, before any subscription or roster emission. Additive: a nil hook (the default) authorizes every topic, so existing presence apps are byte-identical. Opt in to protect private topics whose roster (display names can be emails) would otherwise leak to anyone who guesses the topic string."
  - version: v0.36.0
    title: Mandatory OAuth linking + multi-replica RBAC/seed hardening
    notes:
      - change: OAuth login requires a durable OAuthLinker store (#98)
        breaking: true
        guidance: "OAuth2Plugin.Init now FAILS CLOSED when the configured UserStore does not implement OAuthLinker — the legacy email-only fallback is gone (an IdP emitting an unverified email could otherwise sign in as an existing account). Use auth.NewEntityUserStore (now a linker; it creates a <table>_oauth_links table on EnsureSchema) or set AuthConfig.AllowInMemoryStores:true for local dev. A verified-email OAuth login now REFUSES (409) an existing password account; the user adds the provider via the new authenticated GET /auth/oauth/{provider}/link flow. OIDC now enforces email_verified."
        detect: 'NewOAuth2Plugin\(|OAuth2Config\{'
      - change: Cross-replica RBAC + advisory-locked seeds (#99)
        breaking: false
        guidance: "To propagate runtime grant/revoke across replicas, pass your access.GrantStore to framework.WithGrantStore alongside WithFanout — grant/revoke then refresh every replica (re-read from DB; code-defined baseline grants preserved). Additive: single-process apps are unaffected. Startup seeds + WithSeed hooks now run under a distinct Postgres advisory lock so N replicas seed once; a MaxOpenConns(1) pool skips the lock with a WARN — keep the pool above 1 for multi-replica seed coordination."
  - version: v0.38.0
    title: Stateless interactive layer + pull-first reactivity ladder
    notes:
      - change: WithFanout requires an app secret (#112)
        breaking: true
        guidance: "Sessions are stateless HMAC tokens; a multi-replica deployment (WithFanout) now FAILS AT BOOT unless framework.WithSecret or GOFASTR_SECRET supplies the shared signing secret (>=32 chars, e.g. `openssl rand -base64 32`) on every replica. Single replica with no secret keeps the zero-config per-boot key. Sticky sessions are no longer part of the scaling contract."
        detect: 'WithFanout\('
      - change: Dead stateful island/signal surface removed (#112)
        breaking: true
        guidance: "UIHost.RegisterSignal / RegisterWidget / PushIsland / GetSession, the SignalAny interface, and POST /__gofastr/signal/{id} are gone, as are island.Manager.Register/Unregister/Push/Get/ListBySession, Island.SessionID, and Island.Update. Server push = render the HTML yourself and call Manager.PushUpdate (or presence); the client-side signal seed (#gofastr-signals) is unrelated and unchanged."
        detect: 'RegisterSignal\(|RegisterWidget\(|PushIsland\(|GetSession\(|SignalAny|ListBySession\(|\.SessionID\b'
      - change: island.Manager.Subscribe returns a per-subscriber channel + cancel
        breaking: true
        guidance: "Subscribe(sessionID) now returns (<-chan IslandUpdate, func()) — each SSE connection gets its own channel and updates broadcast to ALL of a session's tabs (they previously competed for one shared channel). The cancel func replaces the removed Manager.Unsubscribe; ConnectSession changed identically."
        detect: 'ConnectSession\(|\.Unsubscribe\([^,)]+\)'
      - change: Widget SSE bindings replaced by polling (#112)
        breaking: true
        guidance: "Builder.SSE / SSERefetch / SSERefresh / SSEReload and the SSEBinding type are removed — each widget opened a private EventSource, contradicting the one-bus contract. Passive freshness is Builder.Poll(interval) (re-fetches /state, re-applies changed signals) or page-level data-fui-poll + data-fui-poll-src; genuinely push-shaped surfaces use the shared /__gofastr/sse bus. See `gofastr docs reactivity` for the ladder."
        detect: '\.SSE\(|SSERefetch\(|SSERefresh\(|SSEReload\(|SSEBinding\{'

  - version: v0.40.0
    title: Strict mode + dev a11y gate
    notes:
      - change: gofastr dev now runs the static accessibility lint on every rebuild, exactly like gofastr build
        breaking: false
        guidance: "Apps with standing a11y findings stop at the dev rebuild instead of at build/CI. Fix the findings (each prints a guided hint) or run gofastr dev --no-a11y while you do; the flag is an escape hatch, not a setting."

  - version: v0.43.0
    title: Security audit remediation
    notes:
      - change: Client-selected SSE block mode is now a broker opt-in
        breaking: true
        guidance: "?slow=block / X-SSE-Slow is ignored unless the broker sets SSEBrokerConfig.AllowClientSlowMode. A block-mode subscriber stalls deliver() on the publisher's goroutine, so a request-selected block mode let one unauthenticated client stall every other subscriber and the calling handler. Set AllowClientSlowMode on trusted-only endpoints; BlockTimeout (default 5s) bounds the stall even then."
        detect: 'slow=block|X-SSE-Slow'
      - change: SSE subscriber_id only replaces a subscriber from the same caller
        breaking: true
        guidance: "?subscriber_id=<id> previously evicted whoever held that id, so one client could drop another's stream by guessing it. A reconnect now only replaces its own entry; a colliding id from a different caller gets a fresh generated id instead. Apps keying streams by user/tab/device are unaffected."
      - change: Permission rules match literally unless Rule.Glob is set
        breaking: true
        guidance: "permission.Rule.ArgvGlob was matched with filepath.Match, so an approved command widened into a pattern (approving 'git diff *' also matched 'git diff ; nc host 9') and persisted that way. Rules are literal now; set Glob: true on any rule you deliberately authored as a pattern."
        detect: 'ArgvGlob:'
      - change: kiln custom agent commands are opt-in
        breaking: true
        guidance: "POST /kiln/agent with name=\"custom\" chose the argv of a spawned process, which made the unauthenticated tool API a code-execution surface. Restart kiln with --allow-custom-agent to keep using it; registered adapter names are unaffected."
      - change: MCP transport validates Origin and Host
        breaking: false
        guidance: "A browser Origin that is not same-origin with the request is refused. Split-origin browser clients and tunnels call Server.SetAllowedOrigins; local transports pin authorities with SetAllowedHosts or SetRequireLoopbackHost. gofastr dev pins loopback automatically because dev implies the mutating control tools."
      - change: WebSocket Upgrade enforces RFC 6455 handshake fields
        breaking: false
        guidance: "Upgrade now requires GET, Connection: Upgrade, Sec-WebSocket-Version: 13, and a key that base64-decodes to 16 bytes. Standard browser and library clients already send all four; hand-rolled clients that omitted them stop upgrading."
      - change: Blueprint rejects field names and enum values that break generated source
        breaking: false
        guidance: "gofastr generate now fails when a field name is not a valid Go identifier, or an enum value contains a quote, backtick, backslash or newline — these previously escaped the emitted Go literal. The error names the entity and field; rename the field or drop the character."
  - version: v0.45.0
    title: Security pass — 30 findings, mostly fail-closed defaults
    notes:
      - change: "?include= requires every relation target to be a registered entity"
        breaking: true
        guidance: "A leaf include whose target was not registered loaded it with no Hidden-column scrub, owner scope, tenant scope or soft-delete filter. Register the entity (including tables a battery self-migrates, e.g. the auth user table) or drop the relation. A hand-built crud.NewCrudHandler must set .Registry."
        detect: "NewCrudHandler\\("
      - change: "?include= is capped at 4 relation hops and 20,000 related-row references"
        breaking: true
        guidance: "Deeper or wider includes return 400 with a message naming the limit. Narrow the include or reduce the page size."
      - change: "_like is a literal substring at every depth"
        breaking: true
        guidance: "Nested filters passed the caller's value through as a raw LIKE pattern while top-level filters escaped it. Drop the wildcards: ?author.name_like=A%25 becomes ?author.name_like=A."
        detect: "_like="
      - change: Every login path mints its session through AuthManager.MintSession
        breaking: true
        guidance: "Magic-link and OAuth created sessions the 2FA enforcement never saw, so an enrolled user got a fully-privileged session. A custom plugin that mints sessions must call mgr.MintSession instead of SessionStore().Create."
        detect: "SessionStore\\(\\)\\.Create\\("
      - change: 2FA self-service endpoints require a verified session
        breaking: true
        guidance: "A session minted before the user enrolled could disable the factor it never proved. Sign in again to get a session that can change 2FA settings."
      - change: The OAuth callback requires the cookie its redirect planted
        breaking: true
        guidance: "Starting a flow sets a short-lived SameSite=Lax gofastr_oauth_state cookie the callback must match, so a captured callback URL replayed in another browser is refused. No action for normal flows; a test that synthesises a callback must send the cookie."
      - change: A magic link renders a confirmation instead of signing in
        breaking: true
        guidance: "GET .../magic-link/verify?token= now renders a confirm screen; a same-origin POST with the token completes sign-in. Clients that scripted the GET must POST. Set MagicLinkConfig.ConfirmPage to render the screen with your design system."
        detect: "magic-link/verify"
      - change: middleware.Idempotency caches nothing without a Principal
        breaking: true
        guidance: "A nil Principal shared one key namespace across users and replayed response bodies between them. framework.WithIdempotency defaults it to the request owner; direct users of the middleware must set IdempotencyConfig.Principal."
        detect: "IdempotencyConfig\\{"
      - change: WithMCPControl tools require an authenticated caller
        breaking: true
        guidance: "app_module_enable/app_module_disable now run behind an mcp.Gated identity check. Make sure the app's session middleware runs on the /mcp route."
        detect: "WithMCPControl\\("
      - change: gofastr dev refuses to expose MCP control tools on a non-loopback bind
        breaking: true
        guidance: "The loopback Host pin is a browser control; a direct TCP client forges Host. Bind to localhost, or set GOFASTR_DEV_MCP_EXPOSE=1 to accept the risk. Note that :8080 and a bare port bind every interface."
      - change: A discovered codegen config cannot silently run command extensions
        breaking: true
        guidance: "gofastr generate/build refuse a `command` extension from a config found by walking the tree. Pass --config <path>, or set GOFASTR_CODEGEN_ALLOW_COMMANDS=1. Config discovery also stops at the module/repo root instead of walking to /."
      - change: X-Forwarded-Host is no longer honored for well-known docs and sitemap URLs
        breaking: true
        guidance: "It is a client-settable header that was reflected into absolute URLs including the Link: rel=service MCP endpoint. Set the sitemap BaseURL if a proxy rewrites Host."
      - change: The untrusted node IR emits a narrower attribute set
        breaking: true
        guidance: "core-ui/noderender refuses data-behavior, data-widget, data-component, data-bind and data-fui-*, plus style/srcdoc/on*. Inert data-* markers still pass. Only affects hosts rendering agent-authored IR (kiln, blueprint node screens)."
      - change: Plugin iframe sandbox tokens are an allow-list
        breaking: true
        guidance: "framework/pluginhost drops any sandbox token outside allow-scripts/forms/modals/popups/pointer-lock/orientation-lock/presentation. A manifest asking for allow-popups-to-escape-sandbox, allow-top-navigation or allow-downloads no longer gets them."
  - version: v0.46.0
    title: Audit backlog closed + never-looked surfaces
    notes:
      - change: A gated MCP tool is hidden from tools/list
        breaking: true
        guidance: "mcp.Gated wraps a handler, so it only reached tools/call — an anonymous tools/list returned every gated tool's inputSchema. Register with mcp.WithToolGate(gate) instead of wrapping with mcp.Gated to gate the listing too."
        detect: "mcp\\.Gated\\("
      - change: Endpoint.MCPHandler twins require an authenticated caller
        breaking: true
        guidance: "The HTTP Handler inherits route middleware; the MCP twin never did. Set Endpoint.MCPGate for a stricter predicate, or Endpoint.MCPPublic: true for an endpoint that really is anonymous over HTTP too."
        detect: "MCPHandler:"
      - change: "/{table}/llm.md runs the entity's full access chain"
        breaking: true
        guidance: "It checked for a session but not the entity's declared permission, so a caller without orders:read got 403 on rows and 200 on the schema. Grant the entity's read permission to callers that should read its docs."
      - change: log_set_level requires an authenticated caller
        breaking: true
        guidance: "Only when the host set AllowMCPMutation itself; dev-implied registration stays ungated. Make sure the app's session middleware runs on the /mcp route."
        detect: "AllowMCPMutation"
      - change: WithAPIPrefix now applies to EntityConfig.Endpoints
        breaking: true
        guidance: "A relative Endpoint.Path resolves under the prefixed table path — {id}/revoke on entity licenses with WithAPIPrefix(\"/api\") mounts at /api/licenses/{id}/revoke. Drop any hand-rolled prefix from relative paths; absolute paths still bypass the prefix."
        detect: "WithAPIPrefix\\("
      - change: The plugin host JS sandbox sanitizer is an allow-list
        breaking: true
        guidance: "host/pluginhost.js was still a one-token deny-list after the Go half flipped in v0.45.0. A manifest asking for allow-popups-to-escape-sandbox, allow-top-navigation or allow-downloads no longer gets them from either side."
      - change: Manifest.Entry must be a same-origin absolute path
        breaking: true
        guidance: "An off-origin or scheme-bearing entry escapes the CSP sandbox header AssetServer emits, so it is refused by both Manifest.Validate and the JS broker. Serve the frame document from your own origin."
        detect: "Entry:"
      - change: A blueprint entity table must be letters, digits and underscores
        breaking: true
        guidance: "The table name is emitted into generated Go string literals and interpolated into DDL as a bare SQL identifier. Rename the table; entity name: was already constrained this way."
        detect: "table:"
      - change: Kiln journal destructive entries carry their authorizing plan_id
        breaking: true
        guidance: "Replay now re-checks that a delete was covered by an approved, unspent plan naming that target. A .kiln.session.jsonl written before v0.46.0 that contains deletes will fail replay — run `kiln freeze` with the old binary first, or start a fresh session."
        detect: "\\.kiln\\.session\\.jsonl"
  - version: v0.47.0
    title: Image placeholders render; uploads derive their own renditions
    notes:
      - change: OptimizedImage/PipelineImage Placeholder takes an inline raster data URI only
        breaking: true
        guidance: "A bare BlurHash string is no longer accepted — it was previously emitted as a data-blurhash attribute that nothing read, so placeholders never painted. Decode first with image.BlurHashDataURL(hash, image.BlurHashRenderConfig{}) and pass the result. Unusable values are dropped and the image renders without a placeholder rather than panicking."
      - change: The data-placeholder and data-blurhash attributes are no longer emitted
        breaking: true
        guidance: "Both were dead — no CSS rule or runtime script in the framework ever read them. The placeholder is now a real stacked <img> positioned by the ui-image stylesheet. If you wired your own CSS or JS hydration to either attribute, delete it; the component paints the placeholder itself with no JavaScript."
      - change: html.Image accepts raster data URIs; other resource sinks still reject them
        breaking: false
        guidance: "core-ui/html.Image moved from urlsafe.Resource to the new urlsafe.ImageSource policy, so an inline data:image/{jpeg,png,gif,webp,avif} src renders instead of being swapped for the blank stub. data:image/svg+xml and every non-image media type stay rejected, and <script src>/<link href> are unchanged. framework/ui image sinks (OptimizedImage, PipelineImage, Gallery, Avatar) inherit this."
  - version: v0.48.0
    title: Masked fields stop leaking through the query surface
    notes:
      - change: entity.Define panics on a Hidden or NoQuery cursor column
        breaking: true
        guidance: "Keyset paging orders and compares on the cursor column and encodes its value into the cursor token, which is reversible base64 — so a masked column there hands the caller back what the mask withholds. The check covers CursorField, CursorFields, the primary-key default, and the primary key auto-appended as a composite tiebreak. Pick a different keyset column."
        detect: "CursorFields?:"
      - change: entity.Define panics on a NoQuery SearchFields entry
        breaking: true
        guidance: "?q= runs LIKE against the stored value, so a masked column in SearchFields discloses exactly what NoQuery keeps off the query surface. Drop the column from search_fields, or drop no_query if the value is not sensitive."
        detect: "SearchFields:"
      - change: "Blueprint screens reject hidden and no_query columns in search, filters, a stat_card source.filter or summed field, and a chart group_by"
        breaking: true
        guidance: "Each reaches ListAll/CountAll with a hand-built ParsedFilter or a raw read, bypassing the filter parser, so a masked column there discloses on the app's own page. A chart group_by is the sharpest: it renders every distinct stored value as a bar or slice label. gofastr generate now fails with the screen, block and column named — point the block at a queryable column. id, the timestamps/soft_delete stamps and relation-derived foreign keys all stay valid. This is checked in gofastr.yml, which the scanner below does not read: re-run gofastr generate to see it."
      - change: "Blueprint cursor_field / cursor_fields reject hidden and no_query columns at decode time"
        breaking: true
        guidance: "entity.Define already panicked on these; the blueprint decoder now catches it during generate instead, so the failure is an error naming the column rather than a generated app that dies at boot."
      - change: AfterGet/AfterList now run on every HTTP path that returns a row
        breaking: true
        guidance: "Keyset pages, ?include= children, _events deliveries and create/update response bodies previously returned stored values past an AfterGet/AfterList mask; they are redacted now. If a hook was written assuming it only ever saw GET responses, it now also sees include payloads, event records and write bodies — check it tolerates a primary-key-only delete stub and does not assume a full row."
        detect: "hook\\.(AfterGet|AfterList)"
      - change: "A failed AfterGet on a write response returns the row id instead of 500"
        breaking: false
        guidance: "The write has already committed and its event has shipped by the time the response hook runs, so answering 500 made callers retry and write the row twice — and in a _batch it discarded the ids of every row that committed. The body degrades to the primary key and the hook error is logged. If your client asserts on a full body, handle the id-only shape."
      - change: "A nested ?rel.field= filter now refuses when the relation target is not a registered entity"
        breaking: true
        guidance: "The Hidden/NoQuery/declared-column checks need the target's schema, and skipping them let any column of an unregistered table be predicated on — auth_users.password_hash among them. ?include= has always refused the same shape. If a filter that used to work now 400s, register the target entity (app.Entity) or filter on the parent instead."
        detect: "\\?[a-zA-Z_]+\\.[a-zA-Z_]+(_like|_gte|_lte|_gt|_lt|_in)?="
      - change: "An ?include= child hook may not reorder rows"
        breaking: true
        guidance: "Each eager-loaded row is already keyed to its parent, so the hook's output is folded back positionally. A hook that resorts p.Results attributed records to the wrong parent (and duplicated one row while destroying another); it now fails the request, as a row-count change already did. Sort in the child's own BeforeList, which changes the query."
      - change: "The admin edit form renders hook-masked columns empty and write-only"
        breaking: false
        guidance: "It reads the row twice and treats any column an AfterGet hook rewrites as write-only: rendered blank with a hint (or an explicit \"— unchanged —\" option on a checkbox, enum, or relation picker), kept as stored unless an admin supplies a value. This replaces both older behaviours — prefilling the mask (which Save wrote back over the real value) and prefilling raw (which showed an admin what the API masks). A hook that TRANSFORMS rather than masks (normalising a phone number, rounding a currency) also makes its columns write-only, since the form cannot tell the two apart."
      - change: "?cursor= now validates ?sort= instead of ignoring it unparsed"
        breaking: true
        guidance: "Keyset mode still ignores the sort — the cursor fields control ORDER BY — but it no longer skips validation, so any ?sort= the offset path rejects is now rejected alongside a cursor too. That includes an UNKNOWN column, not just a masked one. A client that appends its UI sort state to a cursor request and previously got a silent 200 now gets a 400; drop the sort when paging by cursor."
        detect: "[?&]cursor="
      - change: "Nested ?rel.field= filters require CrudHandler.Registry"
        breaking: true
        guidance: "The Hidden/NoQuery/declared-column checks need the target entity's schema, so a handler with no registry now refuses nested filters rather than trusting the column name. framework.App, App.View and generated typed repos all set it; a handler built by hand with crud.NewCrudHandler does not. Set Registry, or filter on the parent."
      - change: In-process reads opt in to read hooks with crud.WithReadHooks
        breaking: false
        guidance: "ListAll/CountAll/GetOne still return stored values by default — right for read-modify-write, seed lookups and aggregates. Wrap the context with crud.WithReadHooks(ctx) where rows are rendered to an end user; generated blueprint screens already do. Do not set it on a context handed to a hook."
        detect: "\\.(ListAll|GetOne|CountAll)\\("
  - version: v0.49.0
    title: Embeddable surfaces take the embed name; API versions coexist
    notes:
      - change: "battery/embed is now battery/semantic"
        breaking: true
        guidance: "The semantic-search battery moved so the new embeddable-surfaces feature could take the embed name. Rewrite the import to github.com/DonaldMurillo/gofastr/battery/semantic and the package qualifier from embed. to semantic.; its routes moved from /embed/* to /semantic/* and its local snapshot dir from ~/.gofastr/embed to ~/.gofastr/semantic."
        detect: "battery/embed"
      - change: "kiln agent.NewEmbedContextHook is now agent.NewSemanticContextHook"
        breaking: true
        guidance: "Renamed with the battery it wraps. Behaviour is unchanged; only the name moved."
        detect: "NewEmbedContextHook"
      - change: "`gofastr embed` is now `gofastr semantic`"
        breaking: true
        guidance: "index|watch|query|stats|clear are unchanged; only the subcommand name moved. The old name is not aliased — it would be ambiguous with embeddable surfaces."
      - change: The entity registry is keyed on (name, version)
        breaking: true
        guidance: "Registry.Get errors instead of guessing when one name has several versions; use GetVersioned(name, version). Registry.All still returns one representative per name, so anything iterating it sees only the lex-first version."
        detect: "Registry\\.Get\\("
      - change: An embeddable surface requires an app secret
        breaking: false
        guidance: "Unlike sessions there is no per-boot fallback key — a nonce that fails to verify is gone, and it was rendered into a page you cannot re-render. Set WithSecret or GOFASTR_SECRET (>=32 chars) before configuring uihost.WithEmbed, or Mount panics."
        detect: "WithEmbed\\("
      - change: Versions of one entity share a table and migrate the union of their columns
        breaking: false
        guidance: "A column only v2 declares is an additive change, applied at boot. A CONFLICTING definition (type, nullability, unique, default) across versions panics at wire time naming both call sites; Hidden and WireName are wire concerns and are never conflicts."
  - version: v0.50.0
    title: Embeddable surfaces carry a screen; server actions refused at boot
    notes:
      - change: "embed.Surface.Path (string) replaced by embed.Surface.Screen (a screen value)"
        breaking: true
        guidance: "A surface renders a screen, not a path string. Build the *app.Screen, register it, and pass that same value to the surface: reports := app.NewScreen(\"/reports\", &Reports{}); application.RegisterScreen(reports, app.EmbedLayout()); embed.Surface{Name: \"reports\", Screen: reports, ...}. *app.Screen satisfies the embed.Screen interface (RoutePath()) structurally. The route is still validated as Path was; read the resolved route via ResolvedSurface.Path() where you read Surface.Path before. uihost reads it internally."
        detect: "embed\\.Surface|fembed\\.Surface"
      - change: A surface whose screen registers G.serverAction panics at boot
        breaking: true
        guidance: "G.serverAction is refused inside a frame (the action registry is app-global). uihost now walks each embed surface's screen on Mount and panics naming the surface, component and action if any registered action's client handler calls G.serverAction. Use an island RPC, a form POST, or polling instead — all work in a frame. Detection flags the literal G.serverAction( token in a registered action's ClientJS."
        detect: "G\\.serverAction\\("
      - change: "embed Host.MintNonce/VerifyGrant/Refresh take a context.Context first"
        breaking: true
        guidance: "Every caller must thread a context through — the grant path consults the OriginSource (and any store) on each call, and a context carries the deadline and trace. Add ctx (or r.Context()) as the first argument: embeds.MintNonce(ctx, surface, subject, origin, scopes), embeds.VerifyGrant(ctx, token), embeds.Refresh(ctx, token)."
        detect: "\\.MintNonce\\(|\\.VerifyGrant\\(|\\.Refresh\\("
  - version: v0.52.0
    title: Review sweep — row-reachability parity, trusted IR rendering, embed CSRF narrowing
    notes:
      - change: Untrusted IR no longer renders action attributes
        breaking: true
        guidance: "core-ui/noderender's RenderNode/RenderKind now strip data-action, data-action-*, and data-param-*, and refuse data-island — frag/boot.js turns those into a __gofastr.trigger() call, so an untrusted tree naming them picks the action and its arguments. First-party IR (the blueprint generator's) must call RenderTrustedNode/RenderTrustedKind instead; on RenderNode it still renders, silently inert."
        detect: "noderender\\.RenderNode\\(|noderender\\.RenderKind\\("
      - change: Versions of one entity must agree on row reachability
        breaking: true
        guidance: "MultiTenant, OwnerField, SoftDelete, Public, Access, and CrossOwnerRead must match across every version of one entity name, or registration panics. The versions share one physical table, so the weaker version was a bypass of the stronger. Per-version Hidden/WireName/ReadOnly still vary freely — column projection is presentation, row reachability is authorization."
      - change: The embed CSRF path exemption covers safe methods only
        breaking: true
        guidance: "It exempted the whole /__gofastr/embed/ prefix; the framework mounts exactly two GET routes there. A host that added its own POST under that prefix and relied on the exemption must now send the CSRF token."
      - change: A pattern redirect that covers an exact screen panics at registration
        breaking: true
        guidance: "RedirectScreen(\"/old/{x}\", ...) beside a screen at /old/special now panics in either registration order, like every other route collision. It used to register cleanly and 308 the screen away forever with no diagnostic. Narrow the redirect's constraint, or drop the screen."
        detect: "RedirectScreen\\("
      - change: A custom magic-link ConfirmPage must render ConfirmPageData.CSRFField
        breaking: true
        guidance: "Omit it and the confirmation button 403s under auth.CSRF(), which WithBFFPosture mounts app-wide — passwordless sign-in stops at the confirm step. Render render.HTML(d.CSRFField) inside the form. ConfirmPageData carries no request, so this field is the only way to reach the _csrf input."
        detect: "ConfirmPage:"
      - change: Generated SDK manifests carry SchemaVersion 2
        breaking: false
        guidance: "The route-group prefix left the schema-hash identity, so a manifest written by an older gofastr cannot match a hash computed now. Re-run `gofastr generate sdk`; until then sdkdocs reports unknown provenance rather than drift."
      - change: SSEBrokerConfig.Principal decides who may evict a subscriber id
        breaking: false
        guidance: "The old default keyed on RemoteAddr's host, which behind any reverse proxy is the proxy for every request — so ?subscriber_id=<victim> dropped a stranger's stream. Left nil the broker now evicts nothing, which is the right default. Set Principal to something the caller cannot choose (a session user id) if you rely on same-id reconnect replacing the previous entry."
        detect: "SSEBrokerConfig\\{"
  - version: v0.53.0
    title: Security audit of the never-audited packages
    notes:
      - change: A module's reverse calls carry only the delegation handle
        breaking: true
        guidance: "EntityQueryParams, EntityMutationParams, SearchQueryParams and EventEmitParams now take moduleproto.CallerRef (Delegation only) instead of moduleproto.Caller. A child echoing back its own Subject/Tenant is a confused-deputy shape — the host must resolve the principal from Delegation alone. Drop the two fields from the reverse call; the host already sent them outbound and does not need them back. Compile errors point at each construction site."
        detect: "moduleproto\\.Caller\\{"
  - version: v0.54.0
    title: Zero-deprecated surface — grouped EntityConfig is the model
    notes:
      - change: The flat EntityConfig fields are gone; Scope/Pagination/Exposure are the config
        breaking: true
        guidance: "SoftDelete, MultiTenant, TenantField, OwnerField, and CrossOwnerRead move to Scope (&framework.ScopeConfig{...}); CursorField, CursorFields, and MaxListLimit move to Pagination (&framework.PaginationConfig{...}); CRUD, MCP, Public, and Access move to Exposure (&framework.ExposureConfig{...}). These fields were deprecated through the v0.40 line. Blueprint YAML flat keys (owner_field:, soft_delete:, crud:, mcp:, ...) still parse — only the Go struct changed. A flat YAML key that conflicts with its grouped twin is now an error instead of a silent precedence pick."
        detect: "EntityConfig\\{[^}]*(SoftDelete|MultiTenant|TenantField|OwnerField|CrossOwnerRead|CursorField|MaxListLimit|Public):"
      - change: EntityConfig.Timestamps is *bool
        breaking: true
        guidance: "A literal false used to silently mean \"default true\" (an unexported set-bit controlled it); only WithTimestamps(false) worked. Timestamps is now *bool with nil = default true, so the visible value is the semantic value under copying and serialization. Replace Timestamps: false with WithTimestamps(false) or a *bool literal; Timestamps: true can simply be dropped."
        detect: "Timestamps:\\s*(true|false)"
      - change: The harness moved under framework/experimental
        breaking: true
        guidance: "Import github.com/DonaldMurillo/gofastr/framework/experimental/harness/... instead of framework/harness/... — the subsystem is v0.1 and now carries the experimental-path stability exemption. The gofastr harness subcommand is unchanged."
        detect: "framework/harness"
      - change: Upload metadata and FileField emit camelCase JSON
        breaking: true
        guidance: "core/upload.Metadata keys changed from original_name/mime_type/uploaded_at to originalName/mimeType/uploadedAt, and framework/file.FileField from mime_type/storage_ref to mimeType/storageRef. Clients parsing those responses by key must switch. The persisted <field>_variants column format is unchanged on purpose."
        detect: "original_name|\"mime_type\"|storage_ref"
      - change: battery/storage lost its dead registry; kiln lost two advertised action kinds
        breaking: true
        guidance: "storage.Register/New/NewBattery/StorageType never had a working path (New always errored) — construct NewLocalStorage/NewS3Storage directly and pass it to WithFileStorage. Kiln's create_entity and respond_query action kinds were advertised but never executed; authoring one is now rejected at journal time with an error naming the kind."
        detect: "storage\\.(Register|New)\\(|storage\\.NewBattery"
      - change: Generated resource screens now import framework/ui/resource
        breaking: false
        guidance: "Older generated apps keep working with their private resource.go engine; optionally regenerate or migrate its config to framework/ui/resource, because future correctness and security fixes do not reach the private copy."
  - version: v0.55.0
    title: Findings from five independent analyses, fixed test-first
    notes:
      - change: openapi.SwaggerUIHandler is now openapi.DocsHandler with a public flag
        breaking: true
        guidance: "Call openapi.DocsHandler(spec, basePath, public) — the third argument gates the landing page and its nested spec route together. framework passes AppConfig.PublicOpenAPI, so WithPublicOpenAPI() now opens /api/docs/ as well as /openapi.json; previously a published spec had an auth-gated page and no way to browse it. Pass false to keep the page private."
        detect: "SwaggerUIHandler"
      - change: island.Manager presence hooks are set through methods
        breaking: true
        guidance: "Replace manager.OnPresenceChange = fn with manager.SetOnPresenceChange(fn), and manager.AuthorizeTopic = fn with manager.SetAuthorizeTopic(fn) — the public fields were written by apps without the lock the hooks are read under. ConnectSession now returns (ch, cancel, error) so it can refuse a connection that would exceed the new stream caps; handle the error."
        detect: "\\.(OnPresenceChange|AuthorizeTopic)\\s*="
      - change: Dead widget-builder API removed
        breaking: true
        guidance: "BootstrapMode, Definition.Bootstrap, Definition.BootstrapPath, Builder.Bootstrap, Builder.RPCWithSignal and RPCEndpoint.ResponseSignal are deleted. Mount never applied the documented bootstrap default and ResponseSignal was written but never read. Use RPC(...) and route signals through the data-fui-rpc-signal attribute."
        detect: "\\.(Bootstrap|RPCWithSignal)\\(|ResponseSignal:"
      - change: Production refuses the in-memory session store
        breaking: true
        guidance: "With DevMode false and no SessionStore, auth Init now returns an error instead of logging a warning — process-memory sessions do not survive a restart and never resolve on a second replica. Wire auth.NewEntitySessionStore(db, table), or set AuthConfig.AllowInMemoryStores true to acknowledge a deliberate single-node deployment. This matches how the in-memory 2FA store already behaved."
        detect: "AuthConfig\\{"
      - change: battery/semantic routes require a bearer token
        breaking: true
        guidance: "The handler accepted any non-empty Authorization header, so 'Authorization: x' granted index write, query and delete. Pass semantic.WithAuthToken(token) to Handler or Plugin (compared in constant time), or semantic.WithInsecureDisabledAuth() for local development. Configure neither and every route returns 401 instead of mounting open."
        detect: "semantic\\.(New)?(Handler|Plugin)\\("
      - change: gofastr init writes gofastr.isolation.yml
        breaking: true
        guidance: "The isolation config used the blueprint's gofastr.yml filename, so running the CLI's own example sequence failed with 'unknown key version'. New projects get gofastr.isolation.yml; framework/isolation reads that name first and still falls back to gofastr.yml, so existing projects keep working until they rename."
        detect: "gofastr\\.yml"
      - change: An over-length ?field_in= list is a 400
        breaking: true
        guidance: "Above 1000 entries the filter parser silently dropped the remainder, narrowing the predicate without telling the caller — rows past the cap vanished from results. The request now fails with an error naming the field and the cap, matching the include-scoped IN list. Split large IN lists across requests, or filter server-side."
        detect: "_in="
      - change: AutoTimestamp writes microsecond precision
        breaking: true
        guidance: "Generated created_at/updated_at values were whole seconds, so rows written in the same second tied and stalled single-field cursor pagination. The format is now fixed-width microseconds (2006-01-02T15:04:05.000000Z07:00) because SQLite compares these as strings and a zero-stripped fraction sorts wrongly. Clients parsing the old exact format need RFC3339 with optional fractional seconds; existing rows are not rewritten."
        detect: "2006-01-02T15:04:05Z"
      - change: Out-of-range integers fail to bind
        breaking: true
        guidance: "core/handler parsed every integer at 64 bits and let reflect truncate, so ?small=300 bound 44 to an int8 field with a nil error. Binding now parses at the destination's bit width and returns a range error, which the adapter turns into a 400. Widen the field type if the larger range was intended."
        detect: "int8|int16|uint8|uint16"
      - change: Island endpoints enforce the entity's read permission and the screen's policy
        breaking: true
        guidance: "resource.Config.TableHandler checked only that someone was signed in, so a list's sort/paginate endpoint served rows that GET /api/<entity> refused with 403. It now also applies the entity's declared read permission and the screen's own policy. Set Config.IslandPolicy to the SAME policy that gates the screen; a public list declares resource.PublicIsland(), because with no policy the handler still requires sign-in."
        detect: "TableHandler\\(\\)"
      - change: Generated island endpoints moved to /api/tables/<screen>/<entity>
        breaking: true
        guidance: "Blueprint apps mounted one island endpoint per entity on the bare registry config, so two screens showing the same entity shared it and a sort click on a filtered list came back unfiltered. Each screen now gets its own endpoint serving that screen's refined config behind that screen's policy. Regenerate the app; any hand-written client calling /api/tables/<entity> needs the screen segment."
        detect: "/api/tables/"
      - change: TryEntity rejects route collisions it used to half-commit
        breaking: true
        detect: "TryEntity\\("
        guidance: "Registration pre-flighted a guessed pair of paths. It now asks crud.CrudRoutePatterns for the full set it will mount and compares wildcard SHAPE, so a screen at /posts/{slug} colliding with the generated /posts/{id}, or an endpoint shadowing /posts/_batch, is caught during validation. A declaration that previously panicked mid-commit — leaving the entity registered and its CRUD routes mounted — now returns an error having registered nothing. Move the conflicting screen or endpoint, or mount entity routes under an APIPrefix."
      - change: RedisClient.RPop must report an empty list as queue.ErrRedisEmpty
        breaking: true
        detect: "RPop\\("
        guidance: "RedisQueue.Dequeue previously treated ANY RPop error as an empty queue, which masked a backend outage as an idle worker. It now surfaces every error except queue.ErrRedisEmpty. RedisClient is a public interface you implement, so an adapter that returns its driver's own nil-sentinel (go-redis's redis.Nil, redigo's redis.ErrNil) now reports an error on every idle poll instead of ErrNoJob. Map that sentinel onto queue.ErrRedisEmpty with errors.Is in your RPop wrapper."
      - change: Production re-checks the session store after plugin init
        breaking: true
        guidance: "An auth plugin's Init could call SetSessionStore(NewMemorySessionStore()) after the only fail-closed check, so Init returned nil with every session in process memory. The gate now runs again once plugins are initialised. A plugin that installs an in-memory store in production must stop, or the app must set AuthConfig.AllowInMemoryStores to acknowledge a single-node deployment."
        detect: "NewMemorySessionStore"
  - version: v0.56.0
    title: Windows support and the pure-Go SQLite swap
    notes:
      - change: The sqlite3 driver is modernc.org/sqlite, not mattn/go-sqlite3
        breaking: true
        guidance: "Import _ \"github.com/DonaldMurillo/gofastr/sqlite/stdlib\" and drop mattn/go-sqlite3 — it needs cgo, which is why CGO_ENABLED=0 builds failed. Whichever package registers the sqlite3 name first wins, so keeping the mattn import silently keeps cgo. Timestamps bind with _time_format=sqlite, byte-identical to what mattn wrote, so existing database files need no migration."
        detect: "mattn/go-sqlite3"
      - change: "sql.Open with the sqlite driver name no longer reaches the in-repo engine"
        breaking: true
        guidance: "github.com/DonaldMurillo/gofastr/sqlite now registers itself as gofastr-sqlite; the sqlite name belongs to modernc. Open gofastr-sqlite if you specifically want the in-repo engine, otherwise use sqlite3."
        detect: "sql\\.Open\\(\"sqlite\""
      - change: Boolean columns serialize as true/false in CRUD JSON
        breaking: true
        guidance: "On mattn a BOOLEAN column came back as 0/1; it is now true/false. Clients testing row.field === 1 must compare against true. Apps that ran on the in-repo pure engine already saw true/false and need no change. Every entity below declares a boolean field whose JSON shape changes."
        detect: "schema\\.Bool"
      - change: New storage keys must be portable to Windows
        breaking: true
        guidance: "LocalStorage.Save rejects key components containing ':', ending in a space or dot, or naming a reserved device (CON, NUL, LPT1, ...) so a store written on Unix can be served from Windows. Get, Exists and Delete still accept those keys, so objects written by earlier releases stay readable and removable. Rename them at your convenience; path-traversal rules are unchanged."
        detect: "NewLocalStorage|WithFileStorage"
      - change: Repeated markdown headings get distinct ids
        breaking: true
        guidance: "A second '## Setup' renders id=\"setup-2\" instead of a duplicate id=\"setup\". Anchor links pointing at the later of two identically-named headings change target."
        detect: "markdown\\.(Render|RenderHTML)\\("
  - version: v0.57.0
    title: Field defaults are validated at registration
    notes:
      - change: A malformed EntityConfig field Default now fails registration
        breaking: true
        guidance: "Entity.Validate runs schema.Validate over every field Default, so a declaration that used to boot and fail per-request now refuses at boot with the field named. This surfaces an existing bug rather than creating one: the create path substitutes a Default AFTER ValidateAll, so a bad one reached the driver unchecked — a 500 with nothing actionable in it, or silently wrong data on a looser dialect ({Type: schema.JSON, Default: \"draft\"} 500s on Postgres JSONB and stores fine in SQLite TEXT). Fix the declaration the error names. App.Entity panics as it already does for other declaration errors; TryEntity returns the error. Two Go spellings a JSON body cannot produce are normalized rather than refused, so they keep working: a schema.Decimal default written as a Go number (what gofastr generate emits for `default: 0`) and a Timestamp/Date default written as a time.Time. Auto-generated fields are exempt."
        detect: "Default:"
  - version: v0.58.0
    title: JSON defaults render as JSON in DDL
    notes:
      - change: A Go map or slice Default on a schema.JSON field now emits valid DDL
        breaking: false
        guidance: "No action needed. SQLDefault used to render such a default with fmt.Sprintf(\"%v\"), emitting DEFAULT 'map[a:1]' — which Postgres rejects on a JSONB column, so AutoMigrate failed at boot while SQLite stored the literal text and looked fine. It now marshals to JSON before quoting. A declaration that could not boot on Postgres will boot; nothing that worked stops working. If you worked around this with a string Default containing JSON, that keeps working unchanged."
  - version: v0.59.0
    title: Contracts and semantic analysis (gofastr verify)
    notes:
      - change: gofastr verify, the build gate, and the dev-loop contracts watcher
        breaking: false
        guidance: "Additive. `gofastr verify` reports on the tree and `gofastr build` gates on error findings — an existing app with findings adopts via `gofastr verify --strict --baseline-write` (accepts current debt, fails on new) or relaxes named rules in gofastr.contracts.yml; every opt-out is reported. `--no-contracts` skips the build gate once. Nothing changes at runtime: the semantic-coverage recorder is off unless GOFASTR_SEMANTIC_COVERAGE=1 or the TestHarness enables it."
        detect: "gofastr build|NewApp"
  - version: v0.60.0
    title: Layout chains, chain-aware navigation, asset addressing
    notes:
      - change: RouteEntry.Layout is now Layouts (layer-key chain) plus Preload
        breaking: true
        guidance: "Code reading app.RouteEntry.Layout must switch to Layouts — an outermost-to-innermost slice of layer keys (l:<name> / g:<prefix>:<name>). The client manifest field is layouts; cssChunk is gone. Apps that only register screens and layouts compile unchanged."
        detect: "\\.Layout\\b.*RouteEntry|RouteEntry\\{"
      - change: Static export composes the same layout chain as live SSR
        breaking: true
        guidance: "Router.RenderRaw now applies the default layout and no longer double-wraps <main>, so exported HTML for grouped screens changes shape. Snapshot-style assertions over exported files need re-recording; live SSR output for ungrouped screens is unchanged apart from the new data-fui-layout-key/-slot markers."
        detect: "RenderScreenRaw|RenderRaw|static\\.NewBuilder"
      - change: Live pages externalize the catalog/module manifest and split actions per screen
        breaking: true
        guidance: "Anything scraping the inline #gofastr-catalog or #gofastr-runtime-modules blocks on live pages should read window.__gofastr_catalog / window.__gofastr_runtime_modules (set by /__gofastr/manifest.js). /__gofastr/widget/{id}.js now requires a session or embed grant, matching the actions.js concat it replaces."
        detect: "gofastr-catalog|gofastr-runtime-modules|/__gofastr/actions\\.js"
      - change: style.Contribute freezes at first render
        breaking: true
        guidance: "app.css is composed and content-addressed once per process. A style.Contribute after the first page render logs a warning and does not ship — move contributions to package init or before Mount."
        detect: "style\\.Contribute\\("
      - change: Runtime history writes go through __gofastr._pushURL
        breaking: true
        guidance: "Custom client JS that history.pushState()s around the router leaves currentPath stale and breaks scroll restoration plus the stateful-popstate diff. Call __gofastr._pushURL(url) instead; history.state now carries {__fui: <id>}."
        detect: "history\\.pushState"
  - version: v0.61.0
    title: Owned-Go migrations, support tiers, codegen and emitter hardening
    notes:
      - change: Versioned migrations can be generated from a host binary's compiled registry
        breaking: false
        guidance: "Additive. An app that deleted its blueprint could not emit a versioned migration at all — only boot-time auto-migrate or hand-written SQL. Call migrate.GenerateMigrationFile(app.MigrationPlan(), name, migrate.MigrationFileOptions{MigrationsDir: \"migrations\", Dialect: …}) from your own main() behind an os.Args check; see `gofastr docs migrations` → Generating from a host binary. `gofastr migrate generate` now calls the same entrypoint, so output is identical."
        detect: "migrate\\.GeneratePlan|RenderMigrationFile"
      - change: Blueprint YAML accepts an entity `renames:` map
        breaking: false
        guidance: "Additive. A rename was previously declarable only in Go (EntityConfig.Renames), so blueprint-driven schema changes emitted a data-losing drop+add. Add `renames: {old_column: new_column}` to the entity; the new name must be a declared field and the old one must not be, and both are checked as column identifiers."
      - change: Codegen command extensions receive an allowlisted environment
        breaking: false
        guidance: "Behavior change for extensions only. A command extension no longer inherits the parent environment — it gets PATH, HOME, a temp dir, locale and the Go toolchain variables, and no longer sees GOFASTR_SECRET, DATABASE_URL or cloud credentials. An extension that read a project value from the ambient environment must instead take it under the extension's `config:` key in gofastr.codegen.yml, which arrives on stdin. Extension stdout/stderr are capped and control-byte scrubbed, and a severity:error diagnostic now fails the run."
        detect: "gofastr\\.codegen\\.ya?ml|codegen\\.Registry"
      - change: Blueprint relation names, theme values and auth footer links are validated
        breaking: false
        guidance: "A blueprint that previously generated is refused if a relation name is not a Go identifier or collides with a field name, if an app.theme value carries a CSS declaration-breaking sequence, or if a login_form/signup_form footer href uses a non-http(s) scheme. Each was a real emitter escape; fix the blueprint value the error names. Generation also parse-checks every .go file it emits, so a malformed emit fails the generate instead of shipping."
        detect: "relations:|app\\.theme|login_form|signup_form"
      - change: Six blueprint booleans that gate access reject non-boolean values
        breaking: true
        guidance: "core/yaml is YAML 1.2, where yes/on/y/1 are STRINGS — so scope.multi_tenant, scope.soft_delete, a field's hidden/no_query/read_only, and a screen's access.auth read as false when written that way, silently dropping the protection. Those six now error. Write true or false; do not revert, because the old spelling was never applying the guard. Keys where false is inert (public, mcp, crud, enabled) are unchanged."
        detect: "(auth|multi_tenant|soft_delete|hidden|no_query|read_only):\\s*(yes|on|y|1|Yes|No|off)\\s*$"
      - change: Every package now carries a stability tier
        breaking: false
        guidance: "Informational. docs/public-api.md says what Stable, Provisional, Experimental, Internal and Excluded promise. Nothing is Stable before v1.0.0 — the supported framework surface is Provisional, meaning documented and covered by the deprecation window in `gofastr docs stability`, not frozen. No import paths changed."

  - version: v0.62.0
    title: Green-gated releases and fail-closed generated boot
    notes:
      - change: Generated apps abort startup on failed migrations or seed rows
        breaking: false
        guidance: "Behavioral: `gofastr init` scaffolds now exit on a migrator.Up error instead of logging 'Migration warning' and starting, and blueprint seed hooks return the first failing row's error (WithSeed errors abort Start). A deploy that previously came up over an unapplied schema, or with seed rows silently dropped, now fails the rollout with the entity named. Regenerate to pick both up, and fix the migration or seed data rather than restoring warn-and-boot."
        detect: "Migration warning|seed %s: skipping row"

  - version: v0.63.0
    title: Fail-closed dialect detection, poll termination, rotation, erasure
    notes:
      - change: AutoMigrate errors when the database dialect cannot be determined
        breaking: false
        guidance: "Behavioral: when the PostgreSQL probe fails repeatedly (unreachable DB, bad DSN, pooler resets), AutoMigrate/MigrateEntity/DiffSchema/RunSeeds now return an error instead of assuming SQLite — the assumption skipped the cross-replica advisory lock and every Postgres-only routine. Fix the connection or DATABASE_URL; there is no code change. DetectDialect keeps its signature for callers that only pick DDL types."
      - change: Generated seed hooks abort on a failed idempotency count
        breaking: false
        guidance: "A blueprint app's seed hook treated a CountAll error as 'not seeded' and inserted again, so a transient read failure could duplicate seed rows. Regenerate the app to pick up the fail-closed hook."
        detect: "CountAll\\(ctx, framework\\.ListOptions\\{\\}\\); err == nil && n > 0"
      - change: battery/print/chromepdf is a nested module
        breaking: false
        guidance: "The import path is unchanged, but the package now lives in its own Go module. Apps that import it add the module explicitly: go get github.com/DonaldMurillo/gofastr/battery/print/chromepdf@latest. Apps that do not import chromepdf need nothing."
        detect: "battery/print/chromepdf"

  - version: v0.64.0
    title: OpenAPI path keys, bound idempotency writes, never-audited surfaces
    notes:
      - change: /openapi.json path keys carry the API prefix
        breaking: true
        guidance: "Under WithAPIPrefix(\"/api\") the document now keys operations /api/posts with servers [{url: \"/\"}], where it keyed them /posts with servers [{url: \"/api\"}] before. Both compose to the same URL, so Swagger UI and servers-aware SDK generators are unaffected. A consumer that concatenated servers[0].url onto each path key must drop the concatenation."
        detect: "servers\\[0\\]\\.url"
      - change: IdempotencyStore.Finish takes the request fingerprint
        breaking: true
        guidance: "The signature is now Finish(ctx, key, fingerprint string, resp *IdempotentResponse) error. Custom stores must accept the fingerprint and refuse to write a row that no longer carries it — a store that ignores it can serve one principal's response to another. Built-in stores need no change."
        detect: "Finish\\(ctx context\\.Context, key string, resp"
      - change: An email longer than RFC 5321 allows is rejected at login and register
        breaking: false
        guidance: "Addresses past 254 octets now get a 400 instead of becoming a rate-limiter key and a user-table value. The submitted email keys the per-account limiter, so without the bound one unauthenticated POST could park ~1 MiB of limiter state. No legitimate address is affected."
      - change: IPv4-translation addresses count as internal for SSRF guards
        breaking: false
        guidance: "netguard.IsInternal now classifies NAT64 (64:ff9b::/96, 64:ff9b:1::/48), 6to4, and IPv4-compatible addresses by the IPv4 they carry, so 64:ff9b::a9fe:a9fe is instance metadata rather than a public host. Webhook subscriber URLs and harness webfetch targets that resolved to one of these and previously worked will now be refused — which is the point. Public embeddings still pass."
      - change: gofastr init scaffolds .env as 0600
        breaking: false
        guidance: "New projects only; existing files are untouched. The file carries DATABASE_URL and is where GOFASTR_SECRET goes, so a world-readable scaffold handed both to every local account. Run chmod 600 .env on projects scaffolded earlier."
  - version: v0.65.0
    title: Owner-column injection, public llm.md opt-in, CLI casing convergence
    notes:
      - change: Undeclared owner columns are auto-created
        breaking: false
        guidance: "An entity with Scope.OwnerField set but no matching field in Fields now gets a hidden read-only string column injected by entity.Define, and the next AutoMigrate adds it to the table. Before, the column never existed: creates persisted rows without an owner and scoped reads failed with no-such-column. Rows created while broken have an empty owner value and stay invisible to owner-scoped reads; backfill the column or delete them."
        detect: "OwnerField"
      - change: WithPublicOpenAPI() also serves /api/llm.md without a session
        breaking: false
        guidance: "The startup banner always claimed this; the route now matches it. The public route serves the full entity index, the same exposure class as the public /openapi.json. Without the option the route stays session-gated, and per-entity llm.md routes keep their own scope gates. If you enabled WithPublicOpenAPI but relied on /api/llm.md staying gated, drop the option."
      - change: The CLI snake-cases leading acronyms correctly
        breaking: false
        guidance: "gofastr generate and gofastr pack now agree: HTTPServer becomes http_server (generate previously produced httpserver, pack h_t_t_p_server). Shipped goldens are unchanged; only identifiers with leading acronym runs are affected on the next generate/pack run."
  - version: v0.66.0
    title: Queue lease fencing, multipart wire cap, blueprint boot gate
    notes:
      - change: "BREAKING: Queue.Ack and Queue.Nack take a Job, not a job ID"
        breaking: true
        guidance: "Pass the Job returned by Dequeue instead of job.ID. The string form carried no claim identity, so a worker that stalled past its lease could Ack a job another worker had already re-claimed — deleting the new holder's lease and losing the job with no dead-letter trace. RedisQueue now checks Job.ClaimToken and counts rejected calls in StaleClaimCount(). Custom Queue implementations must update both method signatures."
        detect: "\\.Ack\\(|\\.Nack\\("
      - change: Multipart request bodies are capped on the wire and rejected 413
        breaking: false
        guidance: "CRUD write handlers previously wrapped every body in a 1 MiB reader before checking the content type, so any multipart upload over 1 MiB failed with a 400. Multipart bodies now cap at crud.MaxMultipartBodyBytes (64 MiB) and over-limit requests get a 413. If you relied on the 400, expect 413; if you need a different ceiling, the constant is exported."
      - change: Standalone upload keys are unique, not the client filename
        breaking: false
        guidance: "upload.Handler now keys objects with upload.UniqueFilename (sanitized name plus a timestamp and 8 random bytes), matching the auto-CRUD path. Two users uploading report.txt no longer overwrite each other. Read `key` from the response; code that rebuilt the storage key from `originalName` will no longer find the object. Objects stored before this release keep their old keys."
        detect: "upload.Handler"
      - change: Repeated ?field_in= keys union instead of dropping
        breaking: false
        guidance: "?tag_in=a,b&tag_in=c previously filtered on a,b alone and reported nothing. Every occurrence now contributes and the 1000-entry cap counts the union, so a client that sent repeated keys will get more rows than before — the rows it was already asking for. Relation-scoped lists (?author.name_in=) now enforce the same cap and 400 above it."
      - change: gofastr generate rejects seed values that cannot satisfy their field
        breaking: false
        guidance: "A seed row assigning a number to a relation column now fails at generate time naming the @entity.field=value form to use, instead of emitting an app that compiles and then dies at boot. Regenerate any blueprint carrying a numeric foreign key in its seed block."
        detect: "seed:"
  - version: v0.67.0
    title: Foreign keys enforced, read gates on every related-row surface
    notes:
      - change: "BREAKING: SQLite enforces foreign keys on every DSN"
        breaking: true
        guidance: "Every DSN opened through the sqlite3 driver name now gets _pragma=foreign_keys(1). AutoMigrate has always emitted FOREIGN KEY clauses and SQLite has always ignored them, so an app that accumulated rows pointing at nothing will see those writes fail now. Deleting a parent while children reference it also fails: AutoMigrate declares no ON DELETE action and entity.Relation cannot express one, so delete children first. Set _pragma=foreign_keys(0) in the DSN while you clean the data up. Postgres already enforced all of this. One case to check first: an entity declaring the same column as both Scope.OwnerField and a relation has a FOREIGN KEY that older AutoMigrate wrote and that the framework violates on every create, because the owner value comes from the auth table rather than the related entity. This release stops emitting it but cannot remove it from an existing table, so that database needs the opt-out until the table is rebuilt without the key."
        detect: "sql\\.Open\\(\"sqlite3\""
      - change: "BREAKING: the in-house gofastr/sqlite engine is removed"
        breaking: true
        guidance: "Import github.com/DonaldMurillo/gofastr/sqlite/stdlib and open sqlite3 instead of gofastr-sqlite. The stdlib package is unchanged and is what every app already imports; only the from-scratch engine behind the gofastr-sqlite driver name is gone. It was a test-only cross check against modernc.org/sqlite, which is real SQLite compiled to Go, so the cross check only ever reported bugs in the local engine."
        detect: "gofastr/sqlite\""
      - change: "BREAKING: server-rendered screens check the entity read gate"
        breaking: true
        guidance: "framework/ui/resource's List, Table, Detail and the pre-filled edit Form read rows directly and never entered the route middleware, so a screen served rows the same entity's REST route answered 401 or 403 for. They now render an access notice instead. A screen that rendered for anonymous visitors because of this gap goes blank until its entity declares the posture you want: a blank read: in the access block opens reads while keeping writes gated."
        detect: "framework/ui/resource"
      - change: "BREAKING: ?include= and ?rel.field= honour the target's read posture"
        breaking: true
        guidance: "Both read another entity's rows through the parent's route and neither consulted that entity's own posture, so an include returned rows the target refuses to serve and a nested filter changed the row count with a guessed value. Both now resolve the target and refuse with 403 when the caller may not read it. Owner- and tenant-scoped targets are refused on the nested-filter path outright, because an EXISTS clause counts rows without selecting them and cannot narrow them to the caller's own; filter on that entity's own list route instead. The detector points at your relation declarations: every one of them is reachable by ?include= and ?rel.field=, so check that each target entity declares the read posture you actually want."
        detect: "Relations:\\s*\\[\\]"
  - version: v0.68.0
    title: Row-level read scoping, in-process nested filters scoped, stale owner-key repair
    notes:
      - change: "BREAKING: ListAll and CountAll scope a NestedFilters spec to the caller"
        breaking: true
        guidance: "Owner, tenant, and read-scope predicates now narrow ListOptions.NestedFilters on every call, not only over HTTP. The narrowing was previously gated on a context marker no host could set, so the safe branch was unreachable and a host forwarding a caller-influenced relation into ListAll mid-request had a count oracle over rows the target hides. Server-side code that means across every owner now says so with owner.AllowCrossOwner or tenant.AllowCrossTenant; both already exist for this surface and neither is reachable from an HTTP route. The posture check (may this caller read the target at all) stays HTTP-only, matching ApplyIncludes, because it is the baseline session gate and in-process code has no session."
        detect: "NestedFilters"
      - change: gofastr migrate repair rebuilds a table carrying a pre-v0.67 owner-column foreign key
        breaking: false
        guidance: "v0.67 turned SQLite foreign-key enforcement on and stopped emitting the key an entity gets when one column is both Scope.OwnerField and a relation, but it could not remove one already in a table, and SQLite has no DROP CONSTRAINT. Run `gofastr migrate repair --from=<blueprint.yml> --db-url=<url>` to report and `--apply` to rebuild. The replacement DDL is the original minus the offending clause, so columns, defaults, other constraints, indices and triggers survive. The scan reads the schema only: a key whose referenced table really does hold the stamped owner ids is satisfiable and --apply would drop it, so check the listed tables first."
        detect: "OwnerField"
      - change: Exposure.ReadScope narrows which rows a caller may read
        breaking: false
        guidance: "New, so nothing changes until an entity declares it. A read scope carries predicates on the entity's own columns plus the permission that lifts them, and one builder feeds every read: list and count, get, cursor, stream, the in-process API, typed queries, the upsert read-back, and the include and eager loaders at every depth. A row outside the scope answers 404 rather than 403. Writes are deliberately not filtered. Three shipped example blueprints served their own draft and unapproved rows to anonymous callers before this and now declare a scope."
  - version: v0.69.0
    title: "Silent failures made loud: inert theme tokens, dark-palette gaps, stale dev assets"
    notes:
      - change: "gofastr verify gains GOFASTR1806: a var(--name) the theme does not emit"
        breaking: false
        guidance: "A new ERROR-severity rule that can fail a verify run which passed before, because an invalid var() is not a CSS error: it resolves to nothing, the declaration is dropped, and nothing reported it. The pass now reads .css files as well as Go source. It flags a reference the theme does not emit and names the nearest token; it stays quiet for a reference carrying a fallback, a custom property declared in any scanned stylesheet, and the --ui-*/--fui-* component knobs. Fix the spelling (style.TokenNames lists what the theme emits), add a fallback, declare the property yourself, or waive it in the stylesheet with a /* gofastr:allow(GOFASTR1806) reason */ directive."
      - change: A theme with a partial dark palette warns once at boot
        breaking: false
        guidance: "An app whose Theme.DarkColors is non-empty but missing color tokens now gets one WARN at startup naming them. Those tokens were already painting their light values under a dark preference, which is usually a contrast bug; the warning is new, the rendering is not. A key present with an EMPTY value counts too, and is the worse case: an empty custom property is valid CSS, so it overrides the light declaration and the consuming declaration is dropped rather than falling back. An empty DarkColors is a light-only theme by design and stays silent."
        detect: "DarkColors"
      - change: "GOFASTR1801 no longer reports a Go short variable declaration as a stylesheet"
        breaking: false
        guidance: "fill := \"var(--color-surface)\" failed the build: fill and stroke are CSS property names and legal Go identifiers, so the colon of := satisfied the property colon. Only a fix, so nothing to do on upgrade, but a suppression added to work around it is now stale and gofastr verify will report it as such."
        detect: "gofastr:allow\\(GOFASTR1801"
