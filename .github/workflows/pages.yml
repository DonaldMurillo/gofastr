# Deploys a native static export of the docs site (examples/site) to GitHub Pages.
#
# The site is an SSR-first GoFastr app. Rather than crawling a running
# server with wget (the old approach, which baked "?v=<hash>" into split
# runtime-module filenames and 404'd every module on the static host,
# silently killing all client interactivity), `site --export` renders
# every declared route in-process and dumps all /__gofastr assets with
# query-free filenames. See framework/static.Builder + framework.App.ExportStatic.
#
# Client-only widgets (theme toggle, copy, client-side tabs) work on the
# static export. Server-backed islands (RPC widgets, SSE, live search)
# need the Go server and are out of scope here; full-fidelity hosting
# (Fly/Render/Cloud Run) remains the upgrade path for those.
name: pages

on:
  # The site follows releases, not main. release.yml calls this once its
  # gate has passed and the release exists, so the site documents what
  # `go get` installs, under that release's version number. Deploying on
  # every push to main published unreleased docs under the previous
  # release's version.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build the site from, e.g. v0.95.0"
        required: true
        type: string
  # A manual redeploy (a failed deploy, a Pages outage) rebuilds a
  # published release, by default the latest one, never main's head.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (empty: the latest release)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          fi
          # Same shape check as release.yml: the value reaches a shell
          # and a checkout ref, so pin it before anything uses it.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing tag $tag — a release tag must look like v1.2.3"; exit 1 ;;
          esac
          if printf '%s' "$tag" | grep -q '[^A-Za-z0-9._-]'; then
            echo "::error::refusing tag $tag — only [A-Za-z0-9._-] are allowed in a release tag"
            exit 1
          fi
          # Only a published release deploys. A v* tag the release gate
          # refused has no release, and its docs were never released.
          if ! gh release view "$tag" --repo "$REPO" --json tagName >/dev/null; then
            echo "::error::refusing tag $tag — it has no published release"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the docs site
        # Stamp siteVersion from the release tag so the live site shows the
        # release it documents instead of a hand-bumped constant.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          echo "building site as version: ${TAG#v}"
          go build "-ldflags=-X=main.siteVersion=${TAG#v}" -o /tmp/site ./examples/site/

      - name: Export static site
        # Native, declaration-driven SSG: render every route in-process and
        # dump all /__gofastr assets (runtime.js, split runtime modules,
        # color-scheme.js, app.css, per-component CSS) with query-free
        # filenames. Replaces the wget mirror, which baked "?v=<hash>" into
        # module filenames and 404'd every split module on the static host,
        # silently killing all client interactivity (theme toggle, palette,
        # copy, widgets). See framework/static.Builder + framework.App.ExportStatic.
        run: |
          # --export-base /gofastr: the site is served from a GitHub Pages
          # project URL (https://donaldmurillo.github.io/gofastr/), so every
          # root-absolute asset/nav URL and the runtime's constructed module
          # URLs must resolve under the /gofastr mount path.
          /tmp/site --export _site --export-base /gofastr
          test -f "_site/index.html" || { echo "export produced no index.html"; exit 1; }
          # __gofastr/ starts with an underscore, Jekyll would drop it.
          touch _site/.nojekyll
          echo "pages: $(find _site -name 'index.html' | wc -l) html files, $(du -sh _site | cut -f1) total"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time, and a running one finishes: a release's deploy
    # is never cancelled halfway by a manual redeploy or the next release.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
