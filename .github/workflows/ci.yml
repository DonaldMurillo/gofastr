name: CI

# Least privilege by default: without this block a workflow inherits the
# repository default, which on many repos is write-all, so any action or
# script in the run holds a token that can push to the repo. Jobs that
# genuinely need more raise it for themselves.
permissions:
  contents: read


# Two jobs, split by runtime profile (history: CI runs
# 27100756725..27161715772, June 2026):
#
#   1. `test` (BLOCKING): build + vet + every package that produced
#      deterministic results on the runners. This is the merge gate.
#
#   2. `browser-e2e` (BLOCKING since 2026-06-10): the slow chromedp
#      suites, one matrix shard per suite so each runs isolated on its
#      own runner (they contend for Chrome/sockets when sharing one):
#        - examples/site, including the axe gate in its own isolated
#          invocation (it flakes when sharing a go-test run with the
#          other chromedp tests, CLAUDE.md).
#        - cmd/gofastr TestAppSpecCLIGeneratesEntireWorkingAppE2E
#          ("chrome failed to start" under parallel load when it ran
#          inside the blocking job, 3/6 runs, serialized here).
#        - kiln/integration: chromedp-heavy, grouped here per
#          CLAUDE.md's slow-suite guidance.
#      This job was continue-on-error while TestAxe_AllPagesAreClean
#      failed 6/6 on Linux runners. Root cause: Linux Chrome defaults
#      to prefers-color-scheme: light, so CI audited the site's LIGHT
#      palette while macOS dev machines (Dark appearance) only ever
#      audited the dark one, the light-scheme colors genuinely failed
#      WCAG AA. Fixed 2026-06-10: light tokens retoned (examples/site
#      + core-ui status tones) and the axe test now forces BOTH schemes
#      per page, so the scan is platform-independent. If the
#      ERR_NETWORK_CHANGED runner flake (5/6 runs, June 2026) resurges,
#      rerun the job before reaching for continue-on-error.
#
# Docker is preinstalled on ubuntu-latest (testcontainers spins up
# Postgres automatically). Chrome is installed in both jobs: several
# blocking packages (framework, framework/uihost, core-ui/runtime,
# examples/backoffice) run chromedp tests that have been stable on CI.

on:
  push:
    branches: [main]
    # No v* tag trigger: a release tag points at a merge commit on main,
    # and check runs attach to the commit SHA, so the main-push run
    # already carries the blocking checks the release gate (release.yml)
    # polls for. A tag trigger re-ran the identical pipeline on the same
    # SHA, v0.62.0 ran twice, concurrently. Fail-closed is preserved: a
    # tag on a commit with no CI run finds zero check runs and the
    # release gate times out red.
  pull_request:
  # Merge queue: GitHub tests the queued commit (main + this PR, as it will
  # actually land) and merges that exact commit, so its check runs attach to
  # the SHA the release gate polls. Without the queue, every change runs this
  # pipeline twice, once on the PR's ephemeral merge commit, once on the
  # identical tree after it lands on main. This trigger is inert until the
  # queue is enabled on main; enabling it removes the duplicate.
  merge_group:
  # The `security` job needs a time trigger, not just a code trigger: an
  # advisory can land against a dependency nobody touched. GO-2026-5158
  # (otel baggage, reachable from core/middleware.Tracing) shipped in a
  # release and sat unnoticed precisely because every gate was
  # change-triggered. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # A manual full run, for the test-reads audit or anything else the
  # schedule covers, without waiting for Monday.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes. Scheduled and
# manual runs get their own group per ref: they sit on main too, and a
# push to main must not cancel a 90-minute audit halfway, nor a manual run
# on another branch.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · vet · test (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1" # mattn/go-sqlite3 requires cgo
      # Every Postgres suite in the repo resolves through TEST_POSTGRES_DSN.
      # The service below supplies it. This replaced testcontainers-go, which
      # spawned the container from inside the tests but had to be a require in
      # the root go.mod, and Go hands a module's requirements to everything
      # importing it, so every app built on GoFastr resolved the Docker client
      # stack. See cmd/repolint's test-only-dep-in-consumer-graph rule.
      TEST_POSTGRES_DSN: "postgres://test:test@localhost:5432/framework_test?sslmode=disable"
      # Fail-closed for the real-Postgres suites: internal/pgtest escalates the
      # no-Postgres t.Skip to t.Fatal so the ~30 dual-dialect tests can't
      # silently degrade to SQLite-only behind a green build. That guard now
      # covers this wiring too, a service that fails to come up, or a DSN that
      # drifts from it, fails the job instead of quietly skipping. Local dev
      # leaves it unset → tests keep skipping when no Postgres is around.
      PGTEST_REQUIRED: "1"
      # Affected scope (cmd/affected). On a pull request, vet, the
      # deterministic test step and the coverage floors run over the
      # import-graph closure of the PR's changes: the checkout is the PR's
      # merge commit, so a direct diff against the base SHA (fetched below,
      # depth 1, no merge-base needed) is exactly the change set. Every other
      # trigger (push to main, merge queue, schedule) sets GOFASTR_TEST_ALL=1
      # and runs everything: what lands on main is proven whole. That
      # includes cmd/gofastr's generated-app variants (clitest.VariantBuild),
      # which a pull request builds only when it edits their inputs; its
      # one generated-app build is appgen's TestUnionApp.
      GOFASTR_TEST_ALL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      GOFASTR_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
      GOFASTR_AFFECTED_DIFF_BASE: "1"
      # The deterministic test step's scope, shared with the replay gate
      # after it. The Test step's comment says why each one runs in
      # browser-e2e instead.
      TEST_EXCLUDE: 'gofastr/(examples/site|examples/meridian|examples/tracker|examples/layoutlab|kiln/integration|core-ui/runtime(/hosttest)?|core-ui/widget|evals/ui-quality/internal/evalrunner|framework/headless)$'
      TEST_SKIP: 'TestAppSpecCLIGeneratesEntireWorkingAppE2E|TestE2E_HotReload_BrowserAutoRefreshes|TestLivereloadSameBuildIDDoesNotReload|TestE2E_DevLoop_Examples'
    services:
      # pgvector/pgvector:pg16 is stock Postgres 16 plus the `vector`
      # extension, so this one service also covers battery/semantic's pgvector
      # store. Mirrors the `postgres` service in docker-compose.yml, which is
      # what `make test-pg` starts locally, keep the two images in step.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: framework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d framework_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch the pull request base (affected scope)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$GOFASTR_AFFECTED_BASE"

      - name: Go module + build/test cache + coverage manifests (per-SHA)
        id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Restored BEFORE Set up Go, here and in the two restore-only
          # steps below. setup-go installs the go.mod `go` version, and its
          # `go env` then downloads any newer `toolchain` version into the
          # module cache as read-only files. A snapshot restored on top of them
          # (it holds the same toolchain) fails tar on every one ("Cannot
          # open: File exists", exit 2). Restored first, the toolchain comes
          # from the snapshot and nothing is downloaded. An exclusion
          # pattern cannot leave it out: actions/cache globs without
          # descendants, so tar archives ~/go/pkg/mod whole. All three
          # steps list the same paths, because the path list is part of
          # the cache version and a drifted list never hits.
          # TestGoCachePathsMatch holds the order and the paths.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/gofastr-coverage
          # Keyed on the commit, and restore-keys hands the run the newest
          # prior snapshot. That is what lets Go's content-addressed test
          # cache skip every package whose sources + transitive deps are
          # unchanged since the last run, which is most of a main push.
          # Only main saves (the step at the end of this job): an entry is
          # 2 GB or more, the repo's cache LRU holds 10 GB, main cannot
          # read a pull request's entries, and PR saves were evicting
          # main's, so main runs started cold. A pull request restores
          # main's newest snapshot instead of its own previous push.
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # setup-go's built-in cache keys on go.sum alone: the entry is
          # saved once per dependency bump, then restored read-only by every
          # later run, test results for code that changed since are never
          # persisted, so the test step re-executed every package on every
          # run (observed: the v0.62.0 tag run re-ran 7.5 min of tests on a
          # SHA whose main-push twin was concurrently running the identical
          # suite). The explicit per-SHA cache above replaces it.
          cache: false

      - name: Coverage manifest directory
        # One directory for the axe and semantic-coverage manifests, shared
        # by cmd/affected, the test steps and gofastr verify. Outside the
        # checkout, because a manifest the sweep rewrites inside the module
        # is an input that moves on every run. A fixed path, because the
        # variable's value is part of every test's cache key.
        #
        # The manifests ride in the Go cache entry above. A package Go
        # replays from the test cache runs nothing and records nothing, so
        # the manifests its earlier run wrote come back with the test
        # results, the way nx restores a cached task's outputs. Without
        # them gofastr verify reads a manifest missing every replayed
        # package. One entry, because two saves can half-succeed and pair
        # new test results with old manifests. The manifests merge, so a
        # record outlives a test that is later deleted; the coverage rules
        # report at info.
        run: echo "GOFASTR_AXE_COVERAGE_DIR=$HOME/.cache/gofastr-coverage" >> "$GITHUB_ENV"

      - name: Install Chrome (stable chromedp suites run here too)
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Install bubblewrap (linux sandbox backend + P1-P7 probes)
        # The process-module SandboxRunner (framework) shells to `bwrap` for
        # the linux confinement backend; without it the conformance-probe
        # tests skip (fail-closed "backend unavailable") and that backend's
        # code goes uncovered in the coverage-floors gate. Installing it lets
        # the probes actually run. If unprivileged user namespaces are
        # restricted on the runner the probes still skip cleanly, never fail.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install Linux desktop runtime and virtual display
        # Runtime libraries only: the shell must still build with CGO=0,
        # without GTK headers or a C wrapper. Keep WebKit's sandbox enabled.
        run: sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify4 dbus xvfb xauth dunst xdotool xcompmgr

      - name: Install the gofastr binary
        # cmd/gofastr e2e tests (migrate diff/generate, app spec) skip
        # silently when the binary is absent, install it so they run.
        run: go install ./cmd/gofastr

      - name: Build
        run: go build ./...
      # The three gates `make build` runs locally (see Makefile + cmd/check-csp,
      # cmd/check-embed, cmd/repolint). The Build step above uses plain
      # `go build`, so until now these were local-only: a tree that fails them
      # still merged green. Each is a `go run` of a cmd/ gate binary over the
      # checkout: seconds, no services, no Chrome (verified 3-5s each,
      # 2026-08-16).
      - name: csp-check (no inline <script> / style emission)
        run: make csp-check

      - name: embed-check (no server actions in embeddable surfaces)
        run: make embed-check

      - name: repo-lint
        run: make repo-lint

      - name: Cross-compile smoke (windows, darwin, linux/386)
        # The runner is ubuntu-only, so windows-tagged files never compile
        # in any gate without this. Compile-only, no tests run. CGO_ENABLED
        # is forced off: the job-level "1" would make the cross-build
        # compile runtime/cgo with the host gcc, which cannot target the
        # other OSes. linux/386 catches a constant past a 32-bit int or
        # uint (an untyped 1<<53 bound, a uint compared to MaxInt64); test
        # files hold 64-bit constants on purpose and are not built.
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...
          GOOS=linux GOARCH=386 go build ./...

      - name: Linux desktop (CGO-free runtime and CLI)
        # The normal job uses runtime/cgo. Exercise the assembly runtime
        # shim separately so neither build mode can hide a link regression.
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 ./battery/desktop/...
          # Cross-link test executables: archive-only builds miss unresolved
          # ARM64 FFI/GTK assembly symbols. These binaries are not executed.
          mkdir -p dist/ci/linux-arm64
          GOOS=linux GOARCH=arm64 go test -c -o dist/ci/linux-arm64/ ./battery/desktop/...
          go test -count=1 -run 'Test(Desktop|LinuxDesktop)' ./cmd/gofastr/ ./cmd/gofastr/internal/desktopcmd/ ./cmd/gofastr/internal/devcmd/

      - name: Linux desktop graphical tests (CGO-free GTK and WebKit)
        timeout-minutes: 20
        # One process per suite, so a native crash names its suite, plus the
        # bus-only check.
        # Fail closed: an opt-in skip must never satisfy this blocking gate.
        run: ./scripts/test-linux-desktop.sh

      - name: gofmt (tracked files must be clean)
        run: |
          drift=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$drift" ]; then
            echo "gofmt drift in:"; echo "$drift"; exit 1
          fi

      - name: Vet (affected packages)
        run: go run ./cmd/affected -- go vet

      - name: Vet (repo analyzers)
        # CLAUDE.md hard rules as machine checks: no Go-emitted hard
        # navigation / bespoke EventSource, no *BaseCSS outside the
        # design system, no map-ordered SSR output. See internal/analyzers.
        # Affected packages, except that a change under internal/analyzers
        # or cmd/vettool vets everything: a new rule can flag code nobody
        # touched.
        run: |
          go build -o /tmp/gofastr-vettool ./cmd/vettool
          go run ./cmd/affected -all-if-changed internal/analyzers/ -all-if-changed cmd/vettool/ -- go vet -vettool=/tmp/gofastr-vettool

      - name: Duplicate code (dupl, baseline-gated)
        # make dupl counts dupl clone groups (threshold 100) over the
        # repo's Go files and fails when the count GROWS past the
        # committed scripts/dupl-baseline.txt. Pinned to an exact dupl
        # version in scripts/dupl.sh so its tree matching cannot drift;
        # ~7s on an M-series laptop, dominated by parsing, no services.
        run: make dupl

      - name: Content-derived mtimes (test cache keys)
        # Go keys a cached test result on the size and mtime of every file
        # the test read. A fresh checkout stamps every file with the time
        # of the checkout, so no package replayed from the restored cache:
        # 0 of 158 on a push that changed one test file. This gives each
        # tracked file an mtime derived from its blob hash, and every
        # directory, .git included, one fixed time. Runs here, not right
        # after checkout, so the steps above cannot stamp new times again.
        run: scripts/content-mtimes.sh

      - name: Test (deterministic packages)
        # -timeout=20m. The old `-p 2` kept chromedp sockets off the
        # ephemeral-port ceiling while chromedp suites ran here; those now
        # run in browser-e2e, so the step uses the runner's full core count
        # (2026-10: with -p 2 both slots were saturated and the step was
        # the critical path of every PR). Intentionally NO -count=1: Go's
        # content-addressed test cache (persisted across runs by the
        # per-SHA cache step above) then skips re-executing any package
        # whose sources + transitive deps + test inputs are byte-identical
        # to a prior PASS, the free, correct-by-construction analog of
        # Nx's affected/cache. Do NOT re-add -count=1 here to "force fresh
        # runs"; the flaky chromedp suites keep it in browser-e2e, which
        # is where forcing a fresh run per push actually matters.
        # Excluded here and run in browser-e2e instead:
        #   - examples/site, kiln/integration, core-ui/runtime,
        #     core-ui/widget (whole packages, the latter two host the
        #     hydration chromedp suites and are documented flaky under
        #     parallel package load; see CLAUDE.md)
        #   - examples/meridian (the 16-surface visual canary exhausts its
        #     bounded 12s capture attempts when another chromedp suite runs
        #     beside it under -p 2, the exact starvation class the other
        #     exclusions document)
        #   - framework/headless (the behaviour-module browser suite; same
        #     Chrome-contention class as core-ui/runtime)
        #   - evals/ui-quality/internal/evalrunner (its capture tests drive
        #     a real headless Chrome; same class)
        #   - examples/tracker, examples/layoutlab (chromedp e2e suites,
        #     3 and 2 minutes each; they filled a -p 2 slot here for the
        #     whole step and belong with the other browser suites)
        #   - cmd/gofastr browser tests via -skip (the rest of the
        #     package stays blocking). These drive a real Chrome over a
        #     livereload websocket; beside every other package they
        #     contend for Chrome/sockets and the websocket connect times
        #     out. They run serialized in browser-e2e instead.
        # Scoped to the affected packages on pull requests (see the job
        # env); everything on main.
        # -coverprofile: the coverage-floors step below reads this one
        # merged profile instead of running the floored suites a second
        # time. Own-package coverage, the same arithmetic as `-cover`.
        # test-start marks the run's start for the replay gate below, and
        # GODEBUG=gocachetest=1 has go test log each package's cache
        # decisions (what it saved, and why it declined to) to
        # testcache-1.log for the same gate. GODEBUG is itself a cache
        # input, so both runs set the same value.
        shell: bash
        run: |
          touch "$RUNNER_TEMP/test-start"
          status=0
          GODEBUG=gocachetest=1 go run ./cmd/affected \
            -exclude "$TEST_EXCLUDE" \
            -- go test -timeout=20m -coverprofile="$RUNNER_TEMP/cover.out" \
            -skip "$TEST_SKIP" \
            2> "$RUNNER_TEMP/testcache-1.log" || status=$?
          grep -v '^testcache: ' "$RUNNER_TEMP/testcache-1.log" >&2 || true
          exit "$status"

      - name: Test cache replays (second run re-runs nothing)
        # The same command again, over a tree nothing has changed. Every
        # package must come back "(cached)". One that re-runs reads an
        # input that moves when no code did (a stat of .git, a file another
        # package's test writes into the module, a directory listing that
        # picks up run state), and every later run pays for it in full.
        shell: bash
        run: |
          set -o pipefail
          status=0
          GODEBUG=gocachetest=1 go run ./cmd/affected \
            -exclude "$TEST_EXCLUDE" \
            -- go test -timeout=20m -coverprofile="$RUNNER_TEMP/cover.out" \
            -skip "$TEST_SKIP" \
            2> "$RUNNER_TEMP/testcache-2.log" | tee "$RUNNER_TEMP/replay.log" || status=$?
          grep -v '^testcache: ' "$RUNNER_TEMP/testcache-2.log" >&2 || true
          [ "$status" = 0 ] || exit "$status"
          # A change that reaches no package (docs, workflow-only) runs no
          # test at all, so there is nothing to replay.
          if grep -q '^affected: no packages affected' "$RUNNER_TEMP/testcache-2.log"; then
            echo "test-cache-replay: no packages affected, nothing to replay"
            exit 0
          fi
          scripts/test-cache-replay.sh "$RUNNER_TEMP/replay.log" "$RUNNER_TEMP/test-start" \
            "$RUNNER_TEMP/testcache-1.log" "$RUNNER_TEMP/testcache-2.log"

      - name: Benchmarks run once (affected packages)
        # `go test` never runs benchmarks, so a broken one fails nobody's
        # build; 56 framework benchmarks sat broken until 2026-10. This runs
        # each benchmark in the affected packages once (-benchtime=1x,
        # SQLite only) to prove it still works. It measures nothing.
        run: make bench-smoke

      - name: Race detector (concurrency packages)
        # The recurring defect class in this repo's release history is
        # concurrency — queue claim/lease fencing, per-consumer outbox
        # cursors, fanout subscriber queues — and until this gate existed
        # no CI check could see a data race at all: -race was a local
        # RACE=1 opt-in in scripts/test-all.sh and appeared nowhere in CI.
        # Every one of those bugs was found by an audit reading code,
        # never by a test.
        #
        # Scoped to the packages that actually coordinate goroutines rather
        # than -race over ./..., which would roughly double the whole suite
        # to re-prove thread-safety for packages that never spawn. Add a
        # package here when it grows a goroutine, a lease, or a shared
        # cursor.
        #
        # `./framework` (the root: app.go, health.go, the process-module
        # supervisor — the goroutine-heaviest code in the repo) is raced
        # since the #208 split moved its two timing-hostile suites out:
        #   - framework/uie2e — the chromedp browser e2e suite. A
        #     full-package -race run timed out
        #     TestUIE2E_OwnerScope_CrossUserIsolation: load-dependent
        #     slowdown, not a data race.
        #   - framework/processmoduletest — the TestSupervisor_* scenarios
        #     drive real child processes against compressed timings
        #     (50ms polls, 500ms leases, 3s spawn deadlines) that flaked
        #     under -race while passing repeatedly in isolation.
        # A handful of process-module tests stayed in ./framework because
        # they reach unexported supervisor internals (moduleSlot
        # construction, Slot's live child, the store's raw db) and
        # exporting seams for them would be API that exists only for
        # tests. They spawn real children too, but against generous
        # deadlines (5-6s state waits, a 15s probe cap, transport ceilings
        # written to tolerate -race). If one ever flakes under this gate,
        # the fix is an exported test seam — not a timeout bump.
        # 20m (not the old 15m) because the root package suite is larger
        # than the rest of this list combined.
        #
        # The list is a -match regexp over cmd/affected's output, so a pull
        # request races only the listed packages its change reaches; main
        # (GOFASTR_TEST_ALL=1) races the whole list. The regexp spells the
        # same set as these patterns did:
        #   ./framework ./battery/queue/... ./battery/cache/...
        #   ./framework/outbox/... ./framework/fanout/... ./core/fanout/...
        #   ./framework/cron/... ./framework/event/... ./framework/hook/...
        #   ./framework/ratelimit/... ./framework/lifecycle/...
        #   ./framework/slowquery/... ./core/stream/... ./framework/uihost/...
        run: |
          go run ./cmd/affected \
            -match 'gofastr/(framework|battery/(queue|cache)(/.*)?|framework/(outbox|fanout|cron|event|hook|ratelimit|lifecycle|slowquery|uihost)(/.*)?|core/(fanout|stream)(/.*)?)$' \
            -- go test -race -timeout=20m

      - name: Nested module (battery/print/chromepdf)
        # battery/print/chromepdf is its own go module: a nested module that
        # isolates the chromedp/cdproto dependency surface from the print
        # battery's core. A nested module is invisible to the root `./...`
        # glob, so the build/vet/test steps above no longer cover it, this
        # step keeps its build + vet + the non-chromium unit tests (the SSRF
        # resolver-rules gate in ssrf_security_test.go) inside the blocking
        # job. The chromium-tagged integration tests are intentionally not run
        # here, matching the pre-split coverage: they build only under
        # `-tags chromium`, which no root step passes.
        run: cd battery/print/chromepdf && go build ./... && go vet ./... && go test ./...

      - name: Coverage floors (claimed packages)
        # Measures every floor-gated package from the Test step's merged
        # profile and fails if any drops below its floor (~2 points under
        # the recorded value). No second test run: that cost four to five
        # minutes of this job (2026-10). On main every floor must appear in
        # the profile; on a pull request a floor outside the affected set
        # is skipped. Floor table + exclusions live in the script.
        run: COVERPROFILE="$RUNNER_TEMP/cover.out" bash scripts/coverage-floors.sh

      - name: Contracts (gofastr verify)
        # The framework held to its own contract. Runs AFTER the test step
        # so the semantic-coverage manifest those tests write is on disk,
        # without it the testing rules report "no manifest" and check
        # nothing, which would look like a pass.
        #
        # --no-vet because the Vet step above already ran it over the whole
        # module; repeating it here would double the slowest part of this
        # job for no new signal.
        #
        # --strict makes WARNINGS fail too, which is only tractable because
        # of the baseline: .gofastr-contracts-baseline.json records the debt
        # that existed when the gate went in, so this run fails on findings
        # ADDED after that point and not on the ones already there.
        #
        # Without it the gate could only fail on errors, and a change adding
        # fifty unguarded mutations would pass, which is the same as having
        # no gate for two thirds of the catalog.
        #
        # Pay the debt down and re-record with `gofastr verify --strict
        # --baseline-write`; the run tells you when an entry is
        # over-accepting. Relaxations live in gofastr.settings.yml, in the
        # repository, in review, not in this file as CI-only flags nobody
        # reads.
        run: |
          go run ./cmd/gofastr verify --no-vet --strict

      - name: Save the Go cache and coverage manifests (main only)
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/gofastr-coverage
          key: go-test-${{ runner.os }}-${{ github.sha }}

  security:
    name: "vulncheck · secrets · mod-verify (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        # `make vulncheck` fails closed when the binary is absent, so this
        # install is what keeps the gate a gate rather than a skip.
        #
        # Pinned, not @latest: an unpinned install makes every CI run
        # fetch and execute whatever is newest at that moment, which is a
        # supply-chain dependency on a third party's release timing in
        # the middle of the security gate itself. Bump deliberately.
        #
        # v1.7.0, not v1.1.4: v1.1.4 bundles golang.org/x/tools v0.29.0, whose
        # SSA builder predates Go 1.27 and panics on this module's source with
        # `unexpected expr: *ast.KeyValueExpr`. A panicking scanner exits
        # non-zero, so the gate failed loudly rather than passing blind, but it
        # scanned nothing. v1.7.0 carries x/tools v0.49.0.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck (reachable advisories only)
        run: make vulncheck

      - name: Secret scan
        run: make secret-scan

      - name: Module integrity
        run: make mod-verify

  browser-e2e:
    # One matrix shard per chromedp suite. These suites were serialized in
    # a single job because they contend for Chrome/sockets when they share
    # a runner (CLAUDE.md documents the flake classes); separate runners
    # don't contend, so the matrix keeps every suite exactly as isolated
    # while running them concurrently, wall clock drops from the ~28m
    # serial sum to the slowest shard. fail-fast is off
    # so one red suite still lets the rest report, matching the old
    # per-step `if: !cancelled()` behavior. Each shard is its own check
    # run; release.yml's gate counts checks whose name contains
    # "(blocking)", so the suffix must stay in `name`.
    name: "browser e2e · ${{ matrix.suite }} (blocking)"
    runs-on: ubuntu-latest
    # Budget = the largest per-suite go-test timeout (site-axe, 30m) plus
    # setup.
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
      # Same affected scope as the test job: on a pull request each shard
      # first asks cmd/affected whether its package (matrix.pkg, an import
      # path regexp, under matrix.buildtags) is in the change's import-graph
      # closure and skips the suite when it is not. The check run still
      # reports success, so the release gate's "(blocking)" count is
      # unchanged. Every other trigger runs every shard.
      GOFASTR_TEST_ALL: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      GOFASTR_AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
      GOFASTR_AFFECTED_DIFF_BASE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: site
            pkg: examples/site$
            run: go test -count=1 -timeout=15m -skip 'TestAxe' ./examples/site/
          # The axe gate scans every page under BOTH color schemes. It ran
          # as two shards while one runner took 11-15 minutes (2026-09);
          # since each page loads once for both schemes (#595) a shard
          # scans for about 85 s, so the gate runs whole again (#598).
          # GOFASTR_AXE_SHARD=k/n still splits its work list
          # (examples/site/axe_test.go) if it grows back. Its own shard:
          # CLAUDE.md documents the axe suite flaking when it shares a
          # go-test run with the other chromedp tests. 30m: a 15m limit
          # once failed slow runners with nothing hung.
          - suite: site-axe
            pkg: examples/site$
            run: go test -count=1 -timeout=30m -run 'TestAxe_AllPagesAreClean' ./examples/site/
          # Moved out of the blocking job's Test step (2026-10): both are
          # chromedp e2e suites and filled one of its two package slots.
          - suite: tracker
            pkg: examples/tracker$
            run: go test -count=1 -timeout=10m ./examples/tracker/
          - suite: layoutlab
            pkg: examples/layoutlab$
            run: go test -count=1 -timeout=10m ./examples/layoutlab/
          - suite: kiln-integration
            pkg: kiln/integration$
            run: go test -count=1 -timeout=15m ./kiln/integration/
          - suite: gofastr-cli
            pkg: cmd/gofastr(/internal/devcmd)?$
            # Every cmd/gofastr test that drives a real Chrome, the
            # app spec app E2E plus the two dev livereload browser tests
            # (all three in the main package; the app spec E2E is a
            # generated-app variant, so it runs when GOFASTR_TEST_ALL=1
            # and skips on a pull request). Kept out of the
            # deterministic step so the websocket connect isn't starved by
            # parallel package load. TestE2E_DevLoop_Examples (devcmd:
            # builds and boots every example under `gofastr dev`) rides
            # here too: it needs no Chrome, but its eleven builds would
            # push the deterministic job past its 20m budget. -p 1 keeps
            # those builds off the browser tests, as when all four shared
            # one test binary. 25m covers its worst case: eleven examples
            # at the 90s per-example wait.
            run: go test -count=1 -timeout=25m -p 1 -run 'TestAppSpecCLIGeneratesEntireWorkingAppE2E|TestE2E_HotReload_BrowserAutoRefreshes|TestLivereloadSameBuildIDDoesNotReload|TestE2E_DevLoop_Examples' ./cmd/gofastr/ ./cmd/gofastr/internal/devcmd/
          - suite: core-ui-runtime
            pkg: core-ui/runtime$
            # The runtime hydration suite launches a real Chrome per test
            # binary; under the deterministic job's -p 2 package
            # parallelism the chromedp websocket connect starves and times
            # out ("websocket url timeout reached", CLAUDE.md documents
            # this package as flaky under parallel load, run isolated).
            # 20m: main's run took 581s on 2026-11-01, 19s under the old
            # 10m cap, and the next run on a PR hit it.
            run: go test -count=1 -timeout=20m ./core-ui/runtime/
          - suite: core-ui-runtime-hosts
            pkg: core-ui/runtime/hosttest$
            # The runtime's tests that boot it inside a framework, uihost
            # or battery host. They live apart so a change to those hosts
            # selects this short suite, not the runtime's whole one (#598).
            run: go test -count=1 -timeout=10m ./core-ui/runtime/hosttest/
          - suite: core-ui-widget
            pkg: core-ui/widget$
            # Same class as core-ui/runtime, documented flaky when
            # sharing a go-test run with other chromedp suites.
            run: go test -count=1 -timeout=5m ./core-ui/widget/
          - suite: framework-headless
            pkg: framework/headless$
            # Same class as core-ui/runtime and core-ui/widget: the
            # headless behaviour-module suite launches a real Chrome
            # per test binary, and under the deterministic job's -p 2
            # package parallelism the chromedp websocket connect
            # starves and times out. Runs isolated here.
            run: go test -count=1 -timeout=10m ./framework/headless/
          - suite: meridian
            pkg: examples/meridian$
            # The 16-surface rendered canary (desktop/mobile × light/dark
            # × marketing/auth/app/admin) captures in software on the
            # two-core runner: bounded 30s attempts × up to 6 retries per
            # surface need a budget well past the local ~2m runtime.
            run: go test -count=1 -timeout=25m ./examples/meridian/
          - suite: chromium-ui
            pkg: (framework/ui|framework/pluginhost|core/mcp|battery/auth|battery/service|battery/sitesearch|cmd/gofastr/packages(/.*)?|core-ui/interactive|examples/acme-site/siteheader|examples/meridian/siteheader)$
            # Go build tags for cmd/affected's go list; named apart from a
            # git tag trigger on purpose.
            buildtags: chromium
            # framework/ui + framework/pluginhost ship render guards
            # behind `-tags chromium` (card footer pinning, image
            # placeholder paint, srcset data-URI parsing, WASM tier
            # instantiation), and cmd/gofastr/packages ships the
            # canonical chrome packages' own capture tests behind the
            # same tag. No other root-module step passes that tag — the
            # nested chromepdf comment below is about a separate Go
            # module and its tagged tests stay out of scope here — so
            # before this shard those guards never ran in CI: a
            # `go test` without the tag silently compiles the files out
            # and passes. Verified locally green before landing:
            # `go test -tags chromium ./framework/ui/
            # ./framework/pluginhost/` (~12s). battery/sitesearch's
            # parity test (the browser ranks what Go ranks) rides the
            # same tag.
            # -p 1: these packages drive their own headless Chrome, and
            # go test runs packages CONCURRENTLY by default. Launching
            # several Chromes on one runner is the documented "chrome
            # failed to start" contention this workflow already
            # serializes elsewhere (see the header note on
            # TestAppSpecCLIGeneratesEntireWorkingAppE2E). It bit here
            # as "websocket url timeout reached" in
            # TestCardFooterPinsToBottomInGrid on a PR that touched
            # neither package. battery/service's tagged test signs in
            # through the file:// page `service open` writes and checks
            # the browser lands on the app with its session.
            # battery/auth's tagged test runs both passkey ceremonies
            # through Chrome's virtual authenticator.
            # Only the tests the tag adds run here: scripts/tagged-tests.sh
            # lists them, and the test job has already run the rest of
            # each package. cmd/repolint fails when a package with
            # chromium-tagged tests is missing from this list or from pkg.
            run: |
              pkgs="./framework/ui/ ./framework/pluginhost/ ./core/mcp/ ./battery/auth/ ./battery/service/ ./battery/sitesearch/ ./cmd/gofastr/packages/... ./core-ui/interactive/ ./examples/acme-site/siteheader/ ./examples/meridian/siteheader/"
              run_re=$(scripts/tagged-tests.sh chromium $pkgs)
              go test -count=1 -timeout=10m -p 1 -tags chromium -run "$run_re" $pkgs
          - suite: ui-quality-evals
            pkg: evals/ui-quality(/|$)
            # Its capture tests drive a real headless Chrome; kept out of
            # the deterministic -p 2 run for the same contention reason.
            run: go test -count=1 -timeout=10m ./evals/ui-quality/...
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch the pull request base (affected scope)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "$GOFASTR_AFFECTED_BASE"

      - name: Go module + build cache (restore only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/gofastr-coverage
          # Restore-only: every suite here runs -count=1, so the cache buys
          # compile time, not test skips, and saving this job's
          # near-duplicate GOCACHE would crowd the repo's 10 GB cache LRU
          # for no extra hits.
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # See the test job: setup-go's go.sum-keyed cache goes stale
          # between dependency bumps. This job restores the test job's
          # per-SHA cache instead.
          cache: false

      # Before the Chrome and gofastr installs: a suite the change does
      # not reach skips them too, not only the test run (#598).
      - name: Is this suite affected?
        id: scope
        env:
          PKG: ${{ matrix.pkg }}
          TAGS: ${{ matrix.buildtags }}
        # The assignment keeps the selector's exit status, so the step's
        # bash -e fails on a selector error; inside the [ ] test it read
        # as "nothing affected" and skipped the suite.
        run: |
          matched=$(go run ./cmd/affected -tags "$TAGS" -match "$PKG")
          if [ -n "$matched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$PKG is not in this change's import-graph closure; suite skipped (runs on main)."
          fi

      - name: Install Chrome
        if: steps.scope.outputs.run == 'true'
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Install the gofastr binary
        if: steps.scope.outputs.run == 'true'
        run: go install ./cmd/gofastr

      - name: Run suite
        if: steps.scope.outputs.run == 'true'
        run: ${{ matrix.run }}


  test-reads-audit:
    # Weekly proof that the affected selection (cmd/affected) sees every
    # file a test reads: the whole suite runs once with each test binary
    # writing Go's test log, and cmd/affected's audit checks that every
    # tracked file in those logs selects the package that read it. A test
    # that starts reading a file outside its package without a
    # //gofastr:test-reads directive fails here, not after a pull request
    # skipped it. Schedule and manual runs only: it is a full run, and pull
    # requests keep their affected scope.
    #
    # A skipped test records no reads, so this job gives the suites the
    # same environment the `test` job does: Postgres, the gofastr binary
    # and bubblewrap. GOFASTR_TEST_ALL=1 runs cmd/gofastr's generated-app
    # variants (clitest.VariantBuild), which skip without it.
    name: test-reads audit (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CGO_ENABLED: "1"
      GOFASTR_TESTLOG_DIR: ${{ github.workspace }}/../testlogs
      TEST_POSTGRES_DSN: "postgres://test:test@localhost:5432/framework_test?sslmode=disable"
      PGTEST_REQUIRED: "1"
      GOFASTR_TEST_ALL: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: framework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d framework_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Chrome (the chromedp suites read files too)
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Install bubblewrap (the sandbox probes skip without it)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install the gofastr binary (the cmd/gofastr e2e tests skip without it)
        run: go install ./cmd/gofastr

      - name: Record every test's reads and audit them
        run: scripts/test-reads-audit.sh

      - name: Suite failures behind an unaudited package
        if: failure()
        run: grep -E '^(FAIL|--- FAIL|panic:)' "$GOFASTR_TESTLOG_DIR/run.txt" || true

  upgrade-fixtures:
    # Mechanical proof that gofastr upgrade works end to end: two checked-in
    # apps generated by old CLIs (v0.38.0 and v0.53.0) are each bumped to THIS
    # tree (via a go.mod replace), have their migration.patch applied, are
    # built, booted against a frozen pre-upgrade SQLite DB, and exercised over
    # HTTP: SSR, auth, owner isolation, CRUD, OpenAPI, island round-trips.
    # See evals/upgrade-fixtures/README.md.
    #
    # BLOCKING since 2026-08-16: promoted from advisory (the v0.63 changelog
    # deferred promotion) after a stretch of green runs, 4/4 success on the
    # main runs checked at promotion time. The "(blocking)" suffix puts the
    # check in scripts/release-required-checks.txt's scope; the gate matches
    # names exactly and TestReleaseManifestMatchesCI pins the sync.
    name: "historical upgrade fixtures (blocking)"
    runs-on: ubuntu-latest
    # 25m: the scan gates type-check each fixture against its own-era
    # gofastr release (mattn/go-sqlite3 needs cgo, cold compile on the
    # runner) on top of the two build+boot cycles.
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0" # the upgraded fixtures use the pure-Go sqlite driver
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history, every release tag included. The registry symbol gate reads Go source
          # at each release's prior tag (git ls-tree / git show), and a
          # shallow clone has none — the test fails with fetch instructions
          # rather than skipping when tags are absent.
          fetch-depth: 0

      - name: Go module + build cache (restore only)
        # Reuses the per-SHA snapshot the `test` job writes on main (on a
        # pull request, main's newest snapshot). The fixtures
        # compile this repo's framework sources (the replace points at the
        # checkout), so the GOCACHE entries from `test`'s `go build ./...`
        # hit and the cold build is far smaller.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/gofastr-coverage
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run upgrade fixtures + negative proof
        env:
          GOFASTR_UPGRADE_FIXTURES: "1"
        run: |
          go test ./evals/upgrade-fixtures/ -count=1 -v
