name: CI

# Least privilege by default: without this block a workflow inherits the
# repository default, which on many repos is write-all, so any action or
# script in the run holds a token that can push to the repo. Jobs that
# genuinely need more raise it for themselves.
permissions:
  contents: read


# Two jobs, split by runtime profile (history: CI runs
# 27100756725..27161715772, June 2026):
#
#   1. `test` (BLOCKING): build + vet + every package that produced
#      deterministic results on the runners. This is the merge gate.
#
#   2. `browser-e2e` (BLOCKING since 2026-06-10): the slow chromedp
#      suites, one matrix shard per suite so each runs isolated on its
#      own runner (they contend for Chrome/sockets when sharing one):
#        - examples/site, including the axe gate in its own isolated
#          invocation (it flakes when sharing a go-test run with the
#          other chromedp tests, CLAUDE.md).
#        - cmd/gofastr TestBlueprintCLIGeneratesEntireWorkingAppE2E
#          ("chrome failed to start" under parallel load when it ran
#          inside the blocking job, 3/6 runs, serialized here).
#        - kiln/integration: chromedp-heavy, grouped here per
#          CLAUDE.md's slow-suite guidance.
#      This job was continue-on-error while TestAxe_AllPagesAreClean
#      failed 6/6 on Linux runners. Root cause: Linux Chrome defaults
#      to prefers-color-scheme: light, so CI audited the site's LIGHT
#      palette while macOS dev machines (Dark appearance) only ever
#      audited the dark one, the light-scheme colors genuinely failed
#      WCAG AA. Fixed 2026-06-10: light tokens retoned (examples/site
#      + core-ui status tones) and the axe test now forces BOTH schemes
#      per page, so the scan is platform-independent. If the
#      ERR_NETWORK_CHANGED runner flake (5/6 runs, June 2026) resurges,
#      rerun the job before reaching for continue-on-error.
#
# Docker is preinstalled on ubuntu-latest (testcontainers spins up
# Postgres automatically). Chrome is installed in both jobs: several
# blocking packages (framework, framework/uihost, core-ui/runtime,
# examples/backoffice) run chromedp tests that have been stable on CI.

on:
  push:
    branches: [main]
    # No v* tag trigger: a release tag points at a merge commit on main,
    # and check runs attach to the commit SHA, so the main-push run
    # already carries the blocking checks the release gate (release.yml)
    # polls for. A tag trigger re-ran the identical pipeline on the same
    # SHA, v0.62.0 ran twice, concurrently. Fail-closed is preserved: a
    # tag on a commit with no CI run finds zero check runs and the
    # release gate times out red.
  pull_request:
  # Merge queue: GitHub tests the queued commit (main + this PR, as it will
  # actually land) and merges that exact commit, so its check runs attach to
  # the SHA the release gate polls. Without the queue, every change runs this
  # pipeline twice, once on the PR's ephemeral merge commit, once on the
  # identical tree after it lands on main. This trigger is inert until the
  # queue is enabled on main; enabling it removes the duplicate.
  merge_group:
  # The `security` job needs a time trigger, not just a code trigger: an
  # advisory can land against a dependency nobody touched. GO-2026-5158
  # (otel baggage, reachable from core/middleware.Tracing) shipped in a
  # release and sat unnoticed precisely because every gate was
  # change-triggered. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build · vet · test (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1" # mattn/go-sqlite3 requires cgo
      # Every Postgres suite in the repo resolves through TEST_POSTGRES_DSN.
      # The service below supplies it. This replaced testcontainers-go, which
      # spawned the container from inside the tests but had to be a require in
      # the root go.mod, and Go hands a module's requirements to everything
      # importing it, so every app built on GoFastr resolved the Docker client
      # stack. See cmd/repolint's test-only-dep-in-consumer-graph rule.
      TEST_POSTGRES_DSN: "postgres://test:test@localhost:5432/framework_test?sslmode=disable"
      # Fail-closed for the real-Postgres suites: internal/pgtest escalates the
      # no-Postgres t.Skip to t.Fatal so the ~30 dual-dialect tests can't
      # silently degrade to SQLite-only behind a green build. That guard now
      # covers this wiring too, a service that fails to come up, or a DSN that
      # drifts from it, fails the job instead of quietly skipping. Local dev
      # leaves it unset → tests keep skipping when no Postgres is around.
      PGTEST_REQUIRED: "1"
    services:
      # pgvector/pgvector:pg16 is stock Postgres 16 plus the `vector`
      # extension, so this one service also covers battery/semantic's pgvector
      # store. Mirrors the `postgres` service in docker-compose.yml, which is
      # what `make test-pg` starts locally, keep the two images in step.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: framework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d framework_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # setup-go's built-in cache keys on go.sum alone: the entry is
          # saved once per dependency bump, then restored read-only by every
          # later run, test results for code that changed since are never
          # persisted, so the test step re-executed every package on every
          # run (observed: the v0.62.0 tag run re-ran 7.5 min of tests on a
          # SHA whose main-push twin was concurrently running the identical
          # suite). The explicit per-SHA cache below replaces it.
          cache: false

      - name: Go module + build/test cache (per-SHA)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Keyed on the commit so every run SAVES a fresh snapshot (cache
          # entries are immutable, an existing key is never updated), and
          # restore-keys hands the next run the newest prior snapshot. That
          # is what lets Go's content-addressed test cache skip every
          # package whose sources + transitive deps are unchanged since the
          # last run, the affected-tests mechanism the Test step's comment
          # relies on. GOCACHE self-trims stale entries; GitHub's 10 GB
          # per-repo LRU evicts old SHAs.
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Install Chrome (stable chromedp suites run here too)
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Install bubblewrap (linux sandbox backend + P1-P7 probes)
        # The process-module SandboxRunner (framework) shells to `bwrap` for
        # the linux confinement backend; without it the conformance-probe
        # tests skip (fail-closed "backend unavailable") and that backend's
        # code goes uncovered in the coverage-floors gate. Installing it lets
        # the probes actually run. If unprivileged user namespaces are
        # restricted on the runner the probes still skip cleanly, never fail.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install the gofastr binary
        # cmd/gofastr e2e tests (migrate diff/generate, blueprint) skip
        # silently when the binary is absent, install it so they run.
        run: go install ./cmd/gofastr

      - name: Build
        run: go build ./...
      # The three gates `make build` runs locally (see Makefile + cmd/check-csp,
      # cmd/check-embed, cmd/repolint). The Build step above uses plain
      # `go build`, so until now these were local-only: a tree that fails them
      # still merged green. Each is a `go run` of a cmd/ gate binary over the
      # checkout: seconds, no services, no Chrome (verified 3-5s each,
      # 2026-08-16).
      - name: csp-check (no inline <script> / style emission)
        run: make csp-check

      - name: embed-check (no server actions in embeddable surfaces)
        run: make embed-check

      - name: repo-lint
        run: make repo-lint

      - name: Cross-compile smoke (windows, darwin)
        # The runner is ubuntu-only, so windows-tagged files never compile
        # in any gate without this. Compile-only, no tests run. CGO_ENABLED
        # is forced off: the job-level "1" would make the cross-build
        # compile runtime/cgo with the host gcc, which cannot target the
        # other OSes.
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...

      - name: gofmt (tracked files must be clean)
        run: |
          drift=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$drift" ]; then
            echo "gofmt drift in:"; echo "$drift"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (deterministic packages)
        # -timeout=20m, -p 2 to keep httptest/chromedp sockets off the
        # ephemeral-port ceiling. Intentionally NO -count=1: Go's
        # content-addressed test cache (persisted across runs by the
        # per-SHA cache step above) then skips re-executing any package
        # whose sources + transitive deps + test inputs are byte-identical
        # to a prior PASS, the free, correct-by-construction analog of
        # Nx's affected/cache. Do NOT re-add -count=1 here to "force fresh
        # runs"; the flaky chromedp suites keep it in browser-e2e, which
        # is where forcing a fresh run per push actually matters.
        # Excluded here and run in browser-e2e instead:
        #   - examples/site, kiln/integration, core-ui/runtime,
        #     core-ui/widget (whole packages, the latter two host the
        #     hydration chromedp suites and are documented flaky under
        #     parallel package load; see CLAUDE.md)
        #   - examples/meridian (the 16-surface visual canary exhausts its
        #     bounded 12s capture attempts when another chromedp suite runs
        #     beside it under -p 2, the exact starvation class the other
        #     exclusions document)
        #   - evals/ui-quality/internal/evalrunner (its capture tests drive
        #     a real headless Chrome; same class)
        #   - cmd/gofastr browser tests via -skip (the rest of the
        #     package stays blocking). These drive a real Chrome over a
        #     livereload websocket; under -p 2 with every other package
        #     they contend for Chrome/sockets and the websocket connect
        #     times out. They run serialized in browser-e2e instead.
        run: |
          # shellcheck disable=SC2046  # word splitting of go list output is intended
          go test -timeout=20m -p 2 \
            -skip 'TestBlueprintCLIGeneratesEntireWorkingAppE2E|TestE2E_HotReload_BrowserAutoRefreshes|TestLivereloadSameBuildIDDoesNotReload' \
            $(go list ./... | grep -vE 'gofastr/(examples/site|examples/meridian|kiln/integration|core-ui/runtime|core-ui/widget|evals/ui-quality/internal/evalrunner)$')

      - name: Race detector (concurrency packages)
        # The recurring defect class in this repo's release history is
        # concurrency, queue claim/lease fencing, per-consumer outbox
        # cursors, fanout subscriber queues, and until now no gate could
        # see a data race at all: -race was a local RACE=1 opt-in in
        # scripts/test-all.sh and appeared nowhere in CI. Every one of those
        # bugs was found by an audit reading code, never by a test.
        #
        # Scoped to the packages that actually coordinate goroutines rather
        # than -race over ./..., which would roughly double the whole suite
        # to re-prove thread-safety for packages that never spawn. Add a
        # package here when it grows a goroutine, a lease, or a shared
        # cursor. Whole set runs in ~90s.
        #
        # The `framework` root package is deliberately NOT in this list even
        # though it spawns goroutines (app.go, health.go, the process-module
        # supervisor). It also holds chromedp browser e2e tests and
        # supervisor timing tests whose deadlines do not reliably absorb race
        # instrumentation: TestSupervisor_* has been observed flaking under
        # -race while passing repeatedly in isolation, and one full-package
        # -race run also timed out TestUIE2E_OwnerScope_CrossUserIsolation
        # (not reproducible on every machine, it is load-dependent, so expect
        # it to bite hardest on a 2-core runner). That is slowdown, not a data
        # race, but a gate that goes red for timing teaches people to ignore
        # it.
        #
        # This exclusion is meant to be temporary: the goroutine-heaviest code
        # in the repo (app.go, health.go, the process-module supervisor) is the
        # part with no race gate. Covering it needs the browser and timing
        # suites split into their own package first.
        run: |
          go test -race -timeout=15m \
            ./battery/queue/... ./battery/cache/... \
            ./framework/outbox/... ./framework/fanout/... ./core/fanout/... \
            ./framework/cron/... ./framework/event/... ./framework/hook/... \
            ./framework/ratelimit/... ./framework/lifecycle/... \
            ./framework/slowquery/... ./core/stream/... \
            ./framework/uihost/...

      - name: Nested module (battery/print/chromepdf)
        # battery/print/chromepdf is its own go module: a nested module that
        # isolates the chromedp/cdproto dependency surface from the print
        # battery's core. A nested module is invisible to the root `./...`
        # glob, so the build/vet/test steps above no longer cover it, this
        # step keeps its build + vet + the non-chromium unit tests (the SSRF
        # resolver-rules gate in ssrf_security_test.go) inside the blocking
        # job. The chromium-tagged integration tests are intentionally not run
        # here, matching the pre-split coverage: they build only under
        # `-tags chromium`, which no root step passes.
        run: cd battery/print/chromepdf && go build ./... && go vet ./... && go test ./...

      - name: Coverage floors (claimed packages)
        # Re-runs `go test -cover` for only the floor-gated packages and
        # fails if any drops below its floor (~2 points under the recorded
        # value). Floor table + exclusions live in the script.
        run: bash scripts/coverage-floors.sh

      - name: Contracts (gofastr verify)
        # The framework held to its own contract. Runs AFTER the test step
        # so the semantic-coverage manifest those tests write is on disk,
        # without it the testing rules report "no manifest" and check
        # nothing, which would look like a pass.
        #
        # --no-vet because the Vet step above already ran it over the whole
        # module; repeating it here would double the slowest part of this
        # job for no new signal.
        #
        # --strict makes WARNINGS fail too, which is only tractable because
        # of the baseline: .gofastr-contracts-baseline.json records the debt
        # that existed when the gate went in, so this run fails on findings
        # ADDED after that point and not on the ones already there.
        #
        # Without it the gate could only fail on errors, and a change adding
        # fifty unguarded mutations would pass, which is the same as having
        # no gate for two thirds of the catalog.
        #
        # Pay the debt down and re-record with `gofastr verify --strict
        # --baseline-write`; the run tells you when an entry is
        # over-accepting. Relaxations live in gofastr.contracts.yml, in the
        # repository, in review, not in this file as CI-only flags nobody
        # reads.
        run: |
          go run ./cmd/gofastr verify --no-vet --strict

  security:
    name: "vulncheck · secrets · mod-verify (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        # `make vulncheck` fails closed when the binary is absent, so this
        # install is what keeps the gate a gate rather than a skip.
        #
        # Pinned, not @latest: an unpinned install makes every CI run
        # fetch and execute whatever is newest at that moment, which is a
        # supply-chain dependency on a third party's release timing in
        # the middle of the security gate itself. Bump deliberately.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck (reachable advisories only)
        run: make vulncheck

      - name: Secret scan
        run: make secret-scan

      - name: Module integrity
        run: make mod-verify

  browser-e2e:
    # One matrix shard per chromedp suite. These suites were serialized in
    # a single job because they contend for Chrome/sockets when they share
    # a runner (CLAUDE.md documents the flake classes); separate runners
    # don't contend, so the matrix keeps every suite exactly as isolated
    # while running them concurrently, wall clock drops from the ~28m
    # serial sum to the slowest shard (site-axe, ~13m). fail-fast is off
    # so one red suite still lets the rest report, matching the old
    # per-step `if: !cancelled()` behavior. Each shard is its own check
    # run; release.yml's gate counts checks whose name contains
    # "(blocking)", so the suffix must stay in `name`.
    name: "browser e2e · ${{ matrix.suite }} (blocking)"
    runs-on: ubuntu-latest
    # Budget = the largest per-suite go-test timeout (meridian, 25m) plus
    # setup; the timeouts on each `run` are unchanged from the serialized
    # steps they replace.
    timeout-minutes: 35
    env:
      CGO_ENABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: site
            run: go test -count=1 -timeout=15m -skip 'TestAxe' ./examples/site/
          - suite: site-axe
            # 15m, not 10, the gate scans every page under BOTH color
            # schemes (≈3.5min locally; CI runners are slower). Its own
            # shard: CLAUDE.md documents the axe suite flaking when it
            # shares a go-test run with the other chromedp tests.
            run: go test -count=1 -timeout=15m -run 'TestAxe_AllPagesAreClean' ./examples/site/
          - suite: kiln-integration
            run: go test -count=1 -timeout=15m ./kiln/integration/
          - suite: gofastr-cli
            # Every cmd/gofastr test that drives a real Chrome, the
            # blueprint app E2E plus the two dev livereload browser tests.
            # Kept out of the deterministic step so the websocket connect
            # isn't starved by parallel package load.
            run: go test -count=1 -timeout=10m -run 'TestBlueprintCLIGeneratesEntireWorkingAppE2E|TestE2E_HotReload_BrowserAutoRefreshes|TestLivereloadSameBuildIDDoesNotReload' ./cmd/gofastr/
          - suite: core-ui-runtime
            # The runtime hydration suite launches a real Chrome per test
            # binary; under the deterministic job's -p 2 package
            # parallelism the chromedp websocket connect starves and times
            # out ("websocket url timeout reached", CLAUDE.md documents
            # this package as flaky under parallel load, run isolated).
            run: go test -count=1 -timeout=10m ./core-ui/runtime/
          - suite: core-ui-widget
            # Same class as core-ui/runtime, documented flaky when
            # sharing a go-test run with other chromedp suites.
            run: go test -count=1 -timeout=5m ./core-ui/widget/
          - suite: meridian
            # The 16-surface rendered canary (desktop/mobile × light/dark
            # × marketing/auth/app/admin) captures in software on the
            # two-core runner: bounded 30s attempts × up to 6 retries per
            # surface need a budget well past the local ~2m runtime.
            run: go test -count=1 -timeout=25m ./examples/meridian/
          - suite: ui-quality-evals
            # Its capture tests drive a real headless Chrome; kept out of
            # the deterministic -p 2 run for the same contention reason.
            run: go test -count=1 -timeout=10m ./evals/ui-quality/...
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # See the test job: setup-go's go.sum-keyed cache goes stale
          # between dependency bumps. This job restores the test job's
          # per-SHA cache instead.
          cache: false

      - name: Go module + build cache (restore only)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Restore-only: every suite here runs -count=1, so the cache buys
          # compile time, not test skips, and saving this job's
          # near-duplicate GOCACHE would crowd the repo's 10 GB cache LRU
          # for no extra hits.
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          install-dependencies: true

      - name: Install the gofastr binary
        run: go install ./cmd/gofastr

      - name: Run suite
        run: ${{ matrix.run }}


  upgrade-fixtures:
    # Mechanical proof that gofastr upgrade works end to end: two checked-in
    # apps generated by old CLIs (v0.38.0 and v0.53.0) are each bumped to THIS
    # tree (via a go.mod replace), have their migration.patch applied, are
    # built, booted against a frozen pre-upgrade SQLite DB, and exercised over
    # HTTP: SSR, auth, owner isolation, CRUD, OpenAPI, island round-trips.
    # See evals/upgrade-fixtures/README.md.
    #
    # BLOCKING since 2026-08-16: promoted from advisory (the v0.63 changelog
    # deferred promotion) after a stretch of green runs, 4/4 success on the
    # main runs checked at promotion time. The "(blocking)" suffix puts the
    # check in scripts/release-required-checks.txt's scope; the gate matches
    # names exactly and TestReleaseManifestMatchesCI pins the sync.
    name: "historical upgrade fixtures (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0" # the upgraded fixtures use the pure-Go sqlite driver
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Go module + build cache (restore only)
        # Reuses the per-SHA snapshot the `test` job writes. The fixtures
        # compile this repo's framework sources (the replace points at the
        # checkout), so the GOCACHE entries from `test`'s `go build ./...`
        # hit and the cold build is far smaller.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-

      - name: Run upgrade fixtures + negative proof
        env:
          GOFASTR_UPGRADE_FIXTURES: "1"
        run: |
          go test ./evals/upgrade-fixtures/ -count=1 -v