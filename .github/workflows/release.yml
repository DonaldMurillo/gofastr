# Safety net for the release flow: every pushed v* tag must have a
# GitHub release. The human/agent flow (merge → tag → `gh release create`
# with a descriptive title) is still the primary path — this workflow
# exists because the last step got skipped twice (v0.22–v0.24 era, then
# v0.34.0–v0.39.0 backfilled 2026-07-22).
#
# Behavior on tag push:
#   - release already exists → no-op success.
#   - release missing, CHANGELOG.md has a `## [X.Y.Z]` section → create
#     the release with that section as the body. Title is just the tag;
#     edit it afterward to the usual "vX.Y.Z — short description" form.
#   - release missing AND changelog section missing → FAIL. That means
#     the changelog roll never happened, which the single-PR release
#     flow requires; fix the changelog, then re-run via workflow_dispatch.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to (re)check, e.g. v0.40.0'
        required: true

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # SHA-pinned like every other action in this repo: a tag is mutable,
      # so `@v4` executes whatever the tag points at on release day.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # A release must not ship a red commit. v0.61.0 published while its
      # blocking build·vet·test check had FAILED, because nothing here ever
      # consulted CI. Waits for every "(blocking)" check run on the exact
      # tag SHA and refuses to publish unless all of them — at least three
      # — completed green. Check runs attach to the commit, and a release
      # tag points at a merge commit on main, so the checks this finds are
      # the ones from that commit's main-push CI run; ci.yml deliberately
      # has no v* trigger (it would re-run the identical pipeline on the
      # same SHA). If the tag points at a commit that never ran CI — or
      # whose run was cancelled — zero checks turn up and the wait below
      # times out red: retag on a commit with green CI, or re-run the
      # failed jobs of that commit's existing CI run (check runs update in
      # place on the same SHA), then re-run this via workflow_dispatch.
      - name: Require green blocking CI on the tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "${TAG}^{commit}")
          echo "gating release of $TAG on blocking check runs at $sha"
          deadline=$((SECONDS + 3600))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate \
              --jq '[.check_runs[] | select(.name | test("\\(blocking\\)"))]')
            total=$(jq 'length' <<<"$runs")
            green=$(jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length' <<<"$runs")
            red=$(jq -r '[.[] | select(.status=="completed" and .conclusion!=null and .conclusion!="success")] | map(.name) | join(", ")' <<<"$runs")
            if [ -n "$red" ]; then
              echo "::error::blocking checks failed on $sha: $red — a release must not ship a red commit. Fix, retag (or re-run CI), then re-run via workflow_dispatch."
              exit 1
            fi
            if [ "$total" -ge 3 ] && [ "$green" -eq "$total" ]; then
              echo "all $total blocking checks green on $sha"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for blocking checks on $sha ($green/$total green). Re-run via workflow_dispatch once CI finishes."
              exit 1
            fi
            echo "waiting: $green/$total blocking checks green"
            sleep 30
          done

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "release for $TAG already exists — nothing to do"
            exit 0
          fi
          ver="${TAG#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\["ver"\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "::error::no CHANGELOG.md section for $ver — the changelog roll is missing. Add it, then re-run this workflow via workflow_dispatch."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --latest \
            --title "$TAG" --notes-file /tmp/notes.md
          echo "created release for $TAG from its CHANGELOG.md section"
