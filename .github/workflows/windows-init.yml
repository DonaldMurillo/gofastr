name: Windows

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-init.yml'
      # install.ps1 is an embedded template, not Go source.
      - 'cmd/gofastr/internal/releasecmd/**'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-init.yml'
      # install.ps1 is an embedded template, not Go source.
      - 'cmd/gofastr/internal/releasecmd/**'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Init and shell regressions
        run: >-
          go test ./cmd/gofastr ./cmd/gofastr/internal/initcmd
          -run '^(TestInitFreshDirectory|TestInitWindowsShells|TestInitGoDirectives|TestProjectNameWindowsDevices|TestInitKeepsHigherExistingGoRequirements|TestInitKeepsGoAboveFloor|TestInitRaisesGoBelowFloor|TestScaffoldGoRequirementsToolchainMeetsHigherMinimum)$'
          -count=1 -v
      # The generated install.ps1, run for real: download over HTTPS,
      # checksum, install, an in-place upgrade, the user Path edit (the
      # test puts the old value back), and a tampered archive refused.
      - name: Release install script
        run: go test ./cmd/gofastr/internal/releasecmd -run '^TestInstallPs1InstallsVerifiedBuild$' -count=1 -v
      # The desktop updater on Windows: the executable-and-loader layout,
      # the Authenticode policy, the relaunch environment and the
      # cross-process install lock, which no Linux runner can exercise.
      - name: Desktop updater
        run: >-
          go test ./battery/desktop/internal/update ./internal/filelock -count=1 &&
          go test ./battery/desktop -run '^(TestInstall|TestFileLayout|TestUpdate|TestCheck|TestScheduled)' -count=1
