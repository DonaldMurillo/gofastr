name: Windows

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-init.yml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/windows-init.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Init and shell regressions
        run: >-
          go test ./cmd/gofastr ./cmd/gofastr/internal/initcmd
          -run '^(TestInitFreshDirectory|TestInitWindowsShells|TestInitGoDirectives|TestProjectNameWindowsDevices|TestInitKeepsHigherExistingGoRequirements|TestInitKeepsGoAboveFloor|TestInitRaisesGoBelowFloor|TestScaffoldGoRequirementsToolchainMeetsHigherMinimum)$'
          -count=1 -v
