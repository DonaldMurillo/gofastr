<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Admin Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Archivo:wght@400;600;800&display=swap">
<style>
/* Layout: an app shell (grouped nav rail + top bar) around one of three content
   models: full pages (A), side-by-side panes (B), layouts + slide-over (C).
   Tokens mirror the gofastr default theme (zinc neutrals); "Brutal" swaps the
   same tokens to show the admin follows a page theme. */
:root{
  --bg:#ffffff; --surface:#fafafa; --surface-2:#f4f4f5; --raised:#ffffff;
  --border:#e4e4e7; --border-strong:#d4d4d8; --text:#09090b; --muted:#52525b; --subtle:#71717a;
  --primary:#18181b; --primary-fg:#fafafa; --focus:#2563eb; --hover:#f4f4f5; --selected:#eff6ff; --selected-border:#bfdbfe;
  --ok-fg:#166534; --ok-bg:#dcfce7; --ok-dot:#16a34a;
  --warn-fg:#854d0e; --warn-bg:#fef3c7; --warn-dot:#d97706;
  --bad-fg:#991b1b; --bad-bg:#fee2e2; --bad-dot:#dc2626;
  --info-fg:#1e40af; --info-bg:#dbeafe; --info-dot:#2563eb;
  --neu-fg:#3f3f46; --neu-bg:#f4f4f5; --neu-dot:#a1a1aa;
  --danger:#dc2626; --danger-fg:#ffffff;
  --scrim:rgb(9 9 11 / .45);
  --radius:8px; --radius-sm:6px; --radius-lg:12px; --stroke:1px;
  --shadow:0 1px 2px rgb(0 0 0 / .05);
  --shadow-pop:0 12px 32px -12px rgb(0 0 0 / .28), 0 0 0 1px var(--border);
  --font:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head:var(--font);
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --head-weight:600; --head-track:-0.015em;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#09090b; --surface:#0f0f12; --surface-2:#18181b; --raised:#18181b;
  --border:#27272a; --border-strong:#3f3f46; --text:#fafafa; --muted:#d4d4d8; --subtle:#a1a1aa;
  --primary:#fafafa; --primary-fg:#18181b; --focus:#60a5fa; --hover:#1f1f23; --selected:#172036; --selected-border:#1e3a8a;
  --ok-fg:#86efac; --ok-bg:rgb(22 101 52 / .35); --ok-dot:#4ade80;
  --warn-fg:#fcd34d; --warn-bg:rgb(133 77 14 / .38); --warn-dot:#fbbf24;
  --bad-fg:#fca5a5; --bad-bg:rgb(153 27 27 / .38); --bad-dot:#f87171;
  --info-fg:#93c5fd; --info-bg:rgb(30 64 175 / .38); --info-dot:#60a5fa;
  --neu-fg:#d4d4d8; --neu-bg:#27272a; --neu-dot:#71717a;
  --danger:#f87171; --danger-fg:#111827; --scrim:rgb(0 0 0 / .6);
  --shadow-pop:0 16px 40px -12px rgb(0 0 0 / .7), 0 0 0 1px var(--border);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090b; --surface:#0f0f12; --surface-2:#18181b; --raised:#18181b;
  --border:#27272a; --border-strong:#3f3f46; --text:#fafafa; --muted:#d4d4d8; --subtle:#a1a1aa;
  --primary:#fafafa; --primary-fg:#18181b; --focus:#60a5fa; --hover:#1f1f23; --selected:#172036; --selected-border:#1e3a8a;
  --ok-fg:#86efac; --ok-bg:rgb(22 101 52 / .35); --ok-dot:#4ade80;
  --warn-fg:#fcd34d; --warn-bg:rgb(133 77 14 / .38); --warn-dot:#fbbf24;
  --bad-fg:#fca5a5; --bad-bg:rgb(153 27 27 / .38); --bad-dot:#f87171;
  --info-fg:#93c5fd; --info-bg:rgb(30 64 175 / .38); --info-dot:#60a5fa;
  --neu-fg:#d4d4d8; --neu-bg:#27272a; --neu-dot:#71717a;
  --danger:#f87171; --danger-fg:#111827; --scrim:rgb(0 0 0 / .6);
  --shadow-pop:0 16px 40px -12px rgb(0 0 0 / .7), 0 0 0 1px var(--border);
  color-scheme:dark;
}
/* Brutal look: same token names, different values. */
:root[data-skin="brutal"]{
  --bg:#fff6d8; --surface:#fff1c2; --surface-2:#ffe9a3; --raised:#ffffff;
  --border:#111111; --border-strong:#111111; --text:#111111; --muted:#2b2b2b; --subtle:#4a4a4a;
  --primary:#ffd60a; --primary-fg:#111111; --focus:#111111; --hover:#ffe9a3; --selected:#ffe27a; --selected-border:#111111;
  --radius:0px; --radius-sm:0px; --radius-lg:0px; --stroke:2px;
  --shadow:3px 3px 0 #111111; --shadow-pop:5px 5px 0 #111111, 0 0 0 2px #111111;
  --font:'Archivo', ui-sans-serif, system-ui, sans-serif; --font-head:'Archivo', ui-sans-serif, sans-serif;
  --head-weight:800; --head-track:-0.02em; --neu-bg:#ffffff; --neu-fg:#111111;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root[data-skin="brutal"]:not([data-theme="light"]){
  --bg:#141209; --surface:#1d1a0e; --surface-2:#2a2512; --raised:#1d1a0e;
  --border:#f5efd6; --border-strong:#f5efd6; --text:#f5efd6; --muted:#e6dfc2; --subtle:#c9c1a0;
  --hover:#2a2512; --selected:#3a3315; --selected-border:#ffd60a; --focus:#ffd60a;
  --shadow:3px 3px 0 #f5efd6; --shadow-pop:5px 5px 0 #f5efd6, 0 0 0 2px #f5efd6; --neu-bg:#1d1a0e; --neu-fg:#f5efd6;
  color-scheme:dark;
}}
:root[data-skin="brutal"][data-theme="dark"]{
  --bg:#141209; --surface:#1d1a0e; --surface-2:#2a2512; --raised:#1d1a0e;
  --border:#f5efd6; --border-strong:#f5efd6; --text:#f5efd6; --muted:#e6dfc2; --subtle:#c9c1a0;
  --hover:#2a2512; --selected:#3a3315; --selected-border:#ffd60a; --focus:#ffd60a;
  --shadow:3px 3px 0 #f5efd6; --shadow-pop:5px 5px 0 #f5efd6, 0 0 0 2px #f5efd6; --neu-bg:#1d1a0e; --neu-fg:#f5efd6;
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}

/* ── shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%;min-height:100vh}
.app.nav-collapsed{grid-template-columns:60px minmax(0,1fr)}
.nav{background:var(--surface);border-inline-end:var(--stroke) solid var(--border);display:flex;flex-direction:column;min-height:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;min-height:56px}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;border:var(--stroke) solid var(--border-strong)}
.brand-name{font-weight:600;line-height:1.2}
.brand-name small{display:block;font-weight:400;color:var(--subtle);font-size:12px}
.nav-scroll{overflow:auto;padding:4px 8px 12px;flex:1}
.nav-group{margin-top:10px}
.nav-group-h{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:6px 8px;color:var(--subtle);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:var(--radius-sm)}
.nav-group-h:hover{color:var(--text)}
.nav-group-h svg{transition:transform .15s}
.nav-group.closed .nav-group-h svg{transform:rotate(-90deg)}
.nav-group.closed .nav-items{display:none}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer;color:var(--muted);text-align:start;min-height:34px}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--raised);color:var(--text);font-weight:500;box-shadow:var(--shadow);outline:var(--stroke) solid var(--border)}
.nav-item .count{margin-inline-start:auto;font-size:12px;color:var(--subtle)}
.nav-foot{border-top:var(--stroke) solid var(--border);padding:8px}
.app.nav-collapsed .brand-name,.app.nav-collapsed .nav-item span,.app.nav-collapsed .nav-item .count,.app.nav-collapsed .nav-group-h{display:none}
.app.nav-collapsed .nav-item{justify-content:center}
.app.nav-collapsed .nav-group{margin-top:6px;border-top:var(--stroke) solid var(--border);padding-top:6px}
.app.nav-collapsed .nav-group.closed .nav-items{display:block}

.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 20px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:var(--stroke) solid var(--border)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:13.5px}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;white-space:nowrap}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs .here{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 6px}
.crumbs .sep{color:var(--subtle)}
.kbd{font-family:var(--mono);font-size:11px;border:var(--stroke) solid var(--border);border-bottom-width:calc(var(--stroke) + 1px);border-radius:4px;padding:0 5px;color:var(--subtle);background:var(--raised)}
.search-trigger{display:flex;align-items:center;gap:8px;min-width:220px;padding:6px 10px;border:var(--stroke) solid var(--border);border-radius:var(--radius);background:var(--raised);color:var(--subtle);cursor:pointer}
.search-trigger .kbd{margin-inline-start:auto}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--surface-2);border:var(--stroke) solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.app[data-skin-b] .avatar{border-radius:0}
.content{padding:24px 28px 120px;min-width:0;flex:1}
.btn.menu-btn{display:none}

/* ── controls ─────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 12px;border-radius:var(--radius);border:var(--stroke) solid var(--border);background:var(--raised);color:var(--text);cursor:pointer;font-weight:500;white-space:nowrap;box-shadow:var(--shadow);transition:background .12s,transform .06s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
:root[data-skin="brutal"] .btn.primary{border-color:var(--border)}
.btn.primary:hover{background:color-mix(in oklab,var(--primary) 88%,var(--bg))}
.btn.danger{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.icon{padding:6px;min-width:34px}
.btn.sm{min-height:28px;padding:3px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .badge-n{background:var(--primary);color:var(--primary-fg);border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
.input,.select,.textarea{width:100%;min-height:36px;padding:7px 10px;border:var(--stroke) solid var(--border-strong);border-radius:var(--radius);background:var(--raised);color:var(--text)}
:root:not([data-skin="brutal"]) .input,:root:not([data-skin="brutal"]) .select,:root:not([data-skin="brutal"]) .textarea{border-color:var(--border)}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap > svg{position:absolute;inset-inline-start:10px;color:var(--subtle);pointer-events:none}
.input-wrap > .input{padding-inline-start:32px}
.input-wrap .prefix{position:absolute;inset-inline-start:10px;color:var(--subtle)}
.input-wrap .prefix + .input{padding-inline-start:22px}
.seg{display:inline-flex;padding:2px;gap:2px;border:var(--stroke) solid var(--border);border-radius:var(--radius);background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 9px;border-radius:calc(var(--radius) - 2px);cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.switch{position:relative;width:36px;height:20px;border-radius:999px;background:var(--border-strong);border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:999px;background:var(--raised);transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0/.2)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--primary-fg)}
input[type=checkbox].cb{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin:0}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 8px 1px 7px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:20px;background:var(--neu-bg);color:var(--neu-fg)}
:root[data-skin="brutal"] .badge{border:2px solid var(--border);border-radius:0}
.badge::before{content:"";width:6px;height:6px;border-radius:999px;background:var(--neu-dot)}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)} .badge.ok::before{background:var(--ok-dot)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)} .badge.warn::before{background:var(--warn-dot)}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg)} .badge.bad::before{background:var(--bad-dot)}
.badge.info{background:var(--info-bg);color:var(--info-fg)} .badge.info::before{background:var(--info-dot)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--radius-sm);border:var(--stroke) solid var(--border);background:var(--raised);font-size:12.5px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.chip:hover{border-color:var(--border-strong);background:var(--hover)}
.pill-filter{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;border:var(--stroke) solid var(--border);background:var(--raised);font-size:12.5px}
.pill-filter b{font-weight:500}
.pill-filter button{border:0;background:none;cursor:pointer;color:var(--subtle);display:grid;place-items:center;width:20px;height:20px;border-radius:999px}
.pill-filter button:hover{background:var(--hover);color:var(--text)}

/* popovers / menus */
.pop-anchor{position:relative;display:inline-flex}
.pop{position:absolute;z-index:40;inset-block-start:calc(100% + 6px);inset-inline-start:0;min-width:220px;background:var(--raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);padding:6px;border:0}
.pop.right{inset-inline-start:auto;inset-inline-end:0}
.pop.up{inset-block-start:auto;inset-block-end:calc(100% + 8px)}
.pop h4{margin:6px 8px 6px;font-size:12px;color:var(--subtle);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;background:none;border-radius:var(--radius-sm);cursor:pointer;text-align:start;color:var(--text);white-space:nowrap}
.mi:hover,.mi.active{background:var(--hover)}
.mi.danger{color:var(--danger)}
.mi .kbd{margin-inline-start:auto}
.mi-sep{height:1px;background:var(--border);margin:6px 2px}
.pop-pad{padding:8px}

/* ── page header ──────────────────────────────────── */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font-family:var(--font-head);font-size:26px;font-weight:var(--head-weight);letter-spacing:var(--head-track);line-height:1.15;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.views{display:flex;align-items:center;gap:2px;border-bottom:var(--stroke) solid var(--border);margin-bottom:14px;overflow-x:auto}
.views button.v{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:calc(-1 * var(--stroke));white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.views button.v:hover{color:var(--text)}
.views button.v[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.views .v .n{font-size:12px;color:var(--subtle)}
.views .spacer{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;max-width:360px}
.applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

/* ── table ─────────────────────────────────────────── */
.tablewrap{border:var(--stroke) solid var(--border);border-radius:var(--radius-lg);overflow:auto;background:var(--raised);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;min-width:640px}
.t th{position:sticky;top:0;background:var(--surface);text-align:start;font-weight:500;color:var(--muted);font-size:12.5px;padding:0 12px;height:38px;border-bottom:var(--stroke) solid var(--border);white-space:nowrap;z-index:1}
.t th.sortable{cursor:pointer;user-select:none}
.t th.sortable:hover{color:var(--text)}
.t th .sorti{opacity:.35;vertical-align:-3px}
.t th[aria-sort] .sorti{opacity:1}
.t td{padding:0 12px;height:46px;border-bottom:var(--stroke) solid var(--border);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--hover)}
.t tr.sel td{background:var(--selected)}
.t .c-check{width:40px;padding-inline-end:0}
.t .r{text-align:end}
.t .c-act{width:44px;text-align:end;overflow:visible}
.title-link{border:0;background:none;padding:0;font-weight:500;cursor:pointer;color:var(--text);text-align:start;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.title-link:hover{text-decoration:underline;text-underline-offset:3px}
.idcell{display:inline-flex;align-items:center;gap:4px}
.idcell button{opacity:0;border:0;background:none;cursor:pointer;color:var(--subtle);padding:2px}
tr:hover .idcell button{opacity:1}
.editable{cursor:text;border-radius:var(--radius-sm)}
.editable:hover{box-shadow:inset 0 0 0 1px var(--border-strong)}
.cell-edit{min-height:30px;padding:3px 8px;width:100%;max-width:220px}

.tfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;color:var(--muted)}
.pager{display:flex;align-items:center;gap:6px}
.pager .select{width:auto;min-height:30px;padding:3px 8px}

/* compact rows (phones) */
.rows{display:none;border:var(--stroke) solid var(--border);border-radius:var(--radius-lg);background:var(--raised);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:var(--stroke) solid var(--border)}
.row:last-child{border-bottom:0}
.row .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{color:var(--subtle);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--text);font-size:16px}

/* bulk bar */

const OPDEF = {

  enum: [['is','is'],['not','is not']], money: [['gt','more than'],['lt','less than'],['eq','equals']], int: [['gt','more than'],['lt','less than'],['eq','equals']],
  date: [['after','after'],['before','before']], relation: [['is','is']], bool: [['is','is']],

function cellVal(c, r, k){ const f = field(c, k); if (!f) return r[k]; if (f.type === 'relation') return titleOf(f.to, get(f.to, r[k])); return r[k]; }
function matches(c, r, f){
  const fd = field(c, f.k); if (!fd) return true;
  const raw = r[f.k]; const v = f.v;
  switch (f.op) {
    case 'contains': return String(raw ?? '').toLowerCase().includes(String(v).toLowerCase());
    case 'is': return fd.type === 'bool' ? String(!!raw) === String(v) : String(raw) === String(v);
    case 'not': return String(raw) !== String(v);
    case 'empty': return raw == null || raw === '';
    case 'gt': return Number(raw) > Number(v); case 'lt': return Number(raw) < Number(v); case 'eq': return Number(raw) === Number(v);
    case 'after': return String(raw).slice(0,10) >= v; case 'before': return String(raw).slice(0,10) <= v;
  }
  return true;
}
function query(c, opts = {}){
  const st = L(c), cfg = COLS[c];
  let rows = DB[c].filter(r => st.filters.every(f => f.v === '' && f.op !== 'empty' ? true : matches(c, r, f)));
  if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => cfg.search.some(k => String(cellVal(c, r, k) ?? '').toLowerCase().includes(q)) || titleOf(c, r).toLowerCase().includes(q)); }
  const { k, dir } = st.sort; const fd = field(c, k);
  rows = [...rows].sort((a, b) => {
    let x = cellVal(c, a, k), y = cellVal(c, b, k);
    if (fd && fd.type === 'enum' && !fd.plain) { x = fd.opts.indexOf(x); y = fd.opts.indexOf(y); }
    if (typeof x === 'number' && typeof y === 'number') return dir === 'asc' ? x - y : y - x;
    return dir === 'asc' ? String(x ?? '').localeCompare(String(y ?? '')) : String(y ?? '').localeCompare(String(x ?? ''));
  });
  if (opts.all) return rows;
  const total = rows.length, pages = Math.max(1, Math.ceil(total / st.per));
  if (st.page > pages) st.page = pages;
  return { rows: rows.slice((st.page - 1) * st.per, st.page * st.per), total, pages };
}

function fmtVal(c, k, v){ const f = field(c, k); if (!f) return esc(v); if (v == null || v === '') return '<span class="subtle">empty</span>'; switch (f.type) { case 'money': return money(v); case 'enum': return f.plain ? esc(v) : badge(v); case 'relation': return esc(titleOf(f.to, get(f.to, v))); case 'bool': return v ? 'Yes' : 'No'; case 'date': return fmtDate(v); default: return esc(v); } }

/* ===================== navigation ===================== */
const pkey = (c, id) => c + '/' + id;
const dirtyOf = d => !!(d && d.orig && JSON.stringify(d.data) !== d.orig);
const isDirty = () => dirtyOf(S.draft);
const anyDirty = () => isDirty() || Object.values(S.stash).some(s => dirtyOf(s.draft));
const dirtyDraft = () => isDirty() ? S.draft : Object.values(S.stash).map(s => s.draft).find(dirtyOf);
const drawerMode = () => S.proto === 'C' || S.proto === 'D';
function go(route, opts = {}){
  // Same record in another frame (panel <-> page) keeps the draft, so no guard.
  if (!opts.force && anyDirty() && !(route.c === S.route.c && route.id === S.route.id && !S.stack.length)) { S.modal = { kind: 'leave', next: route }; S.pop = null; render(); return; }
  if (S.proto === 'C' && route.v === 'doc') route = { v: 'list', c: route.c, id: route.id };
  if (route.id !== S.route.id || route.c !== S.route.c || S.stack.length) { S.docTab = 'edit'; S.draft = null; S.peek = null; S.stack = []; S.stash = {}; }
  const prev = S.route;
  S.route = route; S.pop = null; S.navOpen = false; S.inline = null;
  render();
  // Opening or closing the panel over a list keeps the list's scroll position.
  if (!(route.v === 'list' && prev.v === 'list' && route.c === prev.c)) window.scrollTo(0, 0);
}
const openRecord = (c, id) => go(S.proto === 'A' ? { v: 'doc', c, id } : { v: 'list', c, id });

/* Every view has an address. One URL renders the same thing on a cold load as
   on a click: /admin/collections/<c>/<id> is the record in a panel over its
   list (a page in A), /…/<id>/page is the full page, /…/create is a new one.
   Panels stacked on top ride in ?stack=<c>/<id>,… so reload and back/forward
   rebuild the same pile; each panel's own link is its plain record address. */
const BASE = '/admin';
const MAX_STACK = 3;
const recordPath = (c, id) => `${BASE}/collections/${c}/${id === 'new' ? 'create' : id}`;
const stackStr = st => st.map(p => `${p.c}/${p.id === 'new' ? 'create' : p.id}`).join(',');
const fullPath = () => routePath(S.route) + (S.stack.length ? '?stack=' + stackStr(S.stack) : '');
function parseStack(h){
  const m = /[?&]stack=([^&]*)/.exec(String(h || '')); if (!m) return [];
  let raw; try { raw = decodeURIComponent(m[1]); } catch (e) { return []; }
  return raw.split(',').map(s => s.split('/')).filter(([c, id]) => Object.hasOwn(COLS, c) && id).slice(0, MAX_STACK).map(([c, id]) => ({ c, id: id === 'create' ? 'new' : id }));
}
const stackable = r => S.proto === 'D' && r.v === 'list' && !!r.id;
function routePath(r){
  if (!r || r.v === 'dash') return BASE;
  if (r.v === 'ops') return `${BASE}/system/${r.k}`;
  let p = `${BASE}/collections/${r.c}`;
  if (r.id) p += '/' + (r.id === 'new' ? 'create' : r.id);
  if (r.v === 'doc' && r.id && r.id !== 'new' && S.proto !== 'A') p += '/page';
  return p;
}
function parsePath(h){
  let p; try { p = decodeURIComponent(String(h || '').replace(/^#/, '').split('?')[0]).split('/').filter(Boolean); } catch (e) { return null; }
  if (p[0] !== 'admin') return null;
  if (!p[1]) return { v: 'dash' };
  if (p[1] === 'system' && OPS.some(o => o.k === p[2])) return { v: 'ops', k: p[2] };
  if (p[1] !== 'collections' || !Object.hasOwn(COLS, p[2])) return null;
  const c = p[2]; if (!p[3]) return { v: 'list', c };
  const id = p[3] === 'create' ? 'new' : p[3];
  return S.proto === 'A' || p[4] === 'page' ? { v: 'doc', c, id } : { v: 'list', c, id };
}
let hashSynced = false;
function syncHash(){
  const h = '#' + fullPath(); if (location.hash === h) { hashSynced = true; return; }
  try { if (hashSynced && !S.replaceHash) history.pushState(null, '', h); else history.replaceState(null, '', h); } catch (e) {}
  S.replaceHash = false;
  hashSynced = true;
}
window.addEventListener('popstate', () => {
  const r = parsePath(location.hash); if (!r) return;
  const st = stackable(r) ? parseStack(location.hash) : [];
  if (routePath(r) !== routePath(S.route)) { go(r); if (st.length && routePath(r) === routePath(S.route)) setStack(st, { force: true }); return; }
  if (stackStr(st) !== stackStr(S.stack)) setStack(st);
});

/* Panels stack over the record panel. Whatever stays open keeps its draft;
   whatever closes drops it, behind the unsaved-changes guard. */
function setStack(next, opts = {}){
  const cur = S.stack; const baseKey = pkey(S.route.c, S.route.id);
  const keyAt = (st, i) => i < 0 ? baseKey : pkey(st[i].c, st[i].id);
  const topKey = keyAt(cur, cur.length - 1);
  const keepsTop = next.length >= cur.length && stackStr(next.slice(0, cur.length)) === stackStr(cur);
  if (!opts.force && !keepsTop && isDirty()) { S.modal = { kind: 'leave', nextStack: next }; S.pop = null; render(); return; }
  if (keepsTop && next.length > cur.length && S.draft) S.stash[topKey] = { draft: S.draft, tab: S.docTab };
  if (keepsTop && next.length === cur.length) { render(); return; }
  const open = new Set([baseKey, ...next.map(p => pkey(p.c, p.id))]);
  Object.keys(S.stash).forEach(k => { if (!open.has(k)) delete S.stash[k]; });
  S.stack = next;
  const nk = keyAt(next, next.length - 1); const st = S.stash[nk]; delete S.stash[nk];
  S.draft = st ? st.draft : null; S.docTab = st ? st.tab : 'edit'; S.pop = null; S.inline = null;
  render();
}
function pushPanel(c, id, prefill){
  const k = pkey(c, id);
  if (k === pkey(S.route.c, S.route.id)) { setStack([]); return; }
  const at = S.stack.findIndex(p => pkey(p.c, p.id) === k);
  if (at >= 0) { setStack(S.stack.slice(0, at + 1)); return; }
  if (S.stack.length >= MAX_STACK) { S.pop = null; toast(`${MAX_STACK + 1} panels is the limit`, 'Open this one as a page, or close a panel first.', { tone: 'warn' }); return; }
  if (prefill) S.newPrefill = prefill;
  setStack([...S.stack, { c, id }]);
}

function Cell(c, r, k, opts = {}){

function Table(c, rows, opts = {}){

    ${st.cols.map(k => { const f = field(c, k); const num = f && ['money','int'].includes(f.type);

}
function InlineEditor(c, r, f){

function RowMenu(c, r){

    <button class="mi" data-a="open" data-c="${c}" data-id="${r.id}">${ic('open','sm')}Open</button>

function Rows(c, rows){

    <div class="meta">${sideF ? badge(r[sideF.key]) : ''}${moneyF ? `<span class="num subtle" style="font-size:13px">${money(r[moneyF.key])}</span>` : ''}</div></div>`; }).join('')}</div>`;

function Footer(c, total, pages){

function Empty(c){ return `<div class="panel empty"><h3>No ${COLS[c].label.toLowerCase()} match</h3><p>Try a different search, or clear the filters.</p><button class="btn" data-a="clear-filters" data-c="${c}">Clear filters</button></div>`; }
function ListPage(c){

/* ===================== studio (C) ===================== */
function StudioList(c){
  const st = L(c); const cfg = COLS[c];
  const layouts = [['table','table','Table'],['cards','grid','Cards'],['kanban','kanban','Board'],['calendar','calendar','Calendar']];
  const seg = `<div class="seg" role="group" aria-label="Layout">${layouts.map(([k, i, l]) => `<button data-a="layout" data-c="${c}" data-v="${k}" aria-pressed="${st.layout === k}" title="${l}">${ic(i,'sm')}<span>${l}</span></button>`).join('')}</div>`;
  let body;
  if (st.layout === 'kanban') body = Board(c);
  else if (st.layout === 'calendar') body = Calendar(c);
  else { const { rows, total, pages } = query(c); body = !total ? Empty(c) : st.layout === 'cards' ? `<div class="gcards">${rows.map(r => GCard(c, r)).join('')}</div>${Footer(c, total, pages)}` : `${Table(c, rows, { inline: true })}${Rows(c, rows)}${Footer(c, total, pages)}<p class="subtle" style="font-size:12.5px;margin-top:8px">Double-click a cell to edit it in place.</p>`; }
  return `${ListHeader(c)}${Toolbar(c, seg)}${body}`;
}
function GCard(c, r){
  const cfg = COLS[c]; const sideF = cfg.fields.find(f => f.type === 'enum' && !f.plain); const moneyF = cfg.fields.find(f => f.type === 'money');
  const extra = cfg.cols.filter(k => ![cfg.title, sideF?.key, moneyF?.key].includes(k)).slice(0, 3);
  return `<div class="gcard" role="button" tabindex="0" data-a="open" data-c="${c}" data-id="${r.id}"><div class="top"><div style="min-width:0"><div class="t1">${esc(titleOf(c, r))}</div><div class="subtle" style="font-size:13px">${esc(subOf(c, r) || '')}</div></div>${sideF ? badge(r[sideF.key]) : ''}</div>
    ${moneyF ? `<div class="big num">${money(r[moneyF.key])}</div>` : ''}<dl>${extra.map(k => `<dt>${esc(field(c, k).label)}</dt><dd>${fmtVal(c, k, r[k]) || '—'}</dd>`).join('')}</dl></div>`;
}
function Board(c){
  const cfg = COLS[c]; const fd = field(c, cfg.board); const rows = query(c, { all: true });
  return `<div class="board">${fd.opts.map(o => { const items = rows.filter(r => r[cfg.board] === o); const sum = cfg.sum ? items.reduce((s, r) => s + (r[cfg.sum] || 0), 0) : null;
    return `<div class="bcol" data-drop="${esc(o)}" data-c="${c}"><div class="bcol-h">${fd.plain ? `<b>${esc(human(o))}</b>` : badge(o)}<span class="sum num">${items.length}${sum != null ? ' · ' + money(sum) : ''}</span></div>
    ${items.slice(0, 30).map(r => `<div class="bcard" draggable="true" data-drag="${r.id}" data-a="open" data-c="${c}" data-id="${r.id}" tabindex="0"><div class="t1">${esc(titleOf(c, r))}</div><div class="t2"><span>${esc((cfg.sum ? String(subOf(c, r) || '').split(' · ')[0] : subOf(c, r)) || '')}</span>${cfg.sum ? `<span class="num">${money(r[cfg.sum])}</span>` : ''}</div></div>`).join('')}
    ${items.length > 30 ? `<div class="subtle" style="font-size:12.5px;padding:4px 6px">+${items.length - 30} more</div>` : ''}</div>`; }).join('')}</div><p class="subtle" style="font-size:12.5px;margin-top:8px">Drag a card to another column to change its ${esc(fd.label.toLowerCase())}. Status rules still apply.</p>`;
}
function Calendar(c){
  const cfg = COLS[c]; const { y, m } = S.calMonth; const first = new Date(y, m, 1); const start = new Date(y, m, 1 - first.getDay());
  const rows = query(c, { all: true }); const byDay = {};
  rows.forEach(r => { const d = String(r[cfg.date] || '').slice(0, 10); (byDay[d] = byDay[d] || []).push(r); });
  const sideF = cfg.fields.find(f => f.type === 'enum' && !f.plain);
  let cells = '';
  for (let i = 0; i < 42; i++) { const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; const evs = byDay[key] || [];
    cells += `<div class="day ${d.getMonth() !== m ? 'out' : ''} ${key === '2026-10-05' ? 'today' : ''}"><span class="dn num">${d.getDate()}</span>${evs.slice(0, 3).map(r => `<button class="ev ${sideF ? TONE[r[sideF.key]] || '' : ''}" data-a="open" data-c="${c}" data-id="${r.id}" title="${esc(titleOf(c, r))}">${esc(titleOf(c, r))}</button>`).join('')}${evs.length > 3 ? `<button class="more" data-a="day" data-c="${c}" data-d="${key}">+${evs.length - 3} more</button>` : ''}</div>`; }
  return `<div class="cal-h"><button class="btn icon sm" data-a="cal" data-d="-1" aria-label="Previous month">${ic('left','sm')}</button><h3>${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3><button class="btn icon sm" data-a="cal" data-d="1" aria-label="Next month">${ic('right','sm')}</button><button class="btn sm" data-a="cal" data-d="0">Today</button><span class="subtle" style="margin-inline-start:auto;font-size:13px">By ${esc(field(c, cfg.date).label.toLowerCase())}</span></div>
  <div style="overflow-x:auto"><div class="cal" style="min-width:640px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div>`;
}
// render() rebuilds the DOM, so a panel animates only on the render that first shows it.
let shownPanels = new Set(), seenPanels = new Set();
function Drawer(){
  const { c, id } = S.route; const n = S.stack.length;
  // i = -1 is the record panel; 0.. are panels stacked on it. Only the top one
  // is live: the rest are inert and get prefixed ids so labels stay unique.
  const panel = (pc, pid, i) => {
    const top = i === n - 1; S.idp = top ? '' : `p${i + 1}-`;
    const parent = i < 0 ? null : i === 0 ? { c, id } : S.stack[i - 1];
    const lead = parent
      ? `<button class="btn ghost sm" data-a="pop-panel" style="max-width:45%;justify-content:flex-start" title="Back to ${esc(titleOf(parent.c, get(parent.c, parent.id)))}">${ic('left','sm')}<span style="overflow:hidden;text-overflow:ellipsis">${esc(parent.id === 'new' ? 'New ' + COLS[parent.c].one.toLowerCase() : titleOf(parent.c, get(parent.c, parent.id)))}</span></button>`

    const k = pkey(pc, pid); seenPanels.add(k); const fresh = !shownPanels.has(k);
    const label = S.proto === 'D' ? `<span class="grow mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="This panel's own address">${esc(path)}</span>` : `<span class="grow">${COLS[pc].label}</span>`;
    const step = i < 0 && pid !== 'new' ? `<button class="btn ghost icon" data-a="drawer-step" data-d="-1" aria-label="Previous record" title="Previous record">${ic('up')}</button><button class="btn ghost icon" data-a="drawer-step" data-d="1" aria-label="Next record" title="Next record">${ic('down')}</button>` : '';
    const link = S.proto === 'D' && pid !== 'new' ? `<button class="btn ghost icon" data-a="copy-link" data-path="${esc(path)}" aria-label="Copy link" title="Copy this record's link">${ic('link')}</button><button class="btn ghost icon" data-a="to-page" data-c="${pc}" data-id="${pid}" aria-label="Open as full page" title="Open as full page">${ic('expand')}</button>` : '';
    const html = `<div class="scrim${fresh ? '' : ' still'}" data-a="${i < 0 ? 'close-drawer' : 'pop-panel'}" style="z-index:${52 + 2 * i}"></div><aside class="drawer${fresh ? ' enter' : ''}" ${top ? '' : 'inert'} role="dialog" aria-modal="${top}" aria-label="${esc(COLS[pc].one)}" style="z-index:${53 + 2 * i};width:min(${720 - 40 * (i + 1)}px,100vw)">
      <div class="drawer-h">${lead}${label}${step}${link}</div>
      <div class="drawer-body">${DocView(pc, pid, 'drawer')}</div></aside>`;
    S.idp = ''; return html;
  };
  return [panel(c, id, -1), ...S.stack.map((p, i) => panel(p.c, p.id, i))].join('');

/* ===================== panes (B) ===================== */
function Panes(){
  const { c, id } = S.route; const st = L(c); const { rows, total, pages } = query(c);
  const list = `<section class="pane list" aria-label="${COLS[c].label}"><div class="pane-h"><h2>${COLS[c].label} <span class="subtle num" style="font-weight:400">${total}</span></h2><button class="btn sm primary" data-a="new" data-c="${c}">${ic('plus','sm')}New</button></div>
    <div class="pane-tools"><div class="input-wrap">${ic('search')}<input class="input" id="q-${c}" data-in="q" data-c="${c}" value="${esc(st.q)}" placeholder="Search…" autocomplete="off"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><select class="select" style="flex:1;min-height:32px;padding:4px 8px" data-in="view-sel" data-c="${c}" aria-label="View">${allViews(c).map(v => `<option value="${v.id}" ${st.view === v.id ? 'selected' : ''}>${esc(v.name)} (${countWith(c, v.filters)})</option>`).join('')}</select>
      <div class="pop-anchor"><button class="btn sm" data-a="pop" data-pop="filters">${ic('filter','sm')}${st.filters.length ? `<span class="badge-n">${st.filters.length}</span>` : ''}</button>${S.pop === 'filters' ? FilterPop(c) : ''}</div>
      <div class="pop-anchor"><button class="btn sm" data-a="pop" data-pop="psort" aria-label="Sort">${ic('sort','sm')}</button>${S.pop === 'psort' ? `<div class="pop right">${COLS[c].all.filter(f => f.type !== 'textarea').map(f => `<button class="mi" data-a="sort" data-c="${c}" data-k="${f.key}">${esc(f.label)}${st.sort.k === f.key ? `<span style="margin-inline-start:auto">${ic(st.sort.dir === 'asc' ? 'up' : 'down','sm')}</span>` : ''}</button>`).join('')}</div>` : ''}</div></div></div>
    <div class="pane-body">${rows.map(r => { const sideF = COLS[c].fields.find(f => f.type === 'enum' && !f.plain); return `<button class="li" data-a="open" data-c="${c}" data-id="${r.id}" aria-current="${r.id === id}"><span class="t1">${esc(titleOf(c, r))}</span><span class="r">${sideF ? badge(r[sideF.key]) : ''}</span><span class="t2">${esc(subOf(c, r) || '')}</span><span class="r subtle">${ago(r.updated_at)}</span></button>`; }).join('') || `<div class="empty">Nothing matches.</div>`}
    ${pages > 1 ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px"><button class="btn sm" data-a="page" data-c="${c}" data-d="-1" ${st.page <= 1 ? 'disabled' : ''}>Previous</button><span class="subtle num">${st.page} / ${pages}</span><button class="btn sm" data-a="page" data-c="${c}" data-d="1" ${st.page >= pages ? 'disabled' : ''}>Next</button></div>` : ''}</div></section>`;
  const doc = `<section class="pane doc" aria-label="Record">${id ? `<div class="pane-h"><button class="btn ghost icon sm" data-a="go" data-route='${esc(JSON.stringify({ v: 'list', c }))}' aria-label="Close">${ic('x','sm')}</button><h2>${id === 'new' ? 'New ' + COLS[c].one.toLowerCase() : esc(titleOf(c, get(c, id)))}</h2></div><div class="pane-body pad">${DocView(c, id, 'pane')}</div>` : `<div class="pane-empty"><div>${ic('panel')}<p>Pick a ${COLS[c].one.toLowerCase()} on the left,<br>or press <span class="kbd">⌘K</span> to jump to one.</p></div></div>`}</section>`;
  const peek = S.peek ? `<section class="pane peek" aria-label="Related record"><div class="pane-h"><button class="btn ghost icon sm" data-a="close-peek" aria-label="Close">${ic('x','sm')}</button><h2>${esc(titleOf(S.peek.c, get(S.peek.c, S.peek.id)))}</h2><button class="btn sm" data-a="promote-peek">${ic('open','sm')}Open</button></div><div class="pane-body pad">${PeekView(S.peek.c, S.peek.id)}</div></section>` : '';
  return `<div class="panes ${id ? 'has-doc' : ''} ${S.peek ? 'has-peek' : ''}">${list}${doc}${peek}</div>`;
}
function PeekView(c, id){
  const r = get(c, id); if (!r) return '<p class="subtle">This record was deleted.</p>';
  const cfg = COLS[c];
  return `<div class="subtle" style="font-size:12.5px;margin-bottom:10px">${cfg.one} · updated ${ago(r.updated_at)}</div><dl class="kv" style="font-size:13.5px;gap:10px 16px">${cfg.all.filter(f => f.type !== 'textarea').map(f => `<dt>${esc(f.label)}</dt><dd>${f.type === 'relation' && r[f.key] ? `<button class="chip" data-a="peek" data-c="${f.to}" data-id="${r[f.key]}">${esc(titleOf(f.to, get(f.to, r[f.key])))}</button>` : f.type === 'id' ? `<span class="mono">${esc(r.id.slice(0, 8))}</span>` : f.type === 'datetime' ? ago(r[f.key]) : fmtVal(c, f.key, r[f.key])}</dd>`).join('')}</dl>
  ${cfg.related.map(rel => { const items = DB[rel.c].filter(x => x[rel.fk] === id); return `<h3 class="side-h" style="margin:20px 0 8px">${COLS[rel.c].label} <span class="num">${items.length}</span></h3>${items.slice(0, 6).map(x => `<button class="li" style="padding:8px 0" data-a="peek" data-c="${rel.c}" data-id="${x.id}"><span class="t1">${esc(titleOf(rel.c, x))}</span><span class="r">${(() => { const sf = COLS[rel.c].fields.find(f => f.type === 'enum' && !f.plain); return sf ? badge(x[sf.key]) : ''; })()}</span></button>`).join('') || '<p class="subtle" style="margin:0">None yet.</p>'}`; }).join('')}`;
}

/* ===================== document (shared) ===================== */
function ensureDraft(c, id){
  const kept = S.stash[pkey(c, id)]; if (kept && kept.draft) return kept.draft;
