version: v0.43.0
title: Security audit remediation
notes:
  - change: Client-selected SSE block mode is now a broker opt-in
    breaking: true
    hits: review
    guidance: "?slow=block / X-SSE-Slow is ignored unless the broker sets SSEBrokerConfig.AllowClientSlowMode. A block-mode subscriber stalls deliver() on the publisher's goroutine, so a request-selected block mode let one unauthenticated client stall every other subscriber and the calling handler. Set AllowClientSlowMode on trusted-only endpoints; BlockTimeout (default 5s) bounds the stall even then."
    find:
      strings:
        match: 'slow=block|X-SSE-Slow'
  - change: SSE subscriber_id only replaces a subscriber from the same caller
    breaking: true
    guidance: "?subscriber_id=<id> previously evicted whoever held that id, so one client could drop another's stream by guessing it. A reconnect now only replaces its own entry; a colliding id from a different caller gets a fresh generated id instead. Apps keying streams by user/tab/device are unaffected."
    nodetect: the abuse is a client request shape; apps keying streams legitimately are unaffected and no app spelling differs
  - change: Permission rules match literally unless Rule.Glob is set
    breaking: true
    hits: review
    guidance: "permission.Rule.ArgvGlob was matched with filepath.Match, so an approved command widened into a pattern (approving 'git diff *' also matched 'git diff ; nc host 9') and persisted that way. Rules are literal now; set Glob: true on any rule you deliberately authored as a pattern."
    find:
      fields:
        - field: gofastr/framework/harness/tool/permission.Rule.ArgvGlob
  - change: kiln custom agent commands are opt-in
    breaking: true
    guidance: "POST /kiln/agent with name=\"custom\" chose the argv of a spawned process, which made the unauthenticated tool API a code-execution surface. Restart kiln with --allow-custom-agent to keep using it; registered adapter names are unaffected."
    nodetect: the spelling is a kiln restart flag and a client request body, neither of which lives in app code
  - change: MCP transport validates Origin and Host
    breaking: false
    guidance: "A browser Origin that is not same-origin with the request is refused. Split-origin browser clients and tunnels call Server.SetAllowedOrigins; local transports pin authorities with SetAllowedHosts or SetRequireLoopbackHost. gofastr dev pins loopback automatically because dev implies the mutating control tools."
    nodetect: split-origin browser clients and tunnels are outside the app's Go source; the refusal names the origin
  - change: WebSocket Upgrade enforces RFC 6455 handshake fields
    breaking: false
    guidance: "Upgrade now requires GET, Connection: Upgrade, Sec-WebSocket-Version: 13, and a key that base64-decodes to 16 bytes. Standard browser and library clients already send all four; hand-rolled clients that omitted them stop upgrading."
    nodetect: the clients that stop upgrading are non-browser code outside the app's Go source
  - change: Blueprint rejects field names and enum values that break generated source
    breaking: false
    guidance: "gofastr generate now fails when a field name is not a valid Go identifier, or an enum value contains a quote, backtick, backslash or newline — these previously escaped the emitted Go literal. The error names the entity and field; rename the field or drop the character."
    find:
      config:
        - key: entities.*.fields.*.name
          value: '^[^A-Za-z_]|[^A-Za-z0-9_]'
        - key: entities.*.fields.*.values.*
          value: '[`"''\\\n]'
