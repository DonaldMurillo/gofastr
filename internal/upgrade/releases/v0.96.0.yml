version: v0.96.0
title: unreleased
notes:
  - change: "BREAKING for direct callers of the llm.md index - crud.RegistryLLMMD / RegistryLLMMDHandler take a trailing pagesIndex string, the path the app serves its page index at; empty drops the index's Pages section, which used to link /llm-pages.md even when nothing served it"
    breaking: true
    hits: review
    guidance: "The framework's own /api/llm.md passes the path the UI host registered, so apps that never call these change nothing. A hand-rolled mount passes \"/llm-pages.md\" only when a UI host built with WithPublicLLMMD serves it, and \"\" otherwise."
    find:
      shapes:
        - symbol: gofastr/framework/crud.RegistryLLMMD
          type: '^func\(registry entity\.Registry, appName string, crudMount func\(\*entity\.Entity\) crud\.MountInfo\) string$'
        - symbol: gofastr/framework/crud.RegistryLLMMDHandler
          type: '^func\(registry entity\.Registry, appName string, crudMount func\(\*entity\.Entity\) crud\.MountInfo\) http\.Handler$'
  - change: "BREAKING - mcp.WidgetClientScriptURL, mcp.WidgetClientHandler and the /__gofastr/mcp/app/widgetclient.js route are removed; mcp.WidgetDocument inlines the widget client instead of linking it"
    breaking: true
    hits: edit
    guidance: "A chat host renders the widget in a frame on its own origin, so the linked client resolved against the host and the widget never initialized. Delete any mount of the handler. A hand-written widget inlines \"<script>\"+string(mcp.WidgetClientJS())+\"</script>\" in place of the <script src>, or builds its document with mcp.WidgetDocument."
    find:
      uses:
        - gofastr/core/mcp.WidgetClientScriptURL
        - gofastr/core/mcp.WidgetClientHandler
  - change: "BREAKING - the local storage backends (battery/storage and upload.NewLocalStorage) refuse a key that is not in its clean form (a//b, a/./b, ./a, a trailing slash, a leading slash, or .) with ErrInvalidKey instead of cleaning it, and Delete refuses a case- or normalization-folded spelling of a stored object"
    breaking: true
    hits: review
    guidance: "Each such key was an alias of another object, so erasing a row that named one could delete another user's file. Keys the framework mints are already clean. A key your code builds by joining strings should go through path.Clean before Save, and stored keys that are not clean need renaming."
    find:
      uses:
        - gofastr/battery/storage.NewLocalStorage
        - gofastr/core/upload.NewLocalStorage
  - change: "BREAKING - app.ScreenLLMMD and app.ScreenLLMMDWithMeta take a context.Context first, so a screen's llm.md links follow the request's locale prefix"
    breaking: true
    hits: edit
    guidance: "Pass the request context: app.ScreenLLMMD(r.Context(), screen) and app.ScreenLLMMDWithMeta(r.Context(), screen, meta). The UI host calls these itself, so apps that never call them change nothing."
    find:
      uses:
        - gofastr/core-ui/app.ScreenLLMMD
        - gofastr/core-ui/app.ScreenLLMMDWithMeta
  - change: "BREAKING in production mode - the magic-link, password-reset and email-verification plugins refuse to boot on the in-memory token store they mint when TokenStore is unset, as the session and 2FA stores already do"
    breaking: true
    hits: review
    guidance: "A link emailed from one replica was invalid on the next, and a restart dropped every pending link. Set each plugin's TokenStore to auth.NewSQLMagicLinkTokenStore(db), or set AuthConfig.AllowInMemoryStores: true to acknowledge a single-node deployment. DevMode is unaffected."
    find:
      uses:
        - gofastr/battery/auth.NewMagicLinkPlugin
        - gofastr/battery/auth.NewPasswordResetPlugin
        - gofastr/battery/auth.NewEmailVerificationPlugin
  - change: "BREAKING for static exports - App.ExportStatic now ships the app's own Content-Security-Policy (AppConfig.SecurityHeaders.ContentSecurityPolicy) instead of a fixed one, and refuses a policy holding a 'nonce-' source, a control byte, or a quote or angle bracket"
    breaking: true
    hits: review
    guidance: "An export used to ignore the configured policy, so a policy with a nonce exported fine. A nonce baked into files gives every visitor the same value and protects nothing; exported pages link every script, so drop the nonce source (hashes are fine). The export's <meta> also leaves out frame-ancestors, report-uri and sandbox, which a meta ignores; _headers keeps them."
    find:
      uses:
        - gofastr/framework.WithSecurityHeaders
  - change: "BREAKING - app.LoadingManifest.HTML is a method, HTML(ctx context.Context) string, that renders Show in the reader's locale; it was a string field rendered once"
    breaking: true
    hits: edit
    guidance: "Replace m.HTML with m.HTML(ctx), passing the request context so the loading content reads in the reader's language. Most apps never read the manifest: the UI host builds it."
    find:
      uses:
        - gofastr/core-ui/app.LoadingManifest.HTML
  - change: "BREAKING - EraseUserData follows foreign keys: a row in any table that references an erased row is erased too, whoever owns it, and a RESTRICT or NO ACTION relation refuses the erasure while such a row survives"
    breaking: true
    hits: review
    guidance: "Erasure used to delete only the user's owner-scoped rows, so a reference from another table blocked it or was left dangling. Cascaded rows are reported in EraseReport.Cascaded. Declare OnDelete SetNull on a relation whose child rows must survive the parent's erasure; one declared Restrict or NoAction now makes EraseUserData return an error naming the relation until the blocking rows are removed or reassigned. Run WithEraseDryRun to see the counts first."
    find:
      uses:
        - gofastr/framework.App.EraseUserData
  - change: "BREAKING for generated clients - an entity declaring an integer id gets ID int64 in the Go client (record methods and BatchDelete take int64) and id: number in client.d.ts, and a json field is any (unknown in TypeScript) instead of map[string]any, with every number inside an any (json fields, batch data) decoded as json.Number"
    breaking: true
    hits: review
    guidance: "The server always answered an integer id as a JSON number, so the old string-typed client failed every decode; code calling it with a string id now passes the int64. A json field read as map[string]any needs a type assertion, since the value may be an array, number or string. A number inside one is a json.Number: call Int64() or Float64() where the code asserted float64, which rounded integers past 2^53. Regenerate with gofastr generate."
    find:
      config:
        - key: entities.*.fields.*.type
          value: '(?i)^(int|integer|json)$'
  - change: "BREAKING for --from-openapi CLIs - servers[0].url's path becomes the API prefix every request carries, so --url and <APP>_URL take a bare origin; --api-prefix now works with --from-openapi and replaces that path"
    breaking: true
    hits: review
    guidance: "A caller that passed --url https://host/api/v3 to reach a server whose spec names /api/v3 now passes --url https://host, or the path doubles. Set api_prefix: \"\" on the cli entry to keep the old behavior."
    find:
      text:
        - glob: "**/gofastr.settings.yml"
          match: '^\s+from_openapi:'
  - change: "A generated CLI sends the token login stored only to the origin it was stored for; a --url or <APP>_URL naming another host gets no credential"
    breaking: false
    guidance: "Run login --url <url> against each server you call, or set <APP>_TOKEN, which goes wherever the call does."
    nodetect: "the change is in the generated CLI's runtime behavior; nothing in an app's source spells it"
  - change: "BREAKING - columns is a reserved transition key: a move keyed columns overwrote the JS SDK resource's upload column map"
    breaking: true
    hits: edit
    guidance: "Rename the transition. The boot error names the collision."
    find:
      fields:
        - field: gofastr/framework/entity.Transition.Key
          value: '^columns$'
  - change: "BREAKING - entity.Define panics, and the app spec refuses, a cursor field that can hold NULL: one that is not a key column, not Required and not framework-written"
    breaking: true
    hits: review
    guidance: "Keyset paging skipped rows whose cursor column was NULL, and the dialects sort NULLs at opposite ends. Mark the field Required, or page on created_at plus the id. The panic names the entity and the field."
    find:
      fields:
        - field: gofastr/framework/entity.PaginationConfig.CursorField
        - field: gofastr/framework/entity.PaginationConfig.CursorFields
      config:
        - key: entities.*.pagination.cursor_fields
        - key: entities.*.cursor_fields
        - key: entities.*.pagination.cursor_field
        - key: entities.*.cursor_field
  - change: "BREAKING - a filter value must be of its field's type on every filter surface (flat ?field_op=, ?where=, the DSL, ?rel.field=, ?include=rel(...), ListOptions.Filters, a cursor token); a mistyped one answers 400 naming the field, LenientFilters included, a Bool takes exactly what strconv.ParseBool accepts, a JSON value must be JSON, and a Relation column holding an integer key is checked as an Int"
    breaking: true
    guidance: "A client that sent ?active=yes or ?count=abc got an empty SQLite list or a Postgres 500 and now gets a 400. Send true/false (or 1/0) for a Bool and the field's type everywhere else; the accepted spellings are in entity-declarations.md."
    nodetect: "the values come from clients' query strings and DSL text at request time, not from the app's source"
  - change: "BREAKING - filter.BoolBind is removed; filter.CoerceValue checks and coerces a raw value for any field type"
    breaking: true
    hits: edit
    guidance: "BoolBind(isBool, raw) bound a Bool's parsed value and fell back to the raw string for anything else, so a mistyped value reached SQL. Call filter.CoerceValue(field, t, raw), which returns the bind value or an error naming the field; answer that error with 400. For a ParsedFilter, f.Typed(t) then f.BindValue() does the same."
    find:
      uses:
        - gofastr/framework/filter.BoolBind
  - change: "BREAKING - _like and DSL contains ignore case on both dialects (LOWER(col) LIKE, the ?q= shape), and contains on a non-text field is refused"
    breaking: true
    guidance: "Postgres used to match _like with case and SQLite without; both now ignore ASCII case, and Postgres folds the rest of Unicode too. A client relying on a case-sensitive Postgres match gets more rows."
    nodetect: "the operators come from clients' query strings and DSL text at request time, not from the app's source"
  - change: "BREAKING for typed hooks - a JSON integer in a map[string]any or any field of the hook's value arrives as int64 instead of float64, and merges back to the row the same way"
    breaking: true
    hits: review
    guidance: "Integers above 2^53 were rounded on the way through a typed hook and written back rounded. Other numbers stay float64. A hook that asserts .(float64) on a nested integer switches to int64, or uses a type switch over both."
    find:
      uses:
        - gofastr/framework.OnBeforeCreate
        - gofastr/framework.OnAfterCreate
        - gofastr/framework.OnBeforeUpdate
        - gofastr/framework.OnAfterUpdate
  - change: "BREAKING for crud.Redispatch - numbers in the result arrive as json.Number instead of float64, so an id or count above 2^53 keeps every digit"
    breaking: true
    hits: review
    guidance: "MCP tool results and module reverse calls decoded the response with every number as a float64, rounding big integer ids. A caller that asserts .(float64) on a field of the result switches to json.Number and calls Int64 or Float64."
    find:
      uses:
        - gofastr/framework/crud.Redispatch
  - change: "BREAKING - the auth battery's durable stores fold a mixed-case table name the way AutoMigrate does, and AuthManager.Init refuses to boot on Postgres while a case-kept table from an older version exists"
    breaking: true
    hits: review
    guidance: "Only a users, sessions, 2FA, OAuth-links, passkey or magic-link table declared with upper case or a dot on Postgres is affected. Older versions created a second, quoted table such as \"Members\" beside AutoMigrate's members, kept the case of mapped columns such as \"PasswordHash\", and created a dotted name such as q.Members as one literal table. Move the rows into the folded table and drop the old one, or run the quoted ALTER TABLE statements the error prints (rename, SET SCHEMA, RENAME COLUMN), then restart. Old case-kept index names stay behind after a rename and can be dropped. On SQLite a dotted name now needs that database attached."
    find:
      uses:
        - gofastr/battery/auth.NewEntityUserStore
        - gofastr/battery/auth.NewEntitySessionStore
        - gofastr/battery/auth.NewEntityTwoFAStore
        - gofastr/battery/auth.NewSQLMagicLinkTokenStore
        - gofastr/battery/auth.NewSQLPasskeyStore
  - change: "BREAKING - an update that sends \"\" for an optional non-text field (number, date, timestamp, enum, uuid, relation, json) clears it to null; it used to be dropped, which kept the stored value"
    breaking: true
    guidance: "An HTML form posts every control, and a blank one now clears the column, which is what emptying the control means. A JSON client that sent \"\" for a field it meant to leave alone omits the key instead. String and Text keep \"\" as a value, and a blank Image or File keeps the stored file."
    nodetect: "the change is in how crud reads an update body; nothing in an app's source spells it"
  - change: "BREAKING - an upsert onto an existing key emits and stages entity.updated; it used to announce entity.created on both arms"
    breaking: true
    guidance: "A subscriber or outbox consumer that treated every upsert as a create also handles entity.updated for the same entity. AfterCreate hooks still fire on both arms."
    nodetect: "the event type is chosen at runtime inside crud's upsert; nothing in an app's source spells it"
  - change: "BREAKING for ui.DateTimeFieldConfig - Step is a float64 in seconds, so 0.001 shows milliseconds"
    breaking: true
    hits: review
    guidance: "An untyped constant such as Step: 60 still compiles. A typed int variable passed as Step converts with float64(n)."
    find:
      uses:
        - gofastr/framework/ui.DateTimeFieldConfig
  - change: "BREAKING for custom locale resolvers - i18n.WithLocaleResolver and framework.WithLocaleResolver take an i18n.LocaleResolver{Resolve, Vary}, so the middleware can add the headers a resolver reads to the response's Vary"
    breaking: true
    hits: review
    guidance: "i18n.CookieLocale returns a LocaleResolver already, so WithLocaleResolver(i18n.CookieLocale(\"locale\")) compiles unchanged. A custom func becomes i18n.LocaleResolver{Resolve: f, Vary: []string{<every request header f reads>}}; leaving Vary empty lets a shared cache replay one reader's language to the next."
    find:
      uses:
        - gofastr/core/i18n.WithLocaleResolver
        - gofastr/framework.WithLocaleResolver
  - change: "BREAKING for code that stores FileField.URL - file.FileField.URL escapes each path segment, so it differs from StorageRef for a file name holding # or %"
    breaking: true
    hits: review
    guidance: "Store ff.StorageRef in the column, not ff.URL. A column holding the escaped URL fails CRUD's uploaded-key check with key_not_uploaded for such names. Use ff.URL only as a link."
    find:
      uses:
        - gofastr/framework/file.ProcessFileField
  - change: "BREAKING - auth.TwoFACompareAndSetter and MemoryTwoFAStore.CompareAndSetTwoFA are removed; backup-code regeneration swaps through TwoFAStateSwapper"
    breaking: true
    hits: edit
    guidance: "A custom 2FA store implements TwoFAStateSwapper (CompareAndSwapTwoFA) instead; both built-in stores already do. Delete any CompareAndSetTwoFA method or call."
    find:
      uses:
        - gofastr/battery/auth.TwoFACompareAndSetter
        - gofastr/battery/auth.MemoryTwoFAStore.CompareAndSetTwoFA
  - change: "BREAKING on Postgres - a store table configured with capitals or a dot (queue, outbox, fanout, A2A, access grants, auth token and rate-limit stores, audit, embed burns, search, pgvector, the migrate tracking table) is folded to lowercase and quoted per part; it used to keep its case and be one name"
    breaking: true
    guidance: "A lowercase table name needs nothing. For a name like Jobs or app.Jobs, the first boot refuses to start and prints the statements to run, such as ALTER TABLE \"Jobs\" RENAME TO \"jobs\" (plus ALTER TABLE ... SET SCHEMA for a dotted name). Run them, then restart. Raw SQL a host writes against such a table uses the lowercase name."
    nodetect: "table names are configuration values, often read from env; the old table is found at boot, which prints the rename"
  - change: "BREAKING - framework/datexport moved to core/datexport"
    breaking: true
    hits: edit
    guidance: "Import github.com/DonaldMurillo/gofastr/core/datexport instead of framework/datexport; every name in the package is unchanged. The move lets core stores (A2A, feature flags, idempotency) register their own tables, since core never imports framework."
    find:
      imports:
        - gofastr/framework/datexport
  - change: "BREAKING for custom CRUD event outboxes - crud.EventOutbox declares AppendFor(ctx, ex, owner, eventType, data) in place of Append, so a staged event names its record's owner and an erasure of that user nulls its payload"
    breaking: true
    hits: edit
    guidance: "The bundled outbox implements AppendFor already, so apps that pass outbox.New to crud need nothing. A custom EventOutbox renames Append to AppendFor and takes the owner id as its third argument; store it so App.EraseUserData can find the row."
    find:
      uses:
        - gofastr/framework/crud.EventOutbox
        - gofastr/framework/crud.EventOutbox.Append
  - change: "BREAKING for outboxes built WithoutEnsureTable - the outbox table needs an owner column, owner TEXT NOT NULL DEFAULT ''"
    breaking: true
    hits: review
    guidance: "An outbox that creates its own table adds the column on boot. A host that manages the table itself runs ALTER TABLE <table> ADD COLUMN owner TEXT NOT NULL DEFAULT '' before deploying, or every insert fails."
    find:
      uses:
        - gofastr/framework/outbox.WithoutEnsureTable
  - change: "Store tables gain an owner or principal column for user data erasure: idempotency keys (principal), search documents, pgvector chunks, outbound webhook deliveries and inbound webhook envelopes (owner)"
    breaking: false
    guidance: "Each store adds its column on boot, so nothing needs running. Rows written before the upgrade name nobody and are not erased with a user; set Document.Owner, use PublishFor and IngestConfig.Owner from now on."
    nodetect: "the columns are added at boot by the stores themselves; nothing in an app's source spells the change"
  - change: "BREAKING - entityui RecordBuilder.Steps takes the ListBuilder the drawer opens from, Steps(list), so previous and next walk that list's key, View and Where pins"
    breaking: true
    hits: edit
    guidance: "Steps() rebuilt a bare list, so a keyed list read the wrong params and a View or Where pin was dropped: the drawer stepped onto records the list did not show. Pass the same ListBuilder the list screen renders, for example a func that builds it, called from both the list screen and Steps(list())."
    find:
      uses:
        - gofastr/framework/entityui.RecordBuilder.Steps
  - change: "BREAKING for process modules - the proxy copies only Cache-Control, Content-Language, ETag, Expires, Last-Modified and Retry-After from a module.http response, adds its Vary to the host's, always sets the body kind's Content-Type with nosniff, and answers 503 for a status outside 200-599"
    breaking: true
    hits: review
    guidance: "A module answers on the host origin, so a header it set (Set-Cookie, a Content-Security-Policy, CORS, Location, a text/html Content-Type) used to override the host's. A module that relied on another header drops it; send markup as a ui.node.v1 body, which the host validates and renders, and set cookies from the host."
    find:
      uses:
        - gofastr/core/moduleproto.HTTPResponseResult
  - change: "BREAKING - the admin's Jobs, User roles, Roles and Modules pages and their posts answer 403 to a caller whose request carries a tenant, and its nav and dashboard leave them out"
    breaking: true
    hits: review
    guidance: "Queue jobs, accounts, role grants and process modules have no tenant, so a tenant's admin reached every tenant's. Run these from a request with no tenant (tenant.GetTenantID empty), the platform operator's; tenant admins keep the entity, audit and dashboard pages."
    find:
      uses:
        - gofastr/battery/admin.New
  - change: "BREAKING - ProcessModuleSupervisor.RevokeGrants removes the grants it names and keeps the rest instead of replacing the set with them, and refuses an empty list; ProcessModuleStore gains RemoveEffectiveGrants"
    breaking: true
    hits: review
    guidance: "A call that passed the narrowed set now passes the grants to take away: RevokeGrants(ctx, name, []access.Permission{\"invoices:write\"}). A call passing nil or an empty list to revoke everything now errors; name every grant. A custom ProcessModuleStore implements RemoveEffectiveGrants as a compare-and-swap on the generation, like SQLProcessModuleStore."
    find:
      uses:
        - gofastr/framework.ProcessModuleSupervisor.RevokeGrants
  - change: "BREAKING - the WithMCPControl tools need a caller holding the admin role; framework.WithMCPControlGate replaces the gate"
    breaking: true
    hits: review
    guidance: "app_module_enable and app_module_disable ran for any signed-in caller. Grant the operators who drive them the admin role, or pass framework.WithMCPControlGate(framework.MCPRequireRole(\"ops\")) with the role they hold. The gofastr dev loop's implied tools stay ungated."
    find:
      uses:
        - gofastr/framework.WithMCPControl
  - change: "BREAKING - battery/log's MCP tools need a caller holding the admin role; log.Config.MCPGate replaces the gate"
    breaking: true
    hits: review
    guidance: "log_recent, log_filter, log_metrics and log_set_level ran for any signed-in caller. Grant the operators who read them the admin role, or set Config.MCPGate to framework.MCPRequireRole with the role they hold. The gofastr dev loop's implied tools stay ungated."
    find:
      uses:
        - gofastr/battery/log.Config.EnableMCP
  - change: "BREAKING - auth.RoleGateCapability moved to access.RoleGateCapability"
    breaking: true
    hits: edit
    guidance: "The framework's MCP gates and /.debug now consult the Decider on the same capability, so the constant lives in framework/access. Replace auth.RoleGateCapability with access.RoleGateCapability; the value, auth:role-gate, is unchanged."
    find:
      uses:
        - gofastr/battery/auth.RoleGateCapability
  - change: "BREAKING - an API-token request reaches battery/admin only when the token holds admin.AdminScope (admin:access; admin:* and *:* cover it)"
    breaking: true
    hits: review
    guidance: "A token carried its owner's admin role into the back office whatever its scopes. A script that drives the admin with a token mints one with the admin:access scope; sessions and JWTs change nothing."
    find:
      uses:
        - gofastr/battery/admin.New
  - change: "The OAuth state cookie is __Host-gofastr_oauth_state when SessionSecure is on"
    breaking: true
    guidance: "A sibling subdomain could plant the plain gofastr_oauth_state cookie and pass the callback's browser binding. DevMode keeps the plain name. A test that synthesises a production-mode callback sends the __Host- name; anything that reads or strips the cookie by name (a proxy rule, a cookie-consent list) uses it too."
    nodetect: the cookie is planted and checked by the framework; a name in a proxy rule or test has no Go shape
  - change: "A returning OAuth sign-in refreshes its link's profile only through OAuthProfileRefresher; a custom user store with only OAuthEnrichedLinker keeps the profile from link time"
    breaking: false
    guidance: "The refresh used LinkOAuthEnriched, an upsert that put back a link an account claim had just removed. Implement RefreshOAuthProfile(ctx, userID, provider, providerID, profile) as an UPDATE of the link's profile columns, matching all three keys, to keep profiles current. EntityUserStore does already."
    nodetect: "a custom store implements the method on its own type; no framework name appears at the site"
  - change: "A generated app's authPolicy checks a screen's role through auth.RolePolicy, so an access decider binds it and a scoped API token is refused"
    breaking: false
    guidance: "The generated function read the user's roles itself and never asked the decider installed by access.DeciderMiddleware. An app generated before this release keeps that function in its app.go: replace authPolicy with the one gofastr new now writes, which composes auth.SessionPolicy(auth.WithRedirect(loginPath)) and auth.RolePolicy(auth.Roles(role))."
    nodetect: "the old authPolicy is the app's own function in its app.go; no framework name appears at the role check"
  - change: "An A2A task records the scopes of the credential that created it, and a scoped API token or embed grant sees only the tasks made under the same scopes"
    breaking: false
    guidance: "A narrow token of a user read the tasks that user's session ran. A custom a2a.Store persists TaskRecord.Scope and filters ListTasks by ListQuery.Scoped/Scope; the server re-checks both, so a store that does not hides every task from scoped callers rather than leaking one. Tasks stored before the upgrade read as a session's, so a token no longer sees the tasks it ran earlier."
    find:
      uses:
        - gofastr/core/a2a.NewServer
  - change: "BREAKING - CRUD _batch and transition routes answer 415 to a body that is not application/json, and a multipart create or update from a cross-site sender answers 403"
    breaking: true
    guidance: "A browser sends multipart/form-data cross-site with no preflight, so a page on a sibling subdomain could write as the signed-in user. The runtime and the generated SDKs already send JSON. A client that posted _batch or a transition as a form switches to a JSON body; a same-site multipart upload is unaffected."
    nodetect: "the content type is chosen by clients at request time, not in the app's source"
  - change: "Entity UI relation labels, facets, headings and pickers read a related entity only when ?include= could: never one with Exposure.CRUD false, and never one a scoped token lacks <table>:read for"
    breaking: false
    guidance: "A posts screen whose author_id points at a users entity with CRUD off (auth.UserEntityConfig) now draws an em dash for the author and offers no picker rows. To show those names, expose the related entity's read routes, or draw the column with the app's own component under a check the app owns."
    nodetect: "the related entity's exposure is configuration read at runtime; a screen that shows its labels has no distinct spelling"
  - change: "A CRUD write's response runs the entity's BeforeGet hooks and answers with the row's id when their clauses exclude it"
    breaking: false
    guidance: "Create, update, _batch create and update, and transition responses now run the BeforeGet chain GET runs, after the commit, with the written row's id and the write's request. A BeforeGet hook that assumed a GET (reading the method, or recording a view) runs on those writes too; a hook error hides the row from the response but keeps the write."
    find:
      uses:
        - gofastr/framework.OnBeforeGet
  - change: "A list without ?fields= serves each field under its WireName, as GET /{id} and ?fields= already did; since v0.85.0 it served the column name in the JSON case"
    breaking: false
    guidance: "A client that read an aliased field from a list by its column name reads the WireName instead, the key every other read serves. An AfterList hook that redacts by the WireName now finds the field on the list."
    find:
      uses:
        - gofastr/core/schema.Field.WireName
  - change: "BREAKING - boot and every read refuse a many_to_many whose Through and its join entity's Table differ only in naming a schema (public.memberships against memberships)"
    breaking: true
    hits: review
    guidance: "Reads found no join entity for the mismatched spelling and skipped its owner, tenant, soft-delete and read gates. Spell Through exactly as the join entity's Table spells it; a Through that no entity owns, or that names the same schema, is unaffected."
    find:
      uses:
        - gofastr/framework/entity.ManyToMany
      text:
        - glob: "**/*.json"
          match: '"through":\s*"[A-Za-z_][A-Za-z0-9_]*\.[A-Za-z_]'
  - change: "BREAKING - a has_one or has_many cascade_write create answers 400 validation.cascade_key_not_writable when the child's foreign key is ReadOnly, Hidden, its tenant column, or not declared"
    breaking: true
    hits: review
    guidance: "Those children were stored with no parent while the response showed them attached. Declare the child's foreign key as a plain field, or create the children through their own route."
    find:
      uses:
        - gofastr/framework/entity.Relation.WithCascadeWrite
      text:
        - glob: "**/gofastr.yml"
          match: '^\s+cascade_write:\s*true'
  - change: "TypedQuery.UpdateAll names columns as CreateOne and UpdateOne do, and returns \"no fields to update\" for a body that sets no writable field"
    breaking: false
    guidance: "A MarshalEntity key such as line2 now writes its line_2 column instead of being dropped. A call whose body named no writable column used to restamp updated_at alone and report the rows it matched; it now errors, so a caller that bumped updated_at that way passes updated_at itself. Two keys naming one column (line2 and line_2) are refused."
    find:
      uses:
        - gofastr/framework/crud.TypedQuery.UpdateAll
  - change: "An export archive spells a Postgres timestamp in schema.TimestampLayout and a DATE as YYYY-MM-DD, keeps a SQLite time column's stored text, and an import rewrites a declared Timestamp or Date column in those layouts"
    breaking: false
    guidance: "A tool that reads archives itself sees 2024-01-03T10:00:05.120000Z where it saw 2024-01-03T10:00:05.12Z, a bare date where it saw 2024-01-03T00:00:00Z, and a SQLite battery column as the database stored it. A SQLite database already restored from an older archive keeps the trimmed spellings; restore once more on this version (export, then import into an empty database) to rewrite its declared Timestamp and Date columns."
    find:
      uses:
        - gofastr/framework.App.ExportData
        - gofastr/framework.App.ImportData
  - change: "BREAKING - a blank Bool value in a multipart create or update is \"not provided\", as on the JSON path: an update stores NULL, a create applies the default, and a required Bool sent blank answers 400"
    breaking: true
    guidance: "A multipart client that sent an empty value meaning false stored false and now stores NULL or the default, or gets a 400 for a required field. Send false (or 0, no, off) for false."
    nodetect: "the values come from clients' multipart bodies at request time, not from the app's source"
  - change: "BREAKING - GrantStore.Grant returns access.ErrRevokedByWildcard, and writes nothing, for a permission a wildcard revocation it does not lift still covers (Revoke(\"teams:*\") then Grant(\"teams:read\")); a grant of the wildcard itself now lifts its tombstone"
    breaking: true
    hits: review
    guidance: "That grant used to succeed on the calling replica while peers and restarts kept denying it. Grant the wildcard, then revoke what the role should not hold. GrantStore.CheckGrant reports the same error without writing."
    find:
      uses:
        - gofastr/framework/access.GrantStore.Grant
  - change: "BREAKING for generated SDKs - gofastr sdk refuses an entity whose client.d.ts type name is already declared: by the runtime (Resource, Client, CursorPage, ListResponse, ListParams, CursorParams, BatchResult, BatchResponse, ApiError) or by another entity (order_input beside order's OrderInput)"
    breaking: true
    hits: review
    guidance: "The second declaration used to ship beside the first: a tsc error, or two interfaces TypeScript merged into one. Rename the entity; the error names the type and its owner."
    find:
      fields:
        - field: gofastr/framework/entity.EntityDeclaration.Name
          value: '^(resource|client|cursor_page|list_response|list_params|cursor_params|batch_result|batch_response|api_error|Resource|Client|CursorPage|ListResponse|ListParams|CursorParams|BatchResult|BatchResponse|ApiError)$'
  - change: "A cascade_write child whose keys name one column twice (bodyText and body_text) answers 400 validation.keys_fold, and an in-process nested child reads the keys MarshalEntity derives"
    breaking: false
    guidance: "One of the two keys used to win by map order. Send each child field once, under its wire key."
    nodetect: "the keys come from request bodies at request time, not from the app's source"
  - change: "BREAKING - middleware.CSRFConfig.HostPrefixWhenSecure is removed: a caller-supplied CookieName (and auth.WithCSRFCookieName) gets the __Host- prefix on every secure request, NoHostPrefix opts out, and CSRF panics on a CookiePath other than / unless NoHostPrefix is set"
    breaking: true
    hits: review
    guidance: "Delete HostPrefixWhenSecure: true; the prefix is the default now. A custom name that stayed plain on HTTPS becomes __Host-<name>: a browser holding the old cookie gets the new one on its next GET, and a form loaded before the deploy is refused once. Code that reads the cookie by name reads __Host-<name> on HTTPS. Set NoHostPrefix: true only for a CookiePath other than /, and accept that a sibling subdomain can then plant a token."
    find:
      fields:
        - field: gofastr/core/middleware.CSRFConfig.HostPrefixWhenSecure
        - field: gofastr/core/middleware.CSRFConfig.CookieName
        - field: gofastr/core/middleware.CSRFConfig.CookiePath
      uses:
        - gofastr/battery/auth.WithCSRFCookieName
  - change: "BREAKING - MemoryInboundStore.MarkEnvelopeProcessing and SQLInboundStore.MarkEnvelopeProcessing return (bool, error): false means no envelope was marked, because it is missing or already processed"
    breaking: true
    hits: edit
    guidance: "ProcessInbound is the only caller the framework has, and it now skips the handler on false. A direct caller takes the extra result: if _, err := store.MarkEnvelopeProcessing(ctx, id); err != nil. A store of your own that wraps one of these keeps the same signature for ProcessInbound to find the claim."
    find:
      shapes:
        - symbol: gofastr/battery/webhook.MemoryInboundStore.MarkEnvelopeProcessing
          type: '^func\(\w+ context\.Context, id string\) error$'
        - symbol: gofastr/battery/webhook.SQLInboundStore.MarkEnvelopeProcessing
          type: '^func\(\w+ context\.Context, id string\) error$'
  - change: "BREAKING for process modules with a migration group - an artifact upgrade clears MigrationsAppliedAt, so the module holds in InstalledDisabled until the migration coordinator runs for the new artifact"
    breaking: true
    hits: review
    guidance: "The previous artifact's approval used to carry over, so a new version reached Ready without its DDL. After deploying a new module artifact, run App.NewModuleMigrationCoordinator and Apply with the new descriptor and its migrations. Apply refuses to stamp when the row has moved to another artifact; run it for the artifact the row names."
    find:
      uses:
        - gofastr/framework.App.NewModuleMigrationCoordinator
        - gofastr/framework.NewMigrationCoordinator
