  - change: "per-IP rate limits key an IPv6 client by its /64 (ratelimit.IPKey, (*Limiter).ClientKey) in ratelimit Middleware, MiddlewareByKey(nil), the auth battery's per-IP limiters and framework.AgentRateLimitKey"
