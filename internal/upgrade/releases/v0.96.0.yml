    nodetect: "the change lands in regenerated SDK files; caller code that reads an optional field has no fixed spelling to search for"
  - change: "BREAKING - MagicLinkPlugin.Init refuses to start when a 2FA plugin is registered and MagicLinkConfig.TwoFactorURL is empty; a magic-link sign-in of a 2FA account now redirects there instead of to OnSuccessURL, which refused the pending session"
