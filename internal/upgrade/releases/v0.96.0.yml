  - change: "BREAKING for custom A2A stores - a2a.RetentionTrimmer.TrimTerminalTasks takes a tier: TrimTerminalTasks(ctx, owner, tier a2a.RetentionTier, keep int); Config.TerminalTaskRetention and PausedTaskRetention now bound each (owner, tenant, scope) tier instead of each owner"
    breaking: true
    hits: edit
    guidance: "A narrow token's tasks, or the same user's tasks in another tenant, trimmed the user's other tasks. Add the tier parameter and delete only rows whose tenant and scope equal tier.Tenant and tier.Scope. A store still declaring the old method no longer satisfies RetentionTrimmer and is silently not trimmed. Apps on the built-in memory or SQL store change nothing; an owner now retains up to 64 terminal and 64 paused tasks per tenant and scope set."
    find:
      shapes:
        - symbol: gofastr/core/a2a.RetentionTrimmer.TrimTerminalTasks
          type: '^func\(([_[:alnum:]]+ )?context\.Context, ([_[:alnum:]]+ )?string, ([_[:alnum:]]+ )?int\) error$'
  - change: "AutoMigrate, DiffSchema and migrate generate write a table, column or index name that is a keyword on SQLite or Postgres (order, group, user, end, desc, to, offset, do, …) quoted and folded, so such names migrate on both engines"
    breaking: false
    guidance: "Nothing to do. Names that are not keywords are written as before. On SQLite a column named end, desc, to, offset, do or user already worked bare; the next migrate generate writes it quoted for new statements and proposes no change for the quoting alone. Raw SQL of your own that names such a column on Postgres must quote it, as CRUD does."
    nodetect: "the names are entity field and table declarations; any keyword among them is affected, which no single spelling marks"
  - change: "RedisCache.Set with a negative TTL (or a negative WithTTL default) deletes the key and stores nothing, as MemoryCache does; it used to hand the negative duration to RedisClient.Set"
    breaking: false
    guidance: "A go-redis adapter stores a non-positive expiration other than -1 with no expiry, and -1 as KEEPTTL, so such a write made an entry that never expired. Nothing to change unless code relied on that: pass 0 for the default TTL, or a positive lifetime."
    find:
      uses:
        - gofastr/battery/cache.NewRedisCache
  - change: "The slow-query line's sql attr (slowquery.TrimSQL) prints every SQL string literal as '?' and cuts at 240 bytes on a rune boundary"
    breaking: false
    guidance: "A value spelled inline in a statement (a password in ALTER ROLE, a token in a hand-built WHERE) went to every log sink verbatim. A log search or alert that matched a literal inside the sql attr now sees '?'; match on the statement's shape instead."
    find:
      uses:
        - gofastr/framework/slowquery.TrimSQL
        - gofastr/framework/slowquery.NewSlowQueryLogger
        - gofastr/framework/slowquery.NewSlowQueryLoggerFn
  - change: "battery/log's file sink tightens an existing log file it owns to FileOpts.FileMode (default 0600) when it opens it; it used to keep whatever mode the file had"
    breaking: false
    guidance: "A server.log left 0644 by an older build or a provisioning step was world-readable. If a log shipper reads the file through its group, set FileOpts.FileMode: 0o640 (or the mode it needs); the sink clears only the bits FileMode lacks and never adds any. A log file another user owns (a provisioned 0664 root:app file) keeps its mode, and a refused chmod is a stderr warning, not a failed open."
    find:
      uses:
        - gofastr/battery/log.FileSink
        - gofastr/battery/log.MustFileSink
        - gofastr/battery/log.DefaultFileSink
        - gofastr/battery/log.New
  - change: "battery/cache reads a value back into an interface (map[string]any, *any, []any) with integers past 2^53 as json.Number instead of a rounded float64"
    breaking: false
    guidance: "A cached id 9007199254740993 came back as 9007199254740992. Numbers a float64 holds exactly are still float64, so most code sees no change; code that type-asserts a large integer under an interface to float64 should accept json.Number (or decode into a typed struct)."
    find:
      uses:
        - gofastr/battery/cache.NewMemoryCache
        - gofastr/battery/cache.NewRedisCache
        - gofastr/battery/cache.GetOrSet
  - change: "core/static strips Config.Prefix on a path-segment boundary only, and its dot-segment and config-file refusals (static.Refuses) treat a backslash as a path separator"
    breaking: false
    guidance: "With Prefix /static a request for /staticname.js used to serve name.js; it now looks up staticname.js. A URL naming a hidden or config file with a backslash (/sub%5C.env) answers 404, as a slash already did. static.Mount under a prefix, which panicked at boot, now mounts. Nothing to change unless a client relied on the old prefix reading."
    find:
      uses:
        - gofastr/core/static.Handler
        - gofastr/core/static.Mount
  - change: "static.Builder.Watch leaves the builder's OutDir out of the files it polls"
    breaking: false
    guidance: "With OutDir under a watched dir, each rebuild used to trigger the next. Nothing to change; a file written into OutDir by another tool no longer triggers a rebuild."
    find:
      uses:
        - gofastr/framework/static.Builder.Watch
  - change: "core/static's SPA fallback (Config.SPA) answers with Cache-Control no-cache instead of the handler's MaxAge"
    breaking: false
    guidance: "The index served for a URL that names no file is revalidated on every request (a 304 while unchanged) instead of being cached under that URL for MaxAge. Nothing to change; a CDN rule that relied on the fallback's long max-age sees no-cache now."
    find:
      uses:
        - gofastr/core/static.Handler
        - gofastr/core/static.Mount
  - change: "A static export (App.ExportStatic, gofastr build) skips a static-dir symlink whose target leaves the static dir, dangles, or is not a regular file, and logs it; it used to publish the target, which the live host answers 404 for"
    breaking: false
    guidance: "A file the export now skips was never served by the running app. Copy the file into the static dir, or point the link at a file inside it, if it is meant to be public. A symlinked directory that stays inside the static dir (static/images -> img) is copied under its own name, as the running app serves it; a link back to a directory it sits in (loop -> .) is skipped."
    nodetect: "symlinks live in the static directory on disk, not in the app source"
  - change: "gofastr build's check-embed gate reads a template literal's ${...} in ClientJS as code, so a G.serverAction call inside one on an embeddable surface fails the build"
    breaking: false
    guidance: "The same tree already failed at boot (the Mount-time walk refuses it), so nothing that ran before stops running. Move the action to an island RPC, a form POST, or polling, the three shapes that work in a frame."
    nodetect: "the call sits inside JavaScript text the gate itself now reads; the build reports it"
  - change: "gofastr verify widens fixedtmp, timestampid, errleak, discardeddecode, recoverlog, controlbytes, worldreadable, unboundedbody, unboundedresp, secretcompare, credfetch, keytrim and GOFASTR1413 to more spellings of the shapes they already refuse"
    nodetect: "verify findings, not an API: code that builds a /tmp path by concat or Sprintf, mints an id in a struct literal or from time.Now().Format, formats an error into a 5xx body, drops a strict-decoder error, writes a file with os.FileMode(0o644) or a named mode const, reads a body with io.Copy or ReadFrom, deletes the Vary header, compares a credential with bytes.Equal, or trims an id with strings.Trim can fail verify where it passed"
    guidance: "Run gofastr verify and fix each finding: mint temp names with os.MkdirTemp / os.CreateTemp, ids from crypto/rand, log the error and answer a fixed 5xx message, check the decode error, compare secrets with subtle.ConstantTimeCompare or hmac.Equal, and refuse redirects on a client that sends credentials. A site that is the shape on purpose takes //gofastr:allow(<analyzer>) <reason>."
  - change: "AppConfig.JSONCase: crud.CaseSnake reaches the App.Entity, App.GroupEntity and App.View routes again (since v0.94.0 they answered camelCase keys in a snake_case app), and /openapi.json names those fields by their column names too (it always camelCased them)"
    breaking: false
    nodetect: "the case is AppConfig data and the keys live in the app's clients"
    guidance: "A snake_case app's REST bodies use the column names again, as entity-declarations.md documents. A client written against the camelCase keys those routes served since v0.94.0 reads and sends the column names instead. Apps on the default camelCase change nothing."
  - change: "/openapi.json documents the ?include= read view: a relation field's property in an entity's schema component is anyOf its key, the related record or null, and a relation with no field of its own is an optional property; request bodies still take the key"
    breaking: false
    nodetect: "the document is generated at runtime; what reads it is a client generator outside the app"
    guidance: "Nothing to change in the app. A client generated from the document types each relation field as a union where it was a uuid string; regenerate it, and read the key alternative where the code did not ask for an include."
  - change: "ui.AspectRatioComponent (empty or unknown Ratio), ui.Sticky (unknown Edge or Offset), ui.Box (unknown Pad) and ui.Center (MinHeight other than viewport or screen) panic, as Sticky's ZIndexTier already did"
    breaking: false
    guidance: "Each such value rendered a class with no rule: an AspectRatio with no ratio collapsed its media to 0px. Use the exported constants; the panic names the value."
    nodetect: "only an invalid value panics, and a valid one is spelled with the exported constants"
  - change: "A scalar filter key repeated in one query string (?status=a&status=b) is a 400 naming the key, LenientFilters included; only _in keys read every occurrence"
    breaking: false
    guidance: "Before, the first value ran and the rest were dropped. Send the key once, or use ?status_in=a,b."
    nodetect: "the change is in request handling; nothing in an app's source spells the query strings clients send"
  - change: "?where= decodes strictly: duplicate, case-folded or unknown members, values on a non-in leaf, both value and values on an in leaf, and an empty and/or group are 400s"
    breaking: false
    guidance: "Fix a client that sends extra or misspelled members."
    nodetect: "the JSON comes from clients at request time"
  - change: "Filter values Postgres cannot bind (invalid UTF-8 or NUL, a Decimal exponent past ±1000, a Timestamp or Date before year 1) are 400s on SQLite too"
    breaking: false
    guidance: "These answered 500 on Postgres and an empty 200 on SQLite."
    nodetect: "the values come from clients at request time"
  - change: "DSL queries: after() with an order() on another column or DESC, operators ?field_<op>= refuses (an ordered compare on a Bool, anything on a JSON column), more than 1000 in values, more than 16 order() calls and unbalanced unquoted brackets now error"
    breaking: false
    guidance: "Drop the order() beside after(); key a cursor walk on its own column."
    nodetect: "DSL strings are assembled at runtime"
  - change: "pagination.NewCursorPage returns ErrCursorKeyNull or ErrCursorKeyMissing when a page has more rows and the last row's cursor key is NULL or absent"
    breaking: false
    guidance: "It minted a cursor holding the text null, or HasMore with an empty cursor that restarted at page 1. Key the list on a NOT NULL column the query selects."
    nodetect: "the error depends on row data"
  - change: "_events drops rows a subscriber's BeforeList/BeforeGet hooks hide; a hook-restricted subscriber no longer receives hard deletes and should re-list"
    breaking: false
    guidance: "Matches what GET and the list answer that subscriber."
    nodetect: "the change is in delivery; hooks are registered at runtime"
  - change: "A cascade item or belongs_to reference onto an entity whose BeforeList/BeforeGet hooks add clauses answers 404 for a hidden or missing row"
    breaking: false
    guidance: "A hidden row was linkable and a hidden child's body was echoed."
    nodetect: "hooks are registered at runtime"
  - change: "A ?page= or ?offset= whose skip overflows int, or too long to parse, is 400 offset_too_large; an empty single-column caller-chosen key is 400"
    breaking: false
    guidance: "Both were served or stored before: page 1, and a row no record route could name."
    nodetect: "the values come from clients at request time"
  - change: "A RedirectPattern target that resolves to a control byte is no redirect (the request falls through, usually to a 404); WithExtraScripts drops an off-origin or malformed src with a warning"
    breaking: false
    guidance: "Serve such a script from the app, or load it from app code under a CSP that allows its host."
    nodetect: "only a hostile catch-all value or an off-origin src is affected"
  - change: "headless: StepWizard and Repeater render a leading hidden submit; TagInput with an ID names its field <ID>-field; a Repeater posts add/remove to Action; MenuItem.RPC, RPCAttrs data-cui-rpc, TreeNode.LazyPath, SortableList RPCPath/ConflictRPC and a static Combobox NoScriptAction panic unless same-origin; an Alert with DismissHref, no Title or Text and no DismissLabel panics; class maps should map the new PartComboboxMeta (it used to get the option class) and never give PartDefaultAction a display"
    breaking: false
    guidance: "New API: PartDefaultAction, PartComboboxMeta, Ctx on MultiSelectProps/NumberInputProps/SliderProps/RangeSliderProps/RatingProps/TagInputProps, PaneHostProps.Strings, ui.PaneHostConfig.Ctx, Strings CarouselRole/CarouselSlideRole/PaneSecondary/PaneTertiary. An e2e selector such as button[name=\"wizard_action\"][value=\"next\"] now also matches the hidden default twin first; add :not([hidden]). A catalog that must hold every ui.* key adds ui.carousel.role, ui.carousel.slideRole, ui.paneHost.secondary, ui.paneHost.tertiary and ui.copy.failed."
    nodetect: "markup and refusals depend on values set at render time"
  - change: "A plain disclosure (an accordion section) no longer closes on a link click inside it or on an Escape from outside it; only Dismiss, Trap and menu disclosures do"
    breaking: false
    guidance: "Give a disclosure Dismiss if it should close when a link inside it is followed."
    nodetect: "the behaviour is in the browser runtime"
  - change: "BREAKING - filter.SearchConditions returns ([]Condition, error); a ?q= term that is not storable text (invalid UTF-8 or a NUL) is an error, and the list route answers 400"
    breaking: true
    hits: edit
    guidance: "Take the error: conds, err := filter.SearchConditions(fields, term), and answer 400 when it is non-nil. Postgres refused such a term with a 500 while SQLite answered an empty 200."
    find:
      shapes:
        - symbol: gofastr/framework/filter.SearchConditions
          type: '^func\(fields \[\]string, term string\) \(\[\]filter\.Condition, error\)$'
  - change: "BREAKING - a BeforeGet hook that hides a row now also blocks writes to it: PUT, PATCH, DELETE, transitions, _batch items, restore and purge answer 404 (in process only under crud.WithReadHooks), and BeforeGet hooks run inside the write transaction"
    breaking: true
    guidance: "If a hook hides rows from callers who still need to write them, move that rule to Access permissions or stop hiding the row. A hook that reads the database must use the ctx it is given (framework.TxFromContext), not a separate pool connection, or it can deadlock on a one-connection pool."
    nodetect: "hooks are registered and decide at runtime"
  - change: "BREAKING - a filter key that reads two ways (one field's name and another field's name plus a suffix, check_in beside check) is a 400 filter.ambiguous_filter on every surface, LenientFilters included; entities may now declare such a pair, which registration used to refuse"
    breaking: true
    guidance: "Send ?check[in]= for the operator on check, ?check_in[eq]= for equality on check_in. Regenerate the OpenAPI document, CLI and SDK: those keys are spelled in bracket form."
    nodetect: "query strings come from clients at request time"
  - change: "Decimal writes are checked against the column: an exponent past ±1000, more than 15 integer or 4 fraction digits on a default decimal field (or past a RawType DECIMAL(p,s)) is a 400; a decimal Default past the scale fails at registration"
    breaking: false
    guidance: "Round to the column's scale before sending, or declare a wider column with RawType NUMERIC(p,s). Rows already stored past the column on SQLite still read back."
    nodetect: "values come from clients at request time"
  - change: "A malformed JSON body's error text names the JSON path and type instead of Go types; reason codes are unchanged"
    breaking: false
    guidance: "A client or test that parsed the old text (cannot unmarshal, invalid character, unexpected EOF) should branch on reason or expect the new phrase."
    nodetect: "the wording is produced at request time"
  - change: "A non-GET request to a screen path answers 405 with Allow: GET, HEAD instead of rendering the page; OPTIONS answers 204"
    breaking: false
    guidance: "Point a form's action at a handler registered for its method, or register the page for that method with r.Post(path, host.PageHandler(path))."
    nodetect: "forms and clients that post to page URLs live in templates and other sites"
  - change: "Generated CLIs: --<field> a,b on a list command filters with IN (<field>_in=a,b)"
    breaking: false
    guidance: "Filter on a literal comma with --param <field>=a,b; re-run gofastr generate to refresh committed *.gen.go."
    nodetect: "the change is in generated code"
  - change: "ui.FormRepeater's private --ui-form-repeater-action-min-height knob is removed; its Remove and Add are kit buttons"
    breaking: false
    guidance: "Set button density through the theme's button tokens instead."
    nodetect: "a CSS custom property set in a stylesheet"
  - change: "BREAKING - headless.RangeSliderProps and ui.RangeSliderConfig ValueLow / ValueHigh are *int (were int): nil is the unset end (low on Min, high on Max), and any set value is honoured, so a 0..0 pair renders as posted instead of widening to Min..Max"
    breaking: true
    hits: edit
    guidance: "Both zero used to mean unset, so a real 0..0 range could not round-trip. Take the address of a set value: ValueLow: new(20), ValueHigh: new(80) (or &lo, &hi from posted values). Drop a pair you set only to mean the whole range: nil already means Min..Max. A posted value still clamps into Min..Max and a crossed pair still renders ordered."
    find:
      shapes:
        - symbol: gofastr/framework/headless.RangeSliderProps.ValueLow
          type: '^int$'
        - symbol: gofastr/framework/headless.RangeSliderProps.ValueHigh
          type: '^int$'
        - symbol: gofastr/framework/ui.RangeSliderConfig.ValueLow
          type: '^int$'
        - symbol: gofastr/framework/ui.RangeSliderConfig.ValueHigh
          type: '^int$'
  - change: "BREAKING - the password reveal button is a toggle button with one name: headless.Strings.HidePassword and RevealHide, i18nui.PasswordInputHide and PasswordRevealHide, and the data-hui-show-label / -hide-label / -show-text / -hide-text hooks are removed"
    breaking: true
    hits: edit
    guidance: "The reveal button's name (Strings.ShowPassword) and visible word (Strings.RevealShow) no longer change; aria-pressed says whether the password shows, and ui.PasswordInput paints the pressed state. Delete any HidePassword / RevealHide you set on a Strings, and the ui.passwordInput.hide and ui.passwordInput.revealHide entries from your catalogs. A stylesheet or script keyed on the removed hooks keys on [data-hui-reveal][aria-pressed=true] instead."
    find:
      uses:
        - gofastr/framework/headless.Strings.HidePassword
        - gofastr/framework/headless.Strings.RevealHide
        - gofastr/framework/i18nui.PasswordInputHide
        - gofastr/framework/i18nui.PasswordRevealHide
      strings:
        match: 'data-hui-(show|hide)-(label|text)|ui\.passwordInput\.(hide|revealHide)'
  - change: "A ToggleAction's accessible name is its IdleLabel in both states (rendered as aria-label unless the caller set one); aria-pressed carries the state and only the visible label flips"
    breaking: false
    guidance: "Keep the idle label's words inside CommittedLabel (Follow / Following) so a voice user who reads the button aloud still matches its name. A test that read the committed button's name as the CommittedLabel reads the IdleLabel now."
    nodetect: "the change is in rendered markup; the source that configures a ToggleAction is unchanged"
  - change: "headless.Rating renders its choices in reading order (1..Max); ui.RatingInput fills stars with :has() instead of a reverse-order ~ cascade"
    breaking: false
    guidance: "Arrow keys now move the way the stars read. A stylesheet that filled headless.Rating stars with input:checked ~ label relied on the reverse order: fill a choice with label:has(~ input:checked) and the checked one with input:checked + label."
    find:
      strings:
        match: ':checked[[:space:]]*~'
  - change: "Derived ids keep non-ASCII letters: a ui.Section anchor and the headless Section, Table and Fieldset ids (and segmented, toggle, tooltip and filter-toolbar option ids) keep every script's letters and digits, lowercased, instead of dropping them"
    breaking: false
    guidance: "A heading such as Caf\u00e9 menu anchors at #caf\u00e9-menu, no longer #caf-menu, and a Japanese or Cyrillic heading gets an anchor at all. Update links, bookmarks, rail hrefs and e2e selectors that name an old derived id, or give the component an explicit ID, which always wins."
    nodetect: "derived ids come from titles at render time; links and selectors that name them live in templates, tests and other sites"
