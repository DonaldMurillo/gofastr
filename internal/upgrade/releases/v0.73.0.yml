version: v0.73.0
title: WebMCP bridge, per-route timeouts, CLI from OpenAPI, deterministic output
notes:
  - change: ToggleConfig.ExtraAttrs (Checkbox / Radio / Switch) now follows the sanitized contract — extras land on the root <label>, and class/id/for/data-fui-* keys are dropped
    breaking: true
    find:
      fields:
        - field: gofastr/framework/ui.ToggleConfig.ExtraAttrs
    guidance: "The previous raw copy onto the <input> was documented for data-fui-* RPC wiring but had no known callers. If you relied on it, move RPC wiring to the enclosing form or widget; extras that must reach the input element no longer can."
  - change: SSR/email output bytes are now deterministic (sorted map iteration wherever output was emitted)
    breaking: false
    guidance: "Fix only. Anything that fingerprinted the old nondeterministic bytes (snapshot tests, content hashes) re-baselines once."
    nodetect: "any fingerprint re-baselines once; no fixed spelling differs"
  - change: new opt-in surfaces — framework/experimental/webmcp (in-browser agent tools), per-route/per-group request timeouts, gofastr generate cli --from-openapi
    breaking: false
    nodetect: "all additive and opt-in; nothing changes unless mounted or called"
    guidance: "All additive and opt-in; nothing changes unless you mount or call them."
