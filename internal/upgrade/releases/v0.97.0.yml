version: v0.97.0
title: Pending release
notes:
  - change: "BREAKING - battery/cache.CacheMiddlewareWithLimit panics when maxBodyBytes is negative; a negative cap used to read as 0 and buffer every response whole"
    breaking: true
    nodetect: "the condition is a negative value, usually read from configuration, which no spelling shows; every ordinary call passes a cap or 0"
    guidance: "Pass 0 for no cap, or a positive byte count. A value read from configuration is checked before the middleware is built."
  - change: "BREAKING on SQLite - a create, batch create or upsert whose row would hold a NULL key part (a key left out or sent as null that no column DEFAULT, declared Default or rowid fills) is refused with 400 {<key>: [required]}, the answer Postgres gives; SQLite used to store the row under a NULL key"
    breaking: true
    nodetect: "a fact of the request and the database: a key declared without AutoGenerate is ordinary, and only a write that sends no key value changes answer"
    guidance: "Send the key, or declare it generated (AutoGenerate: schema.AutoUUID). Rows already stored under a NULL key cannot be read, updated or deleted through the CRUD routes: find them with SELECT ... WHERE <key> IS NULL and give them a key or delete them."
  - change: "BREAKING - schema.Field holds a Mask func, so it is no longer comparable: == on two fields, or a schema.Field map key, no longer compiles"
    breaking: true
    nodetect: "the Go compiler reports every such comparison or map key at build time, by file and line"
    guidance: "Compare the fields that matter (a.Name == b.Name), or key the map by field name."
  - change: "?fields= projections now return every required column beside the primary key, on list, cursor and get responses alike"
    nodetect: "a response-shape fact of the CRUD routes; no app spelling differs, and only a caller that asserts the exact key set of a projected row changes answer"
    guidance: "Required fields stay in a projection because the OpenAPI response schema holds them required; a client that needs slimmer rows reads the keys it names and ignores the rest."
  - change: "BREAKING - localentity Define refuses a field Pattern using \\s, \\S or a bare . : JavaScript and Go read them differently, so the browser and the server validated different values"
    breaking: true
    nodetect: "the pattern is a string in the app's own data, and only the runtime refusal names it; no code spelling separates an ambiguous pattern from a clean one"
    guidance: "Name the characters in a class instead: [ \\t\\r\\n]+ for whitespace, an explicit set where . stood. Define refuses the ambiguous spellings at startup with the reason."
  - change: "the SDK manifest's schema hash covers the JSON case now, so every manifest generated by an older CLI reports drift against this release"
    nodetect: "a digest both sides recompute; no app code differs, and the drift banner itself is the signal"
    guidance: "Re-run `gofastr generate sdk` to re-stamp the manifest. An app served snake_case keeps reporting drift until its artifacts speak its case; the hash is what says so."
  - change: "gofastr upgrade --apply refuses a downgrade without --allow-downgrade, and a run whose BREAKING notes still have hits exits 1 (a refused downgrade exits 2)"
    nodetect: "a CLI exit-status fact; scripts reading $? are the only callers that can observe it"
    guidance: "Pass --allow-downgrade to apply a downgrade deliberately, and clear the breaking hits the report lists to get exit 0 back."
  - change: "gofastr agents skill refuses to overwrite a .claude/skills/gofastr-host/SKILL.md that lacks the generated header, unless --force is passed"
    nodetect: "an existing file's content decides, not the app's code; the refusal itself names the flag"
    guidance: "Move or delete the hand-written SKILL.md, or pass --force (gofastr init --reinit --force overrides the same way)."
