version: v0.50.0
title: Embeddable surfaces carry a screen; server actions refused at boot
notes:
  - change: "embed.Surface.Path (string) replaced by embed.Surface.Screen (a screen value)"
    breaking: true
    hits: edit
    guidance: "A surface renders a screen, not a path string. Build the *app.Screen, register it, and pass that same value to the surface: reports := app.NewScreen(\"/reports\", &Reports{}); application.RegisterScreen(reports, app.EmbedLayout()); embed.Surface{Name: \"reports\", Screen: reports, ...}. *app.Screen satisfies the embed.Screen interface (RoutePath()) structurally. The route is still validated as Path was; read the resolved route via ResolvedSurface.Path() where you read Surface.Path before. uihost reads it internally."
    find:
      fields:
        - field: gofastr/framework/embed.Surface.Path
  - change: A surface whose screen registers G.serverAction panics at boot
    breaking: true
    hits: review
    guidance: "G.serverAction is refused inside a frame (the action registry is app-global). uihost now walks each embed surface's screen on Mount and panics naming the surface, component and action if any registered action's client handler calls G.serverAction. Use an island RPC, a form POST, or polling instead — all work in a frame. Detection flags the literal G.serverAction( token in a registered action's ClientJS."
    find:
      strings:
        match: 'G\.serverAction\('
  - change: "embed Host.MintNonce/VerifyGrant/Refresh take a context.Context first"
    breaking: true
    hits: edit
    guidance: "Every caller must thread a context through — the grant path consults the OriginSource (and any store) on each call, and a context carries the deadline and trace. Add ctx (or r.Context()) as the first argument: embeds.MintNonce(ctx, surface, subject, origin, scopes), embeds.VerifyGrant(ctx, token), embeds.Refresh(ctx, token)."
    find:
      uses:
        - gofastr/framework/embed.Host.MintNonce
        - gofastr/framework/embed.Host.VerifyGrant
        - gofastr/framework/embed.Host.Refresh
