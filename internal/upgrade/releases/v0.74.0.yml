version: v0.74.0
title: MCP spec coverage, core/acp, plugin host requirements, wasm tier
notes:
  - change: kiln acp speaks the published session surface; tools/list, tools/call, prompt and shutdown are gone and initialize changed shape
    breaking: true
    hits: review
    guidance: "Move to session/new, session/prompt and session/cancel; tool invocations now arrive as agent-driven session/update tool_call frames. kiln/agent/acp is deleted with no shim - kiln is not a production surface. Nothing changes for apps that do not drive `kiln acp`."
    find:
      imports:
        - gofastr/kiln/agent/acp
      text:
        - glob: "**/*.sh"
          match: '\bkiln acp\b'
  - change: mcp.AppConfig.CSP is mcp.AppCSP (connectDomains/resourceDomains/frameDomains/baseUriDomains) instead of a string
    breaking: true
    hits: edit
    guidance: "The old string emitted JSON no spec-compliant MCP Apps host could parse, so there is no working caller to preserve. Set the four fields instead; an app that sets no CSP is unaffected."
    find:
      fields:
        - field: gofastr/core/mcp.AppConfig.CSP
  - change: data-fui-confirm is honored on every form submit, not only data-fui-rpc dispatch
    breaking: false
    guidance: "Fix. A plain POST form carrying the attribute previously submitted with no prompt. If you relied on that no-op, remove the attribute."
    find:
      strings:
        attrs: [data-fui-confirm]
  - change: new opt-in surfaces — core/acp, MCP prompts/resource templates/pagination/notifications, pluginhost Manifest.HostRequirements and the wasm CSP tier, pluginhost MountConfig.Fallback, ui.Button.AriaLabel
    nodetect: "all additive and opt-in; nothing renders or runs unless configured"
    breaking: false
    guidance: "All additive and opt-in; nothing renders or runs unless you configure it."
