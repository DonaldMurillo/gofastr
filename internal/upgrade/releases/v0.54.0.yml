version: v0.54.0
title: Zero-deprecated surface — grouped EntityConfig is the model
notes:
  - change: The flat EntityConfig fields are gone; Scope/Pagination/Exposure are the config
    breaking: true
    hits: edit
    guidance: "SoftDelete, MultiTenant, TenantField, OwnerField, and CrossOwnerRead move to Scope (&framework.ScopeConfig{...}); CursorField, CursorFields, and MaxListLimit move to Pagination (&framework.PaginationConfig{...}); CRUD, MCP, Public, and Access move to Exposure (&framework.ExposureConfig{...}). These fields were deprecated through the v0.40 line. Blueprint YAML flat keys (owner_field:, soft_delete:, crud:, mcp:, ...) still parse — only the Go struct changed. A flat YAML key that conflicts with its grouped twin is now an error instead of a silent precedence pick."
    find:
      fields:
        - field: gofastr/framework/entity.EntityConfig.SoftDelete
        - field: gofastr/framework/entity.EntityConfig.MultiTenant
        - field: gofastr/framework/entity.EntityConfig.TenantField
        - field: gofastr/framework/entity.EntityConfig.OwnerField
        - field: gofastr/framework/entity.EntityConfig.CrossOwnerRead
        - field: gofastr/framework/entity.EntityConfig.CursorField
        - field: gofastr/framework/entity.EntityConfig.CursorFields
        - field: gofastr/framework/entity.EntityConfig.MaxListLimit
        - field: gofastr/framework/entity.EntityConfig.CRUD
        - field: gofastr/framework/entity.EntityConfig.MCP
        - field: gofastr/framework/entity.EntityConfig.Public
        - field: gofastr/framework/entity.EntityConfig.Access
  - change: EntityConfig.Timestamps is *bool
    breaking: true
    hits: edit
    guidance: "A literal false used to silently mean \"default true\" (an unexported set-bit controlled it); only WithTimestamps(false) worked. Timestamps is now *bool with nil = default true, so the visible value is the semantic value under copying and serialization. Replace Timestamps: false with WithTimestamps(false) or a *bool literal; Timestamps: true can simply be dropped."
    find:
      shapes:
        - symbol: gofastr/framework/entity.EntityConfig.Timestamps
          type: '^bool$'
  - change: The harness moved under framework/experimental
    breaking: true
    hits: edit
    guidance: "Import github.com/DonaldMurillo/gofastr/framework/experimental/harness/... instead of framework/harness/... — the subsystem is v0.1 and now carries the experimental-path stability exemption. The gofastr harness subcommand is unchanged."
    find:
      imports:
        - gofastr/framework/harness/...
  - change: Upload metadata and FileField emit camelCase JSON
    breaking: true
    hits: edit
    guidance: "core/upload.Metadata keys changed from original_name/mime_type/uploaded_at to originalName/mimeType/uploadedAt, and framework/file.FileField from mime_type/storage_ref to mimeType/storageRef. Clients parsing those responses by key must switch. The persisted <field>_variants column format is unchanged on purpose."
    find:
      strings:
        match: 'original_name|mime_type|uploaded_at|storage_ref'
  - change: battery/storage lost its dead registry; kiln lost two advertised action kinds
    breaking: true
    hits: edit
    guidance: "storage.Register/New/NewBattery/StorageType never had a working path (New always errored) — construct NewLocalStorage/NewS3Storage directly and pass it to WithFileStorage. Kiln's create_entity and respond_query action kinds were advertised but never executed; authoring one is now rejected at journal time with an error naming the kind."
    find:
      uses:
        - gofastr/battery/storage.Register
        - gofastr/battery/storage.New
        - gofastr/battery/storage.NewBattery
  - change: Generated resource screens now import framework/ui/resource
    breaking: false
    guidance: "Older generated apps keep working with their private resource.go engine; optionally regenerate or migrate its config to framework/ui/resource, because future correctness and security fixes do not reach the private copy."
    nodetect: advisory regeneration; the private resource.go keeps compiling
  - change: Deprecated UI shims ui.BaseCSS and interactive.Confirm are deleted
    breaking: true
    hits: edit
    guidance: "ui.BaseCSS() returned an empty string: delete the call. interactive.Confirm(message) becomes Action.WithConfirm(message) on the action it guarded."
    find:
      uses:
        - gofastr/framework/ui.BaseCSS
        - gofastr/core-ui/interactive.Confirm
  - change: Pattern components register under bare names (disclosure, multiselect, sortablelist)
    breaking: true
    hits: edit
    guidance: "The emitted data-fui-comp value, the CSS scope and multiselect.js's selectors drop the ui- prefix, so a stylesheet or script keyed on ui-disclosure, ui-multiselect or ui-sortable-list selects nothing; the components emit disclosure, multiselect and sortablelist."
    find:
      strings:
        classes: [ui-disclosure, ui-multiselect, ui-sortable-list]
      css:
        classes: [ui-disclosure, ui-multiselect, ui-sortable-list]
  - change: data-fui-sticky and data-fui-viewport are no longer emitted
    breaking: true
    hits: edit
    guidance: "Both were emit-only markers with no runtime or CSS consumer; styling keys off the .ui-sticky--* and .ui-responsive__* classes. A selector or script reading either attribute matches nothing now."
    find:
      strings:
        attrs: [data-fui-sticky, data-fui-viewport]
  - change: Dead exported surface is deleted (experimental redis stores, harness failover/routing/copilot providers, kiln render.Deferred, freeze.ErrGenerateViaBlueprint)
    breaking: true
    hits: edit
    guidance: "None of it had a working path: the redis stores could not be wired, the providers were never selected, render.Deferred was never populated and ErrGenerateViaBlueprint was never returned. Delete the import or the reference."
    find:
      imports:
        - gofastr/battery/experimental/redisflags
        - gofastr/battery/experimental/redisidempotency
        - gofastr/framework/harness/provider/copilot
        - gofastr/framework/harness/provider/failover
        - gofastr/framework/harness/provider/routing
      uses:
        - gofastr/kiln/render.Deferred
        - gofastr/kiln/freeze.ErrGenerateViaBlueprint
  - change: framework facade re-exports are functions, not assignable vars
    breaking: true
    guidance: "framework.AutoMigrate, framework.NewCrudHandler, framework.Define and the other re-exports in framework/reexports_*.go are wrapper functions with identical signatures: assigning to one or taking its address no longer compiles; plain calls are unchanged."
    nodetect: "an assignment or address-of on a re-export has no spelling apart from the plain call every app makes, and the compile error names the symbol"
  - change: WithConfig replaces AppConfig wholesale instead of merging field by field
    breaking: true
    hits: review
    guidance: "Later options win, including granular setters placed after WithConfig, and a field WithConfig leaves at its zero value becomes zero rather than keeping an earlier option's value: fill every field the config should carry, or place the granular setters after it."
    find:
      uses:
        - gofastr/framework.WithConfig
