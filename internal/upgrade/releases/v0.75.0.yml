version: v0.75.0
title: agent role, MCP Apps widget client, server-owned sidebar collapse
notes:
  - change: new opt-in surfaces - GOFASTR_ROLE=agent (RoleAgent), the MCP Apps widget client (mcp.WidgetClientJS/WidgetClientHandler, auto-mounted by WithMCPApp), ui.SidebarConfig.Collapse and the SidebarAutoHide variant, pluginhost ClientModule.AssetServer
    breaking: false
    guidance: "All additive and opt-in. The sidebar's zero value keeps the existing localStorage behaviour byte-identical; the widget client mounts only when an MCP App is registered, and yields to a route the host already mounted."
    nodetect: "all additive and opt-in; the sidebar zero value keeps the prior bytes"
  - change: an AssetSpec with no ContentType serves a type derived from its filename, and AssetServer.Register rejects specs with no filesystem behind them
    breaking: false
    nodetect: "the fix affects specs that omitted ContentType or carried no filesystem; there is no spelling for an absent field"
    guidance: "Fix. A spec that omitted ContentType previously served an empty Content-Type with nosniff, which browsers refuse to parse. A nil fs.FS carrying specs now fails at boot instead of panicking the first request goroutine; set an explicit ContentType to keep overriding detection."
