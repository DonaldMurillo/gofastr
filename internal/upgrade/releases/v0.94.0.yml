    guidance: "Declare a key other than id as EntityConfig.PrimaryKey: []string{\"code\"}, or several columns for a composite key. Read ent.KeyColumns() where you read ent.PrimaryKey, or ent.KeyColumn() where one column is needed (it returns entity.ErrCompositeKey for a composite key). See gofastr docs entity-declarations, Record ids."
  - change: "boot refuses a table that has rows and no primary key, where it left the table keyless"
    breaking: true
    nodetect: "the change is in the database's state, not the app's source"
    guidance: "A table created outside gofastr with no primary key now fails the boot with an error naming it. Run gofastr migrate generate, review the migration that adds the key (rows that repeat the key, or leave a key column NULL, must be cleaned up first), and apply it. See gofastr docs migrations, Primary-key changes."
  - change: "crud.CrudHandler.PrimaryKey is []string"
