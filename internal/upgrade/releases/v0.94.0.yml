    guidance: "Replace i18nui.T(ctx, i18nui.KeyPaginationNext) with i18nui.PaginationNext.Text(ctx), and i18nui.TVars(ctx, key, vars) with phrase.Text(ctx, vars). Where TVarsHTML took markup, call i18nui.HTML(ctx, phrase, vars). The catalog keys are unchanged. See gofastr docs i18n."
  - change: "placeholders in component phrases, headless.Strings fields and localentity.Messages are spelled {{name}} instead of {n}, {label} or %s"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework/headless.Strings
        - gofastr/framework/localentity.Messages
      text:
        - glob: "**/*.json"
          match: '([^{]\{[A-Za-z_]+\}[^}]|%s)'
    guidance: "In each locale file and in any headless.Strings or localentity.Messages value you set, write a placeholder as {{name}}: \"{n} selected\" becomes \"{{n}} selected\", \"Remove %s\" becomes \"Remove {{label}}\". An old spelling is shown to the reader as written. i18n.CheckCatalog reports a translation whose placeholders differ from the English."
  - change: "ui.CheckStrings and ui.StringsRefusal are removed; i18n.CheckCatalog checks every phrase, components included"
    breaking: true
    hits: edit
    find:
      uses: [gofastr/framework/ui.CheckStrings, gofastr/framework/ui.StringsRefusal]
    guidance: "Call i18n.CheckCatalog(catalog, locale, i18n.Skip(\"entity.\", \"nav.\")) from a test in the package that wires the app, once per locale, and fail on each issue it returns. See gofastr docs i18n."
  - change: "headless.Strings.MultiSelectRemoveLabel is removed; the multi-select chip's remove control uses RemoveLabelled"
    breaking: true
    hits: edit
    find:
      uses: [gofastr/framework/headless.Strings.MultiSelectRemoveLabel]
    guidance: "Set RemoveLabelled (\"Remove {{label}}\") instead. It names the tag input's remove control too."
  - change: "localentity.DefaultMessages is removed; an empty localentity.Messages field uses the localentity.* phrase in the reader's locale"
    breaking: true
    hits: edit
    find:
      uses: [gofastr/framework/localentity.DefaultMessages]
    guidance: "Set only the Messages fields you change and leave the rest empty. To change a default for every locale, translate its localentity.* key in your catalog."
  - change: "entityui.AccessDeniedTitle is an i18n.Phrase instead of a string constant"
    breaking: true
    hits: edit
    find:
      shapes:
        - symbol: gofastr/framework/entityui.AccessDeniedTitle
          type: '^untyped string$'
    guidance: "Use entityui.AccessDeniedTitle.Text(ctx) for the reader's locale, or .English() in a test that compares the English."
  - change: "ui.ShortcutList and uinoderender.New take a context first"
    breaking: true
    hits: edit
    find:
      shapes:
        - symbol: gofastr/framework/ui.ShortcutList
          type: '^func\(items \[\]ui\.ShortcutItem\) render\.HTML$'
        - symbol: gofastr/framework/uihost/uinoderender.New
          type: '^func\(resolve uinoderender\.ActionResolver\) \*uinoderender\.Renderer$'
    guidance: "Pass the request context: ui.ShortcutList(r.Context(), items), uinoderender.New(r.Context(), resolve). The context picks the locale the words are written in."
  - change: "ui.LightboxConfig.Ctx and ui.ConfirmActionConfig.Ctx are removed; the mounted widget says its words in each request's locale"
    breaking: true
    hits: edit
    find:
      fields:
        - field: gofastr/framework/ui.LightboxConfig.Ctx
        - field: gofastr/framework/ui.ConfirmActionConfig.Ctx
    guidance: "Delete the Ctx line. The widget is mounted once, and its dialog renders with the context of the request that shows it, so the labels already follow the reader."
  - change: "app.App.LangForPath, app.App.SkipLabelForPath and uihost.UIHost.LangForPath are LangFor(ctx, path) and SkipLabelFor(ctx, path); with no route rule the language is the request's negotiated locale before the app's default"
    breaking: true
    hits: edit
    find:
      uses:
        - gofastr/core-ui/app.App.LangForPath
        - gofastr/core-ui/app.App.SkipLabelForPath
        - gofastr/framework/uihost.UIHost.LangForPath
    guidance: "Pass the request context: a.LangFor(r.Context(), path), a.SkipLabelFor(r.Context(), path). A page whose locale was negotiated from Accept-Language or a cookie now declares that language on <html lang> and dir."
  - change: "i18n.PluralRule and Translator.RegisterPluralRule are removed; plural categories come from CLDR for every locale"
    breaking: true
    hits: edit
    find:
      uses:
        - gofastr/core/i18n.PluralRule
        - gofastr/core/i18n.Translator.RegisterPluralRule
    guidance: "Delete the registration. The CLDR rule for the locale applies on its own; write the catalog's plural forms under the CLDR category names (one, few, many, other). See gofastr docs i18n."
  - change: "framework components write numbers, dates and times in the reader's locale: counts group digits (4,820), timestamps read Mar 5, 2026, 2:05 PM, and a stepper's or counter's number attributes carry the formatted value"
    breaking: true
    nodetect: "the change is in rendered markup; only tests or scrapers that compare it notice"
    guidance: "Update assertions that matched the raw digits or the old layout. Format your own values with i18n.Number, i18n.Date and i18n.DateTime so they match."
  - change: "kit CSS uses logical properties (inset-inline-start, margin-inline-end, text-align: start) and mirrors on dir=\"rtl\" pages"
    breaking: true
    nodetect: "the change is in the kit's stylesheets; an app's override lives in its own CSS"
    guidance: "An owned style sheet that overrides a kit side with a physical property (left, margin-right) now lands on the wrong side in a right-to-left locale; spell it with the logical property. TooltipLeft and TooltipRight mean start and end."
  - change: "print.Battery.PrintLink takes the request context first: PrintLink(ctx, doc, params, label); an empty label is \"Print\" in the reader's language"
    breaking: true
    hits: edit
    find:
      shapes:
        - symbol: gofastr/battery/print.Battery.PrintLink
          type: '^func\(docName string, params map\[string\]string, label string\) render\.HTML$'
    guidance: "Pass the request context: pb.PrintLink(r.Context(), \"invoice\", params, label)."
  - change: "app.ScreenTitler and app.ScreenDescriber take the request context: ScreenTitle(ctx context.Context) string and ScreenDescription(ctx context.Context) string"
    breaking: true
    hits: edit
    find:
      shapes:
        - symbol: gofastr/core-ui/app.ScreenTitler.ScreenTitle
          type: '^func\(\) string$'
        - symbol: gofastr/core-ui/app.ScreenDescriber.ScreenDescription
          type: '^func\(\) string$'
    guidance: "Add the parameter: func (s *HelpScreen) ScreenTitle(ctx context.Context) string. A screen still declaring ScreenTitle() string or ScreenDescription() string panics when it is registered, naming the type, so the app does not boot until it moves. To translate it, return a phrase: helpTitle.Text(ctx). App.Register reads it once with a bare context, which gives the English, for the route table."
  - change: "uihost.ScreenSEO and uihost.ScreenSchema take the request context: ScreenSEO(ctx context.Context) uihost.SEO and ScreenSchema(ctx context.Context) []seo.Thing"
    breaking: true
    hits: edit
    find:
      shapes:
