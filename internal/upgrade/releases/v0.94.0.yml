    guidance: "Mount entityui's SavedViewsHandler at \"POST <write base>/_views/_delete\"; the delete form now carries the view's id in its query string. A path id would collide with a composite key's record routes, <write base>/{a}/{b}/_restore."
  - change: "an entity whose field's WireName is another field's column name panics at Define"
    breaking: true
    nodetect: "the clash is between two values in one EntityConfig; Define names both fields at boot"
    guidance: "Rename one of the two: give the column a name no field publishes as, or pick another WireName. A body naming the column wrote the field whose wire key it is."
  - change: "a record id for an integer key column answers 404 unless it is canonical decimal (01, +1 and 1.0 no longer name the row keyed 1)"
    breaking: true
    nodetect: "the change is in how a request path or batch item is read; the spelling lives in clients, not the app"
