    guidance: "Key on a String, Int, Enum or UUID column instead: store a date key as its ISO text in a String column, or keep a generated id and enforce the natural key with a unique index."
  - change: "App.View with Columns panics, and admin Config.Entities fails Init, on a key column of a type Define refuses (a RawType other than an integer type, a date, a float, ...)"
