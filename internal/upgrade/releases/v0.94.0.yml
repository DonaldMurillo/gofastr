    guidance: "Write ForeignKey: []string{\"author_id\"} in a Relation literal; entity.BelongsTo, HasOne and HasMany take the columns as before. Read rel.ForeignKey as a list: one column per key column of the end it references. In a raw table, write {Columns: []string{\"user_id\"}, RefTable: \"users\"}. See gofastr docs entity-declarations, Relations and composite keys."
