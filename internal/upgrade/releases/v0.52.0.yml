version: v0.52.0
title: Review sweep — row-reachability parity, trusted IR rendering, embed CSRF narrowing
notes:
  - change: Untrusted IR no longer renders action attributes
    breaking: true
    hits: review
    guidance: "core-ui/noderender's RenderNode/RenderKind now strip data-action, data-action-*, and data-param-*, and refuse data-island — frag/boot.js turns those into a __gofastr.trigger() call, so an untrusted tree naming them picks the action and its arguments. First-party IR (the blueprint generator's) must call RenderTrustedNode/RenderTrustedKind instead; on RenderNode it still renders, silently inert."
    find:
      uses:
        - gofastr/core-ui/noderender.RenderNode
        - gofastr/core-ui/noderender.RenderKind
  - change: Versions of one entity must agree on row reachability
    breaking: true
    hits: review
    guidance: "MultiTenant, OwnerField, SoftDelete, Public, Access, and CrossOwnerRead must match across every version of one entity name, or registration panics. The versions share one physical table, so the weaker version was a bypass of the stronger. Per-version Hidden/WireName/ReadOnly still vary freely — column projection is presentation, row reachability is authorization."
    find:
      uses:
        - gofastr/framework.App.GroupEntity
  - change: The embed CSRF path exemption covers safe methods only
    breaking: true
    hits: review
    guidance: "It exempted the whole /__gofastr/embed/ prefix; the framework mounts exactly two GET routes there. A host that added its own POST under that prefix and relied on the exemption must now send the CSRF token."
    find:
      strings:
        match: '__gofastr/embed/'
  - change: A pattern redirect that covers an exact screen panics at registration
    breaking: true
    hits: review
    guidance: "RedirectScreen(\"/old/{x}\", ...) beside a screen at /old/special now panics in either registration order, like every other route collision. It used to register cleanly and 308 the screen away forever with no diagnostic. Narrow the redirect's constraint, or drop the screen."
    find:
      uses:
        - gofastr/core-ui/app.App.RedirectPattern
  - change: A custom magic-link ConfirmPage must render ConfirmPageData.CSRFField
    breaking: true
    hits: review
    guidance: "Omit it and the confirmation button 403s under auth.CSRF(), which WithBFFPosture mounts app-wide — passwordless sign-in stops at the confirm step. Render render.HTML(d.CSRFField) inside the form. ConfirmPageData carries no request, so this field is the only way to reach the _csrf input."
    find:
      fields:
        - field: gofastr/battery/auth.MagicLinkConfig.ConfirmPage
  - change: Generated SDK manifests carry SchemaVersion 2
    breaking: false
    guidance: "The route-group prefix left the schema-hash identity, so a manifest written by an older gofastr cannot match a hash computed now. Re-run `gofastr generate sdk`; until then sdkdocs reports unknown provenance rather than drift."
    nodetect: the stale artifact is a generated SDK manifest; regenerate it
  - change: SSEBrokerConfig.Principal decides who may evict a subscriber id
    breaking: false
    guidance: "The old default keyed on RemoteAddr's host, which behind any reverse proxy is the proxy for every request — so ?subscriber_id=<victim> dropped a stranger's stream. Left nil the broker now evicts nothing, which is the right default. Set Principal to something the caller cannot choose (a session user id) if you rely on same-id reconnect replacing the previous entry."
    find:
      uses:
        - gofastr/core/stream.SSEBrokerConfig
