version: v0.87.0
title: Layer prefixes, headless form and toast hooks, docs tools opt-in, XS shadow and stroke tokens
notes:
  - change: "the framework_docs_list / framework_docs_get / framework_docs_search MCP tools moved out of framework.WithMCPIntrospection into framework/docs/mcptools, registered through the new framework.WithMCPTools option; package framework no longer imports the docs corpus"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework.WithMCPIntrospection
    guidance: "Add framework.WithMCPTools(mcptools.Register) beside WithMCPIntrospection() (import github.com/DonaldMurillo/gofastr/framework/docs/mcptools) where agents on /mcp used the framework_docs_* tools; leave it out to keep the docs corpus out of the binary. An app that only ever had the tools through gofastr dev has no WithMCPIntrospection call and is not listed: add the option there too if its agents read the docs."
  - change: "every kernel attribute is data-cui-* and every class core-ui mints is cui-*: the data-fui-* keys the runtime read (data-fui-rpc, data-fui-open, data-fui-signal, data-fui-comp, data-fui-toast-stack, …), their dataset camelCase reads, and the fui-widget / fui-slot / fui-pos-* / fui-panel / fui-backdrop / fui-hidden / fui-reveal / fui-dropdown / fui-section-menu / fui-flash / fui-loading / fui-sse-* / fui-css-* / fui-vt-* / fui-intercept / fui-render-error / fui-screen-group / fui-route-announce / fui-theme-<hash> classes, the enter animations and the fui-backtotop-sentinel / fui-nav-toast / fui-toast-fallback singletons are renamed; the framework's own modules keep data-fui-lightbox*, data-fui-zoomed, data-fui-dropzone-preview*, data-fui-pane*, data-fui-z-tier, data-fui-network-retry-*, data-fui-plugin* and data-fui-page-loading, and fui-* classes stay framework/ui's"
    breaking: true
    hits: edit
    find:
      strings:
        attrs: [data-fui-action, data-fui-activelink, data-fui-activelink-skip, data-fui-after, data-fui-animate-class, data-fui-animate-signal, data-fui-area, data-fui-autogrow, data-fui-backdrop, data-fui-banner-dismiss-id, data-fui-borne, data-fui-bundle, data-fui-charcount-source, data-fui-clear-on-esc, data-fui-comp, data-fui-comp-extra, data-fui-compute, data-fui-computed, data-fui-computed-deps, data-fui-confirm, data-fui-copy-text-from, data-fui-ctx, data-fui-deeplink, data-fui-derived, data-fui-disable-when-invalid, data-fui-doc, data-fui-drag-dismiss, data-fui-drag-handle, data-fui-dragging, data-fui-dropdown, data-fui-dropdown-open, data-fui-dropdown-panel, data-fui-dropdown-wrap, data-fui-embed-state, data-fui-fill, data-fui-fill-input, data-fui-fill-text, data-fui-flash-duration-ms, data-fui-flash-on-update, data-fui-intercept-as, data-fui-intercept-close, data-fui-intercept-overlay, data-fui-internal, data-fui-island, data-fui-lang, data-fui-layout, data-fui-layout-key, data-fui-layout-slot, data-fui-loading, data-fui-loadstate, data-fui-match-prefix, data-fui-min, data-fui-nav, data-fui-open, data-fui-optimistic-, data-fui-os, data-fui-outlet, data-fui-persist-storage, data-fui-poll, data-fui-poll-src, data-fui-popover-anchor, data-fui-popover-side, data-fui-popover-trigger, data-fui-prefetch, data-fui-push-state, data-fui-reveal, data-fui-rpc, data-fui-rpc-, data-fui-scope, data-fui-scopey, data-fui-screen-group, data-fui-scroll-bottom-on-update, data-fui-shortcut-target, data-fui-sidebar-storage, data-fui-signal, data-fui-signal-attr, data-fui-signal-inc, data-fui-signal-mode, data-fui-signal-set, data-fui-signal-toggle, data-fui-skip-label, data-fui-spa, data-fui-static, data-fui-static-options, data-fui-style, data-fui-submit-on-enter, data-fui-tab-index, data-fui-tick-elapsed, data-fui-toast, data-fui-toast-fallback, data-fui-toast-id, data-fui-toast-stack, data-fui-toggle-, data-fui-trusted, data-fui-vt, data-fui-vt-kinds, data-fui-vt-when, data-fui-widget, data-fui-window-drag]
        classes: [fui-widget, fui-widget-drag-handle, fui-slot, fui-slot-bare, fui-pos-bottom, fui-pos-bottom-center, fui-pos-bottom-left, fui-pos-bottom-right, fui-pos-center, fui-pos-edge-left, fui-pos-edge-right, fui-pos-top, fui-pos-top-center, fui-pos-top-left, fui-pos-top-right, fui-panel, fui-backdrop, fui-backdrop-in, fui-hidden, fui-reveal, fui-reveal-fade-up, fui-revealed, fui-dropdown, fui-dropdown-open, fui-dropdown-panel, fui-dropdown-wrap, fui-section-menu, fui-flash, fui-loading, fui-sse-up, fui-sse-down, fui-intercept, fui-intercept-in, fui-intercept-overlay, fui-render-error, fui-screen-group, fui-route-announce, fui-top-in, fui-bottom-in, fui-edge-left-in, fui-edge-right-in, fui-overlay-scale-in, fui-vt-fade-in, fui-vt-fade-out, fui-vt-slide-in, fui-vt-slide-in-b, fui-vt-slide-out, fui-vt-slide-out-b, fui-backtotop-sentinel, fui-nav-toast, fui-toast-fallback]
        match: '(?:^|[^-a-zA-Z0-9_])fui-(?:css-[a-z0-9]|theme-[0-9a-f]{8})'
      css:
        classes: [fui-widget, fui-widget-drag-handle, fui-slot, fui-slot-bare, fui-pos-bottom, fui-pos-bottom-center, fui-pos-bottom-left, fui-pos-bottom-right, fui-pos-center, fui-pos-edge-left, fui-pos-edge-right, fui-pos-top, fui-pos-top-center, fui-pos-top-left, fui-pos-top-right, fui-panel, fui-backdrop, fui-backdrop-in, fui-hidden, fui-reveal, fui-reveal-fade-up, fui-revealed, fui-dropdown, fui-dropdown-open, fui-dropdown-panel, fui-dropdown-wrap, fui-section-menu, fui-flash, fui-loading, fui-sse-up, fui-sse-down, fui-intercept, fui-intercept-in, fui-intercept-overlay, fui-render-error, fui-screen-group, fui-route-announce, fui-top-in, fui-bottom-in, fui-edge-left-in, fui-edge-right-in, fui-overlay-scale-in, fui-vt-fade-in, fui-vt-fade-out, fui-vt-slide-in, fui-vt-slide-in-b, fui-vt-slide-out, fui-vt-slide-out-b, fui-backtotop-sentinel, fui-nav-toast, fui-toast-fallback]
      text:
        - glob: "**/*.js"
          match: 'data-fui-(?:scroll-bottom-on-update|disable-when-invalid|banner-dismiss-id|flash-duration-ms|intercept-overlay|charcount-source|activelink-skip|flash-on-update|intercept-close|persist-storage|popover-trigger|shortcut-target|sidebar-storage|submit-on-enter|animate-signal|copy-text-from|dropdown-panel|popover-anchor|static-options|toast-fallback|animate-class|computed-deps|dropdown-open|dropdown-wrap|signal-toggle|clear-on-esc|drag-dismiss|intercept-as|match-prefix|popover-side|screen-group|tick-elapsed|drag-handle|embed-state|layout-slot|signal-attr|signal-mode|toast-stack|window-drag|activelink|comp-extra|fill-input|layout-key|optimistic|push-state|signal-inc|signal-set|skip-label|fill-text|loadstate|tab-index|autogrow|backdrop|computed|deeplink|dragging|dropdown|internal|poll-src|prefetch|toast-id|vt-kinds|compute|confirm|derived|loading|trusted|vt-when|action|bundle|island|layout|outlet|reveal|scopey|signal|static|toggle|widget|after|borne|scope|style|toast|area|comp|fill|lang|open|poll|ctx|doc|min|nav|rpc|spa|os|vt)(?:[^a-z0-9]|$)'
        - glob: "**/*.html"
          match: 'data-fui-(?:scroll-bottom-on-update|disable-when-invalid|banner-dismiss-id|flash-duration-ms|intercept-overlay|charcount-source|activelink-skip|flash-on-update|intercept-close|persist-storage|popover-trigger|shortcut-target|sidebar-storage|submit-on-enter|animate-signal|copy-text-from|dropdown-panel|popover-anchor|static-options|toast-fallback|animate-class|computed-deps|dropdown-open|dropdown-wrap|signal-toggle|clear-on-esc|drag-dismiss|intercept-as|match-prefix|popover-side|screen-group|tick-elapsed|drag-handle|embed-state|layout-slot|signal-attr|signal-mode|toast-stack|window-drag|activelink|comp-extra|fill-input|layout-key|optimistic|push-state|signal-inc|signal-set|skip-label|fill-text|loadstate|tab-index|autogrow|backdrop|computed|deeplink|dragging|dropdown|internal|poll-src|prefetch|toast-id|vt-kinds|compute|confirm|derived|loading|trusted|vt-when|action|bundle|island|layout|outlet|reveal|scopey|signal|static|toggle|widget|after|borne|scope|style|toast|area|comp|fill|lang|open|poll|ctx|doc|min|nav|rpc|spa|os|vt)(?:[^a-z0-9]|$)'
        - glob: "**/*.js"
          match: '(?:^|[^-a-zA-Z0-9_])fui-(?:backtotop-sentinel|widget-drag-handle|intercept-overlay|pos-bottom-center|overlay-scale-in|pos-bottom-right|pos-bottom-left|dropdown-panel|pos-edge-right|pos-top-center|reveal-fade-up|route-announce|toast-fallback|vt-slide-out-b|dropdown-open|dropdown-wrap|edge-right-in|pos-edge-left|pos-top-right|vt-slide-in-b|edge-left-in|intercept-in|pos-top-left|render-error|screen-group|section-menu|vt-slide-out|backdrop-in|vt-fade-out|vt-slide-in|pos-bottom|pos-center|vt-fade-in|bottom-in|intercept|nav-toast|slot-bare|backdrop|dropdown|revealed|sse-down|loading|pos-top|hidden|reveal|sse-up|top-in|widget|flash|panel|slot|css-[a-z0-9]|theme-[0-9a-f]{8})(?:[^a-z0-9_-]|$)'
        - glob: "**/*.html"
          match: '(?:^|[^-a-zA-Z0-9_])fui-(?:backtotop-sentinel|widget-drag-handle|intercept-overlay|pos-bottom-center|overlay-scale-in|pos-bottom-right|pos-bottom-left|dropdown-panel|pos-edge-right|pos-top-center|reveal-fade-up|route-announce|toast-fallback|vt-slide-out-b|dropdown-open|dropdown-wrap|edge-right-in|pos-edge-left|pos-top-right|vt-slide-in-b|edge-left-in|intercept-in|pos-top-left|render-error|screen-group|section-menu|vt-slide-out|backdrop-in|vt-fade-out|vt-slide-in|pos-bottom|pos-center|vt-fade-in|bottom-in|intercept|nav-toast|slot-bare|backdrop|dropdown|revealed|sse-down|loading|pos-top|hidden|reveal|sse-up|top-in|widget|flash|panel|slot|css-[a-z0-9]|theme-[0-9a-f]{8})(?:[^a-z0-9_-]|$)'
        - glob: "**/*.js"
          match: 'dataset\.fui(?:Comp|RpcAfterDone|Scope)\b'
    guidance: "Rename data-fui-<name> to data-cui-<name> and dataset.fui<Name> to dataset.cui<Name> for every kernel key, and fui-<name> to cui-<name> for the kernel's classes and singletons (the ownership table is core-ui/ARCHITECTURE.md, \"Who owns which prefix\"); the kept framework-module keys and framework/ui's own fui-* classes are untouched."
  - change: "the kernel's copy module marks a successful copy data-hui-copy-state=\"done\" and no longer sets the fui-copied class; its form-errors module places messages by the data-hui-field / data-hui-field-error / data-hui-choice hooks instead of naming kit classes"
    breaking: true
    hits: edit
    find:
      strings:
        classes: [fui-copied]
      css:
        classes: [fui-copied]
      text:
        - glob: "**/*.js"
          match: '(?:^|[^-a-zA-Z0-9_])fui-copied(?:[^a-z0-9_-]|$)'
        - glob: "**/*.html"
          match: '(?:^|[^-a-zA-Z0-9_])fui-copied(?:[^a-z0-9_-]|$)'
    guidance: "Style or read [data-hui-copy-state=\"done\"] instead of .fui-copied; a bare input outside ui.FormField gets its refused-submission message after a data-hui-field-error node, so a sheet keyed on the old module-placed markup moves to the hooks."
  - change: "runtime toasts are cloned from the kit's registered template inside a host-guaranteed stack: the headless-feedback module no longer mounts the fui-toast-stack-auto singleton, and a dismissed row is marked data-hui-toast-leaving instead of the is-leaving class"
    breaking: true
    hits: edit
    find:
      strings:
        classes: [fui-toast-stack-auto]
      css:
        classes: [fui-toast-stack-auto]
      text:
        - glob: "**/*.js"
          match: '(?:^|[^-a-zA-Z0-9_])fui-toast-stack-auto(?:[^a-z0-9_-]|$)'
        - glob: "**/*.html"
          match: '(?:^|[^-a-zA-Z0-9_])fui-toast-stack-auto(?:[^a-z0-9_-]|$)'
    guidance: "Mount a stack (ui.ToastSlot, or let framework/uihost mount uihost.DefaultToastStack) instead of styling or querying .fui-toast-stack-auto, and key leaving-row CSS on [data-hui-toast-leaving]."
  - change: "ui.CopyButtonConfig.Target is an element id (a leading # is accepted); a value holding selector characters is refused at render"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework/ui.CopyButtonConfig.Target
    guidance: "Give Target the id of the element to copy (the headless copy module has resolved it with getElementById since v0.86.0, where a selector silently copied nothing); a Target such as \".snippet pre\" now panics at render, so put an id on that element."
  - change: "style.ShadowSet gains an XS token (--shadow-xs) and Validate requires it like the other shadow steps: a theme that builds its ShadowSet field by field instead of starting from style.DefaultTheme() is refused at boot with \"Theme.Shadows.XS: Shadow.Value is empty (Name=\\\"xs\\\")\" (the theme.go that gofastr theme init and theme edit write names it through style.AutoFillNames), or \"Theme.Shadows.XS: Shadow.Name is empty\" when nothing names it"
    breaking: true
    hits: review
    find:
      fields:
        - field: gofastr/core-ui/style.ShadowSet.SM
    guidance: "Where a ShadowSet is built field by field (every theme.go an earlier gofastr theme init or theme edit wrote is), add XS: style.Shadow{Name: \"xs\", Value: \"0 1px 2px 0 rgba(0,0,0,0.05)\"} (or copy style.DefaultTheme().Shadows.XS). A ShadowSet literal that already sets XS, and a theme that starts from style.DefaultTheme() and overrides single steps, need nothing."
  - change: "the owned-style check (gofastr gen styles, gofastr verify) reads border-width, outline-width, outline-offset and column-rule-width against the new --stroke-* tokens: a .style.css declaration such as outline-offset: 2px or border-width: 1px, which every siteheader, sitefooter and docpage sheet the blueprint wrote carries, is a GOFASTR1807 error and stops that sheet's Go being generated"
    breaking: true
    hits: edit
    find:
      strings:
        match: '(?:^|[^-a-z])(?:outline-offset|outline-width|column-rule-width|border(?:-(?:top|right|bottom|left|inline|block)(?:-(?:start|end))?)?-width)\s*:\s*[12]px\s*(?:;|\}|!|$)'
    guidance: "The hit is the checked CSS constant in <name>_style.gen.go; fix its <name>.style.css source. Write outline-offset: var(--stroke-focus-offset), a 1px width as var(--stroke-thin) and a 2px border width as var(--stroke-thick) (an outline: 2px solid … reads var(--stroke-focus) solid …), then re-run gofastr gen styles. A 1px solid border shorthand passes the check, but reading var(--stroke-thin) solid lets a theme's line weight reach it."
  - change: "the owned-style check (gofastr gen styles, gofastr verify) reads line-height, letter-spacing and opacity against the new --leading-*, --tracking-* and --opacity-* tokens: a .style.css declaration whose value is one of theirs, such as line-height: 1.6 or letter-spacing: -0.01em, which the sitefooter and siteheader sheets the blueprint wrote carry, is a GOFASTR1807 error and stops that sheet's Go being generated"
    breaking: true
    hits: edit
    find:
      strings:
        match: '(?:^|[^-a-z])(?:line-height\s*:\s*1\.[2456]|letter-spacing\s*:\s*(?:-0\.0[123]|0\.0[48])em|opacity\s*:\s*0?\.[256])\s*(?:;|\}|!|$)'
    guidance: "The hit is the checked CSS constant in <name>_style.gen.go; fix its <name>.style.css source. Write line-height 1.2 / 1.4 / 1.5 / 1.6 as var(--leading-tight) / var(--leading-snug) / var(--leading-normal) / var(--leading-relaxed), letter-spacing -0.03em / -0.02em / -0.01em / 0.04em / 0.08em as var(--tracking-tighter) / var(--tracking-tight) / var(--tracking-snug) / var(--tracking-wide) / var(--tracking-wider), and opacity 0.2 / 0.5 / 0.6 as var(--opacity-faint) / var(--opacity-disabled) / var(--opacity-muted), then re-run gofastr gen styles. Other values pass the check."
  - change: "EntityUserStore records email_verified (FALSE for every existing row). A magic link or a completed password reset on an unverified account claims it: OAuth links, API tokens and sessions are removed, and a magic link also clears the password. OAuth auto-links a new provider only into a verified account (409 otherwise). A magic link on an existing account answers 500 when the user store does not implement EmailVerifiedChecker"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/battery/auth.NewMagicLinkPlugin
        - gofastr/battery/auth.NewOAuth2Plugin
        - gofastr/battery/auth.UserStore.CreateUser
    guidance: "Mark every user your own code creates (a seeded admin, an import) verified with EmailVerifier.MarkEmailVerified right after CreateUser, or its first magic link clears its password. Backfill accounts you trust by your own evidence the same way. A custom UserStore used with the magic link plugin implements EmailVerifiedChecker (and EmailVerifier, PasswordClearer)."
  - change: "GET /auth/verify-email verifies only in a browser holding a full session of the account that requested the link: 401 without one (the token stays live), 403 for another account's session"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/battery/auth.NewEmailVerificationPlugin
    guidance: "Tell users to open the verification link in the browser they signed up in; a link opened elsewhere asks them to sign in first."
  - change: "RequireTwoFA judges the request principal, not the first session cookie: it requires a session of that user with the second factor verified, and refuses principals from a JWT or API token"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/battery/auth.TwoFAPlugin.RequireTwoFA
    guidance: "Routes behind RequireTwoFA that JWT or API-token clients call need a session-cookie client, or a separate route without the step-up gate."
  - change: "an Image or File field accepts a relative storage key on a JSON or in-process write only when the same request uploaded it, host code passed it through crud.WithUploadedKeys, or it is already on the row; anything else answers 400"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/core/upload.Handler
        - gofastr/framework/crud.CrudHandler.CreateOne
        - gofastr/framework/crud.CrudHandler.UpdateOne
        - gofastr/framework/crud.CrudHandler.UpsertOne
        - gofastr/framework/crud.TypedQuery.UpdateAll
    guidance: "Upload through the entity's multipart route instead of PATCHing a key from upload.Handler, or wrap the write's context in crud.WithUploadedKeys(ctx, keys...) with the keys your own code just saved. Never pass keys read from request data. TypedQuery.UpdateAll has no single current row, so it refuses even a key the matched rows already hold: leave the field out of the update, or pass the key through WithUploadedKeys."
  - change: "upload.Handler caps a body at upload.DefaultMaxSize (32 MiB) when Config.MaxSize is zero or negative, instead of accepting any size"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/core/upload.Handler
    guidance: "Set Config.MaxSize explicitly where uploads larger than 32 MiB are expected."
  - change: "X-Forwarded-For is read from the right: the client is the rightmost hop that is not a trusted proxy. With no TrustedProxies set, the immediate peer is taken to be the one proxy and the rightmost entry is the client"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework/ratelimit.Config.TrustForwardedFor
        - gofastr/core/middleware.RateLimitConfig.TrustProxyHeaders
    guidance: "Behind more than one proxy tier (a CDN in front of a load balancer), list every tier in TrustedProxies (framework/ratelimit.Config or core/middleware.RateLimitConfig); otherwise every client shares the inner proxy's bucket."
  - change: "the /.debug endpoints answer 401 without a user, 403 to an embed grant, and otherwise require the admin role; framework.WithDebugAuthorize replaces the role check"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework.AppConfig.DebugEndpoints
    guidance: "Give the operators who read /.debug/stats the admin role, or install framework.WithDebugAuthorize(fn) with your own check."
  - change: "a server action compiled from a screen runs that screen's Policy chain first and answers 403 (or a Block decision's status) when the policy refuses. The policy sees the route params of the page the runtime names in the action body, and none when that page is not one of the screen's"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/core-ui/app.Screen.WithPolicy
    guidance: "A policy that reads a route param works unchanged for actions sent by the shipped runtime. Hand-written calls to /__gofastr/action must send the page path as page, or the policy sees an empty param and refuses. Per-record checks stay in the action handler: the client chooses the page."
  - change: "an embed grant reaches only the runtime endpoints uihost mounts under /__gofastr (not the whole namespace), and never a prefix an EmbedReserving battery reserves; a grant's scopes also bind ?include=, ?rel.field= filters and cascade writes, so a grant with no scopes cannot include or filter across relations over HTTP"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework/embed.Host.Middleware
    guidance: "Declare the scopes a surface's grants need for the relations its HTTP calls include (\"<table>:read\") or cascade-write (\"<table>:write\"), and add a Reach entry for any other /__gofastr route an embed must call."
  - change: "a scoped API token needs \"<table>:read\" for each entity it reaches through ?include= or ?rel.field= filters, and \"<table>:write\" for each child a cascade write touches; RequireAPIScopes still checks only the entity in the path"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/battery/auth.RequireAPIScopes
    guidance: "Mint integration tokens with the scopes of every related entity their requests include, filter on or cascade-write."
  - change: "an entity declared CRUD:false (auth.UserEntityConfig included) is no longer reachable over HTTP through another entity's ?include=, ?rel.field= filters or cascade writes: includes and filters answer 403, cascades not found"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/battery/auth.UserEntityConfig
    guidance: "Expose what clients need from such an entity through a custom route or a projection entity; in-process reads (ListAll, GetOne, EagerLoad) are unaffected."
