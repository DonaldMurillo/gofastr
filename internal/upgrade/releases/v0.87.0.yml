version: v0.87.0
title: Layer prefixes, headless form and toast hooks, docs tools opt-in, XS shadow and stroke tokens
notes:
  - change: "the framework_docs_list / framework_docs_get / framework_docs_search MCP tools moved out of framework.WithMCPIntrospection into framework/docs/mcptools, registered through the new framework.WithMCPTools option; package framework no longer imports the docs corpus"
    breaking: true
    hits: review
    find:
      uses:
        - gofastr/framework.WithMCPIntrospection
    guidance: "Add framework.WithMCPTools(mcptools.Register) beside WithMCPIntrospection() (import github.com/DonaldMurillo/gofastr/framework/docs/mcptools) where agents on /mcp used the framework_docs_* tools; leave it out to keep the docs corpus out of the binary. An app that only ever had the tools through gofastr dev has no WithMCPIntrospection call and is not listed: add the option there too if its agents read the docs."
  - change: "every kernel attribute is data-cui-* and every class core-ui mints is cui-*: the data-fui-* keys the runtime read (data-fui-rpc, data-fui-open, data-fui-signal, data-fui-comp, data-fui-toast-stack, …), their dataset camelCase reads, and the fui-widget / fui-slot / fui-pos-* / fui-panel / fui-backdrop / fui-hidden / fui-reveal / fui-dropdown / fui-section-menu / fui-flash / fui-loading / fui-sse-* / fui-css-* / fui-vt-* / fui-intercept / fui-render-error / fui-screen-group / fui-route-announce / fui-theme-<hash> classes, the enter animations and the fui-backtotop-sentinel / fui-nav-toast / fui-toast-fallback singletons are renamed; the framework's own modules keep data-fui-lightbox*, data-fui-zoomed, data-fui-dropzone-preview*, data-fui-pane*, data-fui-z-tier, data-fui-network-retry-*, data-fui-plugin* and data-fui-page-loading, and fui-* classes stay framework/ui's"
    breaking: true
    hits: edit
    find:
      strings:
