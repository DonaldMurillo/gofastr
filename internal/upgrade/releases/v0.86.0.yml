    guidance: "SortHrefPattern becomes Query url.Values (the request state a sort carries) with optional Path, SortParam and DirParam; IslandSignal + IslandEndpoint become Island: headless.Island{Endpoint, Signal}. The island sort control is an <a> in both postures (th a.fui-data-table__sort), and the stylesheet draws the direction glyph from aria-sort."
