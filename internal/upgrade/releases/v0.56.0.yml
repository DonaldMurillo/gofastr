version: v0.56.0
title: Windows support and the pure-Go SQLite swap
notes:
  - change: The sqlite3 driver is modernc.org/sqlite, not mattn/go-sqlite3
    breaking: true
    hits: edit
    guidance: "Import _ \"github.com/DonaldMurillo/gofastr/sqlite/stdlib\" and drop mattn/go-sqlite3 — it needs cgo, which is why CGO_ENABLED=0 builds failed. Whichever package registers the sqlite3 name first wins, so keeping the mattn import silently keeps cgo. Timestamps bind with _time_format=sqlite, byte-identical to what mattn wrote, so existing database files need no migration."
    find:
      imports:
        - github.com/mattn/go-sqlite3
  - change: "sql.Open with the sqlite driver name no longer reaches the in-repo engine"
    breaking: true
    guidance: "github.com/DonaldMurillo/gofastr/sqlite now registers itself as gofastr-sqlite; the sqlite name belongs to modernc. Open gofastr-sqlite if you specifically want the in-repo engine, otherwise use sqlite3: a caller that keeps the bare name has silently swapped engines."
    nodetect: "the sqlite name still opens a working driver (modernc, which gofastr/sqlite imports); only the engine behind it changed, and the string is also an app's own driver alias (a DB_DRIVER default, a switch case) far more often than a sql.Open argument, so no spelling tells a swapped engine from a correct one"
  - change: Boolean columns serialize as true/false in CRUD JSON
    breaking: true
    hits: review
    guidance: "On mattn a BOOLEAN column came back as 0/1; it is now true/false. Clients testing row.field === 1 must compare against true. Apps that ran on the in-repo pure engine already saw true/false and need no change. Every entity below declares a boolean field whose JSON shape changes."
    find:
      uses:
        - gofastr/core/schema.Bool
  - change: New storage keys must be portable to Windows
    breaking: true
    hits: review
    guidance: "LocalStorage.Save rejects key components containing ':', ending in a space or dot, or naming a reserved device (CON, NUL, LPT1, ...) so a store written on Unix can be served from Windows. Get, Exists and Delete still accept those keys, so objects written by earlier releases stay readable and removable. Rename them at your convenience; path-traversal rules are unchanged."
    find:
      uses:
        - gofastr/battery/storage.NewLocalStorage
        - gofastr/framework.WithFileStorage
  - change: Repeated markdown headings get distinct ids
    breaking: true
    hits: review
    guidance: "A second '## Setup' renders id=\"setup-2\" instead of a duplicate id=\"setup\". Anchor links pointing at the later of two identically-named headings change target."
    find:
      uses:
        - gofastr/core/markdown.Render
        - gofastr/core/markdown.RenderHTML
