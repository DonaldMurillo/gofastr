version: v0.77.0
title: menu submenus and radio rows, per-entity widget chrome, boot-time internal-link check
notes:
  - change: new opt-in surfaces - ui.MenuItem.Children/Radio/Checked/ID (submenus and menuitemradio rows), TabsConfig.StateAttrs/ID/VacateHidden, data-fui-ctx per-entity widget chrome read via widget.ChromeContext, UIHost.PageHandler, the ScreenStatusCode interface, Screen.NoSPA and data-fui-nav="off", data-skip-link
    breaking: false
    guidance: "All additive and opt-in; every zero value keeps the prior output byte-identical. A submenu parent is a disclosure only - Children alongside Href, RPC, or Radio panics at render time, and MenuItem.ExtraAttrs still drops id (the ID field owns it)."
    nodetect: "all additive and opt-in; every zero value keeps the prior output"
  - change: BEHAVIOUR - Escape now closes only the innermost open disclosure instead of every open one on the page, so nested chrome (a mobile drawer around an expanded nav group) takes one Escape per level
    breaking: false
    guidance: "Intended per-level contract, reached through the shared data-fui-disclosure machinery; no config to restore the old close-all behaviour. Focus outside any open disclosure still closes all of them."
    nodetect: "intended per-level contract; no config restores the old close-all behaviour"
  - change: uihost.WithStrict now fails boot when the site chrome links to a path nothing serves, and StrictConfig.InternalLinks defaults to enforce
    breaking: false
    guidance: "Runs after the last route registration, so a working link is never flagged; a catch-all GET route satisfies it unverified. A failing boot names each dead href - register its screen, fix the link, add the path to ExemptScreens, or set InternalLinks to warn/off."
    find:
      uses:
        - gofastr/framework/uihost.WithStrict
  - change: gofastr pack and gofastr generate output changes - the pack serializer no longer drops middleware/plugins/helpers/app.description/app.base_url/app.public_openapi/seed.count/seed.weights/entity renames (and emits corrected key orders), and generated marketing chrome links and auth-gate redirects derive from the blueprint's registered screens instead of literal defaults
    breaking: false
    find:
      config:
        - key: app.description
        - key: app.base_url
        - key: app.public_openapi
        - key: middleware
        - key: plugins
        - key: helpers
        - key: seed.*.count
        - key: seed.*.weights
        - key: entities.*.renames
    guidance: "Fixes for silent data loss and 404 chrome. Regenerating or re-packing an existing blueprint now emits keys that were previously dropped - expect and review the diff rather than treating the new keys as drift."
