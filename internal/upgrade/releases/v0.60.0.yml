version: v0.60.0
title: Layout chains, chain-aware navigation, asset addressing
notes:
  - change: RouteEntry.Layout is now Layouts (layer-key chain) plus Preload
    breaking: true
    hits: edit
    guidance: "Code reading app.RouteEntry.Layout must switch to Layouts — an outermost-to-innermost slice of layer keys (l:<name> / g:<prefix>:<name>). The client manifest field is layouts; cssChunk is gone. Apps that only register screens and layouts compile unchanged."
    find:
      uses:
        - gofastr/core-ui/app.RouteEntry.Layout
  - change: Static export composes the same layout chain as live SSR
    breaking: true
    hits: review
    guidance: "Router.RenderRaw now applies the default layout and no longer double-wraps <main>, so exported HTML for grouped screens changes shape. Snapshot-style assertions over exported files need re-recording; live SSR output for ungrouped screens is unchanged apart from the new data-fui-layout-key/-slot markers."
    find:
      uses:
        - gofastr/core-ui/app.App.RenderScreenRaw
        - gofastr/core-ui/app.Router.RenderRaw
        - gofastr/framework/static.Builder
  - change: Live pages externalize the catalog/module manifest and split actions per screen
    breaking: true
    hits: edit
    guidance: "Anything scraping the inline #gofastr-catalog or #gofastr-runtime-modules blocks on live pages should read window.__gofastr_catalog / window.__gofastr_runtime_modules (set by /__gofastr/manifest.js). /__gofastr/widget/{id}.js now requires a session or embed grant, matching the actions.js concat it replaces."
    find:
      strings:
        match: 'gofastr-catalog|gofastr-runtime-modules|/__gofastr/actions\.js'
      text:
        - glob: "**/*.js"
          match: 'gofastr-catalog|gofastr-runtime-modules|__gofastr/actions\.js'
  - change: style.Contribute freezes at first render
    breaking: true
    hits: review
    guidance: "app.css is composed and content-addressed once per process. A style.Contribute after the first page render logs a warning and does not ship — move contributions to package init or before Mount."
    find:
      uses:
        - gofastr/core-ui/style.Contribute
  - change: Runtime history writes go through __gofastr._pushURL
    breaking: true
    hits: review
    guidance: "Custom client JS that history.pushState()s around the router leaves currentPath stale and breaks scroll restoration plus the stateful-popstate diff. Call __gofastr._pushURL(url) instead; history.state now carries {__fui: <id>}."
    find:
      text:
        - glob: "**/*.js"
          match: 'history\.pushState'
