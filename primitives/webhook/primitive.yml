primitive: webhook
summary: Outbound webhook subscribers and deliveries, inbound envelopes, and the memory and SQL stores behind them.
code:
  - battery/webhook/
docs:
  - framework/docs/content/webhooks.md
twins:
  - job: List or claim due deliveries in the same order.
    why: Memory picks from an in-process map under a mutex. SQL orders database rows, and its claims use engine-specific locking. SQLite and Postgres share the SQL ordering clause.
    sites:
      - path: battery/webhook/memory.go
        note: MemoryStore sorts the due snapshot before applying its limit.
      - path: battery/webhook/sql.go
        note: SQLStore shares the order across the due list, both claim selections, and the Postgres claim result.
  - job: Store a subscriber and read it back with the paused state it was given.
    why: MemoryStore keeps the Subscriber struct, while SQLStore keeps one active column that other replicas read and derives Paused from it on the scan, so the two cannot share the round trip.
    sites:
      - path: battery/webhook/memory.go
        note: MemoryStore, which hands back the struct it was given.
      - path: battery/webhook/sql.go
        note: scanSubscriber, which sets Paused from the active column.
  - job: Retry a settle write that SQLite refuses with a transient SQLITE_BUSY.
    why: Outbound deliveries and inbound envelopes are separate stores over separate tables with their own statements; the retry loop itself is already one function, sqlbusy.Retry, and each store's write has to be wrapped in it where the statement is built.
    sites:
      - path: battery/webhook/sql.go
        note: SQLStore's claim settles (success, retry, dead, release).
      - path: battery/webhook/inbound_sql.go
        note: SQLInboundStore's MarkEnvelopeProcessing, UpdateEnvelope and RegisterDedupeKey.
invariants:
  - id: due-order-is-stable-across-stores
    rule: Due lists and returned claims put unset deadlines first, then order by earliest due instant and break ties by delivery ID in byte order.
    enforced_by:
      - test: battery/webhook.TestDueDeliveryOrderParity
  - id: upgraded-sqlite-stores-compare-utc-instants
    rule: On open, SQLite stores rewrite legacy due, creation, receipt, and update times to the driver's UTC encoding, only while the exact stored value still matches.
    enforced_by:
      - test: battery/webhook.TestLegacyWebhookTimesParity
      - test: battery/webhook.TestSQLiteStoreRewritesZonedDueTimes
  - id: webhook-writes-share-templates
    rule: Each subscriber upsert, delivery insert, and delivery settle uses one SQL template, with dialect-specific bind markers.
    enforced_by:
      - test: battery/webhook.TestWebhookWriteParity
    judge: Does a subscriber upsert, delivery insert, or delivery settle define its statement separately for SQLite and Postgres?
  - id: paused-survives-the-store-round-trip
    rule: A subscriber stored paused reads back paused and inactive from MemoryStore and SQLStore alike, and a Subscribe of the value read back keeps it paused.
    enforced_by:
      - test: battery/webhook.TestPausedSubscriberSurvivesReadModifySubscribe
  - id: settle-writes-retry-sqlite-busy
    rule: Every settle write of the outbound SQLStore and the inbound SQLInboundStore succeeds through a transient SQLITE_BUSY, by way of sqlbusy.Retry.
    enforced_by:
      - test: battery/webhook.TestClaimSettlesRetrySQLiteBusy
      - test: battery/webhook.TestInboundSettlesRetrySQLiteBusy
  - id: stored-response-holds-no-credential
    rule: The response body a delivery stores holds no part of the subscriber's credential, wherever ResponseBodyLimit cuts the body and however often the receiver echoes it, and is never longer than the limit.
    enforced_by:
      - test: battery/webhook.TestDeliveryRedactsCredentialCutByBodyLimit
      - test: battery/webhook.TestDeliveryRedactsRepeatedCredentialEcho
decisions:
  - id: share-outbound-write-statements
    date: 2026-11-20
    status: accepted
    decision: Keep one aliased upsert, one delivery insert column list, and one settle assignment list. Render the bind markers separately so both dialects use the same column and attempt semantics.
    rejected:
      - option: Keep duplicate Postgres and SQLite statements.
        why: Both accept the same SQL once the bind markers are rendered.
    upholds: [webhook-writes-share-templates]
  - id: redact-in-the-body-offsets-before-the-cut
    date: 2026-11-16
    status: accepted
    decision: readResponse reads the limit plus the longest secret, marks every byte a credential covers in the body's own offsets, and writes the first ResponseBodyLimit bytes of the body with each covered run replaced.
    rejected:
      - option: Cut the body at the limit and redact what is left.
        why: A credential that straddles the limit is cut to a prefix that no longer equals the secret, so the prefix is stored.
      - option: Redact the longer read and then cut the redacted text at the limit.
        why: The placeholder is shorter than a secret, so text past the limit, a second echo the read cut short included, slides into the kept window.
    upholds: [stored-response-holds-no-credential]
