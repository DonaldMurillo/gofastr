primitive: harness.secrets
summary: Repository-supplied provider keys - finds .harness-secrets/env by walking up to the repository root and sets the provider API keys the environment lacks, with the operator's consent remembered per repository and key set.
code:
  - framework/experimental/harness/secrets/
docs:
  - framework/docs/content/harness-architecture.md
invariants:
  - id: only-provider-credentials
    rule: The file sets only keys whose whole name matches ^[A-Z][A-Z0-9_]*$ and ends in _API_KEY or _TOKEN, never one starting GOFASTR_, so a cloned repository cannot set a proxy, PATH, LD_PRELOAD, HOME or the credential store's own key.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestLoadRepoDropsEnvShapingVars
      - test: framework/experimental/harness/secrets.TestLoadRepoDropsHarnessKeyVars
      - test: framework/experimental/harness/secrets.TestIsProviderCredentialKeyChecksWholeName
      - test: framework/experimental/harness/secrets.TestSweepGofastrKeysAndSetEnvNeverComeFromFile
  - id: environment-wins
    rule: A key already set in the process environment, when the file is read or when the keys are applied, is never overwritten by the file.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestLoadWithConsentSkipsKeysTheEnvironmentHas
      - test: framework/experimental/harness/secrets.TestSweepGofastrKeysAndSetEnvNeverComeFromFile
      - test: framework/experimental/harness/secrets.TestLoadRepoFromWorkingDirectory
  - id: walk-stops-at-repo-root
    rule: The search walks up from the start directory and stops at the first directory holding .git, never reading a secrets file above the repository; an empty value is not set.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestSweepWalkStopsAtRepoRootAndSkipsEmpty
      - test: framework/experimental/harness/secrets.TestLoadFromAndWalkUp
  - id: malformed-line-fails
    rule: A non-comment line with no '=' fails the load with its file and line number.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestLoadRejectsMalformed
  - id: consent-before-borrowing-keys
    rule: LoadWithConsent sets keys only when an approval for the same directory names every one of them, allow is true, or ask approves; otherwise, including a declined ask or no ask, it sets nothing, remembers nothing and returns ErrRefused.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestLoadWithConsentScopesApprovals
      - test: framework/experimental/harness/secrets.TestSweepDeclinedAskSetsAndRemembersNothing
  - id: approvals-owner-only
    rule: The approvals file is written 0600.
    enforced_by:
      - test: framework/experimental/harness/secrets.TestSweepApprovalsFileIsOwnerOnly
decisions:
  - id: allow-list-not-deny-list
    date: 2026-11-18
    status: accepted
    decision: The file may set only names shaped like provider credentials.
    rejected:
      - option: Set any key except a deny-list of dangerous ones.
        why: The file is attacker-authored in a cloned repository, and every forgotten deny entry (a proxy variable, LD_PRELOAD, an XDG path) is a way to plant one.
    upholds: [only-provider-credentials]
  - id: ask-before-using-repo-keys
    date: 2026-11-18
    status: accepted
    decision: Keys from a repository's file are used only with consent, asked once per directory and key set and remembered like an Allow-always permission.
    rejected:
      - option: Load them silently whenever the environment lacks them.
        why: The session would then run and bill on the repository author's account, and the author could read every prompt on their provider dashboard.
    upholds: [consent-before-borrowing-keys]
