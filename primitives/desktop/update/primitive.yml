primitive: desktop.update
summary: The auto-updater, a signed feed checked on a schedule, a verified download swapped in place of the running bundle and relaunched, its page capability and the feed writer the CLI uses.
code:
  - battery/desktop/update.go
  - battery/desktop/cap_updates.go
  - battery/desktop/internal/update/
docs:
  - framework/docs/content/desktop.md
on_change:
  - No error, log line or bridge message from the updater carries a path or a URL; the bridge errors are fixed words and paths go through LogDetail.
  - The tests behind darwin-signature-pin run only on a Mac and those behind windows-layout-is-closed only on Windows; CI runs neither, so run them on that machine before merging a change to the signature check or the Windows layout.
invariants:
  - id: update-config-validated
    rule: New panics on an Update config whose FeedURL is not https or http to 127.0.0.1, whose PublicKey is not 64 hex characters, whose Channel is over 64 bytes or holds a control character, whose MacOSTeamID is not ten uppercase letters and digits, or that sets both MacOSTeamID and MacOSAllowAdHoc.
    enforced_by:
      - test: battery/desktop.TestUpdateConfigValidation
  - id: install-is-gated
    rule: The updates capability is registered for every battery, check is ungated and install is gated updates:install, so the OS prompt asks once before a bundle is replaced.
    enforced_by:
      - test: battery/desktop.TestUpdatesCapabilityShape
      - test: battery/desktop.TestUpdatesCheckAndInstallThroughThePage
  - id: one-install-at-a-time
    rule: install is single-flight through TryLock, so a concurrent call is refused at once, and every call after a completed swap is refused.
    enforced_by:
      - test: battery/desktop.TestInstallRefusesConcurrentInstall
  - id: only-a-strictly-newer-release
    rule: Check and install treat the feed release as an update only when it is strictly newer than the running version by semver precedence, so an equal or older feed is never offered or installed.
    enforced_by:
      - test: battery/desktop.TestCheckComparesAgainstRunningVersion
      - test: battery/desktop.TestInstallRefusesDowngrade
  - id: no-key-no-check
    rule: An updater whose public key did not decode refuses check and install with not configured before fetching or verifying anything.
    enforced_by:
      - test: battery/desktop.TestUpdatesMethodsUnconfiguredRefuse
  - id: staging-is-removed
    rule: install stages the download in an update- directory under the data directory and removes it on every return, success or refusal.
    enforced_by:
      - test: battery/desktop.TestInstallRefusesConcurrentInstall
      - test: battery/desktop.TestInstallRefusesArchiveOffTheFeed
      - test: battery/desktop.TestInstallRefusesFailedSignatureCheck
  - id: fetch-errors-carry-no-url
    rule: Every error Fetch returns names the failure in fixed words (a status code, transport error, cancelled or timed out) and never the URL, so the updater's log lines that print it carry none.
    enforced_by:
      - test: battery/desktop/internal/update.TestFetchErrorsCarryNoURL
      - test: battery/desktop.TestCheckFeedFailureIsClosedCodeWithoutURL
  - id: archive-matches-the-feed
    rule: install refuses a downloaded archive whose sha256 or size is not the feed entry's before extracting it or running the signature check.
    enforced_by:
      - test: battery/desktop.TestInstallRefusesArchiveOffTheFeed
      - test: battery/desktop/internal/update.TestVerifyArchiveChecksSumAndSize
  - id: signature-check-gates-the-swap
    rule: install runs the platform's signature check on the extracted bundle and, when it fails, refuses with the archive error before anything is swapped or relaunched.
    enforced_by:
      - test: battery/desktop.TestInstallRefusesFailedSignatureCheck
  - id: bundle-is-the-feed-release
    rule: An install refuses a bundle whose version is not the feed release's or whose identifier is not the running app's, and refuses when the running app reports no identifier, even when the bundle carries none either.
    enforced_by:
      - test: battery/desktop.TestInstallRefusesMislabelledBundle
      - test: battery/desktop.TestInstallRefusesWithoutRunningIdentifier
  - id: swap-rolls-back
    rule: swap refuses before touching anything when an installed path is missing, and a failed rename puts back every unit already swapped, last first.
    enforced_by:
      - test: battery/desktop.TestInstallRetryAfterFailedRollbackKeepsOldBundle
      - test: battery/desktop.TestFileLayoutInstallRollsBackEarlierFiles
  - id: notify-once-per-version
    rule: update_available is emitted once per version, one delivery at a time, and a version counts as notified only after a delivery succeeded.
    enforced_by:
      - test: battery/desktop.TestUpdateNotifySharesInflight
      - test: battery/desktop.TestScheduledCheckEmitsEventOncePerVersion
      - test: battery/desktop.TestUpdateNotifyRetriesDelivery
  - id: signature-before-parse
    rule: ParseFeed refuses a manifest over 64 KiB, then verifies the detached ed25519 signature over the exact manifest bytes before decoding anything, then refuses a feed or channel version that is not semver and a missing, malformed or passed expiry.
    enforced_by:
      - test: battery/desktop/internal/update.TestParseFeedRejectsOversizeManifest
      - test: battery/desktop/internal/update.TestParseFeedRejectsBadSignatureBeforeParse
      - test: battery/desktop/internal/update.TestFeedRefusesInvalidChannelVersion
      - test: battery/desktop/internal/update.TestParseFeedRefusesExpired
  - id: fetch-rules
    rule: Fetch refuses before dialing a URL that is not https or http to 127.0.0.1, holds every redirect to the same rule ahead of the caller's own CheckRedirect, and refuses a body past its cap.
    enforced_by:
      - test: battery/desktop/internal/update.TestAllowedURLSchemeRules
      - test: battery/desktop/internal/update.TestFetchRefusesDisallowedURLBeforeDialing
      - test: battery/desktop/internal/update.TestFetchRefusesRedirectOffRule
      - test: battery/desktop/internal/update.TestFetchKeepsRedirectPolicy
      - test: battery/desktop/internal/update.TestFetchRefusesBodyOverCap
  - id: extract-one-bundle-inside-root
    rule: ExtractZip refuses an entry name with a backslash, a drive letter, a leading slash or a dot segment, any entry outside the one named root directory, an archive without that root's directory entry, and a symlink or device entry.
    enforced_by:
      - test: battery/desktop/internal/update.TestCleanEntryNameRefusesEscapes
      - test: battery/desktop/internal/update.TestExtractZipNeedsTheNamedRootDirectory
      - test: battery/desktop/internal/update.TestExtractZipRefusesSymlinkEntry
  - id: extract-drops-group-other-write
    rule: An extracted directory is owner-writable and no extracted file or directory keeps group or other write, setuid, setgid or sticky.
    enforced_by:
      - test: battery/desktop/internal/update.TestExtractDirectoriesRefusePublicWrites
      - test: battery/desktop/internal/update.TestExtractDropsGroupOtherWrite
      - test: battery/desktop/internal/update.TestExtractStripsSetuidSetgidSticky
  - id: extract-bounded
    rule: ExtractZip refuses an archive of more than maxZipEntries entries before writing anything, and an entry whose header declares more than maxEntrySize bytes before creating its file.
    enforced_by:
      - test: battery/desktop/internal/update.TestExtractZipRefusesTooManyEntries
      - test: battery/desktop/internal/update.TestExtractZipRefusesEntryDeclaredTooLarge
  - id: semver-precedence
    rule: Compare orders by major, minor and patch, puts a release above every pre-release of the same triple, and lets a longer pre-release list win when the prefixes match.
    enforced_by:
      - test: battery/desktop/internal/update.TestCompareOrdersVersions
      - test: battery/desktop/internal/update.TestIsNewerRules
  - id: windows-trust-never-loosens
    rule: CheckWindowsTrust refuses a new loader DLL that is not trusted, or, when the installed loader is trusted, one whose subject differs or when the installed subject is empty, a new executable whose signature does not verify, and, when the running executable is trusted, a new one from another subject or when the running subject is empty.
    enforced_by:
      - test: battery/desktop/internal/update.TestCheckWindowsTrustPolicy
  - id: move-tree-never-merges
    rule: MoveTree refuses a destination that exists, renames with no-replace semantics in one syscall, and copies with exclusive creates when the rename crosses volumes.
    enforced_by:
      - test: battery/desktop/internal/update.TestMoveTreeRefusesExistingDestination
      - test: battery/desktop/internal/update.TestRenameRefusesAppearedDestination
  - id: log-detail-has-no-path
    rule: LogDetail keeps only the operation and the OS error of a path, link or syscall error and collapses any other error to fixed words.
    enforced_by:
      - test: battery/desktop/internal/update.TestLogDetailDropsPaths
  - id: predecessor-variable-consumed
    rule: AwaitPredecessor removes GOFASTR_DESKTOP_UPDATE_PREDECESSOR from the environment and waits only when it names another positive process id.
    enforced_by:
      - test: battery/desktop/internal/update.TestAwaitPredecessorConsumesTheVariable
      - test: battery/desktop/internal/update.TestAwaitPredecessorWaitsForALiveProcess
  - id: feed-writer-checks
    rule: WriteFeed refuses a lifetime that is negative or past MaxFeedLifetime, merges into an existing manifest only when its signature verifies under the same key, and writes both files 0644.
    enforced_by:
      - test: battery/desktop/internal/update.TestWriteFeedRefusesBadLifetime
      - test: battery/desktop/internal/update.TestFeedRefusesForeignManifest
      - test: battery/desktop/internal/update.TestFeedFilesArePublic
  - id: key-file-cross-checked
    rule: LoadPrivateKey accepts a hex seed, or a hex seed followed by its public key, which must match the seed's in constant time.
    enforced_by:
      - test: battery/desktop/internal/update.TestLoadPrivateKeyFormats
  - id: info-plist-unambiguous
    rule: ParseInfoPlist refuses a repeated or missing CFBundleIdentifier or CFBundleShortVersionString.
    enforced_by:
      - test: battery/desktop/internal/update.TestParseInfoPlistRefusesAmbiguity
  - id: darwin-signature-pin
    rule: On macOS an update must pass codesign --verify --deep --strict against the team's Developer ID requirement when MacOSTeamID is set, else the running bundle's designated requirement, and is refused when the running app has no identity unless MacOSAllowAdHoc, and under every policy when codesign cannot read the running app.
    enforced_by:
      - test: battery/desktop/internal/update.TestDarwinVerifyPinsRunningIdentity
      - test: battery/desktop/internal/update.TestDarwinVerifyPinsTeamID
      - test: battery/desktop/internal/update.TestDarwinVerifyRefusesNoIdentity
      - test: battery/desktop/internal/update.TestDarwinUnreadableIdentityRefuses
  - id: linux-needs-an-installation
    rule: The Linux platform reports a bundle only when the running executable resolves to <apps>/<id>/bin/<id> of a directory linuxbundle.OpenInstalled accepts, and takes the app's version and id from that installation's manifest.
    enforced_by:
      - test: battery/desktop/internal/update.TestLinuxPlatformReadsTheInstallation
      - test: battery/desktop/internal/update.TestLinuxPlatformNeedsAnIntactInstallation
  - id: linux-swaps-the-installation
    rule: A Linux install swaps the whole <apps>/<id> directory for one staged from the verified archive in the installed form, with a receipt reissued for the new manifest that keeps the running installation's launcher and desktop entry digests, keeps the previous directory as .old until the next launch, and relaunches bin/<id> in its own session with PredecessorEnv naming the quitting process.
    enforced_by:
      - test: battery/desktop.TestLinuxInstallSwapsTheInstallation
      - test: battery/desktop/internal/update.TestLinuxExtractStagesAnInstallationUninstallAccepts
      - test: battery/desktop/internal/update.TestLinuxRelaunchNamesThePredecessor
      - test: cmd/gofastr/internal/desktopcmd.TestLinuxDesktopUpdateEndToEnd
  - id: linux-keeps-name-and-scheme
    rule: The Linux signature check refuses a staged update whose display name or embedded URL scheme differs from the running installation's, and the install then refuses with the archive error before anything is swapped.
    enforced_by:
      - test: battery/desktop/internal/update.TestLinuxVerifyRefusesANameOrSchemeChange
      - test: battery/desktop.TestLinuxInstallRefusesARenamedApp
  - id: linux-archive-is-the-running-app
    rule: A Linux install refuses an archive for another architecture, one whose payload is off its manifest, and one whose manifest names another app id.
    enforced_by:
      - test: battery/desktop/internal/update.TestLinuxExtractRefusesABadBundle
      - test: battery/desktop/internal/update.TestLinuxInspectRefusesAnotherApp
  - id: extract-tar-one-root
    rule: ExtractTarGz refuses an entry that escapes the root, a second top-level name, a link, device, FIFO or other non-regular, non-directory entry, a repeated name, a regular file as the root, more than maxZipEntries entries and an entry past maxEntrySize, and drops group and other write, setuid, setgid and sticky.
    enforced_by:
      - test: battery/desktop/internal/update.TestExtractTarGzRefusesUnsafeArchives
      - test: battery/desktop/internal/update.TestExtractTarGzWritesOneRoot
  - id: feed-writer-checks-linux-archives
    rule: WriteFeed refuses a linux- platform archive that is not a tar.gz ExtractTarGz would accept, whose root is not the one gofastr desktop build writes for its manifest, or whose manifest names another platform or version.
    enforced_by:
      - test: battery/desktop/internal/update.TestWriteFeedChecksALinuxArchive
  - id: windows-layout-is-closed
    rule: A Windows install swaps exactly the executable and WebView2Loader.dll, refuses a running layout where the loader is missing or not a regular file, and relaunches the new executable with PredecessorEnv naming the quitting process.
    enforced_by:
      - test: battery/desktop/internal/update.TestReadRunningBuildRefusesABrokenLayout
      - test: battery/desktop/internal/update.TestWindowsPlatformInspect
      - test: battery/desktop/internal/update.TestWindowsRelaunchNamesThePredecessor
      - test: battery/desktop/internal/update.TestRelaunchEnvReplacesEveryPredecessorEntry
decisions:
  - id: build-metadata-refused
    date: 2026-11-20
    status: accepted
    decision: A version with build metadata (+...) is refused.
    rejected:
      - option: Ignore build metadata as semver does.
        why: Two versions that differ only in build metadata compare equal, and the updater would download the same version forever.
    upholds: [semver-precedence]
  - id: feed-expiry-signed
    date: 2026-11-20
    status: accepted
    decision: The signed manifest carries an expiry and a client refuses it once passed, with no grace period.
    rejected:
      - option: A manifest valid forever once signed.
        why: Whoever serves the feed could replay an old signed manifest and hold every client on an old release.
    upholds: [signature-before-parse]
  - id: no-revocation-fetch
    date: 2026-11-20
    status: accepted
    decision: The Authenticode check runs WinVerifyTrust with no revocation fetch.
    rejected:
      - option: Check revocation online.
        why: An install must not hang on a CRL download, and the feed's ed25519 signature is the primary check.
    upholds: [windows-trust-never-loosens]
  - id: install-refused-not-queued
    date: 2026-11-20
    status: accepted
    decision: A second install while one runs is refused.
    rejected:
      - option: Queue it behind the first.
        why: Two runs share <Name>.app.new and .old, and the second's RemoveAll of .old could delete the first's only copy of the running bundle between its renames.
    upholds: [one-install-at-a-time]
  - id: linux-trusts-the-feed-signature
    date: 2026-11-25
    status: accepted
    decision: A Linux update rests on the ed25519 feed signature, which pins the archive's sha256 and size, and on the archive's manifest, which pins every payload file; the executable carries no signature of its own.
    rejected:
      - option: A detached ed25519 signature over the ELF, with its own key.
        why: It names the same publisher the feed key already pins, over bytes the feed already pins, and gives every publisher a second key to keep and rotate.
      - option: GPG or distribution package signing.
        why: Linux has no standard signature for a per-user ELF app, and either would add a runtime dependency and a keyring the app does not control.
    revisit_if: Linux gains a standard per-app code signature the shell can check without a new dependency, or the feed and the archives come to be published by parties that do not share one key.
    upholds: [linux-archive-is-the-running-app]
  - id: linux-refuses-a-rename
    date: 2026-11-25
    status: accepted
    decision: An update that changes the app's display name or URL scheme is refused, not applied by rewriting the desktop entry.
    rejected:
      - option: Rewrite the desktop entry during the update.
        why: The entry lives outside the swapped directory, so the rewrite and the swap are two steps; a crash between them leaves a receipt that no longer matches the entry, and uninstall then refuses to remove the app.
    revisit_if: A release needs to rename an installed app in place.
    upholds: [linux-keeps-name-and-scheme]
