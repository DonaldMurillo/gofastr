primitive: mountpath
summary: Literal mount-path validation for batteries and path-only prefix normalization for App CRUD and route groups.
code:
  - internal/mountpath/
invariants:
  - id: mount-paths-are-literal
    rule: "Validate refuses a mount path that is not absolute, is the root /, ends in a slash, carries a control byte or space, a ServeMux metacharacter ({, } or $), %, #, ? or a backslash, an empty or traversal segment, the bare reserved root /__gofastr, or a reserved /__gofastr segment; ValidateSegments carries the per-character and per-segment half for route prefixes."
    enforced_by:
      - test: internal/mountpath.TestValidateRefusesNonLiteralMounts
      - test: internal/mountpath.TestValidateAcceptsLiteralMounts
      - test: internal/mountpath.TestValidateSegmentsRefusesBadPrefixes
      - test: battery/relay.TestRouteConfigRequiresLiteralPaths
      - test: battery/rtc.TestNewPanicsOnBadConfig
    applies:
      - battery/relay/relay.go
      - battery/rtc/rtc.go
decisions:
  - id: one-mount-path-validator
    date: 2026-11-19
    status: accepted
    decision: rtc and relay wrap internal/mountpath.Validate and prefix their battery name onto its error text, instead of each battery carrying its own copy of the rules.
    rejected:
      - option: Copy relay's metacharacter and reserved-segment refusals into rtc's validatePath.
        why: The two copies had already drifted apart; one job belongs in one implementation.
    upholds: [mount-paths-are-literal]
