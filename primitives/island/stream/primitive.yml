primitive: island.stream
summary: ServeSSEWithPresence, the SSE loop of one island stream - session id and cap checks, topic admission before subscribing, the heartbeat, the lifetime bound, the per-push principal re-check, and the ClientKey the per-client cap counts under.
code:
  - core-ui/island/stream.go
docs:
  - framework/docs/content/reactivity.md
invariants:
  - id: session-id-is-bounded
    rule: ServeSSE answers 400 for an empty session id and one longer than 256 bytes.
    enforced_by:
      - test: core-ui/island.TestSSESessionRedKeyBounded
      - test: core-ui/island.TestServeSSEMissingSession
  - id: refusal-is-429
    rule: A stream the caps refuse is answered 429 with a Retry-After before any SSE header is written.
    enforced_by:
      - test: core-ui/island.TestSSEStreamCapReturnsClearStatus
      - test: core-ui/island.TestRefusedStreamSaysWhenToRetry
      - test: core-ui/island.TestSSEPeerCapAnswers429
  - id: admit-before-subscribe
    rule: Presence topics are admitted before the stream subscribes, so a panicking AuthorizeTopic hook leaves no subscription behind.
    enforced_by:
      - test: core-ui/island.TestServeSSEWithPresence_PanickingHookLeaksNoSubscription
  - id: stream-outlives-request-timeout
    rule: A request-context DeadlineExceeded leaves the stream running and only a cancellation ends it, while the heartbeat writes a keepalive on an idle stream and the bound closes any stream after its lifetime.
    enforced_by:
      - test: core-ui/island.TestSSEStreamOutlivesRequestDeadline
      - test: core-ui/island.TestSSEHeartbeatKeepsIdleStreamAlive
      - test: core-ui/island.TestSSEStreamBoundReclaimsStream
      - test: core-ui/island.TestSSEStreamClosesOnClientDisconnect
  - id: viewer-is-rechecked
    rule: Before each push and each heartbeat the stream re-checks the principal and its topics, and closes when the session was revoked or a joined topic is no longer authorized.
    enforced_by:
      - test: core-ui/island.TestIslandStreamClosesOnRevocation
      - test: core-ui/island.TestPresenceLeavesRevokedTopic
  - id: client-key
    rule: ClientKey is the signed-in user when there is one, else the caller's address read through trusted proxies only, an IPv6 address masked to its /64.
    enforced_by:
      - test: core-ui/island.TestClientKey
  - id: unlisted-proxy-hint
    rule: When the per-client cap refuses a stream from a private or loopback peer while no proxy is trusted, the manager logs one warning naming the trusted-proxy settings.
    enforced_by:
      - test: core-ui/island.TestPeerCapHintsAtAnUnlistedProxy
decisions:
  - id: subscribe-before-flushing
    date: 2026-11-20
    status: accepted
    decision: The stream subscribes and joins presence before it flushes the connected comment.
    rejected:
      - option: Flush headers first.
        why: A client that pushes as soon as the connection is ready won the race and its update was dropped for want of a subscriber.
  - id: deadline-is-not-disconnect
    date: 2026-11-20
    status: accepted
    decision: The stream tells middleware.Timeout's deadline from a real disconnect and bounds its own lifetime with a heartbeat and a timer.
    rejected:
      - option: Clear the connection's read and write deadlines.
        why: It defeated net/http's close notification and stranded streams, exhausting the browser's per-origin connection pool.
      - option: Let the request deadline end the stream.
        why: Every live stream was cut at the timeout.
    upholds: [stream-outlives-request-timeout]
