primitive: embed.credential
summary: The signed nonce and grant tokens and the burn stores that make a nonce single-use.
code:
  - framework/embed/token.go
  - framework/embed/burnstore.go
invariants:
  - id: prefix-is-in-the-mac
    rule: The token prefix is fed into the MAC, so a nonce re-prefixed as a grant fails verification even under a shared key.
    enforced_by:
      - test: framework/embed.TestNonceAndGrantAreNotInterchangeable
  - id: empty-key-never-signs-or-verifies
    rule: An empty key verifies no token, and MintNonce and MintGrant refuse one.
    enforced_by:
      - test: framework/embed.TestVerifyRejectsAnEmptyKey
      - test: framework/embed.TestMintRejectsBadOriginAndMissingKey
  - id: tampered-token-fails
    rule: A token whose payload, signature or key differs from the one it was minted with fails verification.
    enforced_by:
      - test: framework/embed.TestNonceRejectsTamperingAndWrongKey
  - id: required-claims
    rule: VerifyNonce refuses a nonce missing its surface, id or origin, and VerifyGrant one missing its surface or origin.
    enforced_by:
      - test: framework/embed.TestVerifyNonceRejectsAClaimsWithARequiredFieldMissing
      - test: framework/embed.TestSweepEmbedVerifyGrantRequiresAnOrigin
  - id: tokens-expire
    rule: A nonce or grant stops verifying at its expiry instant.
    enforced_by:
      - test: framework/embed.TestNonceExpires
      - test: framework/embed.TestExchangeRejectsSpentNonceAfterWindow
  - id: grant-clamped-to-deadline
    rule: MintGrant never signs an expiry past the deadline it is given.
    enforced_by:
      - test: framework/embed.TestMintGrantClampsExpiryToDeadline
  - id: nonce-ids-are-random
    rule: Every nonce carries a fresh 128-bit crypto/rand id, the key the burn store claims.
    enforced_by:
      - test: framework/embed.TestNonceIDsAreUnique
  - id: burn-contract
    rule: Over the memory and SQL stores alike, the first Burn of a nonce wins, a later one gets the same stored grant as a replay while it is live and "" after, and of concurrent claims exactly one wins.
    enforced_by:
      - test: framework/embed.TestMemoryBurnStoreContract
      - test: framework/embed.TestSQLBurnStoreContract
  - id: late-claim-burns-but-returns-nothing
    rule: Over both stores, a first claim made at or past its retention deadline still writes the tombstone and answers ("", true).
    enforced_by:
      - test: framework/embed.TestStalledClaimGetsNoGrantButStillBurns
      - test: framework/embed.TestFreshNonceExpiringDuringBurnIsExpired
  - id: identical-grant-is-still-a-replay
    rule: Over both stores, a second Burn of a nonce with a byte-identical grant reports a replay.
    enforced_by:
      - test: framework/embed.TestSweepEmbedIdenticalGrantReplayIsAReplay
  - id: sql-burn-answers-from-the-stored-row
    rule: When the driver cannot report rows affected the SQL store answers with the stored grant, and when the row is gone it answers spent.
    enforced_by:
      - test: framework/embed.TestSweepEmbedSQLBurnWithoutRowsAffected
  - id: sql-prune-waits-out-the-grace
    rule: SQLBurnStore.Prune deletes only rows whose deadline is more than PruneGrace in the past.
    enforced_by:
      - test: framework/embed.TestSQLBurnStorePruneKeepsRowsInsideTheGraceWindow
      - test: framework/embed.TestSQLBurnStorePrunes
  - id: memory-store-prunes-itself
    rule: MemoryBurnStore.Burn deletes rows past their deadline once the map reaches its threshold, at most once per interval, and keeps live rows.
    enforced_by:
      - test: framework/embed.TestMemoryBurnStoreSelfPrunesExpiredRows
      - test: framework/embed.TestMemoryBurnStoreSelfPruneKeepsLiveRows
      - test: framework/embed.TestMemoryBurnStorePruneRespectsIntervalGate
  - id: erasure-keeps-the-tombstone
    rule: A data erasure blanks the burn row's grant and subject but keeps the row, and Burn answers an erased row as spent.
    enforced_by:
      - test: framework/embed.TestEraseScrubsBurnedGrant
      - test: framework/embed.TestEraseScrubsBurnedGrantPG
  - id: burn-table-is-upgraded-in-place
    rule: NewSQLBurnStore adds the subject column to a burn table an older build created, keeping its rows spent, and every new burn records its grant's subject.
    enforced_by:
      - test: framework/embed.TestBurnTableGainsSubjectColumn
  - id: burn-table-name-is-safe
    rule: NewSQLBurnStore refuses a nil database, a table name that is not a safe identifier, and on Postgres a case-kept table it would not find.
    enforced_by:
      - test: framework/embed.TestSQLBurnStoreRejectsBadTable
      - test: framework/embed.TestSQLBurnStoreCaseKeptTableRefusedPG
decisions:
  - id: two-barriers-between-nonce-and-grant
    date: 2026-11-17
    status: accepted
    decision: Nonces and grants use separate HKDF-derived keys and also put their prefix inside the MAC.
    rejected:
      - option: Key separation alone.
        why: Both are HMAC-SHA256 over near-identical JSON, so one derivation mistake would let a nonce verify as a grant.
    upholds: [prefix-is-in-the-mac]
  - id: burn-by-unique-constraint
    date: 2026-11-17
    status: accepted
    decision: Spending a nonce is one atomic claim on its id, a primary-key INSERT in SQL, never a read followed by a write.
    rejected:
      - option: Read whether the nonce is used, then write.
        why: Two concurrent exchanges both read unused and both mint a grant, the shared identity single use exists to prevent.
    upholds: [burn-contract]
  - id: sql-replay-reads-the-row
    date: 2026-11-17
    status: accepted
    decision: The SQL store's INSERT uses ON CONFLICT DO NOTHING, and anything but one affected row is answered by reading the stored row.
    rejected:
      - option: Sniff the driver's constraint-violation error.
        why: It is driver-specific.
      - option: Call it a first use when the stored grant equals the one just minted.
        why: Grants are a deterministic function of their claims, so two exchanges in one second mint byte-identical tokens and every such replay read as a first use.
    upholds: [identical-grant-is-still-a-replay, sql-burn-answers-from-the-stored-row]
  - id: late-claim-writes-the-tombstone
    date: 2026-11-17
    status: accepted
    decision: A claim past its deadline is still recorded, but hands back no grant.
    rejected:
      - option: Refuse to write the row.
        why: The nonce would stay unburnt and spendable by the next caller, after a stalled request had outlived a prune of the winning row.
    upholds: [late-claim-burns-but-returns-nothing]
  - id: prune-grace-not-synced-clocks
    date: 2026-11-17
    status: accepted
    decision: SQLBurnStore.Prune keeps a row PruneGrace, five minutes, past its deadline.
    rejected:
      - option: Assume replica clocks agree.
        why: A fast pruner deleting a row a slow verifier still needs un-burns the nonce, and nothing enforces synced clocks.
    upholds: [sql-prune-waits-out-the-grace]
  - id: memory-store-self-prunes
    date: 2026-11-17
    status: accepted
    decision: MemoryBurnStore sweeps expired rows from Burn, past a row threshold and at most once per interval.
    rejected:
      - option: Rely on Host.Prune.
        why: The host schedules no sweeper, so the map grew by one row per exchange for the life of the process.
      - option: Sweep on every write.
        why: A workload of all-live nonces would scan the map on every exchange.
    upholds: [memory-store-prunes-itself]
  - id: erase-blanks-not-deletes
    date: 2026-11-17
    status: accepted
    decision: The burn table's eraser anonymizes the grant and subject and keeps the row; export leaves burn rows out.
    rejected:
      - option: Delete the row.
        why: The row is the nonce's tombstone, and deleting it makes the nonce spendable again.
      - option: Export the rows.
        why: A restored row is a live grant.
    upholds: [erasure-keeps-the-tombstone]
  - id: burn-table-outside-the-migrator
    date: 2026-11-17
    status: accepted
    decision: NewSQLBurnStore creates its own table, as the auth battery's token tables do.
    rejected:
      - option: An entity migrated with the app's data.
        why: It is framework plumbing, not app data.
    upholds: [burn-table-is-upgraded-in-place]
