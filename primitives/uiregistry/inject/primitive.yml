primitive: uiregistry.inject
summary: The attribute splice on a component's first opening tag - the data-cui-comp marker, InjectAttribute, AppendAttributes, AddAttributeToken and Attribute - with no HTML parser, one quote-aware scan to the tag's >.
code:
  - core-ui/registry/inject.go
docs:
  - core-ui/ARCHITECTURE.md
invariants:
  - id: splice-into-the-first-open-tag
    rule: The splice skips leading whitespace and comments, refuses output whose first token is not an element open tag or whose tag never ends, inserts before a self-closing / keeping a space before it, and writes every spliced value HTML-escaped, the data-cui-comp name included, after InjectAttribute refuses an unsafe attribute name; AppendAttributes adds sorted render.Attr pairs and returns a fragment with no usable root unchanged.
    enforced_by:
      - test: core-ui/registry.TestInjectIntoSimpleDiv
      - test: core-ui/registry.TestInjectIntoSelfClosingTag
      - test: core-ui/registry.TestInjectSelfClosingPreservesSpace
      - test: core-ui/registry.TestInjectSkipsLeadingComment
      - test: core-ui/registry.TestInjectRejectsBareText
      - test: core-ui/registry.TestInjectAttrWithEmbeddedGreaterThan
      - test: core-ui/registry.TestInjectAttribute
      - test: core-ui/registry.TestInjectMarkerEscapesName
      - test: core-ui/interactive.TestInteractiveAttributesReachRootAfterComments
  - id: attribute-found-at-a-name-boundary
    rule: An attribute counts only outside quoted values, its name matched without regard to ASCII case, preceded by HTML whitespace (space, tab, line feed, carriage return or form feed, as isHTMLSpace reads it for the template scan) and followed by =, whitespace, / or the tag end; injectMarker and InjectAttribute return a tag that already carries it unchanged, AppendAttributes keeps the existing bytes and appends each pair render.Attr accepts, even a name the tag already has, and Attribute reads a value past whitespace around the = and a quoted one to its own closing quote.
    enforced_by:
      - test: core-ui/registry.TestInjectIdempotentWhenAlreadyMarked
      - test: core-ui/registry.TestInjectIgnoresAttrNameInsideQuotedValue
      - test: core-ui/registry.TestInjectIdempotentAcrossLineBreaks
      - test: core-ui/registry.TestInjectSkipsWhenWrappedByDifferentName
      - test: core-ui/registry.TestAttribute
  - id: token-joins-the-list
    rule: AddAttributeToken refuses an unsafe attribute name and a token that is empty or holds whitespace, adds name="token" to a root tag without the attribute, keeps an existing value's bytes as written and adds a space (unless the value is empty or ends in HTML whitespace) and the HTML-escaped token, inside a quoted value's own quotes or by double-quoting an unquoted or bare one, with or without whitespace around the =, and returns a list that already holds the token, as split on HTML whitespace and compared raw or decoded, or a fragment with no usable root, unchanged.
    enforced_by:
      - test: core-ui/registry.TestAddAttributeToken
