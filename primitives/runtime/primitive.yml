primitive: runtime
summary: The browser runtime that hydrates server-rendered pages, routes cross-page navigation client-side, swaps islands and listens on the one SSE bus.
code:
  - core-ui/runtime/
docs:
  - core-ui/ARCHITECTURE.md
  - framework/docs/content/reactivity.md
on_change:
  - A new or renamed data-cui-* attribute gets its row in the core-ui/ARCHITECTURE.md attribute table and a runtime test in the same change.
invariants:
  - id: sinks-go-through-the-trusted-types-policy
    rule: The kernel creates exactly one Trusted Types policy, named middleware.TrustedTypesPolicy, and every HTML string and script URL the runtime, its modules and the shipped behaviours hand the DOM passes through it, so a page under the default CSP raises no Trusted Types violation on first load, module loads, a poll swap, an html-mode signal, a navigation inside or across shells, or Back.
    enforced_by:
      - test: core-ui/runtime.TestRuntimePolicyIsTheOneTheCSPAllows
      - test: core-ui/check.TestLintTrustedTypesSinks_RepoIsClean
      - test: framework/uihost.TestRuntimeSwapsUnderTrustedTypes
    applies:
      - framework/headless/*.js
      - battery/sitesearch/*.js
      - framework/uihost/pwa.go
  - id: attributes-are-documented
    rule: Every data-cui-* attribute the runtime or a registered behaviour reads has a row in the core-ui/ARCHITECTURE.md attribute table, named in the row's first column; a mention in a description cell or in prose does not count.
    enforced_by:
      - test: core-ui/runtime/internal/treegate.TestRuntimeAttrsAreDocumented
      - test: core-ui/runtime/internal/treegate.TestProseMentionIsNotARow
      - test: core-ui/runtime/internal/treegate.TestPrivilegedAttrsAreDocumented
  - id: refused-submit-focuses-first-invalid
    rule: A refused form submit, on the data-cui-rpc path and the plain-form bridge alike, moves focus to the first refused control in form.elements order that can take it, a control associated from outside the form included and a hidden input or disabled control (a disabled fieldset's included) skipped, a radio group on its checked or first enabled radio, while focus is still on the body, in the form or on one of its controls; a click-dispatched control or an as-you-type dispatch never moves focus.
    enforced_by:
      - test: core-ui/runtime.TestRefusedSubmitFocusesFirstInvalidField
      - test: core-ui/runtime.TestRefusedInputDispatchKeepsFocus
      - test: core-ui/runtime.TestRefusedSubmitFocusesAnExternalControl
      - test: core-ui/runtime.TestLateRefusalLeavesFocusOutsideTheForm
      - test: core-ui/runtime.TestRefusedClickDispatchKeepsFocus
      - test: core-ui/runtime.TestRefusedSubmitSkipsAHiddenInput
      - test: core-ui/runtime.TestRefusedSubmitFocusesTheCheckedRadio
      - test: core-ui/runtime.TestRefusedSubmitSkipsADisabledControl
      - test: core-ui/runtime.TestRetryClearsAnExternalControlsError
      - test: core-ui/runtime.TestRefusedSubmitSkipsADisabledFieldset
      - test: core-ui/runtime.TestRefusedRadioGroupWithADisabledLastRadio
      - test: core-ui/runtime.TestRefusedPlainFormSubmitFocusesFirstInvalidField
  - id: saved-stack-refreshes-what-it-uncovers
    rule: A save inside an intercept stack that keeps a layer re-renders each layer under it and the page under the stack when a close or Back uncovers it; the navigation guards and the leave guard can stop the re-render to preserve edits, and a failed refetch falls back to a plain navigation. Declining or superseding a refresh does not clear the stale state before the content is replaced.
    enforced_by:
      - test: core-ui/runtime.TestSaveInPaneRefreshesTheListOnClose
      - test: core-ui/runtime.TestSaveInUpperPaneRefreshesTheLayersUnder
      - test: core-ui/runtime.TestUncoveredStaleLayerAsksTheLeaveGuard
      - test: core-ui/runtime.TestUncoveredStaleContentAsksNavigationGuards
      - test: core-ui/runtime.TestUncoveredStalePageSurvivesStartingANewStack
      - test: core-ui/runtime.TestUncoveredStaleLayerRetriesSupersededRefresh
      - test: core-ui/runtime.TestUncoveredStaleLayerFallsBackWhenItsRefetchFails
  - id: off-screen-poll-waits
    rule: A data-cui-poll region more than 200px outside the viewport is not fetched, and the tick that came due while it was away fetches once the region comes near.
    enforced_by:
      - test: core-ui/runtime.TestPoll_PausesOffScreen
  - id: scroll-store-persists-per-gesture
    rule: The router writes its scroll store to sessionStorage once per scroll gesture, on scrollend, and whenever the page goes hidden, so a reloaded page, or a background tab the browser discards, keeps its position even where scrollend never fires.
    enforced_by:
      - test: core-ui/runtime.TestScrollPersistsOncePerGesture
      - test: core-ui/runtime.TestReloadRestoresScrollWithoutScrollEnd
  - id: no-hard-navigation
    rule: Navigation goes through the client router; nothing assigns location.href or reloads the page to move between pages or to refresh one.
    enforced_by:
      - contract: GOFASTR1802
    applies:
      - framework/gallery/
      - framework/i18nui/
      - framework/sdkdocs/
      - framework/ui/
      - framework/uihost/
      - battery/
      - examples/
      - internal/testapps/
      - cmd/gofastr/
  - id: sse-is-push-only
    rule: Server-sent events travel on the single /__gofastr/sse bus and carry only background events (presence, collaboration, sub-second updates), never the answer to a user action; passive freshness polls with data-cui-poll.
    enforced_by:
      - contract: GOFASTR1803
    judge: Does this change deliver the result of a user action over SSE, or open an EventSource outside the /__gofastr/sse bus and dev-mode reload tooling?
    applies:
      - framework/
      - battery/
      - examples/
      - internal/testapps/
      - cmd/gofastr/
  - id: no-list-math-in-js
    rule: Pagination, sort and filter are computed on the server; the runtime only follows the links and swaps the regions the server returns.
    judge: Does this change compute a page, a sort order or a filter result in JavaScript instead of asking the server?
    applies:
      - framework/gallery/
      - framework/i18nui/
      - framework/sdkdocs/
      - framework/ui/
      - framework/uihost/
      - battery/
      - examples/
      - internal/testapps/
      - cmd/gofastr/
  - id: scheme-meta-follows-the-choice
    rule: The color-scheme bootstrap sets the color-scheme meta to the forced mode when the reader chose one and to light dark while the page follows the OS.
    enforced_by:
      - test: framework/ui.TestThemeChoiceSetsSchemeAndMeta
  - id: toggle-stores-no-mode-the-os-shows
    rule: A theme-toggle cycle step that lands on the scheme the OS already shows stores no choice, so the page keeps following the OS.
    enforced_by:
      - test: framework/ui.TestThemeCycleStoresNoChoiceTheOSShows
    applies:
      - framework/headless/navigation.js
  - id: held-clicks-keep-their-order
    rule: A click the transition module holds because it landed on <html> during a view transition is delivered before any later click is handled, so the page the user clicked last is the page shown.
    enforced_by:
      - test: core-ui/runtime.TestHeldClickNeverLandsAfterALaterClick
      - test: examples/site/tracker.TestTrackerSupersedingPointerClicksKeepRingOff
  - id: anchored-popover-is-on-the-top-layer
    rule: An anchored popover widget's root is a manual popover while open, so it shows above whatever is already in the top layer, still placed beside its trigger by the module; it leaves the top layer when the widget closes, so a hydrated root that is only re-hidden rises above later layers when it reopens, and a root a page swap re-attaches rises again on its next placement.
    enforced_by:
      - test: core-ui/runtime.TestAnchoredPopoverOpensAboveTheTopLayer
      - test: core-ui/runtime.TestHydratedPopoverReopensAboveALaterPopover
      - test: core-ui/runtime.TestReattachedPopoverRisesAgain
  - id: escape-waits-for-widgetfocus
    rule: An Escape pressed while a modal or popover is open and the demand-loaded widgetfocus module has not registered yet is handed to that module once it loads, so it closes the top layer instead of being lost, unless a layer opened or closed in between; an Escape that belongs to an IME is never forwarded.
    enforced_by:
      - test: core-ui/runtime.TestEscapeBeforeFocusModuleLoadsClosesModal
      - test: core-ui/runtime.TestHeldEscapeSkipsALaterLayer
      - test: core-ui/check.TestLintKeyGuard_Repo
      - test: kiln/integration.TestBrowser_EscClosesModals
  - id: modal-widget-is-a-native-dialog
    rule: A backdrop'd widget with default chrome is a <dialog> opened with showModal(), so Tab and assistive tech never reach the page behind it from the moment it opens; a close request (Escape, the back gesture) or a scrim click dismisses it through the one dismiss path only when the widget allows it, a scrim click only when the press started on the scrim, a non-modal widget opened over it mounts inside it so it is not inert, and a modal opened from inside it stacks on top and closes alone.
    enforced_by:
      - test: core-ui/widget.TestModalChromeIsADialog
      - test: core-ui/runtime.TestModalWidgetOpensAsNativeDialog
      - test: core-ui/runtime.TestTabBeforeFocusModuleStaysInDialog
      - test: core-ui/runtime.TestDialogEscapeClosesWithoutFocusModule
      - test: core-ui/runtime.TestDialogBackdropClickCloses
      - test: core-ui/runtime.TestPanelOverDialogMountsInside
      - test: core-ui/runtime.TestStackedDialogsCloseOneAtATime
  - id: confirm-closes-in-the-closing-task
    rule: A closed confirm dialog is removed, its answer resolved and focus handed back in the task that closed it, whatever closed it (a button, Escape, close(), requestClose).
    enforced_by:
      - test: core-ui/runtime.TestConfirmTeardownRunsInTheClosingTask
      - test: core-ui/runtime.TestConfirmInsideModalWidgetOwnsKeyboard
  - id: route-constraints-match-server
    rule: Navigation, route prefetch and intercept selection test typed parameters against the server router's constraints on decoded segment values; a constraint mismatch falls through to the next route.
    enforced_by:
      - test: core-ui/runtime.TestTypedSegmentPicksServerRoute
      - test: core-ui/runtime/hosttest.TestHoverPrefetchUsesServerRouteConstraints
  - id: background-fetches-yield
    rule: A scheduled poll tick (data-cui-poll and a widget's state poll) and a visible or eager prefetch ask for priority 'low'; a hover prefetch, a widget's pollNow after its own RPC and the refresh when a hidden tab becomes visible keep the default, since the user is waiting on them.
    enforced_by:
      - test: core-ui/runtime.TestPollFetchIsLowPriority
      - test: core-ui/runtime.TestWidgetPollFetchIsLowPriority
      - test: core-ui/runtime.TestPrefetchPriorityFollowsIntent
  - id: refusal-read-from-one-polite-region
    rule: A refused form submission is read from the one cui-form-errors region (role=status, aria-live=polite), one sentence per refused field (its label, a radio's group legend, a colon, its messages), every live node it places has an id the control is described by and is no alert of its own, and a successful retry or a client navigation empties the region.
    enforced_by:
      - test: core-ui/runtime.TestRefusalIsReadFromOnePoliteRegion
      - test: core-ui/runtime.TestRefusalNamesTheGroupAndClearsOnNavigation
      - test: core-ui/runtime.TestRuntimeModule_FormErrors
  - id: autogrow-defers-to-field-sizing
    rule: Where CSS.supports reports field-sizing content, the textarea module sets field-sizing content on each autogrow textarea, with its rows and cols as minimum block and inline size so an empty one keeps its rendered size, and measures nothing after (no inline height, no ResizeObserver); elsewhere its scrollHeight fallback grows it, a hidden textarea included.
    enforced_by:
      - test: core-ui/runtime.TestAutogrowUsesFieldSizing
      - test: core-ui/runtime.TestHiddenTextareaGrowsOnReveal
decisions:
  - id: anchored-popover-placement-stays-in-script
    date: 2026-11-28
    status: accepted
    decision: The anchored popover joins the top layer as a manual popover but keeps the module's script placement and arrow; CSS anchor positioning waits until anchored container queries ship in Safari and Firefox, and then replaces the script outright.
    rejected:
      - option: position-area and position-try-fallbacks now, the script kept for browsers without them.
        why: The arrow points at the trigger from the side the popover took, and only anchored container queries tell CSS which fallback the browser chose; with them in Chromium alone, two placers would have to agree on every side and clamp.
      - option: Leave the popover out of the top layer.
        why: A menu, toast stack or tooltip already in the top layer covered it, and the top layer is the part that changes what a reader can see and reach.
    upholds: [anchored-popover-is-on-the-top-layer]
  - id: pass-through-trusted-types-policy
    date: 2026-11-21
    status: accepted
    decision: The 'gofastr' policy passes HTML and script URLs through unchanged (createHTML and createScriptURL are String), each core sink calls the kernel's _html or _scriptURL, and a module calls NS._html?.(s) ?? s so it still runs beside an older kernel.
    rejected:
      - option: Sanitize in createHTML.
        why: The runtime's own writes carry markup the app's server rendered, and updateHTML and fetchPage write their caller's string, which the docs require to be trusted HTML; a sanitizer would cost bytes and break that markup. The policy's job is to make a plain string at a sink throw, not to judge what the runtime is handed.
      - option: A default policy.
        why: A browser hands every plain string from any script to the default policy, so a pass-through one would accept injected strings and the enforcement would protect nothing.
      - option: Keep _html and _scriptURL private to the kernel's closure.
        why: Demand modules and the headless behaviours are separate scripts that load after the kernel, so they reach the policy through window.__gofastr; the wrappers are documented as internal and the lint checks every framework sink's whole value.
      - option: Refuse script URLs that are not same-origin paths.
        why: Every runtime script URL is built from a fixed /__gofastr/ prefix and a name the loader already pins, and the check cost 29 bytes at level 1 in a core already at its window.
    upholds: [sinks-go-through-the-trusted-types-policy]
  - id: poll-before-push
    status: accepted
    decision: Passive freshness (dashboards, counters, statuses) polls with data-cui-poll; SSE is the last rung.
    rejected:
      - option: Push every change over SSE.
        why: It holds a connection per tab and needs fanout across replicas, for updates nobody needs within a second.
    upholds: [sse-is-push-only]
  - id: unplaceable-held-click-is-dropped
    date: 2026-11-16
    status: accepted
    decision: A held click that still hit-tests to <html> when a later click forces delivery is dropped.
    rejected:
      - option: Keep it queued and deliver it when the transition covering it finishes.
        why: It would land after the later click and override it, which is the order inversion held-clicks-keep-their-order forbids.
    revisit_if: A held click must reach a control whose effect does not depend on order, such as a toggle.
    upholds: [held-clicks-keep-their-order]
  - id: escape-forwarded-not-inlined
    date: 2026-11-16
    status: accepted
    decision: The widgets module keeps one document keydown listener that, while widgetfocus has not registered and a layer is open, loads it and hands it the Escape; the Escape logic itself stays in widgetfocus.
    rejected:
      - option: Move the Escape handler into the widgets module.
        why: It moves the whole handler and its foreign-dialog check into a module already past its gzip goal, where the forwarder adds one line.
      - option: Hold the modal hidden until widgetfocus has loaded.
        why: Every first open would wait an extra request before it shows.
    upholds: [escape-waits-for-widgetfocus]
  - id: modal-scroll-lock-stays-on-the-root
    date: 2026-11-17
    status: accepted
    decision: A <dialog> modal keeps the owner-refcounted lock on <html> (NS.doc.lockScroll) and adds overscroll-behavior contain on the dialog.
    rejected:
      - option: 'overscroll-behavior contain alone, as #701 suggested.'
        why: It only stops scroll chaining out of a scrollable dialog; a wheel over the scrim or over a dialog too short to scroll still scrolls the page behind.
      - option: A CSS :root:has(dialog:modal) rule.
        why: The widget sheet can land after showModal(), so the page scrolls until it does, and drawers and the pane host already share the refcounted lock.
    upholds: [modal-widget-is-a-native-dialog]
  - id: confirm-teardown-watches-the-open-attribute
    date: 2026-11-16
    status: accepted
    decision: The confirm module tears its dialog down from a MutationObserver on the dialog's open attribute.
    rejected:
      - option: Tear down on the dialog's close event.
        why: Chromium fires close with the next animation frame, so under load the closed dialog stayed in the page and the answer waited 300 to 900 ms in headless Chrome.
    upholds: [confirm-closes-in-the-closing-task]
