primitive: runtime
summary: The browser runtime that hydrates server-rendered pages, routes cross-page navigation client-side, swaps islands and listens on the one SSE bus.
code:
  - core-ui/runtime/
docs:
  - core-ui/ARCHITECTURE.md
  - framework/docs/content/reactivity.md
on_change:
  - A new or renamed data-cui-* attribute gets its row in the core-ui/ARCHITECTURE.md attribute table and a runtime test in the same change.
invariants:
  - id: attributes-are-documented
    rule: Every data-cui-* attribute the runtime or a registered behaviour reads has a row in the core-ui/ARCHITECTURE.md attribute table.
    enforced_by:
      - test: core-ui/runtime/internal/treegate.TestRuntimeAttrsAreDocumented
      - test: core-ui/runtime/internal/treegate.TestPrivilegedAttrsAreDocumented
  - id: no-hard-navigation
    rule: Navigation goes through the client router; nothing assigns location.href or reloads the page to move between pages or to refresh one.
    enforced_by:
      - contract: GOFASTR1802
    applies:
      - framework/ui/
      - framework/uihost/
      - battery/
      - examples/
      - cmd/gofastr/
  - id: sse-is-push-only
    rule: Server-sent events travel on the single /__gofastr/sse bus and carry only background events (presence, collaboration, sub-second updates), never the answer to a user action; passive freshness polls with data-cui-poll.
    enforced_by:
      - contract: GOFASTR1803
    judge: Does this change deliver the result of a user action over SSE, or open an EventSource outside the /__gofastr/sse bus and dev-mode reload tooling?
    applies:
      - framework/
      - battery/
      - examples/
      - cmd/gofastr/
  - id: no-list-math-in-js
    rule: Pagination, sort and filter are computed on the server; the runtime only follows the links and swaps the regions the server returns.
    judge: Does this change compute a page, a sort order or a filter result in JavaScript instead of asking the server?
    applies:
      - framework/ui/
      - framework/uihost/
      - battery/
      - examples/
      - cmd/gofastr/
  - id: held-clicks-keep-their-order
    rule: A click the transition module holds because it landed on <html> during a view transition is delivered before any later click is handled, so the page the user clicked last is the page shown.
    enforced_by:
      - test: core-ui/runtime.TestHeldClickNeverLandsAfterALaterClick
      - test: examples/tracker.TestTrackerSupersedingPointerClicksKeepRingOff
  - id: escape-waits-for-widgetfocus
    rule: An Escape pressed while a modal or popover is open and the demand-loaded widgetfocus module has not registered yet is handed to that module once it loads, so it closes the top layer instead of being lost.
    enforced_by:
      - test: core-ui/runtime.TestEscapeBeforeFocusModuleLoadsClosesModal
      - test: kiln/integration.TestBrowser_EscClosesModals
decisions:
  - id: poll-before-push
    status: accepted
    decision: Passive freshness (dashboards, counters, statuses) polls with data-cui-poll; SSE is the last rung.
    rejected:
      - option: Push every change over SSE.
        why: It holds a connection per tab and needs fanout across replicas, for updates nobody needs within a second.
    upholds: [sse-is-push-only]
  - id: unplaceable-held-click-is-dropped
    date: 2026-11-16
    status: accepted
    decision: A held click that still hit-tests to <html> when a later click forces delivery is dropped.
    rejected:
      - option: Keep it queued and deliver it when the transition covering it finishes.
        why: It would land after the later click and override it, which is the order inversion held-clicks-keep-their-order forbids.
    revisit_if: A held click must reach a control whose effect does not depend on order, such as a toggle.
    upholds: [held-clicks-keep-their-order]
  - id: escape-forwarded-not-inlined
    date: 2026-11-16
    status: accepted
    decision: The widgets module keeps one document keydown listener that, while widgetfocus has not registered and a layer is open, loads it and hands it the Escape; the Escape logic itself stays in widgetfocus.
    rejected:
      - option: Move the Escape handler into the widgets module.
        why: It moves the whole handler and its foreign-dialog check into a module already past its gzip goal, where the forwarder adds one line.
      - option: Hold the modal hidden until widgetfocus has loaded.
        why: Every first open would wait an extra request before it shows.
    upholds: [escape-waits-for-widgetfocus]
