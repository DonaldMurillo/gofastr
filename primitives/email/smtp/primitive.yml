primitive: email.smtp
summary: SMTPSender, which dials with a bounded deadline, requires transport encryption unless told otherwise, authenticates with an advertised mechanism and sends a normalized envelope.
code:
  - battery/email/smtp.go
  - battery/email/smtp_auth.go
docs:
  - framework/docs/content/email.md
invariants:
  - id: fails-closed-without-tls
    rule: Without implicit TLS, a server that does not offer STARTTLS, or a failed STARTTLS, ends the send unless AllowCleartext is set.
    enforced_by:
      - test: battery/email.TestSMTP_NoCleartextWhenSTARTTLSUnavailable
  - id: exchange-is-bounded
    rule: The dial is bounded by DialTimeout, the same budget is the connection's deadline for the whole exchange, and cancelling the context closes the connection.
    enforced_by:
      - test: battery/email.TestSMTP_StalledServerDoesNotWedge
      - test: battery/email.TestSMTPCancelEndsStalledSend
  - id: accepted-is-sent
    rule: Once the relay accepts the DATA, Send returns nil whatever QUIT does, and a refused DATA wraps ErrSendFailed.
    enforced_by:
      - test: battery/email.TestSendIgnoresQuitAfterAccept
      - test: battery/email.TestSendRejectedDataWrapsErrSendFailed
  - id: auth-uses-an-advertised-mechanism
    rule: The sender authenticates once with the first of CRAM-MD5, PLAIN and LOGIN the relay advertises, fails when none is, and names only SASL-shaped relay words in the error.
    enforced_by:
      - test: battery/email.TestSMTPAuthPrefersCRAM
      - test: battery/email.TestSMTPAuthCRAMOnlyRelay
      - test: battery/email.TestSMTPAuthPrefersPlainOverLogin
      - test: battery/email.TestSMTPAuthNoUsableMechanism
      - test: battery/email.TestSMTPAuthErrorDropsOddWords
  - id: login-only-over-tls-or-loopback
    rule: LOGIN refuses an unencrypted connection to a non-loopback host and a server name other than the configured host, as smtp.PlainAuth does.
    enforced_by:
      - test: battery/email.TestSMTPLoginAuthRefusals
  - id: envelope-is-normalized
    rule: MAIL FROM and RCPT TO carry each address's bare addr-spec, its local part quoted, and refuse a control byte or a local part holding <, > or @.
    enforced_by:
      - test: battery/email.TestSmtpEnvelopeParsesRecipients
      - test: battery/email.TestSmtpEnvelopeQuotesLocalPart
      - test: battery/email.TestSmtpEnvelopeRefusesPathBreak
  - id: one-mailbox-address
    rule: ValidateAddress accepts exactly one mailbox with no control byte or invisible codepoint.
    enforced_by:
      - test: battery/email.TestValidateAddressOneMailbox
  - id: recipients-do-not-alias-to
    rule: The RCPT list is a fresh slice of To, Cc then Bcc, so the caller's To is never written.
    enforced_by:
      - test: battery/email.TestSmtpDoesNotMutateCallerTo
decisions:
  - id: cleartext-is-opt-in
    date: 2026-11-20
    status: accepted
    decision: The sender refuses to send in cleartext unless SMTPConfig.AllowCleartext is set.
    rejected:
      - option: Fall back to cleartext when STARTTLS is not offered.
        why: An on-path attacker strips the STARTTLS capability, and the message and credentials then go out readable.
    upholds: [fails-closed-without-tls]
