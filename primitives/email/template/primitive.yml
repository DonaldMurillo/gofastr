primitive: email.template
summary: Email templates with subject, text and HTML bodies, loaded from a directory or fs.FS and executed against data.
code:
  - battery/email/template.go
docs:
  - framework/docs/content/email.md
invariants:
  - id: html-body-through-html-template
    rule: Execute renders HTMLBody with html/template, so data values are escaped for their context, and the subject and text with text/template.
    enforced_by:
      - test: battery/email.TestExecuteEscapesHTMLBodyVars
  - id: crlf-subject-line-loses-its-cr
    rule: A leading "Subject:" line read from a CRLF file loses its trailing CR, so the subject passes the header check.
    enforced_by:
      - test: battery/email.TestLoadFromFSCRLFSubject
  - id: inline-subject-is-template-metadata
    rule: 'Both loaders strip a leading "Subject: " line from each body that has one and choose the first non-empty subject from the trimmed .subject file, .txt line, and .html line in that order.'
    enforced_by:
      - test: battery/email.TestLoadPairedTemplateSubjects
