primitive: crud.relations.nested-filter
summary: The ?rel.field= filters, rendered as EXISTS subqueries over a relation's target.
code:
  - framework/crud/nested_filter.go
docs:
  - framework/docs/content/query-dsl.md
twins:
  - job: Validate a nested relation filter and resolve it to hops, a column and a typed value.
    why: The HTTP path reads suffix and bracket spellings and repeated keys from a query string while the in-process path takes a typed NestedFilter; nothing but the work of a shared spec keeps them apart.
    sites:
      - path: framework/crud/nested_filter.go
        note: parseNestedFiltersValues, for ?rel.field= keys.
      - path: framework/crud/nested_filter.go
        note: resolveNestedFilters, for ListOptions and TypedQuery NestedFilter specs.
invariants:
  - id: single-segment-identifiers
    rule: "A nested-filter field name and every key column spliced into the subquery is a single-segment SQL identifier; a relation table name is checked with query.SafeIdent and may be schema-qualified. Anything else is refused."
    enforced_by:
      - test: framework/crud.TestNestedFilter_SQLInjection
      - test: framework/crud.TestBuildExistsSubquery_UnsafeRelationIdentifiers
      - test: framework/crud.TestBuildExistsSubquery_UnsafeHopChain
  - id: subquery-carries-target-scope
    rule: The EXISTS subquery is narrowed by the target's owner, tenant and read-scope predicates on HTTP and in-process calls alike.
    enforced_by:
      - test: framework/crud.TestNestedFilterCountsOnlyTheCallersOwnRows
      - test: framework/crud.TestNestedFilterScopesTheManyToOneBranch
      - test: framework/crud.TestInProcessNestedFilterScopesByDefault
      - test: framework/crud.TestBuildExistsSubqueryEmitsScopePredicates
  - id: nested-filter-parses-like-top-level
    rule: A nested filter names a declared visible column (by column, wire or camelCase name) and reaches SQL as that column on both surfaces; over HTTP it splits its operator as filter.ReadKey does, checks its value against the column type, refuses a repeated scalar key and parses keys in sorted order.
    enforced_by:
      - test: framework/crud.TestNestedFilter_AcceptsWireNameAndEmitsColumn
      - test: framework/crud.TestNestedFilterBracketForm
      - test: framework/crud.TestNestedFilterValueTypeChecked
      - test: framework/crud.TestNestedLikeRefusesUnstorableText
      - test: framework/crud.TestNestedFilterRepeatedScalarKeyRefused
      - test: framework/crud.TestInProcessNestedFilterEmitsColumn
      - test: framework/crud.TestNestedFilterOrderIsStable
      - test: framework/crud.TestListAll_NestedFilterParity
    applies:
      - framework/filter/key.go
      - framework/filter/typed.go
  - id: nested-filter-identifiers
    rule: A nested field renders only as one plain identifier and a table as an identifier or a schema-qualified one, and a hop whose foreign key does not line up with the key it references joins nothing; anything else renders the filter as 1 = 0.
    enforced_by:
      - test: framework/crud.TestNestedFilterFieldIsOneIdentifier
      - test: framework/crud.TestTableQualifierRefusesInjection
      - test: framework/crud.TestNestedFilterMisalignedHopMatchesNothing
  - id: nested-filter-counts-only-readable-rows
    rule: Every hop of a nested filter's EXISTS carries the target's owner, tenant, read and soft-delete scope and its pivot's scopes; the target's and pivot's own BeforeList clauses join over HTTP, and in process under WithReadHooks only.
    enforced_by:
      - test: framework/crud.TestNestedFilterCountsOnlyTheCallersOwnRows
      - test: framework/crud.TestBuildExistsSubqueryHidesSoftDeletedInEveryShape
      - test: framework/crud.TestNestedFilterPivotScopesReachSQL
      - test: framework/crud.TestNestedFilterRunsChildBeforeList
      - test: framework/crud.TestNestedM2MRunsPivotBeforeList
      - test: framework/crud.TestInProcessM2MRunsPivotHooks
      - test: framework/crud.TestNestedFilterInProcessHookScopesAreOptIn
  - id: nested-filter-posture-is-http-only
    rule: Over HTTP a nested filter whose hop or pivot reaches an entity the caller may not read is refused; in process no posture is asked and only the scopes narrow.
    enforced_by:
      - test: framework/crud.TestScopeNestedFiltersForCallerStillRefusesUnreadableTargets
      - test: framework/crud.TestNestedFilterHopRefusesUnreadableTarget
      - test: framework/crud.TestPivotReadGateRBAC
      - test: framework/crud.TestListAll_NestedFilterParity
decisions:
  - id: narrow-not-refuse
    status: accepted
    decision: A nested filter across a scoped target is narrowed with the eagerScopeFilters predicates, always, in-process calls included.
    rejected:
      - option: Refuse every owner-scoped or multi-tenant target.
        why: It closed the row-count oracle but refused owners filtering their own rows.
      - option: Narrow only when the context carries realRequestKey.
        why: That marker never reaches ListAll or CountAll, so the narrowing branch was unreachable in production.
    revisit_if: Server code needs cross-owner reads through a nested filter; it must use owner.AllowCrossOwner or tenant.AllowCrossTenant, not a context marker.
    upholds: [subquery-carries-target-scope]
  - id: own-identifier-pattern
    status: accepted
    decision: Nested-filter field names and key columns use their own single-segment pattern, separate from core/query's, while relation table names go through query.SafeIdent.
    rejected:
      - option: Reuse core/query's identifier pattern.
        why: It admits a dotted schema.table, which would loosen the single-segment field rule.
    revisit_if: Multi-level field paths are ever allowed.
    upholds: [single-segment-identifiers]
  - id: nested-filter-uses-exists
    status: accepted
    decision: A nested filter is one EXISTS subquery per filter, the same SQL for every relation type.
    rejected:
      - option: A JOIN.
        why: It duplicates parent rows through has_many and many_to_many relations.
  - id: nested-posture-http-only
    status: accepted
    decision: The may-read posture check runs for HTTP nested filters only, while the scope predicates run on both surfaces.
    rejected:
      - option: Ask the posture in process too.
        why: In-process callers run with no session by construction, so it refused every nested filter a job or typed repo makes and protected nothing.
    upholds: [nested-filter-posture-is-http-only]
