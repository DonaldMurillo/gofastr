primitive: headless
summary: The structure half of the design system - components that render tags, roles, labels and data-hui-* hooks with no classes, a Classes value that maps parts to classes, and the behaviour module that binds the hooks.
code:
  - framework/headless/
docs:
  - framework/docs/content/ui-headless.md
  - core-ui/ARCHITECTURE.md
on_change:
  - A change to a component's markup moves its nil-Classes golden; regenerate it in the same change and read the diff.
  - Screenshot the rendered examples/meridian (marketing, app, auth, admin, phone width, light and dark) and look at it; a DOM dump or computed style cannot show layout.
