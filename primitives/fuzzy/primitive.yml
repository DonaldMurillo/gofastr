primitive: fuzzy
summary: String-similarity helpers (Levenshtein edit distance) shared by the framework's did-you-mean suggestions and the CLI, which cannot import each other.
code:
  - core/fuzzy/
docs:
  - framework/docs/content/core-packages.md
invariants:
  - id: levenshtein-is-edit-distance
    rule: Levenshtein and LevenshteinRunes share one recurrence, counting byte edits and rune edits respectively. Contract and owned-style suggestions count rune edits, and owned-style distance caps at cutoff plus one.
    enforced_by:
      - test: core/fuzzy.TestLevenshtein
      - test: core/fuzzy.TestLevenshteinRunes
      - test: framework/contracts.TestSweepEngineSuggestRulesKeepsTheDistanceRanking
      - test: core-ui/ownstyle.TestTokenSuggestionsKeepRuneDistanceAndCutoff
    applies:
      - framework/contracts/rule.go
      - core-ui/ownstyle/check.go
decisions:
  - id: two-rows-sized-to-shorter-input
    date: 2026-11-18
    status: accepted
    decision: The recurrence sizes both working rows to the shorter input. Byte and rune callers choose the unit of an edit.
    rejected:
      - option: Fill the full len(a)×len(b) matrix.
        why: Only the previous row is ever read, so the matrix is memory spent for nothing.
    revisit_if: A did-you-mean suggestion for non-ASCII input is reported missing, or a caller becomes slow. framework/filter caps query keys at 64 bytes (framework/filter.TestUnknownFilterKeyIsBounded), cmd/gofastr dispatch passes the raw first argument unbounded, and the RBAC admin grant route limits the request body to 1 MiB (battery/admin.TestOpsPostBodyIsCapped).
