primitive: fuzzy
summary: String-similarity helpers (Levenshtein edit distance) shared by the framework's did-you-mean suggestions and the CLI, which cannot import each other.
code:
  - core/fuzzy/
docs:
  - framework/docs/content/core-packages.md
invariants:
  - id: levenshtein-is-edit-distance
    rule: Levenshtein returns the minimum number of single-byte insertions, deletions and substitutions turning a into b, and the same value for b into a.
    enforced_by:
      - test: core/fuzzy.TestLevenshtein
decisions:
  - id: bytewise-two-rows
    date: 2026-11-18
    status: accepted
    decision: Levenshtein compares bytes and keeps two rolling rows, so memory is O(len(b)), and its callers bound the input length rather than the function.
    rejected:
      - option: Compare runes.
        why: The inputs are ASCII identifiers such as command and field names, where byte and rune distance agree, and decoding costs an allocation per call.
      - option: Fill the full len(a)×len(b) matrix.
        why: Only the previous row is ever read, so the matrix is memory spent for nothing.
    revisit_if: A caller passes non-ASCII text or input whose length it does not bound; framework/filter caps query keys at 64 bytes (framework/filter.TestUnknownFilterKeyIsBounded).
