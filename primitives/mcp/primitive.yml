primitive: mcp
summary: The MCP server, which registers tools, prompts and resources and answers their JSON-RPC methods.
code:
  - core/mcp/
docs:
  - framework/docs/content/mcp.md
twins:
  - job: Negotiate the MCP revision on initialize and check the MCP-Protocol-Version header on later HTTP requests.
    why: Work not yet done; the harness control-plane server answers initialize with a fixed 2024-11-05, a revision older than the header, and its HTTP transport never reads MCP-Protocol-Version, so the two servers disagree on which revisions a client may speak.
    sites:
      - path: core/mcp/protocol.go
        note: negotiateProtocolVersion, and refuseVersionHeader in core/mcp/transport.go.
      - path: framework/experimental/harness/control/mcpserver/server.go
        note: handleInitialize, which always answers 2024-11-05; its http.go reads no MCP-Protocol-Version.
  - job: Run an app-supplied gate or callback under a recover guard that logs the scrubbed panic and fails closed.
    why: Work not yet done; each site answers a different shape (a bool for listings and notifications, an RPCError for tools and prompts, a masked sentinel for Gated and resource gates), so one helper would need to return the error and let each caller map it.
    sites:
      - path: core/mcp/server.go
        note: gateRefused, checkToolGate, runCallGate, checkServerGate and invokeHandler.
      - path: core/mcp/gated.go
        note: gatedCall, for Gated wrappers.
      - path: core/mcp/resources.go
        note: readResourceContents, for the resource gate and contents func.
      - path: core/mcp/prompts.go
        note: getPromptMessages and checkPromptGate.
      - path: core/mcp/notifications.go
        note: gateAllows, for delivery-time notification gates.
  - job: Refuse JSON-RPC messages whose envelope or params hold duplicate or case-folded keys.
    why: core/mcp, core/acp, core/a2a and the harness control plane are separate JSON-RPC servers with their own request types; all call handler.CheckTopLevelKeys or UnmarshalStrict and handler.CheckObjectKeys, but answer a refused envelope differently (core/mcp -32700 or -32600 with a null id, core/acp -32700, core/a2a HTTP 400 with -32700, the harness -32602), and core/a2a decodes params with jsonexact to keep big integers.
    sites:
      - path: core/mcp/transport.go
        note: decodeEnvelope, the envelope decode every core/mcp transport runs.
      - path: core/mcp/protocol.go
        note: HandleRequest, the params check at the dispatch chokepoint.
      - path: framework/experimental/harness/control/mcpserver/server.go
        note: decodeRequest on the envelope and unmarshalMCPObject on params and arguments.
      - path: framework/experimental/harness/mcpclient/client.go
        note: readLoop on every line a spawned server sends.
      - path: core/moduleproto/codec.go
        note: Codec.ReadFrame on every host-to-module frame, refused as ErrInvalidFrame.
      - path: core/acp/server.go
        note: decodeEnvelope on each line and decodeParams on every params object.
      - path: core/a2a/server.go
        note: ServeHTTP's UnmarshalStrict on the body and decodeParams on params.
invariants:
  - id: one-callback-error-rule
    rule: tools/call, prompts/get and resources/read decide which callback error crosses the transport in one function, callerFacingError, so an RPCError (wrapped or not) crosses as itself, a typed 4xx handler.Error crosses as invalid params with its code, and every other error is answered with a generic message.
    enforced_by:
      - test: core/mcp.TestCallbackErrorAnswersAlikeOnEveryMethod
    judge: Does this change decide outside callerFacingError whether a tool, prompt or resource callback's error text reaches the client?
  - id: nil-gate-panics
    rule: WithToolGate, WithResourceGate, WithResourceTemplateGate, WithPromptGate and Gated panic on a nil gate.
    enforced_by:
      - test: core/mcp.TestNilGateOptionsPanic
  - id: request-id-is-scalar
    rule: HandleRequest refuses a request whose id is not a string, a number or null with -32600 and a null id, and one whose jsonrpc is not "2.0" with -32600.
    enforced_by:
      - test: core/mcp.TestNonScalarIDRefused
      - test: core/mcp.TestInvalidJSONRPCVersion
  - id: args-refusal-is-a-tool-error
    rule: On the wire, tools/call answers arguments that fail the tool's inputSchema with a result carrying isError true and the reason as its one text block, without running the handler, while CallTool and CallToolFor return an *RPCError with -32602 for the same arguments.
    enforced_by:
      - test: core/mcp.TestArgsRefusalIsToolExecutionError
      - test: core/mcp.TestToolCallArgsMatchInputSchema
  - id: not-found-codes
    rule: tools/call answers an unknown or hidden tool with -32602 and resources/read answers an unknown or hidden resource with -32002 (ErrResourceNotFound); -32601 is kept for an unknown method.
    enforced_by:
      - test: core/mcp.TestNotFoundCodes
      - test: core/mcp.TestCallTool_UnknownTool
      - test: core/mcp.TestResourcesRead_Unknown
  - id: icons-are-safe-urls
    rule: WithToolIcons, WithResourceIcons, WithResourceTemplateIcons and WithPromptIcons panic, and SetServerDetails errors without changing serverInfo, on an icon whose src is not an https URL with a host or a data URI with a payload, or whose theme is not empty, light or dark; SetServerDetails also refuses a websiteUrl that is not https.
    enforced_by:
      - test: core/mcp.TestIconOptionsRefuseUnsafeSrc
      - test: core/mcp.TestServerDetailsInInitialize
      - test: core/mcp.TestIconsAppearInListings
  - id: tool-arguments-are-an-object
    rule: tools/call answers -32602 before the tool is looked up when arguments is present and is not a JSON object, null included; omitted arguments reach the tool as a nil map.
    enforced_by:
      - test: core/mcp.TestToolsCallRefusesNullArguments
  - id: params-refuse-ambiguous-keys
    rule: HandleRequest answers -32602 before dispatch when any object at any depth of params repeats a key or holds two keys that case-fold onto each other.
    enforced_by:
      - test: core/mcp.TestParamsDuplicateKeysRefused
  - id: server-gate-covers-data-surface
    rule: The server-wide gate (SetGate) runs before tools/list, tools/call, resources/list, resources/read, resources/templates/list, resources/subscribe, resources/unsubscribe, prompts/list and prompts/get, and never before initialize, ping or server/discover; its refusal answers through gateRefusal.
    enforced_by:
      - test: core/mcp.TestDiscoverStaysOpenUnderServerGate
      - test: core/mcp.TestServerGateClosesListAndCall
      - test: core/mcp.TestServerGateClosesResourceSubscribe
      - test: core/mcp.TestInitializeAndPingStayOpenUnderServerGate
  - id: version-negotiation
    rule: initialize answers the client's protocolVersion when it is one of HandshakeProtocolVersions (2025-11-25, 2025-06-18, 2025-03-26), and LatestHandshakeVersion for any other, missing or non-string value, 2026-07-28 included, because that revision has no handshake.
    enforced_by:
      - test: core/mcp.TestInitializeNegotiatesVersion
      - test: core/mcp.TestSupportedProtocolVersionsList
  - id: version-header-checked
    rule: For a request whose params carry no _meta protocolVersion, ServeHTTP and ServeSSE (POST and GET) answer 400 with -32600 and the SupportedProtocolVersions list in error data when the MCP-Protocol-Version header names a revision initialize does not negotiate, or is repeated (then saying "repeated"); the reply carries the request id when it is a string, a number or null, and a null id otherwise. An absent header, a supported one (the GET stream opens and sends its endpoint event), or any header on initialize, is served.
    enforced_by:
      - test: core/mcp.TestVersionHeaderRefusesUnsupported
      - test: core/mcp.TestVersionHeaderLeavesInitializeToNegotiation
      - test: core/mcp.TestVersionHeaderRefusesNotification
      - test: core/mcp.TestVersionHeaderRefusesStream
      - test: core/mcp.TestVersionHeaderOpensStreamWhenSupported
      - test: core/mcp.TestVersionHeaderRepeatedSaysRepeated
      - test: core/mcp.TestVersionHeaderRefusalNullsInvalidID
  - id: transport-refusals-null-invalid-ids
    rule: A refusal the HTTP transports answer before HandleRequest (an unsupported MCP-Protocol-Version header, a modern header mismatch) answers under the request's id when it is a string, a number or null, and under a null id otherwise.
    enforced_by:
      - test: core/mcp.TestVersionHeaderRefusalNullsInvalidID
      - test: core/mcp.TestModernHeaderMismatchNullsInvalidID
  - id: modern-requests-are-stateless
    rule: A request whose params._meta carries io.modelcontextprotocol/protocolVersion is served without initialize under that revision; a non-string value answers -32602 and a revision outside the modern list (2026-07-28) answers -32022 with data.supported listing SupportedProtocolVersions and data.requested echoing at most 64 bytes of the request.
    enforced_by:
      - test: core/mcp.TestModernUnsupportedVersion
      - test: core/mcp.TestModernOverStdio
  - id: modern-result-fields
    rule: Every successful modern result carries resultType complete and _meta io.modelcontextprotocol/serverInfo, and the results of server/discover, tools/list, prompts/list, resources/list, resources/templates/list and resources/read also carry ttlMs 0 and cacheScope private; a request served under an initialize-negotiated revision gets none of these fields.
    enforced_by:
      - test: core/mcp.TestModernResultFields
  - id: server-discover
    rule: server/discover answers, with or without _meta, supportedVersions (SupportedProtocolVersions), the modern capabilities (tools always, resources and prompts when registered, with listChanged and resources subscribe only when the request arrived on ServeSSE's POST), instructions when set, and the modern result fields.
    enforced_by:
      - test: core/mcp.TestServerDiscover
      - test: core/mcp.TestListenOnlyOnStreamingTransport
  - id: modern-removed-methods
    rule: A modern request for initialize, ping, resources/subscribe, resources/unsubscribe or any unknown method answers -32601, and a modern resources/read of an unknown or hidden resource answers -32602 instead of -32002.
    enforced_by:
      - test: core/mcp.TestModernRemovedMethodsAndCodes
  - id: modern-http-headers
    rule: Over ServeHTTP and ServeSSE, a modern request answers 400 with -32020 (ErrHeaderMismatch) unless it carries exactly one MCP-Protocol-Version equal to its _meta version, one Mcp-Method equal to its method, and for tools/call, resources/read and prompts/get one Mcp-Name equal to params.name or params.uri after decoding a =?base64?...?= sentinel, each in visible ASCII, space or tab; a request without _meta protocolVersion under a modern MCP-Protocol-Version header answers the same, except server/discover.
    enforced_by:
      - test: core/mcp.TestModernHTTPHeaders
      - test: core/mcp.TestModernHTTPStatusMapping
  - id: modern-http-status
    rule: Over HTTP, -32020, -32021 and -32022 answer 400, a modern -32601 answers 404, and every other response, legacy -32601 included, answers 200; a GET under a modern MCP-Protocol-Version header answers 405.
    enforced_by:
      - test: core/mcp.TestModernHTTPStatusMapping
      - test: core/mcp.TestModernGETRefused
  - id: listen-delivers-only-what-was-asked
    rule: A modern subscriptions/listen on ServeSSE answers an event stream whose first message is notifications/subscriptions/acknowledged with the honored filter, after which only the notification types the filter set and resources/updated for its listed URIs are delivered, each carrying _meta io.modelcontextprotocol/subscriptionId equal to the request id, and each still passing the server-wide gate and the resource's gate.
    enforced_by:
      - test: core/mcp.TestListenFiltersAndTags
      - test: core/mcp.TestListenHonorsResourceGate
  - id: listen-releases-on-close
    rule: A listen stream holds one subscriber seat and one count per distinct listed URI from open to close, and closing it releases exactly those, so NotifyResourceUpdated stops reaching a URI no open stream lists.
    enforced_by:
      - test: core/mcp.TestListenReleasesOnClose
  - id: listen-refusals
    rule: subscriptions/listen answers a JSON-RPC error without opening a stream when its envelope fails the checks HandleRequest applies (refuseEnvelope), the server-wide gate refuses, the filter is malformed (a non-boolean flag, a non-array or over-256 URI list, an empty or over-2048-byte URI), or holding its URIs would pass the resources/subscribe limits (1024 distinct URIs, 4096 caller-URI pairs, 256 distinct URIs per caller across all its streams); it answers -32601 on ServeHTTP, stdio or HandleRequest, which hold no streams.
    enforced_by:
      - test: core/mcp.TestListenRefusals
      - test: core/mcp.TestListenRefusesAmbiguousEnvelope
      - test: core/mcp.TestListenCapsURIsPerCaller
      - test: core/mcp.TestListenOnlyOnStreamingTransport
  - id: capabilities-follow-registries
    rule: initialize always advertises tools, advertises resources (with subscribe) when a resource or a resource template is registered, and prompts only when a prompt is registered.
    enforced_by:
      - test: core/mcp.TestTemplatesAdvertiseResources
      - test: core/mcp.TestResourcesCapability_OnlyWhenRegistered
      - test: core/mcp.TestInitializeOmitsPromptsWhenEmpty
  - id: cursor-is-unforgeable
    rule: A list cursor carries only its method and resume offset under an HMAC keyed by a per-server random secret, and a cursor that is malformed, tampered, minted for another list method or holds a negative offset answers -32602 "invalid cursor".
    enforced_by:
      - test: core/mcp.TestForgedCursorIsRejected
  - id: paging-walks-post-gate-sorted-listing
    rule: tools/list, resources/list, resources/templates/list and prompts/list drop items the caller's gates refuse and sort by name, URI or uriTemplate before the page is cut, so a gated item never appears on a page or counts toward an offset.
    enforced_by:
      - test: core/mcp.TestPagingNeverRevealsGatedItems
      - test: core/mcp.TestListPaginationCoversAllItems
  - id: page-boundaries
    rule: A listing that fits one page carries no nextCursor, a cursor at or past the end answers an empty page with no nextCursor and no error, and the page end is computed without integer overflow for any page size.
    enforced_by:
      - test: core/mcp.TestListShortSetOmitsNextCursor
      - test: core/mcp.TestStaleCursorPastEndEmptyPage
      - test: core/mcp.TestListHugePageSizeDoesNotOverflow
  - id: panicking-gate-fails-closed
    rule: A gate or callback that panics never unwinds the transport; a listing hides the item, a direct call answers as an unknown name, and a handler panic answers -32603 with a generic message.
    enforced_by:
      - test: core/mcp.TestSweepPanickingGatesMaskAsUnknown
      - test: core/mcp.TestPanickingGateFailsClosedEverywhere
      - test: core/mcp.TestCallGatePanicRedScrubbed
      - test: core/mcp.TestServerGatePanicRedScrubbed
  - id: initialize-serves-instructions
    rule: initialize carries instructions exactly when SetInstructions set non-empty text, and the text as set.
    enforced_by:
      - test: core/mcp.TestInitializeServesInstructions
decisions:
  - id: listen-on-serve-sse-only
    date: 2026-11-28
    status: accepted
    decision: subscriptions/listen is served on ServeSSE's POST only, and server/discover advertises listChanged and subscribe only to requests that arrived there.
    rejected:
      - option: Serve listen on stdio too.
        why: ServeStdio answers one line at a time from a single loop and writes nothing unprompted, so listen there needs a locked writer, a goroutine per subscription and notifications/cancelled handling; left for when a stdio client needs change notifications.
      - option: Advertise listChanged everywhere.
        why: A client would wait on a stream ServeHTTP and stdio can never open.
    revisit_if: A stdio MCP client relies on change notifications under 2026-07-28.
    upholds: [listen-refusals, server-discover]
  - id: dual-era-server
    date: 2026-11-28
    status: accepted
    decision: The server speaks 2026-07-28 per request (chosen by params._meta protocolVersion) beside the initialize-negotiated 2025-11-25, 2025-06-18 and 2025-03-26 on the same endpoint and process, as the spec's dual-era server.
    rejected:
      - option: Move to 2026-07-28 only.
        why: Every client released before mid-2026 speaks only the handshake revisions and has no fall-forward path, so a modern-only server would cut them off.
      - option: Pick the era per connection or session.
        why: The server keeps no sessions; the era of each request is decidable from its own body, which is what the spec prescribes for a dual-era server.
    revisit_if: The spec removes the handshake revisions, or the clients that matter all speak 2026-07-28.
    upholds: [modern-requests-are-stateless, version-negotiation]
  - id: private-zero-ttl-cache-hints
    date: 2026-11-28
    status: accepted
    decision: Cacheable modern results carry ttlMs 0 and cacheScope private, with no setting to change them.
    rejected:
      - option: cacheScope public for tools/list, prompts/list and resources/templates/list.
        why: Gates make every listing per caller, and a public response may be shared across authorization contexts by a gateway.
      - option: A positive default TTL.
        why: Registries change at run time (RegisterTool, UnregisterTool) and 2026-07-28 change notifications arrive only on subscriptions/listen, so a client trusting a TTL could call a tool that is gone.
    revisit_if: An app needs clients or gateways to cache listings, which needs a per-server setting that knows whether its gates vary by caller.
    upholds: [modern-result-fields]
  - id: spec-error-codes
    date: 2026-11-28
    status: accepted
    decision: An unknown or gate-hidden tool answers -32602 and an unknown or gate-hidden resource answers -32002, as the 2025-11-25 tools and resources pages specify, instead of the -32601 both answered before.
    rejected:
      - option: Keep -32601 for both.
        why: -32601 means the JSON-RPC method does not exist, so a client cannot tell an unknown tool from a server without tools/call; the spec examples name -32602 and -32002.
    revisit_if: A modern (2026-07-28) request is served, whose resources page names -32602 for an unknown resource.
    upholds: [not-found-codes]
  - id: args-refusal-as-tool-error
    date: 2026-11-28
    status: accepted
    decision: Arguments that fail the inputSchema answer tools/call as an isError tool result for every negotiated version, while the Go API keeps returning an RPCError.
    rejected:
      - option: Only for clients that negotiated 2025-11-25.
        why: The spec change is a clarification (SEP-1303) of what an input validation error is, the server keeps no per-session version on HTTP, and the result shape is valid in every revision it speaks.
      - option: Return the isError result from CallTool too.
        why: Go callers branch on the RPCError code; a result value would hide the refusal from them.
    upholds: [args-refusal-is-a-tool-error]
  - id: callback-errors-share-one-function
    date: 2026-11-16
    status: accepted
    decision: callTool and handlerErrorResponse both ask callerFacingError; callTool's inline typed-4xx branch and handlerErrorResponse's own unwrapped RPCError type assertion are removed.
    rejected:
      - option: Keep the prompt and resource copy and add the missing cases to it.
        why: It was the second copy of the rule and had already drifted, answering a wrapped RPCError and a typed 4xx as internal errors where tools/call let them cross.
    upholds: [one-callback-error-rule]
  - id: refuse-ambiguous-keys-at-dispatch
    date: 2026-11-18
    status: accepted
    decision: Duplicate and case-folded keys in params are refused once, at HandleRequest, for every method that decodes params.
    rejected:
      - option: Plain encoding/json decoding of params.
        why: It keeps the last duplicate and folds key case, so a proxy, WAF or audit log reading the first occurrence and the dispatcher could disagree on which tool ran or which uri was read.
      - option: A check in each method handler.
        why: A new method would ship without it.
    upholds: [params-refuse-ambiguous-keys]
  - id: handshake-outside-server-gate
    date: 2026-11-18
    status: accepted
    decision: initialize, ping and server/discover stay outside the server-wide gate.
    rejected:
      - option: Gate the handshake too.
        why: It carries only the protocol version, capability booleans and the server name, and no MCP client can present credentials before it completes the handshake.
    upholds: [server-gate-covers-data-surface]
  - id: protocol-versions
    date: 2026-11-18
    status: accepted
    decision: initialize negotiates 2025-11-25, 2025-06-18 and 2025-03-26 and leaves 2024-11-05 off; 2026-07-28 is served per request.
    rejected:
      - option: Also accept 2024-11-05.
        why: Its HTTP+SSE transport answers each POST with 202 and delivers the response on the stream, while this server answers in the POST body, so such a client would wait forever.
    revisit_if: A 2025-03-26 client depends on JSON-RPC batches, which that revision requires and this server answers with an invalid-request error.
    upholds: [version-negotiation]
  - id: signed-offset-cursors
    date: 2026-11-18
    status: accepted
    decision: List cursors are "v1.<payload>.<hmac>" with only the method and offset in the payload, authenticated but not encrypted, under a per-process secret.
    rejected:
      - option: A plain offset as the cursor.
        why: A client could mint any offset, negative or mid-set, or reuse a cursor across list methods.
      - option: Carry the total count or page size in the cursor.
        why: The cursor would become an oracle for how many items exist.
      - option: A secret that survives restarts.
        why: A restart only makes the client restart the walk from page 1, which the spec's repeat-until-absent loop handles.
    upholds: [cursor-is-unforgeable]
  - id: page-size-one-hundred
    date: 2026-11-18
    status: accepted
    decision: Every list method serves pages of 100 items.
    rejected:
      - option: A smaller page.
        why: Every listing a GoFastr app serves today fits in 100, so a client written before pagination sees the same single-page response.
    upholds: [page-boundaries]
