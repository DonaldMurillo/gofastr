primitive: cli.appspec
summary: The app spec model behind gofastr generate, validate and pack, the gofastr.yml types and the queries, names and lookup tables every reader of a spec shares; each child owns one job on it.
code:
  - cmd/gofastr/internal/appspec/doc.go
  - cmd/gofastr/internal/appspec/model.go
  - cmd/gofastr/internal/appspec/casing.go
  - cmd/gofastr/internal/appspec/generate.go
  - cmd/gofastr/internal/appspec/generate_keys.go
docs:
  - framework/docs/content/app-spec.md
on_change:
  - appspec.go, the spec types, is still owned by appgen; a change to a type there updates the decoder, the validator and pack's reader here in the same commit.
