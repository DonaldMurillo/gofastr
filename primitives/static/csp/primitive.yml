primitive: static.csp
summary: The Content-Security-Policy an export carries - the built-in default, the check that refuses unsafe policies, the per-page meta tags and the _headers file.
code:
  - framework/static/csp.go
docs:
  - framework/docs/content/static-export.md
  - framework/docs/content/security.md
on_change:
  - The built-in policy is the default core/middleware.SecurityHeaders serves plus object-src 'none' and form-action 'self'; a change to that default is made here too.
invariants:
  - id: default-policy
    rule: With no ContentSecurityPolicy set, the export carries default-src 'self', img-src 'self' data:, object-src 'none', worker-src 'self', form-action 'self', frame-ancestors 'none', base-uri 'none', and, unless NoTrustedTypes is set, middleware.TrustedTypesDirectives of TrustedTypesPolicies, which ExportStatic copies from the app's SecurityHeaders.
    enforced_by:
      - test: framework/static.TestStaticExportShipsCSP
      - test: framework/static.TestSweepStaticDefaultCSPDirectives
      - test: framework/static.TestExportFollowsTrustedTypesSettings
  - id: unsafe-policy-refused
    rule: Build refuses a policy holding a nonce source in any case, a control byte other than tab, a double quote or an angle bracket.
    enforced_by:
      - test: framework/static.TestExportCSPRefusesUnsafeShapes
      - test: framework/static.TestSweepStaticCSPRefusesAngleBrackets
  - id: meta-per-policy
    rule: Each page, redirect page and the offline page gets one CSP meta per comma-separated policy right after <head>, without frame-ancestors, report-uri and sandbox and with & escaped, unless the page already carries a CSP meta.
    enforced_by:
      - test: framework/static.TestExportCSPOneMetaPerPolicy
      - test: framework/static.TestExportUsesConfiguredCSP
      - test: framework/static.TestPWAOfflinePageCarriesCSP
      - test: framework/static.TestExportWritesRedirectPages
      - test: framework/static.TestSweepStaticCSPMeta
  - id: headers-file
    rule: The root _headers carries the full policy with X-Content-Type-Options nosniff and the Referrer-Policy, and no contributor or copied file replaces it.
    enforced_by:
      - test: framework/static.TestStaticExportShipsCSP
      - test: framework/static.TestExportUsesConfiguredCSP
      - test: framework/static.TestContributorRefusesHostRules
      - test: framework/static.TestExtraDirsKeepGeneratedHostRules
decisions:
  - id: meta-and-headers-file
    date: 2026-11-17
    status: accepted
    decision: The policy ships both as a meta in every page and as a _headers file.
    rejected:
      - option: The meta alone.
        why: A meta-delivered policy ignores frame-ancestors, so the clickjacking guard needs a real header.
      - option: The _headers file alone.
        why: S3 and GitHub Pages ignore it, and a static export there would carry no policy at all.
    upholds: [meta-per-policy, headers-file]
  - id: refuse-nonce-sources
    date: 2026-11-17
    status: accepted
    decision: A nonce source fails the build.
    rejected:
      - option: Keep it in the exported policy.
        why: A file gives every visitor the same nonce, so any injected script can carry it, and the export links every script so no page needs one.
    upholds: [unsafe-policy-refused]
  - id: base-uri-none
    date: 2026-11-18
    status: accepted
    decision: The default policy, live and exported, sends base-uri 'none' and names worker-src 'self'.
    rejected:
      - option: Keep base-uri 'self'.
        why: No framework page emits a <base> element, and 'self' still lets an injected same-origin <base> move every relative URL on the page.
      - option: Leave worker-src to fall back to default-src.
        why: The fallback gives the same answer for the default, but worker-src falls back to script-src, so a policy that adds a CDN to script-src would let workers load from it too. A host policy set with WithSecurityHeaders replaces the default whole and keeps workers same-origin only if it names worker-src 'self' itself.
    upholds: [default-policy]
