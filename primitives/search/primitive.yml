primitive: search
summary: Keyword search documents and exact field filters across memory, SQLite and Postgres.
code:
  - battery/search/
docs:
  - framework/docs/content/search.md
invariants:
  - id: reject-nul-in-fields-and-filters
    rule: The built-in search backends refuse NUL bytes in encoded document field keys and string values and in exact field filter keys and values before indexing or searching.
    enforced_by:
      - test: battery/search.TestSearchFieldNULParity
  - id: sql-erasers-key-on-owner
    rule: The SQL backends register a datexport eraser per table, the SQLite prefix companion included, that deletes rows by the owner column.
    enforced_by:
      - test: battery/search.TestEraseRemovesSQLiteDocuments
      - test: battery/search.TestEraseRemovesPostgresDocuments
  - id: query-terms-are-capped
    rule: queryTerms keeps at most maxQueryTerms (64) distinct sanitized terms, and every backend queries with it.
    enforced_by:
      - test: battery/search.TestBuildTsQueryBounded
      - test: battery/search.TestBuildFts5QueryBounded
      - test: battery/search.TestSearchQueryTermsBounded
twins:
  - job: Match a sanitized query against indexed documents with Type and FieldEquals filters, the empty query matching all and a punctuation-only one none.
    why: Each backend speaks its own engine (Go word scan, tsvector and FTS5) and only queryTerms is shared; the parity is held by mirrored tests per backend.
    sites:
      - path: battery/search/memory.go
        note: Memory.Search, scoreTerms and matchesFields.
      - path: battery/search/postgres.go
        note: PostgresSearch.Search and searchAll.
      - path: battery/search/sqlite.go
        note: SQLiteFTS.Search, searchAll and appendFilters.
