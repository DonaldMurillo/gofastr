primitive: urlprefix
summary: Locale-prefix rewriting of response URLs and tolerant HTML detection shared with dev injection.
code:
  - core-ui/urlprefix/
  - internal/mediatype/
invariants:
  - id: html-detection-is-case-insensitive
    rule: HTML detection is case-insensitive and ignores parameters, including malformed or whitespace-delimited parameters, accepting surrounding whitespace but rejecting text/htmlish, an empty type, application/json and application/xhtml+xml.
    enforced_by:
      - test: internal/mediatype.TestIsHTML
      - test: core-ui/urlprefix.TestMiddlewareRewritesMixedCaseHTML
      - test: core-ui/urlprefix.TestMiddlewareRejectsInvalidHTMLMediaType
      - test: framework/dev.TestInjectorMixedCaseHTML
    applies:
      - framework/dev/htmlinject.go
