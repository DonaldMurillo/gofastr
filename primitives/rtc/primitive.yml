primitive: rtc
summary: The WebRTC signaling rooms, covering joins, seats, displacement and the fanout between replicas.
code:
  - battery/rtc/
docs:
  - framework/docs/content/rtc.md
invariants:
  - id: authorize-is-required
    rule: Mount, ServeHTTP and Init refuse a Signaler with no Config.Authorize.
    enforced_by:
      - test: battery/rtc.TestMountPanicsWithoutAuthorize
      - test: battery/rtc.TestServeHTTPPanicsWithoutAuthorize
      - test: battery/rtc.TestInitRefusesNilAuthorize
  - id: signal-cap-fits-the-read-limit
    rule: New panics when MaxSignalBytes plus the envelope does not fit the socket read limit, and on a negative cap.
    enforced_by:
      - test: battery/rtc.TestNewPanicsOnBadConfig
  - id: join-fields-are-bounded
    rule: A Join is refused unless its room is 1-128 printable ASCII bytes, role 0-32 and peer id 0-64 of the same, and user (0-128) and display name (0-64) hold no control bytes.
    enforced_by:
      - test: battery/rtc.TestValidJoinRefusesEachBadField
      - test: battery/rtc.TestJoinValidationRefused
  - id: refusal-reads-every-upgrade-line
    rule: A refused join is a WebSocket close with code 4000 plus the status when any Upgrade field line names websocket, and a plain HTTP status otherwise.
    enforced_by:
      - test: battery/rtc.TestRefusalReadsEveryUpgradeLine
      - test: battery/rtc.TestAuthorizeRefusalReachesSocket
  - id: displaced-socket-closes-off-the-caller
    rule: A socket a rejoin, a seat cap or Kick pushes out is closed by closeDetached on another goroutine, and one a join displaces is first unregistered from its room by detachLocked, so no join and no Kick waits out the old socket's close handshake, and the old socket still gets its Close frame.
    enforced_by:
      - test: battery/rtc.TestClosingADisplacedSocketBlocksNoOneElse
    judge: Does this change close a room peer's socket on the goroutine that holds or just held the Signaler's lock, instead of through closeDetached?
  - id: stale-join-mirror-keeps-the-live-socket
    rule: A remote join mirror whose seat Order is no newer than the local socket of the same id is dropped and displaces nothing, whenever it is published, because remoteJoinLocked compares the mirror's seat Order and never its publish clock At.
    enforced_by:
      - test: battery/rtc.TestLateJoinMirrorDoesNotKickTheMovedPeer
      - test: battery/rtc.TestJoinMirrorPublishedLateIsStillStale
    judge: Does this change decide whether a remote join displaces a local socket from the message's publish time At instead of the seat's Order?
  - id: held-test-lane-keeps-publish-order
    rule: The tests' heldFanout delivers a released lane in publish order, queueing arrivals during the drain behind the held messages, as the bus delivers one subscriber's messages.
    enforced_by:
      - test: battery/rtc.TestHeldFanoutReleaseKeepsOrder
decisions:
  - id: one-displacement-path
    date: 2026-11-16
    status: accepted
    decision: Every site that pushes a socket out (a rejoin, the seat cap, a join another replica reports, a peer whose signal was lost and Kick) closes it through closeDetached, and the join sites unregister it through detachLocked; the join's own inline Close calls and each site's own go conn.Close() loop are removed.
    rejected:
      - option: Keep closing the replaced socket on the joining goroutine.
        why: Close waits for the peer's close handshake, up to CloseTimeout on a half-open socket, and the new socket waited that long to join.
    upholds: [displaced-socket-closes-off-the-caller]
