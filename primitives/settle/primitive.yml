primitive: settle
summary: The bounded, detached context an outcome write runs on after its unit of work returned, and the timeout that bounds it, in internal/settle.
code:
  - internal/settle/
  - internal/analyzers/settlectx/
twins:
  - job: Bound an outcome write after its unit of work returned at 10s on a context detached from the caller.
    why: battery/queue and battery/webhook stay unmountable, and unmount refuses a package that imports a gofastr internal/ package; each keeps a settleTimeout pinned to settle.Timeout.
    sites:
      - path: internal/settle/settle.go
        note: Timeout and Context.
      - path: battery/queue/db.go
        note: settleTimeout and settleContext.
      - path: battery/webhook/webhook.go
        note: settleTimeout, also used by inbound.go's ProcessInbound.
invariants:
  - id: settle-context-result-is-selected-by-index
    rule: Settlectx follows the selected context result of named helpers and immediately called function literals through assignments and forwarded returns, with imported detachment facts keyed by result index.
    enforced_by:
      - test: internal/analyzers/settlectx.TestSettleCtx
  - id: settle-context-is-detached-and-bounded
    rule: An outcome write after its handler, delivery or run returned runs on settle.Context - WithoutCancel plus a Timeout bound - and framework/entityui takes the timeout and helper from here; queue and webhook keep copies whose timeout equals settle.Timeout.
    enforced_by:
      - analyzer: settlectx
      - test: battery/queue.TestSettleTimeoutMatchesSettle
      - test: battery/webhook.TestSettleTimeoutMatchesSettle
      - test: cmd/gofastr/internal/unmountcmd.TestUnmountableBatteriesImportNoInternal
    judge: Does a new settle-style outcome write take its context and timeout from internal/settle instead of declaring its own?
decisions:
  - id: one-settle-owner
    date: 2026-11-19
    status: accepted
    decision: The 10s settle timeout and the WithoutCancel helper moved to internal/settle, deleting entityui's bulkSettleTimeout and webhook's inboundSettleTimeout (folded into webhook's settleTimeout); queue and webhook keep one pinned copy each so they stay unmountable.
    rejected:
      - option: battery/queue exports the const and helper
        why: framework/entityui cannot import a battery package, and no framework package should grow one.
    upholds: [settle-context-is-detached-and-bounded]
