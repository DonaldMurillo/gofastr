primitive: localrun.securedir
summary: The per-OS check that the registry directory and its files belong to the current user and are not open to others, on Unix by mode and owner and on Windows by the token's owner.
code:
  - framework/localrun/securedir.go
  - framework/localrun/securedir_unix.go
  - framework/localrun/securedir_windows.go
docs:
  - framework/docs/content/local-runs.md
on_change:
  - "securedir_windows.go builds only on Windows: check it with GOOS=windows go vet ./framework/localrun/."
