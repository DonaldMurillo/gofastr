primitive: appgen
summary: The gofastr generate driver, which reads the project, plans and runs each generator, and writes their files; each child renders one kind of output.
code:
  - cmd/gofastr/internal/appgen/generate.go
  - cmd/gofastr/internal/appgen/generators.go
  - cmd/gofastr/internal/appgen/codegen_entries.go
  - cmd/gofastr/internal/appgen/validate.go
  - cmd/gofastr/internal/appgen/doc.go
  - cmd/gofastr/internal/appgen/[a-fh-np-z]*_test.go
  - cmd/gofastr/internal/appgen/gen_[^o]*_test.go
  - cmd/gofastr/internal/appgen/gen[^_e]*_test.go
  - cmd/gofastr/internal/appgen/generat[^e]*_test.go
  - cmd/gofastr/internal/appgen/generate[^_]*_test.go
  - cmd/gofastr/internal/appgen/generate_test.go
  - cmd/gofastr/internal/appgen/generate_[^cs]*_test.go
  - cmd/gofastr/internal/appgen/generate_c[^l]*_test.go
  - cmd/gofastr/internal/appgen/generate_cli[^_]*_test.go
  - cmd/gofastr/internal/appgen/generate_s[^d]*_test.go
  - cmd/gofastr/internal/appgen/generate_sdk_test.go
  - cmd/gofastr/internal/appgen/generate_sdk_[^o]*_test.go
  - cmd/gofastr/internal/appgen/generate_sdk_ops_test.go
  - cmd/gofastr/internal/appgen/generate_sdkjs_[^o]*_test.go
  - cmd/gofastr/internal/appgen/testdata/
docs:
  - framework/docs/content/app-spec.md
  - framework/docs/content/entity-declarations.md
  - framework/docs/content/codegen.md
invariants:
  - id: discovered-config-runs-no-command
    rule: A codegen config found by discovery rather than named with --config may not run a command extension.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestDiscoverGenerateConfigKeepsRefusedConfig
  - id: app-generate-is-one-shot
    rule: gofastr generate app refuses to write over any existing target file, the endpoints section of a settings file included, unless --force, and --force names every hand-edited file it replaces.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestOverwriteErrorNamesAddPath
      - test: cmd/gofastr/internal/appgen.TestAppConflictIsOneJSON
      - test: cmd/gofastr/internal/appgen.TestGenerateRefusesOverwritingSettingsEndpoints
      - test: cmd/gofastr/internal/generatecmd.TestForceNamesHandEditedFiles
  - id: add-extends-only-what-it-can
    rule: --add and generate entity|screen refuse a project with the aggregated entities/register.go or screens.go layout, union the project's entities first so a redeclaration (matched by its file name, case and separators folded) is skipped, and write only files that are absent.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestAddRefusesLegacyLayout
      - test: cmd/gofastr/internal/appgen.TestScaffoldEntityRefusesLegacyLayout
      - test: cmd/gofastr/internal/appgen.TestAddRefusesAggregatedScreensLayout
      - test: cmd/gofastr/internal/appgen.TestAddEntityCaseVariantIsRedeclaration
      - test: cmd/gofastr/internal/appgen.TestAddRedeclaredEntitySkipped
  - id: config-lists-only-derived-generators
    rule: A codegen config that lists a scaffold generator (app, entity, screen or package, and no other) by name is refused, since plain gofastr generate and every build re-run the config, while an extension that shares the name is allowed.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestConfigRefusesScaffoldGenerators
      - test: cmd/gofastr/internal/appgen.TestScaffoldGeneratorsAreExactlyTheOwnedWriters
      - test: cmd/gofastr/internal/appgen.TestConfigAllowsExtensionNamedLikeScaffold
      - test: cmd/gofastr/internal/appgen.TestGenerateConfigScaffoldExits
  - id: settings-entries-are-strict
    rule: A cli or sdk settings entry refuses an unknown key, a value of the wrong type, a comma string where a list belongs and a verbs item carrying --verbs syntax, naming the entry's index.
    enforced_by:
      - test: cmd/gofastr/internal/generatecmd.TestSettingsRefusesBadCLIEntry
      - test: cmd/gofastr/internal/generatecmd.TestGenerateSDKRefusesCommaString
      - test: cmd/gofastr/internal/generatecmd.TestGenerateCLIRefusesBadEntry
      - test: cmd/gofastr/internal/generatecmd.TestSettingsErrorKeepsEntryIndex
  - id: printed-entry-reads-back
    rule: The cli entry printed after a flag-driven run reads back as the same options, quoting every value YAML would read as another type or an alias, and refusing a value that is not UTF-8.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestCLIEntryYAMLRoundTrips
      - test: cmd/gofastr/internal/appgen.TestCLIEntryYAMLQuotesStar
      - test: cmd/gofastr/internal/appgen.TestCLIEntryYAMLRefusesNonUTF8
      - test: cmd/gofastr/internal/appgen.TestYAMLScalarQuotesWhatYAMLReadsAsAnotherType
  - id: module-matches-go-mod
    rule: An app spec's app.module is derived from the enclosing go.mod when omitted, kept when there is none, and refused when it differs.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestModuleMismatchErrors
      - test: cmd/gofastr/internal/appgen.TestModuleDerivedFromGoMod
      - test: cmd/gofastr/internal/appgen.TestModuleKeptWithoutGoMod
decisions:
  - id: pin-the-framework-before-tidy
    date: 2026-11-28
    status: accepted
    decision: generate app requires the gofastr release matching this CLI in a go.mod that does not require gofastr yet (pinFrameworkRequire), before the user's first go mod tidy.
    rejected:
      - option: Leave the requirement to go mod tidy.
        why: Tidy resolves every missing import at @latest, so the generated axe_test.go's chromedp import landed on a chromedp that framework/testkit/axetest does not compile against; a required gofastr puts its own chromedp pin in the build list first.
  - id: no-module-is-a-warning
    date: 2026-11-28
    status: accepted
    decision: Generating an app where no go.mod encloses the directory warns and prints the go mod init command, instead of refusing.
    rejected:
      - option: Refuse, as a go.mod declaring a different module is refused.
        why: Generating into a directory that is about to become a module is legitimate, and app.module is declared, so the command that makes the code build can be printed instead of the work being rejected.
    upholds: [module-matches-go-mod]
