primitive: handler.crosssite
summary: The one cross-site request guard, the same-site hop, the session-refusal mark and the safe relative redirect check.
code:
  - core/handler/fetchmeta.go
  - core/handler/safepath.go
docs:
  - framework/docs/content/core-packages.md
invariants:
  - id: fetch-metadata-first
    rule: IsCrossSiteRequest is true for Sec-Fetch-Site cross-site, false for same-origin and none, and otherwise compares the Origin host with Host, where under same-site an absent, null or hostless Origin is cross-site and without Fetch Metadata it is not.
    enforced_by:
      - test: core/handler.TestIsCrossSiteRequest
      - test: core/handler.TestIsCrossSiteRequestStrictRefusesBareNullOrigin
  - id: forged-write-refused
    rule: RefuseCrossSite answers 403 to a method other than GET, HEAD and OPTIONS with a CORS-simple or absent Content-Type from a cross-site origin, and passes everything else.
    enforced_by:
      - test: core/handler.TestRefuseCrossSite
      - test: core/handler.TestIsForgeableRequest
  - id: hop-ends
    rule: NeedsSameSiteHop is true for a cross-site request and for one with no Sec-Fetch-Site and no hop marker, and SameSiteHopTarget adds the marker only when the request had no Sec-Fetch-Site and the target lacks it.
    enforced_by:
      - test: core/handler.TestNeedsSameSiteHop
      - test: core/handler.TestSameSiteHopTarget
  - id: resource-isolation
    rule: IsCrossOriginSubresource is true when Sec-Fetch-Site is present and neither same-origin nor none, except for a GET or HEAD navigation whose destination is not an object or embed, and IsolateResources answers those 403 unless its allow func admits them.
    enforced_by:
      - test: core/handler.TestIsCrossOriginSubresource
      - test: core/handler.TestIsolateResources
  - id: safe-relative-path
    rule: IsSafeRelativePath accepts only a single-slash path with no scheme, host, backslash, NUL, CR, LF or tab, raw or percent-decoded.
    enforced_by:
      - test: core/handler.TestSweepSafeRelativePath
decisions:
  - id: same-site-is-not-same-origin
    date: 2026-11-19
    status: accepted
    decision: Sec-Fetch-Site same-site falls through to the Origin comparison.
    rejected:
      - option: Trust same-site.
        why: A sibling subdomain or port is same-site; two copies that trusted it were driven to an attacker-owned admin and an approved destructive plan.
    upholds: [fetch-metadata-first]
  - id: resource-isolation-is-opt-in
    date: 2026-11-21
    status: accepted
    decision: Resource isolation is an opt-in (framework.WithResourceIsolation) that refuses same-site siblings too and lets requests with no Fetch Metadata through.
    rejected:
      - option: Turn it on in the default chain.
        why: It refuses every cross-origin fetch, script tag, image hotlink and form_post callback, so CORS APIs and Sign in with Apple would stop working until the app lists them in allow.
      - option: Allow same-site as the web.dev policy does.
        why: The same-site-is-not-same-origin decision already refuses a sibling subdomain or port for writes; a sibling reading the app's scripts and JSON is the same trust.
    upholds: [resource-isolation]
  - id: hop-for-missing-fetch-metadata
    date: 2026-11-19
    status: accepted
    decision: A request with no Fetch Metadata gets the hop page.
    rejected:
      - option: Decide on IsCrossSiteRequest alone.
        why: A browser sends no Fetch Metadata to a plain-HTTP LAN address, so a link there spent the setup token and landed on 403.
    upholds: [hop-ends]
