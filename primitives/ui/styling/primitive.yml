primitive: ui.styling
summary: The one styling surface, theme tokens, component sheets and the owned style sheets an app may add.
code:
  - framework/ui/theme/
docs:
  - core-ui/ARCHITECTURE.md
  - framework/docs/content/codegen.md
on_change:
  - Screenshot the rendered examples/meridian (marketing, app, auth, admin, phone width, light and dark) and look at it; a DOM dump or computed style cannot show layout.
invariants:
  - id: owned-css-waiver-skips-comment-only-lines
    rule: A standalone CSS waiver reaches the next line that contains a significant CSS token, across blank and comment-only lines. A trailing waiver stays on its own line.
    enforced_by:
      - test: core-ui/ownstyle.TestStandaloneWaiverSkipsCSSComments
      - test: core-ui/ownstyle.TestSuppressedUsesSharedMarkerGrammarAndScope
  - id: one-styling-surface
    rule: All CSS lives in the design system (component sheets, layouts, theme tokens) or in an app's owned style sheet, scoped to its own markup and written in tokens; generators and apps ship no other CSS.
    enforced_by:
      - test: cmd/gofastr/internal/appgen.TestScaffoldCSSUsesOwnedSheets
      - contract: GOFASTR1801
      - contract: GOFASTR1804
      - contract: GOFASTR1806
      - contract: GOFASTR1807
      - contract: GOFASTR1810
      - contract: GOFASTR1817
      - contract: GOFASTR1823
    judge: Does this change add CSS, an inline style or an invented class outside the design system and the owned style sheet, or set a value where a var(--*) token belongs?
    applies:
      - framework/gallery/
      - framework/i18nui/
      - framework/sdkdocs/
      - framework/ui/
      - core-ui/
      - battery/
      - examples/
      - internal/testapps/
      - cmd/gofastr/
  - id: contrast-warns-what-validate-skips
    rule: ContrastWarnings reports a primary or danger ink pair below 4.5:1 written in rgb(), hsl(), oklab() or oklch(), and the control edge (the ui-control-border knob, text-subtle when unset) over surface below 3:1, in both schemes, and skips what Go cannot resolve exactly; Validate keeps refusing only plain-hex ink pairs.
    enforced_by:
      - test: core-ui/style.TestContrastWarnings
      - test: core-ui/style.TestContrastWarningsJudgeTheControlBorderKnob
      - test: core-ui/style.TestParseColorClampsNegativeChroma
      - test: core-ui/style.TestParseColorReadsCSSColourFunctions
      - test: core-ui/style.TestParseColorSkipsWhatItCannotResolve
  - id: font-fallback-face-is-checked
    rule: FontFaceCSS adds a '<Family> Fallback' face only when Fallback.Local is set, and drops any metric override that is not a plain percentage.
    enforced_by:
      - test: core-ui/style.TestFontFaceCSSFallbackFace
      - test: core-ui/style.TestFontURLMatchesTheFaceRule
  - id: scheme-is-declared-in-css
    rule: "A theme with a dark palette declares color-scheme: light dark on :root and light or dark under each forced scheme, a light-only theme declares light, and a scoped theme declares the scheme each of its blocks paints."
    enforced_by:
      - test: core-ui/style.TestSchemeIsDeclaredInCSS
      - test: core-ui/style.TestThemeOverrideDeclaresScheme
  - id: subtree-scheme-override
    rule: A data-color-scheme attribute on any element below <html> re-declares that scheme's palette, color-scheme, paint and every token, knob and component option whose value reads another variable on that element.
    enforced_by:
      - test: core-ui/style.TestSubtreeSchemeBlocksRebind
      - test: framework/ui.TestColorSchemeSubtreeOverride
  - id: default-theme-is-adaptive
    rule: theme.Default gives every theme it builds style.DefaultDarkColors as its dark palette, so a ThemeToggle always has a complete dark scheme to switch to.
    enforced_by:
      - test: framework/ui/theme.TestDefaultShipsAdaptiveDarkPalette
  - id: default-theme-carries-every-option
    rule: Every theme theme.Default builds carries a value for every component option in Components.
    enforced_by:
      - test: framework/ui/theme.TestDefaultCarriesCompleteOptions
  - id: one-table-per-colour-field
    rule: Every colour field of Overrides is one colorFields row, and that one table drives the light setters, the Dark compile into DarkColors and the light-only warning.
    enforced_by:
      - test: framework/ui/theme.TestEveryOverridesFieldIsColourOrRefused
      - test: framework/ui/theme.TestEveryColourFieldReachesItsToken
      - test: framework/ui/theme.TestDarkOverrideLandsInBothDarkBlocks
  - id: dark-override-is-colour-only
    rule: A Dark override that sets Components, a font, a radius or a nested Dark panics when the theme is built.
    enforced_by:
      - test: framework/ui/theme.TestDarkRejectsNonColourFields
      - test: framework/ui/theme.TestEveryOverridesFieldIsColourOrRefused
  - id: light-only-override-warns
    rule: A light colour override with no Dark logs one warning for each field whose token has a dark value, and any non-nil Dark, even an empty one, silences it.
    enforced_by:
      - test: framework/ui/theme.TestLightOnlyOverrideWarns
      - test: framework/ui/theme.TestLightOnlyQuietWithoutDarkValue
  - id: explicit-option-resets-earlier-override
    rule: Merging overrides, an unset component option keeps the earlier value and a set one, the default included, replaces it; Flattened omits unset options.
    enforced_by:
      - test: framework/ui/theme.TestComponentOptionsOverrideAndReset
  - id: complete-fills-every-unset-option
    rule: ComponentOptions.Complete replaces every unset option with its DefaultOptions value.
    enforced_by:
      - test: framework/ui/theme.TestCompleteFillsUnset
      - test: framework/ui/theme.TestCompleteFillsFieldOptions
  - id: flattened-options-refuse-unknowns
    rule: OptionsFromFlattened errors on an unknown key or on a value outside its option's enum.
    enforced_by:
      - test: framework/ui/theme.TestOptionsFromFlattenedRejectsUnknowns
      - test: framework/ui/theme.TestOptionParsersRefuseUnknown
  - id: option-catalogue-follows-the-enums
    rule: Options lists every flattened key in declaration order with members derived from the enum's String walk, and that walk panics on an enum whose String never returns empty.
    enforced_by:
      - test: framework/ui/theme.TestOptionsCatalogueCoversTheFlattenedVocabulary
      - test: framework/ui/theme.TestOptionEnumsHaveNoHoles
      - test: framework/ui/theme.TestOptionMembersRefusesAnUnterminatedEnum
  - id: brutal-shadows-follow-the-border
    rule: Brutal's radii are zero and its shadows are hard offsets drawn in var(--color-border), so they flip with the colour scheme.
    enforced_by:
      - test: framework/ui/theme.TestBrutalReskinsTheTokens
  - id: visually-hidden-clips-with-clip-path
    rule: No kit sheet and no built-in host sheet uses the deprecated clip property; content hidden from view and kept for assistive tech is clipped with clip-path inset(50%).
    enforced_by:
      - test: framework/ui.TestKitHidesWithClipPath
      - test: framework/uihost.TestBuiltinCSSHidesWithClipPath
  - id: required-mark-keeps-a-fallback
    rule: Every required-mark rule that writes content " *" / "" has the single-value content " *" line right before it.
    enforced_by:
      - test: framework/ui.TestRequiredMarkKeepsAFallback
decisions:
  - id: generator-ships-no-css
    status: accepted
    decision: The app generator emits no CSS; a surface that needs styling the kit lacks gets a component, layout or token upstream.
    rejected:
      - option: Let the generator carry its own base stylesheet.
        why: Building Meridian it grew about 70 bespoke rules that duplicated or worked around existing components.
    upholds: [one-styling-surface]
  - id: subtree-scheme-is-an-attribute
    date: 2026-11-16
    status: accepted
    decision: A subtree pins its scheme with the same data-color-scheme attribute the root reads, selected as a descendant of :root, and ui.ColorScheme is the typed way to write it.
    rejected:
      - option: Register a dark ThemeOverride per section and wrap it in ui.Themed.
        why: It needs a second whole theme and a hash class per palette for what is the app theme's own dark half.
      - option: Rewrite the tokens as light-dark() pairs and set color-scheme on the subtree.
        why: Component option variables computed at :root would still carry the root's colours, and the toggle's forced schemes would need a second mechanism.
      - option: A data-cui-* attribute read by the runtime.
        why: CSS alone does the job, so it works with JS off and the runtime has nothing to read.
    revisit_if: Every supported browser has @scope, so a ui.Themed scope can follow the nearest scheme wrapper instead of any dark ancestor.
    upholds: [subtree-scheme-override]
  - id: framework-theme-is-adaptive
    date: 2026-11-16
    status: accepted
    decision: theme.Default ships a complete dark palette while core-ui's lower-level style.DefaultTheme stays light-only.
    rejected:
      - option: Make style.DefaultTheme adaptive.
        why: The lower-level core-ui theme stays light-only for compatibility; host apps and generated projects use theme.Default.
    upholds: [default-theme-is-adaptive]
  - id: dark-is-not-copied-from-light
    date: 2026-11-16
    status: accepted
    decision: A light colour override is not copied into the dark palette; the host sets its Dark twin or gets a warning.
    rejected:
      - option: Copy each light override into dark mode.
        why: A contrast-safe dark value is usually a different colour.
    upholds: [light-only-override-warns]
  - id: colour-fields-in-one-typed-table
    date: 2026-11-16
    status: accepted
    decision: Dark colours are typed Overrides fields compiled through the colorFields table.
    rejected:
      - option: A string-keyed DarkColors map the host fills.
        why: A typo in a token name (surfce-soft) compiled and did nothing.
    upholds: [one-table-per-colour-field, dark-override-is-colour-only]
  - id: code-tokens-are-their-own-pair
    date: 2026-11-16
    status: accepted
    decision: Code blocks draw from CodeSurface, CodeText and CodeBorder, not from the page's Text and Background.
    rejected:
      - option: Reuse the page Text and Background tokens.
        why: Dark mode could not reskin code blocks apart from the page.
  - id: single-tier-semantic-tokens
    date: 2026-11-16
    status: accepted
    decision: Theme tokens are one tier of semantic names (primary, danger, surface-soft) with no raw palette tier beneath them.
    rejected:
      - option: A raw palette tier such as indigo-500 under the semantic names.
        why: Most apps never need it, and an app that does can build it on top.
  - id: brutal-names-archivo-without-shipping-it
    date: 2026-11-16
    status: accepted
    decision: Brutal names Archivo first in its font stacks and ships no font file; without it the stack falls back to the system sans.
    rejected:
      - option: Load Archivo from a font CDN.
        why: The strict CSP blocks font CDNs, so an app that wants the face self-hosts it.
