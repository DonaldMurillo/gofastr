primitive: ui
summary: The design system's components, layouts and page frames, each rendering through framework/headless.
code:
  - framework/ui/
docs:
  - core-ui/ARCHITECTURE.md
  - framework/docs/content/ui-new-components.md
on_change:
  - Screenshot the rendered examples/meridian (marketing, app, auth, admin, phone width, light and dark) and look at it; a DOM dump or computed style cannot show layout.
invariants:
  - id: survey-before-building
    rule: A surface composes the existing component that does the job, or extends it with a config or variant, instead of rebuilding or restyling it.
    judge: Does this change hand-roll markup or CSS that an existing framework/ui or core-ui component already provides, or override a component's internals from outside?
    applies:
      - battery/
      - examples/
      - cmd/gofastr/
  - id: secret-input-is-never-spellchecked
    rule: A ui.PasswordInput's input carries spellcheck=false and autocapitalize=off, so a revealed password is never sent to a spell checker or capitalised.
    enforced_by:
      - test: framework/ui.TestPasswordInputSignInHints
  - id: one-time-code-is-fillable
    rule: A ui.OneTimeCode is a text input with autocomplete=one-time-code, inputmode=numeric and a digits-only pattern of its length.
    enforced_by:
      - test: framework/ui.TestOneTimeCodeIsAFillableCodeField
decisions:
  - id: ask-a-new-password-once
    date: 2026-11-16
    status: accepted
    decision: Forms that set a password ask for it once in a ui.PasswordInput, whose show toggle is how the reader checks it; the admin account form sends no confirm_password.
    rejected:
      - option: Keep a confirm-password field beside the new one.
        why: Typing it twice blind catches fewer mistakes than one look at the revealed value, and password managers fill one new-password field.
    revisit_if: The show toggle is removed or made optional on ui.PasswordInput.
    upholds: [secret-input-is-never-spellchecked]
