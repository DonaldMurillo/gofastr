primitive: middleware.headers
summary: SecurityHeaders, the strict default set of browser security headers with HTTPS-only HSTS, and the CSP violation report sink.
code:
  - core/middleware/security.go
  - core/middleware/cspreport.go
  - core/handler/cspreport.go
docs:
  - framework/docs/content/security.md
on_change:
  - The default CSP here is the base of the static export's policy; a change to it is made in primitives/static/csp too.
invariants:
  - id: default-csp-bounds-form-and-object
    rule: The default Content-Security-Policy names form-action 'self' and object-src 'none', which default-src does not cover.
    enforced_by:
      - test: core/middleware.TestDefaultCSPBoundsFormAndObject
  - id: hsts-only-over-https
    rule: Strict-Transport-Security is sent only over TLS, an X-Forwarded-Proto of exactly https in any case, or Secure true, with a one-year max-age by default and none at HSTSMaxAge -1.
    enforced_by:
      - test: core/middleware.TestHSTSDefaultOnTLS
      - test: core/middleware.TestHSTSHonorsForwardedProto
      - test: core/middleware.TestHSTSAbsentOnPlainHTTP
      - test: core/middleware.TestHSTSForwardedProtoExactValueOnly
  - id: cross-origin-isolation-by-default
    rule: Cross-Origin-Resource-Policy and Cross-Origin-Opener-Policy default to same-origin.
    enforced_by:
      - test: core/middleware.TestSecurityHeaders_CORPPresent
      - test: core/middleware.TestSecurityHeaders_COOPPresent
  - id: default-csp-enforces-trusted-types
    rule: Unless NoTrustedTypes is set, the default policy ends in require-trusted-types-for 'script' and trusted-types naming TrustedTypesPolicy then each TrustedTypesPolicies name once, a name outside the trusted-types grammar panics, and a ContentSecurityPolicy the host sets is sent as written.
    enforced_by:
      - test: core/middleware.TestDefaultCSPEnforcesTrustedTypes
      - test: core/middleware.TestTrustedTypesPolicyNameIsChecked
  - id: csp-reporting-opt-in
    rule: With CSPReportURI set, SecurityHeaders defines CSPReportEndpoint in Reporting-Endpoints beside any endpoints an outer handler set (keeping one already named so), adds report-to and report-uri to each comma-separated policy that names neither and leaves one that names either as written, adds 'report-sample' to the default policy's default-src, and panics on a URI holding a space, quote, comma, semicolon, backslash or control byte; with it unset no reporting header or directive is sent.
    enforced_by:
      - test: core/middleware.TestCSPReportingHeaders
      - test: core/middleware.TestCSPReportingKeepsHostDirectives
      - test: core/middleware.TestReportingEndpointsKeepsOuterEndpoints
      - test: core/middleware.TestCSPReportingSeesTabSeparatedDirectives
      - test: core/middleware.TestCSPReportURIRefusesHeaderBreakers
  - id: report-sink-is-bounded
    rule: handler.CSPReportHandler takes only a POST of application/reports+json or application/csp-report up to 64 KiB, decodes it with UnmarshalStrict so a duplicate or case-folded key is a 400, passes at most 16 csp-violation entries per request, cuts URLs at their query, and escapes control bytes in every field before capping it at 256 bytes.
    enforced_by:
      - test: core/handler.TestCSPReportHandler
      - test: core/handler.TestCSPReportHandlerRefusesSmuggledKeys
  - id: xss-auditor-disabled
    rule: "SecurityHeaders sends X-XSS-Protection: 0."
    enforced_by:
      - test: core/middleware.TestSweepSecurityHeadersDisableXSSAuditor
decisions:
  - id: trusted-types-on-by-default
    date: 2026-11-21
    status: accepted
    decision: The default policy enforces Trusted Types, with NoTrustedTypes as the off switch and TrustedTypesPolicies for an app's own policy names.
    rejected:
      - option: Report-only first.
        why: The runtime's own sinks all go through the policy, and a browser without Trusted Types ignores the directives; an app script that writes raw HTML finds out on the first page it loads, with the off switch one field away.
      - option: Add the directives to a host's own ContentSecurityPolicy.
        why: A policy the host sets is sent as written everywhere else in this middleware; TrustedTypesDirectives gives the host the two directives to add.
    upholds: [default-csp-enforces-trusted-types]
  - id: report-both-ways
    date: 2026-11-21
    status: accepted
    decision: Reporting sends both report-to with a Reporting-Endpoints header and report-uri, to one sink that reads both formats.
    rejected:
      - option: report-to alone.
        why: Not every browser reads Reporting-Endpoints, and Chrome sends Reporting API reports only to a secure endpoint, so plain-HTTP development would get none.
      - option: Keep the document query in the report.
        why: Page URLs carry tokens (password reset, email verify, signed links), and a log line is the wrong place for them.
    upholds: [csp-reporting-opt-in, report-sink-is-bounded]
  - id: xss-auditor-off
    date: 2026-11-18
    status: accepted
    decision: X-XSS-Protection is sent as 0, leaving script injection to the CSP.
    rejected:
      - option: "X-XSS-Protection: 1; mode=block."
        why: The legacy auditor is gone from current browsers and, where it ran, could be steered to blank or alter a page; the CSP is the defence.
    upholds: [xss-auditor-disabled]
