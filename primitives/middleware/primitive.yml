primitive: middleware
summary: The HTTP middleware of core/middleware, composed with Chain or a Pipeline, and the request ID; each family (CORS, CSRF, security headers, idempotency, rate limit, compression, timeout, recovery, logging, metrics, tracing) is a child.
code:
  - core/middleware/doc.go
  - core/middleware/middleware.go
  - core/middleware/phrases.go
  - core/middleware/requestid.go
  - core/middleware/statuswriter.go
docs:
  - framework/docs/content/security.md
twins:
  - job: Record the final status a response sent, forwarding a 1xx other than 101 without recording it and latching the first final status, an implicit 200 from a write or flush included.
    why: Logging, metrics, tracing and the idempotency recorder share statusRecorder; Recovery keeps its own writer because it forwards every WriteHeader and tracks whether anything started, which panickedStatus reads, and folding it in has not been designed.
    sites:
      - path: core/middleware/statuswriter.go
        note: statusRecorder.WriteHeader and Write, embedded by logging, metrics, tracing and idempotency.
      - path: core/middleware/recovery.go
        note: recoveryWriter.WriteHeader and markStarted.
  - job: Decide whether a request arrived over HTTPS from TLS, an X-Forwarded-Proto of https in any case, or a configured override.
    why: SecurityHeaders and CSRF each inline the same three-way test against their own config flag (Secure, CookieSecure); nothing shared names it yet.
    sites:
      - path: core/middleware/security.go
        note: The secure test in SecurityHeaders that gates HSTS.
      - path: core/middleware/csrf.go
        note: The secure test in CSRF that sets the cookie's Secure flag and __Host- prefix.
  - job: Bound a map keyed by client-chosen values with an absolute cap that sheds to 90 percent of it, cheapest entries first.
    why: The rate-limit buckets rank by tokens left and the idempotency entries by in-flight state and last access, so the ranking differs while the cap and low-water shape is copied.
    sites:
      - path: core/middleware/ratelimit.go
        note: bucketStore.evictLocked.
      - path: core/middleware/idempotency.go
        note: memoryIdempotencyStore.evictLocked.
invariants:
  - id: chain-order
    rule: Chain(A, B, C)(h) is A(B(C(h))), and Pipeline.Build applies its middleware in the order they were added.
    enforced_by:
      - test: core/middleware.TestChainOrder
      - test: core/middleware.TestPipelineBuild
  - id: request-id-is-bounded
    rule: RequestID reuses an inbound X-Request-ID only when it is at most MaxRequestIDLen bytes of letters, digits, dot, dash and underscore, and otherwise generates a UUID.
    enforced_by:
      - test: core/middleware.TestRequestIDRejectsOversized
      - test: core/middleware.TestRequestIDRejectsBadCharset
  - id: wrappers-keep-optional-interfaces
    rule: Every ResponseWriter wrapper in the package forwards Flush and Hijack and keeps ReadFrom and Unwrap, so streams, upgrades, sendfile and deadlines work behind it.
    enforced_by:
      - test: core/middleware.TestCORS_PreservesFlusherAndHijacker
      - test: core/middleware.TestMetricsPreservesHijacker
      - test: core/middleware.TestTracingPreservesHijacker
      - test: core/middleware.TestRecoveryKeepsReaderFrom
      - test: core/middleware.TestLoggingReadFromLazyCommit
      - test: core/middleware.TestLoggingWriterUnwrapsForResponseController
  - id: wrappers-record-the-status-sent
    rule: A status-recording wrapper forwards a 1xx other than 101 without recording it and records the first final status, latched by a write or flush.
    enforced_by:
      - test: core/middleware.TestWrappersKeepStatusAfterHints
      - test: core/middleware.TestLoggingRecordsStatusSent
      - test: core/middleware.TestWrappersLatchStatusOnFlush
      - test: core/middleware.TestIdempotencyRecordsPastEarlyHints
  - id: log-sinks-scrub-request-values
    rule: Every log line and span attribute built from a request's method or path has its control and invisible characters escaped before it is truncated to its cap.
    enforced_by:
      - test: core/middleware.TestLogSinksScrubAndBound
      - test: core/middleware.TestLogging_LogInjection
      - test: core/middleware.TestSampledLogging_SanitizesMethod
      - test: core/middleware.TestLogTraceScrubInvisibleChars
      - test: core/middleware.TestRecovery_EncodeBeforeTruncate
