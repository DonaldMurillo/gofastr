primitive: middleware.tracing
summary: Tracing, the OpenTelemetry server-span middleware, and NoteRoute, which lets a router behind a catch-all name the span.
code:
  - core/middleware/tracing.go
docs:
  - framework/docs/content/observability.md
invariants:
  - id: extract-global-then-w3c
    rule: The incoming context comes from the global propagator when it has fields and yields a remote span, else from W3C traceparent, and W3C baggage only when the global left none.
    enforced_by:
      - test: core/middleware.TestTracing_GlobalWithoutW3CFallsBackToTraceparent
      - test: core/middleware.TestTracing_NoGlobalPropagatorUnchanged
  - id: inject-before-the-handler
    rule: The span context is injected into the response headers before the handler runs.
    enforced_by:
      - test: core/middleware.TestTracing_ResponseCarriesTraceparent
  - id: span-named-for-the-route
    rule: The span is named for the mux pattern, or for the first NoteRoute when the pattern is empty or takes a subtree, else "unmatched".
    enforced_by:
      - test: core/middleware.TestNoteRouteNamesTheSpan
  - id: response-status-classifies-error
    rule: A response that returns without panicking marks the span an error with the decimal status code as error.type for status 500 or more, and tracing does not set either for a lower status.
    enforced_by:
      - test: core/middleware.TestTracing_ResponseErrorType
  - id: panicked-span-carries-the-stack
    rule: A panicked request's span gets the status the client got, an error status, error.type set to tracing.ErrorTypePanic regardless of the response status, and an exception.stacktrace from the goroutine that panicked.
    enforced_by:
      - test: core/middleware.TestTracingMarksPanickedSpan
      - test: core/middleware.TestTracingSpanCarriesThePanicsStack
