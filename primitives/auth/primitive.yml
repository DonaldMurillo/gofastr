primitive: auth
summary: The auth battery, covering sessions and their middleware, policies, login flows and tokens.
code:
  - battery/auth/
docs:
  - framework/docs/content/auth.md
invariants:
  - id: cross-site-arrival-reloads-same-site
    rule: SessionMiddleware answers a cookieless document navigation (GET or HEAD) that handler.IsCrossSiteRequest calls cross-site and that is about to be refused with the same-site hop page for the request's own path and query, in place of the refusal; a public page, a request that sent a session cookie, a request that is no such navigation and the hop's own reload get the app's answer.
    enforced_by:
      - test: battery/auth.TestCrossSiteArrivalAtGuardedPageHops
      - test: battery/auth.TestCrossSiteArrivalHopDoesNotLoop
      - test: battery/auth.TestCrossSiteArrivalAtPublicPageIsServedDirectly
      - test: battery/auth.TestOnlyCookielessCrossSiteNavigationsHop
      - test: battery/auth.TestCrossSiteArrivalHopIsNoOpenRedirect
      - test: battery/auth.TestCrossSiteArrivalHopReplacesTheRefusal
  - id: hop-only-on-a-401-or-a-marked-redirect
    rule: The hop replaces a 401, or a redirect whose gate called handler.NoteSessionRefusal; RequireSession, SessionPolicy, RolePolicy and the admin gate mark their login redirects, the UI host marks none, and an unmarked redirect reaches a cross-site visitor as it is.
    enforced_by:
      - test: battery/auth.TestCrossSiteArrivalHopsOnlyOnSessionPolicyRedirects
      - test: battery/admin.TestCrossSiteArrivalIsNotSentToLogin
      - test: battery/admin.TestCrossSiteArrivalReloadSignedOutGetsLogin
    judge: Does this change add a gate that redirects to a login page for want of a session without calling handler.NoteSessionRefusal, or call it before a redirect that is no session refusal?
    applies:
      - core/handler/fetchmeta.go
      - battery/admin/admin.go
      - battery/admin/shell.go
  - id: hop-keeps-the-locale-prefix
    rule: Under a locale prefix (framework.WithLocalePrefixes) every URL a hop page carries, in the Refresh header, a meta refresh and its link, names the path the browser asked for with the prefix on once. The hop writes its target as the router sees it and core-ui/urlprefix adds the prefix to the Refresh header and a meta refresh as it does to Location, for any handler's Refresh; an external, protocol-relative or already prefixed URL stays as written. The setup wizard answers ahead of the router and reloads the path as it came.
    enforced_by:
      - test: battery/auth.TestHopKeepsLocalePrefix
      - test: battery/auth.TestPrefixedHopIsNoOpenRedirect
      - test: core-ui/urlprefix.TestRefreshRule
      - test: core-ui/urlprefix.TestRefreshRuleIdempotent
      - test: core-ui/urlprefix.TestRefreshHeaderGainsPrefix
      - test: core-ui/urlprefix.TestMetaRefreshGainsPrefix
      - test: battery/setup.TestHopUnderLocalePrefixReloadsSamePath
    judge: Does this change write a same-origin URL into a response header or attribute that core-ui/urlprefix does not rewrite, or prepend the locale prefix to a hop target by hand?
    applies:
      - core-ui/urlprefix/
      - battery/setup/render.go
  - id: mailbox-proof-signs-in-one-way
    rule: Magic links and emailed codes sign in through AuthManager.signInMailboxOwner, which creates an unknown address's account as verified and without a password (taking the existing account when a concurrent sign-in created it first), refuses to create one on a lookup error, claims an unverified account, refuses a store without EmailVerifiedChecker, mints through MintSession so a 2FA account stays pending, and drops the session when the credential moved meanwhile.
    enforced_by:
      - test: battery/auth.TestMagicLink_Verify_CreatesUserIfNotExists
      - test: battery/auth.TestNewMagicLinkUserIsVerified
      - test: battery/auth.TestMagicLinkClaimKillsSquatter
      - test: battery/auth.TestMagicLinkVerify_DBErrorDoesNotAutoCreate
      - test: battery/auth.TestMagicLinkLosesRaceToReset
      - test: battery/auth.TestMagicLinkCreateRaceSignsIn
      - test: battery/auth.TestMagicLinkPendingSignInGoesToTwoFactorURL
      - test: battery/auth.TestEntityUserStore_HasPasswordDistinguishesNoPasswordCreate
      - test: battery/auth.TestMailboxSignInRefusesStoreWithoutVerifiedChecker
      - test: battery/auth.TestEmailCode_SendThenVerify_SignsInNewVerifiedAccount
  - id: credential-change-drops-mailed-sign-ins
    rule: A password reset or change purges the account's outstanding magic links and emailed-code challenges by canonical address.
    enforced_by:
      - test: battery/auth.TestResetDropsMagicLinks
      - test: battery/auth.TestEmailCode_PasswordResetDropsOutstandingCodes
  - id: erasure-reaches-email-keyed-tokens
    rule: Erasure removes the erased user's magic-link and emailed-code tokens from the SQL and in-memory token stores, by the canonical form of a user row stored in any case, and leaves other addresses' tokens.
    enforced_by:
      - test: battery/auth.TestEraseReachesEmailKeyedTokensFromLegacyRow
      - test: battery/auth.TestMemoryTokenStoreErasedByResolvedEmail
      - test: battery/auth.TestMemoryEmailCodeStoreErased
      - test: battery/auth.TestMemoryStoresReachedByErasure
  - id: memory-eraser-email-once-and-loud
    rule: The in-memory eraser uses the resolved email as given, reads it from the user store only when none resolved and the store is not the battery's SQL one, canonicalizes only that value, and fails on a lookup error other than ErrUserNotFound.
    enforced_by:
      - test: battery/auth.TestMemoryEraserCanonicalizesOnce
      - test: battery/auth.TestMemoryEraserReportsUserLookupFailure
  - id: init-keeps-host-email-resolver
    rule: Init registers its own IdentityEmail resolver only for an EntityUserStore, and otherwise keeps the registered resolver, adding the manager's canonicalizer only to the battery's auth_users default or a resolver with none.
    enforced_by:
      - test: battery/auth.TestInitKeepsHostEmailResolver
  - id: logout-clears-site-data
    rule: A successful POST /logout sends Clear-Site-Data, "cache", "storage" unless CorePlugin.WithLogoutClearSiteData sets other types or none; a logout whose revoke failed sends none.
    enforced_by:
      - test: battery/auth.TestLogoutSendsClearSiteData
      - test: battery/auth.TestLogoutClearSiteDataConfigurable
      - test: battery/auth.TestSignedInLogoutSendsClearSiteData
      - test: battery/auth.TestLogoutFailsClosedOnRevokeFailure
  - id: csrf-exempts-only-self-guarded-auth-routes
    rule: WithBFFPosture and WithCSRFAuthRoutes exempt from auth.CSRF exactly POST {BasePath}/logout and POST {BasePath}/oauth/{provider}/callback, both of which carry their own cross-site check; a sibling path under BasePath still needs the token.
    enforced_by:
      - test: battery/auth.TestCSRFAuthRoutesLetsFormPostCallbackThrough
      - test: battery/auth.TestBFFPostureLetsFormPostCallbackThrough
      - test: battery/auth.TestBFFPostureSignOutFormPassesLogoutOriginGuard
      - test: battery/auth.TestBFFPostureLogoutExemptionStaysSameOriginAndExact
  - id: production-needs-a-jwt-secret
    rule: Init refuses an empty JWTSecret outside DevMode, and New in DevMode mints a random per-process secret when none is set.
    enforced_by:
      - test: battery/auth.TestInit_ProdEmptySecretFailsClosed
      - test: battery/auth.TestAuthManager_DevModeMintsJWT
  - id: lifetimes-default-and-refuse-negative
    rule: A zero SessionTTL means seven days and a zero JWTExpiry one hour, BasePath defaults to /auth, and Init refuses a negative SessionTTL or JWTExpiry.
    enforced_by:
      - test: battery/auth.TestZeroSessionTTLDefaultsToSevenDays
      - test: battery/auth.TestNegativeSessionTTLRefused
      - test: battery/auth.TestNegativeJWTExpiryRefused
  - id: cookie-defaults-by-mode
    rule: Outside DevMode the session cookie defaults to __Host-session and Secure; in DevMode to session_id and not Secure.
    enforced_by:
      - test: battery/auth.TestAuthConfig_DefaultsAreSecure
      - test: battery/auth.TestAuthConfig_DevMode_RelaxedDefaults
  - id: default-throttles-in-every-mode
    rule: A nil LoginRateLimit, LoginRateLimitPerAccount, RegisterRateLimit or MailAddressRateLimit gets its default (30/min with a 5-minute block; 10/min, 15 minutes; 10/min, 15 minutes; one mail per address per two minutes) in DevMode and production alike.
    enforced_by:
      - test: battery/auth.TestDefaultThrottlesInstalledInDevModeToo
      - test: battery/auth.TestAuthBypass_DefaultBruteForceLimiter
      - test: battery/auth.TestRegisterRateLimitedByDefault
  - id: production-refuses-memory-sessions
    rule: Outside DevMode and AllowInMemoryStores, Init refuses the default in-memory session store, including one a plugin installed during its own Init.
    enforced_by:
      - test: battery/auth.TestProdRefusesMemorySessionStoreInstalledByPlugin
      - test: battery/auth.TestNoMemoryStoreWarnWhenOptedIn
  - id: default-roles-are-server-config
    rule: DefaultRoles returns a fresh copy of AuthConfig.DefaultRoles, or ["user"] when it is empty, and every account-creating flow reads it, never the request.
    enforced_by:
      - test: battery/auth.TestDefaultRolesReturnsACopy
      - test: battery/auth.TestRegisterUsesConfiguredRoles
      - test: battery/auth.TestDefaultRolesIgnoreClientInput
  - id: set-user-roles-audited
    rule: SetUserRoles refuses a user id that is not storable text with ErrUserNotFound and emits roles.updated only after the store changed the roles.
    enforced_by:
      - test: battery/auth.TestSetUserRolesAuditsMutation
      - test: battery/auth.TestSetUserRolesRefusesUnstorableID
  - id: jwt-helper-built-in-new
    rule: New builds the manager's JWTAuth when JWTSecret is set, so RequireAuth(mgr.JWT()) wired before Init holds the same value Init finishes; after plugin Init the helper resolves owners against the user store the app runs with.
    enforced_by:
      - test: battery/auth.TestRequireAuthWiredBeforeInit
      - test: battery/auth.TestJWTResolvesAgainstStoreAPluginInstalled
  - id: auth-noted-only-when-resolving
    rule: The app is told an authenticator is wired only once Init has run with it and a resolving middleware (SessionMiddleware, Middleware, or RequireAuth over the manager's JWT) exists, in either order.
    enforced_by:
      - test: battery/auth.TestAuthNotedOnlyWithMiddleware
  - id: plugin-order
    rule: Use panics on a duplicate plugin name; Middleware makes the first registered plugin outermost; OnStop stops plugins in reverse order, returns the first failure, and unregisters the manager's in-memory store eraser.
    enforced_by:
      - test: battery/auth.TestAuthManager_UseDuplicatePanics
      - test: battery/auth.TestPluginMiddlewareFirstRegisteredOutermostAndStopReversed
      - test: battery/auth.TestMemoryStoresReachedByErasure
  - id: base-path-reserved-from-embeds
    rule: ReservedEmbedPrefixes on the manager and on TokensPlugin report the configured BasePath, so no embed grant sits over or reaches an auth route.
    enforced_by:
      - test: battery/auth.TestAuthReservesItsBasePathFromEmbeds
  - id: owner-extractor-is-current-user
    rule: Importing battery/auth installs framework/owner's extractor, which answers the ID of the context user and no owner for no user or an empty ID.
    enforced_by:
      - test: battery/auth.TestOwnerExtractorReadsCurrentUser
decisions:
  - id: logout-clear-site-data-skips-cookies
    date: 2026-11-17
    status: accepted
    decision: Logout's default Clear-Site-Data is "cache", "storage", asking the browser to drop the signed-out account's cached pages and stored state; browsers honour it only over HTTPS, and not every browser honours every type.
    rejected:
      - option: Include "cookies".
        why: Browsers clear it for the whole registrable domain, signing the visitor out of sibling subdomains, and the session cookie is already expired by the same response.
      - option: Send no Clear-Site-Data by default.
        why: The back/forward cache and runtime storage keep the signed-in pages after logout (issue 707).
    upholds: [logout-clears-site-data]
  - id: erasure-canonicalizes-the-stored-address
    date: 2026-11-16
    status: accepted
    decision: Erasure canonicalizes the stored address before matching email-keyed tokens, and AuthConfig.CanonicalizeEmail must be idempotent.
    rejected:
      - option: Bind the stored address as it is.
        why: A row stored before canonicalization kept its raw spelling and missed tokens written under the canonical one.
      - option: Bind both the stored and the canonicalized address.
        why: An eraser binds one value, and password reset's purge already canonicalizes the stored address, so an idempotent canonicalizer is a contract the battery holds anyway.
    upholds: [erasure-reaches-email-keyed-tokens]
  - id: hop-on-refusal-not-on-arrival
    date: 2026-11-16
    status: accepted
    decision: A cross-site arrival is hopped only when the app is about to refuse it, on a 401 or on a redirect the gate itself marked as a session refusal, and uihost does not mark policy redirects (issue 696).
    rejected:
      - option: Hop every cookieless cross-site navigation before the app runs.
        why: A public page would cost every visitor from another site a second page load.
      - option: Hop on any redirect.
        why: A redirect can follow work a reload must not repeat, such as a logout link or a callback.
      - option: Have uihost mark every screen policy redirect.
        why: A policy that sends / to /en is no refusal, and its cross-site visitors got the hop page in place of the plain 303.
    revisit_if: A gate outside the framework needs the hop and cannot reach handler.NoteSessionRefusal, or browsers stop sending Fetch Metadata on navigations.
    upholds: [cross-site-arrival-reloads-same-site, hop-only-on-a-401-or-a-marked-redirect]
  - id: mail-address-limit-is-a-cooldown
    date: 2026-11-20
    status: accepted
    decision: The default per-address mail budget is one mail every two minutes with a two-minute block, shared by magic-link send and forgot-password.
    rejected:
      - option: Five mails an hour, then an hour's block.
        why: Anyone can spend an address's budget, so six requests from a stranger stopped every link to the victim for an hour, which locks a passwordless user out.
    upholds: [default-throttles-in-every-mode]
  - id: throttles-on-in-dev
    date: 2026-11-20
    status: accepted
    decision: The default login and register throttles are installed in DevMode too; only the per-IP login limiter is relaxed there.
    rejected:
      - option: No throttles in DevMode.
        why: Credential stuffing is a network attack, not a config-mode one, and the per-account limiter is the one that stops it.
    upholds: [default-throttles-in-every-mode]
