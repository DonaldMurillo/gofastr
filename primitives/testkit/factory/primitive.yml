primitive: testkit.factory
summary: Entity factories for tests and seeders - a base body with caller overrides, created through the entity's in-process CRUD handler; with an App's registry that is the app-wired handler, so hooks and events run as they do for HTTP, and with any other registry a bare handler that runs none.
