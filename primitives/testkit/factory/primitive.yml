primitive: testkit.factory
summary: Entity factories for tests and seeders - a base body with caller overrides, created through an in-process CRUD handler - by default the one a registry with CrudHandlerFor wires (an App's, so hooks and events run as they do for HTTP), else a bare handler that runs none, unless WithHandler replaces it.
