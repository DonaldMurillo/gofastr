primitive: fanout
summary: The lossy cross-replica message bus of core/fanout - the Fanout interface and its in-process and Redis backends; the Postgres backend, the node-id envelope and the shared queues are its parts.
code:
  - core/fanout/doc.go
  - core/fanout/fanout.go
  - core/fanout/inprocess.go
  - core/fanout/redis.go
docs:
  - framework/docs/content/core-packages.md
  - framework/docs/content/scaling.md
  - framework/docs/content/events.md
invariants:
  - id: inprocess-delivers-in-order-per-topic
    rule: InProcess hands each subscriber only its own topic's payloads, in publish order, and a cancelled subscriber receives nothing more.
    enforced_by:
      - test: core/fanout.TestInProcessTopicIsolation
      - test: core/fanout.TestInProcessOrderedDelivery
      - test: core/fanout.TestInProcessCancelStopsDelivery
  - id: redis-subscriber-behind-a-queue
    rule: NewRedis runs each subscriber behind its own SubscriberQueue, so a slow subscriber never stalls the Redis reader goroutine or another subscriber of the topic.
    enforced_by:
      - test: core/fanout.TestRedisAdapterSlowSubDoesNotStallOthers
decisions:
  - id: fanout-is-lossy
    date: 2026-11-19
    status: accepted
    decision: Fanout is the lossy real-time lane and may drop a message published while a subscriber is away or queue-full; durable at-least-once delivery is the transactional outbox's job and never rides fanout.
    rejected:
      - option: At-least-once delivery inside fanout.
        why: Every subscriber would need acknowledgements and replay storage, and real-time consumers (island pushes, presence heartbeats) heal on the next message anyway.
    revisit_if: A real-time consumer cannot heal from a dropped message on its own.
  - id: transport-is-trusted
    date: 2026-11-19
    status: accepted
    decision: Fanout payloads are not authenticated; write access to the channel (a NOTIFY channel, a Redis channel) is trusted, and the channel is secured by network isolation and credentials.
    rejected:
      - option: Sign every envelope with a shared replica key.
        why: Every backend and every replica would need key distribution and rotation for a channel that is already behind database or Redis credentials.
    revisit_if: Fanout runs over a channel that untrusted clients can publish on.
  - id: no-redis-import
    date: 2026-11-19
    status: accepted
    decision: NewRedis takes a RedisPubSub the host adapts from its own client instead of importing a Redis library.
    rejected:
      - option: Depend on go-redis directly.
        why: Every app that imports core/fanout would link a Redis client, and hosts on redigo would carry two.
