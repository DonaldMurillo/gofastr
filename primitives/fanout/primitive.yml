primitive: fanout
summary: PostgresFanout, the lossy cross-replica message bus on one LISTEN/NOTIFY channel, with a fallback table for payloads too large to NOTIFY.
code:
  - framework/fanout/
docs:
  - framework/docs/content/scaling.md
  - framework/docs/content/events.md
invariants:
  - id: large-payload-spills-to-the-table
    rule: Publish NOTIFYs a wrapper of at most 7000 bytes inline and stores a larger one in the fallback table, NOTIFYing a t:<id> pointer that receivers SELECT.
    enforced_by:
      - test: framework/fanout.TestPostgres_BigPayloadFallsBackToTable
  - id: channel-is-the-table-name
    rule: The NOTIFY channel is the fallback table's name, so two fanouts with different tables on one database never see each other's messages, inline or spilled.
    enforced_by:
      - test: framework/fanout.TestPostgres_InlineMessageStaysOnItsTable
      - test: framework/fanout.TestPostgres_TableNameIsolatesChannel
  - id: construction-refuses-bad-config
    rule: NewPostgres errors on a nil db, an empty dsn, a table name SafeIdent refuses or longer than 63 bytes, and a case-kept table an older build left.
    enforced_by:
      - test: framework/fanout.TestLongTableNameRefusedForItsLength
      - test: framework/fanout.TestPostgres_LongTableNameRejected
      - test: framework/fanout.TestPostgres_CaseKeptTableRefused
  - id: listen-is-bounded
    rule: NewPostgres closes the listener and errors when LISTEN is not up within the listen timeout, instead of retrying an unreachable dsn forever.
    enforced_by:
      - test: framework/fanout.TestPostgres_BadDSNTimeout
      - test: framework/fanout.TestNewPostgresUnreachableFailsFast
  - id: utf8-only
    rule: Publish refuses a topic or payload that is not valid UTF-8 before it touches the database, and Subscribe refuses such a topic.
    enforced_by:
      - test: framework/fanout.TestPostgres_PublishRejectsInvalidUTF8
      - test: framework/fanout.TestPublishValidatesBeforeTransport
      - test: framework/fanout.TestSubscribeRejectsNilAndNonUTF8Topic
      - test: framework/fanout.TestPostgres_SubscribeRejectsBadUTF8Topic
  - id: subscriber-cannot-stall-the-dispatcher
    rule: Each subscriber's callback runs on its own goroutine behind a drop-oldest core/fanout.SubscriberQueue, whose worker recovers a panic in the callback, and the dispatcher recovers a panic from a subscriber's send, so a slow, stuck or panicking subscriber holds back no other topic.
    enforced_by:
      - test: framework/fanout.TestDeliverSurvivesStuckSubscriber
      - test: framework/fanout.TestPostgres_SlowSubDoesNotStallOtherTopic
      - test: framework/fanout.TestDeliverSurvivesPanickingSubscriber
  - id: spill-rows-expire
    rule: Fallback rows older than two minutes by the database clock are purged on the dispatcher's ticker even when nothing is published, and pgPurgeAgeSQL names the same age as pgPurgeAge.
    enforced_by:
      - test: framework/fanout.TestPostgres_PurgeRemovesOldRows
      - test: framework/fanout.TestPurgeRunsWithoutPublish
      - test: framework/fanout.TestPurgeAgeSQLMatchesPurgeAge
  - id: close-ends-everything
    rule: Close cancels an in-flight fallback fetch, waits for the dispatcher, stops every subscriber queue including those whose cancel was dropped, and makes later Subscribe calls fail.
    enforced_by:
      - test: framework/fanout.TestCloseCancelsFallbackFetch
      - test: framework/fanout.TestPostgres_CloseStopsSubQueues
      - test: framework/fanout.TestSubscribeAfterCloseRefused
      - test: framework/fanout.TestPostgres_SubscribeAfterCloseErrors
  - id: without-ensure-creates-no-table
    rule: With WithoutEnsureTable, NewPostgres creates no fallback table.
    enforced_by:
      - test: framework/fanout.TestPostgres_WithoutEnsureTable
decisions:
  - id: one-channel-topic-in-payload
    date: 2026-11-17
    status: accepted
    decision: One LISTEN channel per fanout carries every topic inside the NOTIFY payload.
    rejected:
      - option: A Postgres channel per topic.
        why: Dynamic topic strings would each have to be validated as a channel identifier and LISTENed on separately.
    upholds: [channel-is-the-table-name]
  - id: purge-by-database-clock
    date: 2026-11-17
    status: accepted
    decision: The purge compares created_at with the database's now(), the clock that wrote it.
    rejected:
      - option: Compare with the replica's time.Now().
        why: Clock skew between a replica and the database would purge rows early or keep them late.
    upholds: [spill-rows-expire]
